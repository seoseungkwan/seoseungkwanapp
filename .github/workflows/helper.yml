# 청구 사전점검 도우미(윈도우) 시험·빌드·zip (specs/precheck/design.md 12절, REQ-002)
# - 서명하지 않는다(ADR-016). 비밀값을 쓰지 않는다. 태그 릴리스도 이 실행의 기본 토큰(github.token)만 쓴다
# - action은 판을 고정한다. 움직이는 판(main 등)은 쓰지 않는다
# - extension 일(TASK-3)은 크롬 확장 zip을 만든다. 태그 때 release 일이 도우미 zip과 함께 올린다
name: helper

on:
  push:
    # tags만 적으면 브랜치 push에는 돌지 않아서 모든 브랜치를 함께 적는다. 태그 push에는 paths가 걸리지 않는다
    branches:
      - '**'
    paths:
      - 'helper/**'
      - 'extension/**'
      - 'src/lib/bridge/commands.json'
      - '.github/workflows/helper.yml'
    tags:
      - 'helper-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helper:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Core(net48·net10.0)와 Windows 시험을 모두 돈다. 하나라도 실패하면 아래 빌드·zip은 돌지 않는다
      - name: 시험
        run: dotnet test helper/Precheck.sln -c Release

      - name: 빌드
        run: dotnet build helper/Precheck.sln -c Release

      # precheck-helper-<Version>.zip = install.cmd·install.ps1·uninstall.ps1·host-manifest.json·README.md + app\(exe·설정·DLL)
      - name: zip 묶기
        run: |
          $props = [xml](Get-Content -Raw -LiteralPath 'helper/Directory.Build.props')
          $version = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Directory.Build.props의 Version이 틀렸다: $version" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "helper-v$version") {
            throw "태그 $env:GITHUB_REF_NAME 와 Directory.Build.props Version $version 이 다르다"
          }
          $bin = 'helper/src/Precheck.Helper/bin/Release/net48'
          if (-not (Test-Path -LiteralPath "$bin/PrecheckHelper.exe")) { throw "$bin/PrecheckHelper.exe 가 없다" }
          $stage = Join-Path $env:RUNNER_TEMP 'precheck-helper'
          $app = Join-Path $stage 'app'
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          Copy-Item -Path "$bin/*.exe", "$bin/*.exe.config", "$bin/*.dll" -Destination $app
          Copy-Item -Path 'helper/install/*' -Destination $stage
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "precheck-helper-$version.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$zip"
          Get-ChildItem -LiteralPath $stage -Recurse -File | ForEach-Object { $_.FullName.Substring($stage.Length + 1) }
          Write-Output "만든 zip: dist/$zip"

      - uses: actions/upload-artifact@v4
        with:
          name: precheck-helper
          path: dist/precheck-helper-*.zip
          if-no-files-found: error

  # 크롬 확장 zip: 웹스토어에 올리는 것과 '압축 풀린 확장' 시험용(풀어서 그 폴더를 불러온다)
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 설치
        run: npm ci

      - name: 확장 빌드
        run: npm run ext:build

      # precheck-extension-<manifest.version>.zip = extension/dist 안 파일(manifest.json이 zip 맨 위)
      - name: zip 묶기
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "extension/manifest.json version이 틀렸다: $version"; exit 1; fi
          test -f extension/dist/manifest.json
          test -f extension/dist/background.js
          mkdir -p dist
          zip="precheck-extension-$version.zip"
          (cd extension/dist && zip -r -X "../../dist/$zip" .)
          unzip -l "dist/$zip"
          echo "만든 zip: dist/$zip"

      - uses: actions/upload-artifact@v4
        with:
          name: precheck-extension
          path: dist/precheck-extension-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/helper-v')
    needs: [helper, extension]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: GitHub 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.zip --verify-tag --title "$TAG" --notes "청구 사전점검 도우미 $TAG. precheck-helper zip을 모두 풀고 install.cmd를 누릅니다(zip 안 README.md). precheck-extension zip은 크롬 확장입니다(웹스토어 등록·압축 풀린 확장 시험용)."
