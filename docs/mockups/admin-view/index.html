<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다른 의원 보기 · 의원 비교 시안</title>
<!--
  admin-view 시안: 관리자가 다른 의원 화면을 읽기만 하고(다른 의원 보기), 관리자 화면에서 의원들을 견준다(의원 비교). 결정·화면 글자 목록은 notes.md.
  ?s=viewing(기본) · admin-list · compare · compare-region · empty
    viewing 덧붙임: &p=stats(통계 화면) · &open=1(위쪽 띠 '보는 의원' 판 열림)
    empty 덧붙임: &e=month(그 달 자료 없음, 기본은 지역에 의원 없음)
  모양은 지금 화면(AppShell·TabBar·AccountMenu · AdminApplications · StatsScreen·StatsToc·parts.tsx StatsCard · ds 클래스 · globals.css :root 토큰) 그대로 옮겼다. 새 색은 없다.
  PC 화면만이다(폰 전용 모양 없음). 의원 이름·사람 이름·메일(@example.com)·번호·숫자는 모두 지어낸 값이다. 어디로도 보내지 않는다.
-->
<style>
@font-face { font-family: 'AppPretendard'; font-weight: 400; src: url('../../../src/app/fonts/Pretendard-Regular.subset.woff2') format('woff2'); }
@font-face { font-family: 'AppPretendard'; font-weight: 500; src: url('../../../src/app/fonts/Pretendard-Medium.subset.woff2') format('woff2'); }
@font-face { font-family: 'AppPretendard'; font-weight: 600; src: url('../../../src/app/fonts/Pretendard-SemiBold.subset.woff2') format('woff2'); }

/* 앱 토큰(src/app/globals.css :root) — 새 색 없음 */
:root {
  --canvas: #F7F8FA; --surface: #FFFFFF; --line: #E5E7EB; --line-strong: #D1D5DB; --faint: #9CA3AF;
  --muted: #6B7280; --ink-2: #374151; --ink: #111827;
  --accent: #2563EB; --accent-strong: #1D4ED8; --accent-soft: #EAF1FE;
  --positive: #15803D; --positive-soft: #ECF7EF; --negative: #C2410C; --negative-soft: #FDF0EA;
  --warning: #B45309; --warning-soft: #FDF4E3;
  --chart-1: #DBE7FD; --chart-2: #B4CDFA; --chart-3: #8DB0F4; --chart-4: #2563EB; --chart-5: #1D4ED8; --chart-prev: #9CA3AF;
  --cat-1: #2563EB; --cat-2: #0F766E; --cat-3: #B45309; --cat-4: #6D28D9; --cat-5: #6B7280;
  --r-control: 4px; --r-float: 8px;
  --elev-float: 0 1px 2px rgb(17 24 39 / 0.06), 0 6px 16px rgb(17 24 39 / 0.1);
  /* 통계 화면 토큰(first90) */
  --st-canvas: #F4F6F9; --st-ink: #172B4D; --st-ink-2: #3B4A63; --st-muted: #5B6B82; --st-line: #E5EAF1; --st-line-2: #CBD3DF;
  --st-f90: #0D9488; --st-ret: #6B89BF; --st-ref: #B7791F; --st-warn-ink: #975A16;
  --st-h0: #F1F4F8; --st-h1: #DCE8FC; --st-h2: #B5CEF8; --st-h3: #7FA9F1; --st-h4: #3F7BE6; --st-h5: #1D4ED8;
  --st-r: 14px; --st-r-sm: 8px; --st-card-shadow: 0 1px 2px rgb(23 43 77 / 0.04);
  --ui: 'AppPretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; border: 0 solid; }
html { background: var(--surface); }
body { background: var(--surface); color: var(--ink); font: 400 14px/22px var(--ui); font-variant-numeric: tabular-nums; word-break: keep-all; overflow-x: clip; }
button, select, input { font: inherit; color: inherit; letter-spacing: inherit; background-color: transparent; }
button { cursor: pointer; }
a { color: inherit; }
svg { flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0; }

/* ── 시안 고르기 띠(앱 밖, 검토용) ── */
.mbar { background: var(--canvas); border-bottom: 1px solid var(--line-strong); }
.mbar-in { max-width: 1280px; margin: 0 auto; padding: 8px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 12px; line-height: 18px; color: var(--muted); }
.mbar b { font-size: 13px; font-weight: 600; color: var(--ink); }
.mseg { display: flex; flex-wrap: wrap; gap: 4px; }
.mseg a { padding: 2px 10px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); color: var(--ink-2); text-decoration: none; white-space: nowrap; }
.mseg a[aria-current="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); font-weight: 600; }
.msub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding-left: 12px; border-left: 1px solid var(--line-strong); }
.mchk { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }

/* ── 앱 틀(AppShell · TabBar · MoreMenu · AccountMenu) ── */
.sticky { position: sticky; top: 0; z-index: 10; }
/* 새: 보는 중 띠(위에 붙는 묶음 맨 위) */
.band { background: var(--warning-soft); border-bottom: 1px solid var(--line); }
.band-in { max-width: 1280px; margin: 0 auto; height: 44px; padding: 0 24px; display: flex; align-items: center; gap: 8px; }
.band-in > svg { color: var(--warning); }
.band-t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; line-height: 22px; color: var(--ink); }
.band-t b { font-weight: 600; }
.band-t .ro { font-weight: 600; color: var(--warning); }
.band-h { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; line-height: 20px; color: var(--ink-2); }
.band .btn { margin-left: auto; }

.top { border-bottom: 1px solid var(--line); background: var(--surface); }
.top-in { max-width: 1280px; margin: 0 auto; height: 56px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand span { min-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 16px; line-height: 24px; font-weight: 600; color: var(--ink); }
.top-r { display: flex; flex-shrink: 0; align-items: center; gap: 16px; }
.clock { white-space: nowrap; font-size: 13px; line-height: 20px; color: var(--muted); }
.acct span { max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
.tabsbar { display: flex; border-bottom: 1px solid var(--line); background: var(--surface); }
.tabs-in { display: flex; flex: 1; min-width: 0; max-width: 1280px; margin: 0 auto; }
.strip { flex: 1; min-width: 0; }
.strip-row { display: flex; align-items: stretch; padding: 0 24px; }
.strip-row > :first-child { margin-left: -12px; }
.atab, .more { position: relative; display: inline-flex; flex-shrink: 0; align-items: center; gap: 4px; height: 44px; padding: 0 12px; border-radius: var(--r-control); white-space: nowrap; font-size: 14px; line-height: 22px; font-weight: 500; color: var(--ink-2); text-decoration: none; }
.atab:hover, .more:hover { color: var(--ink); }
.atab[aria-current="page"] { font-weight: 600; color: var(--ink); }
.atab[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; background: var(--accent); }
.more-wrap { position: relative; display: flex; flex-shrink: 0; margin-right: 12px; }

/* 새: 위쪽 띠 '보는 의원' 단추와 판(계정 메뉴와 같은 떠 있는 층) */
.vp { position: relative; }
.vp-panel { position: absolute; top: 100%; right: 0; z-index: 20; margin-top: 4px; width: 320px; padding: 4px; border: 1px solid var(--line); border-radius: var(--r-float); background: var(--surface); box-shadow: var(--elev-float); }
.vp-head { display: flex; flex-direction: column; gap: 2px; padding: 8px 12px 12px; }
.vp-head b { font-size: 13px; line-height: 20px; font-weight: 600; color: var(--ink); }
.vp-head span { font-size: 12px; line-height: 16px; color: var(--muted); }
.vp-find { padding: 0 8px 8px; }
.vp-find input { height: 36px; width: 100%; border: 1px solid var(--line-strong); border-radius: var(--r-control); background: var(--surface); padding: 0 12px; font-size: 14px; color: var(--ink); }
.vp-find input::placeholder { color: var(--muted); }
.vp-list { max-height: 340px; overflow-y: auto; border-top: 1px solid var(--line); padding-top: 4px; }
.vp-cap { padding: 8px 12px 4px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--muted); }
.vp-item { display: flex; width: 100%; height: 36px; align-items: center; gap: 8px; border-radius: var(--r-control); padding: 0 12px; text-align: left; font-size: 14px; line-height: 22px; color: var(--ink); }
.vp-item:hover { background: var(--canvas); }
.vp-item .nm { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vp-item .rg { flex-shrink: 0; font-size: 12px; line-height: 16px; color: var(--muted); }
.vp-item .ck { width: 16px; color: var(--accent); }
.vp-item[aria-current="true"] { font-weight: 600; color: var(--accent-strong); }
.vp-empty { padding: 8px 12px 12px; font-size: 13px; color: var(--muted); }

main { background: var(--surface); }
main.st { background: var(--st-canvas); }
.main-in { max-width: 1280px; margin: 0 auto; padding: 24px 24px 48px; }

/* ── 공통 모양 ds(src/components/ui/classes.ts) ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; border-radius: var(--r-control); border-width: 1px; transition: background-color .15s, color .15s; }
.btn:disabled { cursor: not-allowed; opacity: .4; }
.btn-md { height: 36px; padding: 0 16px; font-size: 14px; line-height: 22px; font-weight: 500; }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13px; line-height: 20px; font-weight: 500; }
.btn-sm-b { height: 32px; padding: 0 12px; font-size: 13px; line-height: 20px; font-weight: 600; }
.t-primary { border-color: transparent; background: var(--accent); color: var(--surface); }
.t-secondary { border-color: var(--line-strong); background: var(--surface); color: var(--ink); }
.t-secondary:not(:disabled):hover, .t-secondary[aria-expanded="true"] { background: var(--canvas); }
.t-accent-outline { border-color: var(--accent); background: var(--surface); color: var(--accent); }
.t-accent-outline:not(:disabled):hover { background: var(--accent-soft); }
.chip { display: inline-flex; flex-shrink: 0; align-items: center; gap: 4px; height: 20px; padding: 0 6px; white-space: nowrap; border-radius: var(--r-control); border: 1px solid transparent; font-size: 12px; line-height: 16px; font-weight: 500; }
.chip-neutral { border-color: var(--line); background: var(--canvas); color: var(--ink-2); }
.chip-accent { background: var(--accent-soft); color: var(--accent-strong); }
.chip-warning { background: var(--warning-soft); color: var(--warning); }
.panel { min-width: 0; border: 1px solid var(--line); border-radius: var(--r-control); background: var(--surface); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 0; }
.panel-title { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--ink); }
.panel-desc { padding: 4px 20px 0; font-size: 13px; line-height: 20px; color: var(--ink-2); }
.count { white-space: nowrap; font-size: 13px; line-height: 20px; color: var(--muted); }
.twrap { min-width: 0; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 20px; }
th { height: 40px; white-space: nowrap; border-bottom: 1px solid var(--line); padding: 0 12px; text-align: left; font-weight: 500; color: var(--muted); }
td { height: 44px; white-space: nowrap; border-bottom: 1px solid var(--line); padding: 0 12px; color: var(--ink); }
th:first-child, td:first-child { padding-left: 20px; }
th:last-child, td:last-child { padding-right: 20px; }
tbody tr:hover { background: var(--canvas); }
tbody tr:last-child > * { border-bottom-width: 0; }
td.sub { color: var(--ink-2); }
.seg { display: inline-flex; flex-shrink: 0; overflow: clip; border: 1px solid var(--line-strong); border-radius: var(--r-control); background: var(--surface); }
.seg button { height: 30px; border-left: 1px solid var(--line-strong); padding: 0 12px; font-size: 13px; line-height: 20px; font-weight: 500; color: var(--ink-2); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); font-weight: 600; color: var(--accent-strong); }
.stepbox { display: inline-flex; height: 32px; flex-shrink: 0; align-items: stretch; overflow: clip; border: 1px solid var(--line-strong); border-radius: var(--r-control); background: var(--surface); }
.stepbox button { display: flex; width: 32px; align-items: center; justify-content: center; color: var(--ink-2); }
.stepbox button:not(:disabled):hover { background: var(--canvas); }
.stepbox button:disabled { cursor: not-allowed; opacity: .4; }
.stepbox span { display: flex; min-width: 120px; align-items: center; justify-content: center; white-space: nowrap; border-inline: 1px solid var(--line); padding: 0 8px; font-size: 13px; line-height: 20px; font-weight: 600; color: var(--ink); }
.sel { height: 32px; cursor: pointer; border: 1px solid var(--line-strong); border-radius: var(--r-control); background: var(--surface); padding: 0 6px; font-size: 13px; line-height: 20px; color: var(--ink); }
.sel:hover { border-color: var(--muted); }
.sel.unknown { color: var(--warning); font-weight: 500; }
.cap { margin-bottom: 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.ecard { display: flex; align-items: flex-start; gap: 8px; border-radius: var(--r-control); background: var(--negative-soft); padding: 12px 16px; }
.status { display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 20px; color: var(--positive); }
.status:empty { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); }

/* ── 관리자 화면 머리(AdminApplications 머리 + 설정 안쪽 메뉴 모양) ── */
.admin { display: flex; flex-direction: column; gap: 16px; }
.ahead { display: flex; flex-direction: column; gap: 12px; }
.ahead-t { display: flex; flex-direction: column; gap: 4px; }
.loc { display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 20px; font-weight: 600; color: var(--muted); }
h1 { font-size: 20px; line-height: 28px; font-weight: 600; color: var(--ink); }
.intro { max-width: 560px; font-size: 14px; line-height: 22px; color: var(--ink-2); }
.subnav { display: flex; border-bottom: 1px solid var(--line); }
.subnav a { position: relative; display: inline-flex; flex-shrink: 0; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border-radius: var(--r-control); white-space: nowrap; font-size: 14px; line-height: 22px; font-weight: 500; color: var(--ink-2); text-decoration: none; }
.subnav a:first-child { margin-left: -12px; }
.subnav a:hover { color: var(--ink); }
.subnav a[aria-current="page"] { font-weight: 600; color: var(--ink); }
.subnav a[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--accent); }
main.st .subnav { border-color: var(--st-line-2); }

.itabs { display: flex; border-bottom: 1px solid var(--line); }
.itab { position: relative; display: inline-flex; flex-shrink: 0; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border-radius: var(--r-control); white-space: nowrap; font-size: 14px; line-height: 22px; font-weight: 500; color: var(--ink-2); }
.itab:first-child { margin-left: -12px; }
.itab[aria-selected="true"] { font-weight: 600; color: var(--ink); }
.itab[aria-selected="true"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--accent); }
.itab .n { font-weight: 500; color: var(--muted); }

.apps { table-layout: fixed; min-width: 1120px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface); }
.apps tbody tr { height: 56px; }
.apps td { font-size: 14px; line-height: 22px; }
.apps td.act { font-size: 13px; line-height: 20px; }
.apps td.clinic { font-weight: 600; }
.apps td.trunc { overflow: hidden; text-overflow: ellipsis; }
.apps td .dt { color: var(--muted); }
.apps col.c-date, .apps col.c-who { width: 120px; }
.apps col.c-emr { width: 112px; }
.apps col.c-region { width: 120px; }
.apps col.c-tel { width: 150px; }
.apps col.c-act { width: 150px; }
.apps th.r { text-align: right; }
.nm { display: flex; min-width: 0; align-items: center; gap: 6px; }
.nm > .tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.acts { display: flex; justify-content: flex-end; gap: 8px; }
.mine { font-size: 13px; line-height: 20px; color: var(--muted); }
/* 새: 승인 줄 의원 이름 = 보기 링크 단추 */
.vlink { display: inline-flex; min-width: 0; max-width: 100%; align-items: center; gap: 6px; border-radius: var(--r-control); font-weight: 600; color: var(--accent-strong); text-underline-offset: 3px; }
.vlink:hover .tx { text-decoration: underline; }
.vlink .tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.install .panel-desc { padding-bottom: 16px; }

/* 본 기록 표 */
.seen { table-layout: fixed; }
.seen th:nth-child(1), .seen td:nth-child(1) { width: 220px; }
.seen th:nth-child(3), .seen td:nth-child(3) { width: 40%; }
.seen td .em { color: var(--muted); }

/* ── 대시보드(BitDashboard · DailySection · FlowSection) ── */
.dhead { margin-top: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.dhead h1 { font-size: 24px; line-height: 32px; letter-spacing: -0.01em; }
.dhead .when { display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 20px; color: var(--ink-2); }
.dhead .when svg { color: var(--muted); }
.dhead .r { margin-left: auto; display: flex; gap: 8px; }
.dsec { margin-top: 48px; border-top: 1px solid var(--line-strong); padding-top: 20px; }
.dsec-h { margin-bottom: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.dsec-h h2 { font-size: 20px; line-height: 28px; font-weight: 600; color: var(--ink); }
.dsec-h .rt { margin-left: auto; white-space: nowrap; font-size: 13px; color: var(--muted); }
.dctl { margin-bottom: 8px; }
.dctl p { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--muted); }
.dctl .row { margin-top: 4px; display: flex; align-items: center; gap: 4px 12px; }
.dctl .pick { margin-left: -6px; display: flex; align-items: center; gap: 4px; }
.dctl .stp { display: flex; width: 32px; height: 32px; align-items: center; justify-content: center; border-radius: var(--r-control); color: var(--ink-2); }
.dctl .dt { display: inline-flex; height: 32px; align-items: center; gap: 6px; border: 1px solid var(--line-strong); border-radius: var(--r-control); padding: 0 10px; font-size: 13px; font-weight: 600; }
.dctl .ap { font-size: 13px; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.kpi { min-width: 0; border-left: 1px solid var(--line); padding: 16px 20px; }
.kpi:first-child { border-left: 0; padding-left: 0; }
.kpi .l { display: block; height: 28px; font-size: 13px; line-height: 20px; color: var(--muted); }
.kpi .v { font-size: 28px; line-height: 36px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
.kpi .v small { margin-left: 2px; font-size: 14px; font-weight: 500; letter-spacing: 0; color: var(--muted); }
.kpi .v.d { font-size: 20px; line-height: 36px; color: var(--positive); }
.kpi .d2 { font-size: 13px; color: var(--muted); }
.rep { margin-top: 12px; }
.rep-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.rep-h p { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink); }
.rep-b { margin-top: 8px; max-width: 640px; font-size: 14px; line-height: 22px; color: var(--ink-2); }
.rep-b b { font-weight: 600; color: var(--ink); }
.flow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 32px; }
.fbox h3 { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--ink); }
.fbox .ds { font-size: 13px; color: var(--muted); }
.fbox svg.ch { display: block; width: 100%; height: 160px; margin-top: 12px; }

        <p class="band-t"><b>${esc(shownClinic.name)}</b> ${T.bandA} · <span class="ro">${T.bandRo}</span></p>
        <p class="band-h">· ${T.bandHint}</p>
        <button type="button" class="btn btn-sm t-secondary" data-act="back">${T.bandBack}</button>
      </div></div>` : '';
    document.body.classList.toggle('viewing', viewing);
    return `
      <div class="sticky">
        ${band}
        <div class="top"><div class="top-in">
          <div class="brand">${LOGO}<span>${esc(shownClinic.name)}</span></div>
          <div class="top-r">
            <div class="vp">
              <button type="button" class="btn btn-sm ${viewing ? 't-accent-outline' : 't-secondary'}" data-act="picker" aria-haspopup="dialog" aria-expanded="${st.pickerOpen}">${ic(I.eye)}<span>${T.pickBtn}</span>${ic(I.chev)}</button>
              ${st.pickerOpen ? picker() : ''}
            </div>
            <time class="clock">${TODAY_CLOCK}</time>
            <button type="button" class="btn btn-sm t-secondary acct" aria-expanded="false">${ic(I.user)}<span>${esc(byId(OWN).email)}</span>${ic(I.chev)}</button>
          </div>
        </div></div>
        <nav class="tabsbar" aria-label="메뉴"><div class="tabs-in">
          <div class="strip"><div class="strip-row">
            ${tabs.map(([t, k]) => `<a class="atab" href="#" data-act="tab" data-page="${k}" ${st.page === k ? 'aria-current="page"' : ''}>${t}</a>`).join('')}
          </div></div>
          <div class="more-wrap"><button type="button" class="more" aria-expanded="false">더보기${ic(I.chev)}</button></div>
        </div></nav>
      </div>
      <main id="main" class="${canvas ? 'st' : ''}"><div class="main-in">${body}</div></main>`;
  }

  // ─────────────────────────── 대시보드(보는 의원 · 저장된 숫자) ───────────────────────────
  function pageDashboard() {
    const id = st.viewing ?? OWN;
    const c = byId(id);
    const m = OCT[id];
    const r = seeded(hash(id + 'dash'));
    const day = Math.round((m.visits / m.days) * 1.04);
    const newp = Math.round((m.newp / m.days) * 1.1);
    const f90 = Math.round((m.f90 / m.days) * 1.05);
    const ret = day - newp - f90;
    const pt = Math.round(day * 0.43);
    // 30일 흐름(10월 24일 – 11월 23일)
    const flow = [];
    for (let i = 0; i < 31; i += 1) {
      const wd = (i + 5) % 7; // 10월 24일 = 토
      if (wd === 6) { flow.push([0, 0]); continue; }
      const f = (wd === 5 ? 0.6 : wd === 0 ? 1.25 : 1) * (0.86 + r() * 0.28);
      const v = Math.round((m.visits / m.days) * f);
      const n = Math.round((m.newp / m.days) * f * (0.8 + r() * 0.4));
      flow.push([n, v - n]);
    }
    const week = [1.22, 1.05, 1.0, 0.98, 1.02, 0.62].map((f) => Math.round((m.visits / m.days) * f));
    const rx = [['도수치료', 812], ['체외충격파', 344], ['주사', 298], ['물리치료 묶음', 1460], ['초음파', 206]].map(([n, v]) => [n, Math.round(v * m.visits / 3412)]).sort((a, b) => b[1] - a[1]);
    return `
      <div class="dhead">
        <h1>대시보드</h1>
        <span class="chip chip-neutral">저장된 숫자</span>
        <p class="when">${ic(I.clock, 14)}<span>11월 23일 19:02에 저장한 숫자</span></p>
        <div class="r"><button type="button" class="btn btn-sm t-secondary">${ic(I.reload, 14)}저장된 숫자 새로고침</button></div>
      </div>

      <section class="dsec">
        <div class="dsec-h"><h2>11월 23일 하루 분석</h2></div>
        <div class="dctl"><p>일별 현황 기준일</p>
          <div class="row"><div class="pick"><span class="stp">${ic(I.chev, 16, 'style="transform:rotate(90deg)"')}</span><span class="dt">${ic(I.cal, 14)}11월 23일 (월)${ic(I.chev, 14, 'style="color:var(--muted)"')}</span><span class="stp" style="opacity:.4">${ic(I.chev, 16, 'style="transform:rotate(-90deg)"')}</span></div><span class="ap">숫자 6개와 보고 문장에 적용</span></div>
        </div>
        <div class="kpis">
          <div class="kpi"><span class="l">환자 수</span><p class="v">${fmt(day)}<small>명</small></p></div>
          <div class="kpi"><span class="l">신환</span><p class="v">${fmt(newp)}<small>명</small></p></div>
          <div class="kpi"><span class="l">90일초진</span><p class="v">${fmt(f90)}<small>명</small></p></div>
          <div class="kpi"><span class="l">재진</span><p class="v">${fmt(ret)}<small>명</small></p></div>
          <div class="kpi"><span class="l">물리치료</span><p class="v">${fmt(pt)}<small>명</small></p></div>
          <div class="kpi"><span class="l">지난주 같은 요일보다</span><p class="v d">▲ ${fmt(Math.round(day * 0.07))}명</p><p class="d2">지난주 ${fmt(day - Math.round(day * 0.07))}명</p></div>
        </div>
        <div class="rep">
          <div class="rep-h"><p>원장님 보고 <span class="chip chip-neutral">자동 집계 요약</span></p><button type="button" class="btn btn-sm t-secondary" style="min-width:112px">${ic(I.copy, 14)}복사</button></div>
          <p class="rep-b"><b>11월 23일(월) 환자 ${fmt(day)}명, 신환 ${fmt(newp)}명입니다.</b> 지난주 월요일보다 ${fmt(Math.round(day * 0.07))}명 많고, 물리치료는 ${fmt(pt)}명입니다. 가장 많은 처방은 ${rx[0][0]}입니다.</p>
        </div>
      </section>

      <section class="dsec">
        <div class="dsec-h"><h2>기간별 흐름</h2><span class="rt">10월 24일 – 11월 23일</span>
          <div class="seg"><button type="button">7일</button><button type="button" aria-pressed="true">30일</button><button type="button">90일</button></div>
        </div>
        <div class="flow">
          <div class="fbox"><h3>환자 수 추이</h3><p class="ds">하루씩 · 단위 명</p>${barSvg(flow, ['var(--accent)', 'var(--chart-3)'], { h: 160, cls: 'ch' })}<div class="ax"><span>10월 24일</span><span>11월 8일</span><span>11월 23일</span></div><div class="lg"><span><i style="background:var(--accent)"></i>신환</span><span><i style="background:var(--chart-3)"></i>재진</span></div></div>
          <div class="fbox"><h3>신환 재방문율</h3><p class="ds">처음 온 환자가 7·14·30일 안에 다시 온 비율이에요.</p>
            <div class="rv">${[['7일 안', m.revisit * 0.42], ['14일 안', m.revisit * 0.68], ['30일 안', m.revisit]].map(([l, v]) => `<div class="rv-row"><span>${l}</span><span class="bar"><i style="width:${v}%"></i></span><b>${one(v)}%</b></div>`).join('')}</div></div>
          <div class="fbox"><h3>요일별 환자 수</h3><p class="ds">하루 평균, 요일마다 · 단위 명</p>${barSvg(week, ['var(--accent)'], { h: 160, cls: 'ch' })}<div class="ax axg" style="grid-template-columns:repeat(6,minmax(0,1fr))">${['월', '화', '수', '목', '금', '토'].map((d) => `<span>${d}</span>`).join('')}</div></div>
          <div class="fbox"><h3>처방 상위</h3><p class="ds">통계 탭에서 묶은 치료를 많이 한 순서로 5가지까지 적어요.</p>
            <ol class="top5">${rx.map(([n, v], i) => `<li><span>${i + 1}</span><span>${n}</span><b>${fmt(v)}건</b></li>`).join('')}</ol></div>
        </div>
      </section>`;
  }

  // ─────────────────────────── 통계(보는 의원 · 불러오기 상자 없음 · 고치기 단추 없음) ───────────────────────────
  function pageStats() {
    const id = st.viewing ?? OWN;
    const m = OCT[id];
    const series = dailySeries(id, m).filter((x) => !x.closed);
    const revBars = series.map((x) => Math.round((x.v * m.rev) / m.visits));
    const goal = m.goalWon;
    const pace = 23 / 30 * 100;
    const novRev = Math.round(m.rev * 0.8);
    const REVTABS = ['매출 추이', '급여', '비급여', '기타', '건당 진료비', '신환 1명당'];
    return `
      <h1>통계</h1>
      <div class="pline">
        <div class="pline-r">
          <div><p class="cap">빠르게 보기</p><div class="seg"><button type="button">최근 7일</button><button type="button" aria-pressed="true">최근 30일</button><button type="button">최근 90일</button><button type="button">최근 12개월</button></div></div>
          <div><p class="cap">기간 골라 보기</p><div style="display:flex;gap:8px;align-items:center"><div class="seg"><button type="button">일별</button><button type="button">주별</button><button type="button">월별</button></div><div class="stepbox"><button type="button" aria-label="앞 달">${ic(I.chev, 16, 'style="transform:rotate(90deg)"')}</button><span style="font-weight:500;color:var(--muted)">2026년 11월</span><button type="button" aria-label="다음 달" disabled>${ic(I.chev, 16, 'style="transform:rotate(-90deg)"')}</button></div><button type="button" class="btn btn-sm t-secondary" style="color:var(--ink-2)">${ic(I.cal, 16)}직접 날짜</button></div></div>
        </div>
        <p class="rng"><b>최근 30일</b> · 10월 25일 – 11월 23일 · 증감은 지난 30일과 비교</p>
      </div>
      <nav class="toc" aria-label="통계 바로가기"><div class="toc-s">${['요약', '환자', '매출', '예약·전환', '예약', '처방', '진료 운영', '보고'].map((n, i) => `<a href="#" ${i === 0 ? 'aria-current="true"' : ''}>${n}</a>`).join('')}</div></nav>
      <div class="stack">
        <section class="stc"><div class="stc-h"><h2>환자 요약</h2><span class="d">하루 평균 · 신환·재진 합 · 증감은 지난 30일과 비교</span></div>
          <div class="stc-b"><div class="grid4">
            ${kcell('하루 평균 내원', '진료한 날 25일', one(m.visits / m.days), '건', 'up', '4.1%', '늘어남')}
            ${kcell('신환', '처음 온 환자', fmt(m.newp), '명', 'up', '12명 (+4.3%)', '늘어남')}
            ${kcell('90일초진', '90일 넘어 다시 온 내원', fmt(m.f90), '건', 'flat', '3건 (−2.3%)', '줄어듦')}
            ${kcell('재진', '그 밖의 내원', fmt(m.visits - m.newp - m.f90), '건', 'flat', '96건 (+3.3%)', '늘어남')}
          </div></div></section>
        <section class="stc"><div class="stc-h"><h2>매출 요약</h2><span class="d">총진료비 · 수납한 날 기준</span></div>
          <div class="stc-b"><div class="grid2">
            ${kcell('총매출', null, manWon(m.rev).replace(' 원', ''), '원', 'up', '520만 원 (+4.1%)', '지난 30일보다 늘어남')}
            ${kcell('건당 진료비', `매출 ÷ 접수 ${fmt(m.visits)}건`, fmt(Math.trunc(m.rev / m.visits)), '원', 'flat', '12원 (+0.0%)', '늘어남')}
          </div></div></section>
        <section class="stc"><div class="stc-h"><h2>이번 달 목표</h2><span class="d">11월 · 30일 가운데 23일 지남</span></div>
          <div class="stc-b">${goal === null ? `<p class="empty1">${T.noGoal}</p>` : `<div>
            <p class="ln" style="font-size:15px;line-height:24px;color:var(--st-ink-2)">지금까지 <b style="color:var(--st-ink)">${manWon(novRev)}</b> · 목표 ${manWon(goal)}의 <b style="color:var(--st-ink)">${one(novRev / goal * 100)}%</b> · 월말 예상 ${manWon(Math.round(novRev / 0.78))}</p>
            <div class="goalbar"><i style="width:${Math.min(100, novRev / goal * 100)}%"></i><u style="left:${pace}%"></u></div>
            <p class="note">세로줄은 이번 달이 지나간 만큼이에요. 월말 예상은 지금까지에 남은 날마다 지난 8주 같은 요일의 하루 평균을 더해요.</p></div>`}
          </div></section>
        <section class="stc"><div class="stc-h"><h2>매출</h2><span class="d">최근 30일 · 하루씩</span></div>
          <div class="stc-b"><div>
            <div class="rtabs" role="tablist" aria-label="매출 보기">${REVTABS.map((t, i) => `<button type="button" role="tab" aria-selected="${i === st.revTab}">${t}</button>`).join('')}</div>
            <p class="ln" style="margin-top:12px;font-size:14px;color:var(--st-ink-2)">기간 합계 <b style="color:var(--st-ink)">${manWon(m.rev)}</b> · 하루 평균 ${manWon(Math.round(m.rev / m.days))}</p>
            ${barSvg(revBars, ['var(--accent)'], { h: 200, cls: 'big' })}
            <div class="ax" style="display:flex;justify-content:space-between;font-size:12px;color:var(--st-muted);margin-top:4px"><span>10월 25일</span><span>11월 9일</span><span>11월 23일</span></div>
          </div></div></section>
      </div>`;
  }
  function kcell(label, hint, value, unit, dir, text, tail) {
    const tone = dir === 'up' ? 'up' : dir === 'down' ? 'down' : '';
    const arrow = text.includes('−') ? '▼' : '▲';
    return `<div class="kc"><p class="l"><b>${label}</b>${hint ? `<span>${hint}</span>` : ''}</p>
      <p class="v"><b>${value}</b><small>${unit}</small></p>
      <p class="dl ${tone}" style="${tone ? '' : 'color:var(--st-ink-2)'}"><span class="ar" style="color:inherit">${arrow}</span> ${text} <span>${tail}</span></p></div>`;
  }

  // ─────────────────────────── 관리자 머리 ───────────────────────────
  function adminHead(cur) {
    return `<div class="ahead">
      <div class="ahead-t">
        <p class="loc">${ic(I.userCheck, 14)}관리자</p>
        <h1>${cur === 'admin' ? '가입 승인' : T.cmpTitle}</h1>
      </div>
      <nav class="subnav" aria-label="관리자 안 메뉴">
        <a href="#" data-act="tab" data-page="admin" ${cur === 'admin' ? 'aria-current="page"' : ''}>가입 승인</a>
        <a href="#" data-act="tab" data-page="compare" ${cur === 'compare' ? 'aria-current="page"' : ''}>${T.cmpTitle}</a>
      </nav>
    </div>`;
  }

  // ─────────────────────────── 관리자 · 가입 승인(승인 탭) ───────────────────────────
  function phoneText(p) { if (!p) return '—'; const head = p.startsWith('02') ? 2 : 3; return `${p.slice(0, head)}-${p.slice(head, -4)}-${p.slice(-4)}`; }
  function regionSelect(c) {
    const v = st.regions[c.id];
    const opts = [...REGIONS.map((r) => `<option ${v === r ? 'selected' : ''}>${r}</option>`), `<option value="" ${v ? '' : 'selected'}>${UNKNOWN}</option>`].join('');
    return `<select class="sel${v ? '' : ' unknown'}" data-act="region" data-id="${c.id}" aria-label="${esc(c.name)} 지역" ${v ? '' : `title="${T.regionUnknownTitle}"`}>${opts}</select>`;
  }
  function pageAdmin() {
    const rows = CLINICS.map((c) => {
      const own = c.id === OWN;
      const badge = c.owner ? '주 관리자' : c.admin ? '관리자' : null;
      const chip = badge ? `<span class="chip chip-accent">${badge}</span>` : '';
      const name = own
        ? `<div class="nm"><span class="tx">${esc(c.name)}</span>${chip}</div>`
        : `<div class="nm"><button type="button" class="vlink" data-act="view" data-id="${c.id}" title="${esc(T.viewTitle(c.name))}">${ic(I.eye, 14)}<span class="tx">${esc(c.name)}</span></button>${chip}</div>`;
      const act = own ? `<span class="mine">내 계정</span>` : c.admin ? `<button type="button" class="btn btn-sm t-secondary">관리자 빼기</button>` : `<button type="button" class="btn btn-sm t-secondary">관리자로 정하기</button>`;
      return `<tr>
        <td><span class="dt">${c.date}</span></td>
        <td class="clinic" title="${esc(c.name)}">${name}</td>
        <td>${regionSelect(c)}</td>
        <td class="sub">${c.emr}</td>
        <td class="trunc">${esc(c.who)}</td>
        <td class="sub trunc">${esc(c.email)}</td>
        <td class="sub">${phoneText(c.tel)}</td>
        <td class="act"><div class="acts">${act}</div></td>
      </tr>`;
    }).join('');
    const seen = SEEN.map(([when, who, what]) => `<tr><td class="sub">${when}</td><td>${esc(byId(who).name)} <span class="em">· ${esc(byId(who).email)}</span></td><td>${esc(byId(what).name)}</td></tr>`).join('');
    return `<div class="admin">
      ${adminHead('admin')}
      <p class="intro">${T.adminIntro}</p>
      <section class="panel install"><div class="panel-head"><h2 class="panel-title">설치 파일</h2></div>
        <p class="panel-desc">비트 PC 연결 화면의 [내려받기] 단추가 여기 올린 파일을 줘요. 로그인하고 승인된 사람만 받을 수 있어요. (이 시안에서는 줄였어요)</p></section>
      <div role="tablist" aria-label="신청 상태" class="itabs">
        <button type="button" role="tab" class="itab" aria-selected="false">대기 <span class="n">${PENDING.length}</span></button>
        <button type="button" role="tab" class="itab" aria-selected="true">승인 <span class="n">${CLINICS.length}</span></button>
        <button type="button" role="tab" class="itab" aria-selected="false">거절 <span class="n">${REJECTED.length}</span></button>
      </div>
      <p role="status" class="status">${st.message ? `${ic(I.check)}${esc(st.message)}` : ''}</p>
      <div class="twrap">
        <table class="apps" aria-label="승인 신청">
          <colgroup><col class="c-date"><col><col class="c-region"><col class="c-emr"><col class="c-who"><col><col class="c-tel"><col class="c-act"></colgroup>
          <thead><tr><th>신청일</th><th>의원 이름</th><th>지역</th><th>EMR</th><th>신청자</th><th>이메일</th><th>연락처</th><th class="r">동작</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <section class="panel" aria-labelledby="seen-t">
        <div class="panel-head"><h2 class="panel-title" id="seen-t">${T.seenTitle}</h2><span class="count">${T.seenCount(SEEN.length)}</span></div>
        <p class="panel-desc">${T.seenDesc}</p>
        <div class="twrap" style="padding-top:12px"><table class="seen" aria-label="${T.seenTitle}">
          <thead><tr>${T.seenCols.map((h) => `<th>${h}</th>`).join('')}</tr></thead>
          <tbody>${seen}</tbody>
        </table></div>
      </section>
    </div>`;
  }

  // ─────────────────────────── 관리자 · 의원 비교 ───────────────────────────
  const REP = [
    { key: 'nonpay', label: '비급여 비율', get: (m) => m.nonpay, text: (m) => pct(m.nonpay) },
    { key: 'revisit', label: '신환 재방문율 (30일)', get: (m) => m.revisit, text: (m) => pct(m.revisit) },
    { key: 'rsv', label: '신환 예약률', get: (m) => m.rsv, text: (m) => pct(m.rsv) },
    { key: 'block', label: 'Block 전환율', get: (m) => m.block, text: (m) => pct(m.block) },
    { key: 'rsvCount', label: '예약 수', get: (m) => m.rsvCount, text: (m) => (m.rsvCount === null ? null : `${fmt(m.rsvCount)}건`) },
    { key: 'age', label: '가장 많은 나이대', get: (m) => m.age[1], text: (m) => `${m.age[0]} · ${pct(m.age[1])}` },
    { key: 'goal', label: '목표 달성률', get: (m) => (m.goalWon === null ? null : (m.rev / m.goalWon) * 100), text: (m) => (m.goalWon === null ? null : pct((m.rev / m.goalWon) * 100)) },
    { key: 'three', label: '3번 이상 받은 비율', get: (m) => m.three, text: (m) => pct(m.three) },
  ];
  const SALES = [
    { key: 'rev', label: '총진료비', get: (m) => m.rev, text: (m) => manWon(m.rev) },
    { key: 'visits', label: '내원 수', get: (m) => m.visits, text: (m) => `${fmt(m.visits)}건` },
    { key: 'newp', label: '신환', get: (m) => m.newp, text: (m) => `${fmt(m.newp)}명` },
    { key: 'ret', label: '재진', get: (m) => m.visits - m.newp - m.f90, text: (m) => `${fmt(m.visits - m.newp - m.f90)}건` },
    { key: 'avg', label: '하루 평균 내원', get: (m) => m.visits / m.days, text: (m) => `${one(m.visits / m.days)}건` },
  ];
  const PAYCOLS = JOBS.map((j) => ({ key: 'pay:' + j, label: j, get: (m, p) => (p && p[j][0] > 0 ? p[j][1] : null), text: (m, p) => (p && p[j][0] > 0 ? manOnly(p[j][1]) : null) }));
  const COLS = [...SALES.map((c) => ({ ...c, g: 0 })), ...PAYCOLS.map((c) => ({ ...c, g: 1 })), ...REP.map((c) => ({ ...c, g: 2 }))];

  function cmpClinics() {
    const list = st.cmpRegion === '전체' ? CLINICS : CLINICS.filter((c) => regionOf(c) === st.cmpRegion);
    // 차례: 내 의원 먼저, 나머지는 이름 차례(순위 표만 고른 칸으로 줄을 세운다)
    const ordered = list.slice().sort((a, b) => (a.id === OWN ? -1 : b.id === OWN ? 1 : a.name.localeCompare(b.name, 'ko')));
    return ordered.map((c) => ({ c, m: monthData(c.id, st.cmpMonth), p: monthPay(c.id, st.cmpMonth) }));
  }
  function sortedRows(rows) {
    const col = COLS.find((x) => x.key === st.sort.key);
    const v = (r) => (r.m ? col.get(r.m, r.p) : null);
    return rows.slice().sort((a, b) => {
      const x = v(a), y = v(b);
      if (x === null && y === null) return a.c.name.localeCompare(b.c.name, 'ko');
      if (x === null) return 1;
      if (y === null) return -1;
      return st.sort.dir === 'asc' ? x - y : y - x;
    });
  }
  function nameCell(c, i) {
    const own = c.id === OWN;
    return `<td class="stk"><div class="cn">${i !== null ? `<span class="rk">${i}</span>` : ''}<span class="nmt">${esc(c.name)}</span>${own ? `<span class="chip chip-accent">${T.mine}</span>` : ''}${st.cmpRegion === '전체' ? `<span class="rg">${esc(regionOf(c))}</span>` : ''}</div></td>`;
  }
  function emptyNote(pair) { return `<p class="empty1"><b>${pair[0]}</b> · ${pair[1]}</p>`; }

  function rankCard(rows, empty) {
    let body;
    if (empty) body = emptyNote(empty);
    else {
      const head1 = `<tr><th class="stk" rowspan="2" style="vertical-align:bottom;text-align:left">의원</th>
        <th class="grp" colspan="${SALES.length}">${T.groups[0]}</th><th class="grp" colspan="${PAYCOLS.length}">${T.groups[1]}</th><th class="grp" colspan="${REP.length}">${T.groups[2]}</th></tr>`;
      const head2 = `<tr>${COLS.map((col, i) => {
        const on = st.sort.key === col.key;
        const aria = on ? (st.sort.dir === 'asc' ? 'ascending' : 'descending') : 'none';
        const arrow = on ? ic(st.sort.dir === 'asc' ? I.up : I.down, 12) : '';
        const gs = i === 0 || COLS[i - 1].g !== col.g ? ' class="gs"' : '';
        return `<th${gs} aria-sort="${aria}"><button type="button" class="sortb" data-act="sort" data-key="${col.key}">${col.label}<span class="ar">${arrow}</span></button></th>`;
      }).join('')}</tr>`;
      const sorted = sortedRows(rows);
      const trs = sorted.map((r, i) => `<tr>${nameCell(r.c, i + 1)}${COLS.map((col, k) => {
        const t = r.m ? col.text(r.m, r.p) : null;
        const cls = [k === 0 || COLS[k - 1].g !== col.g ? 'gs' : '', st.sort.key === col.key ? 'on' : '', t === null ? 'na' : ''].filter(Boolean).join(' ');
        return `<td${cls ? ` class="${cls}"` : ''}>${t ?? '–'}</td>`;
      }).join('')}</tr>`).join('');
      body = `<div class="rank-wrap"><table class="rank" aria-label="${T.rankTitle}"><thead>${head1}${head2}</thead><tbody>${trs}</tbody></table></div><p class="note">${T.rankFoot}</p>`;
    }
    return `<section class="stc" id="cmp-rank"><div class="stc-h"><h2>${T.rankTitle}</h2><span class="d">${empty ? ymText(st.cmpMonth) : `${ymText(st.cmpMonth)} · ${T.rankDesc}`}</span></div><div class="stc-b"><div>${body}</div></div></section>`;
  }

  function payCard(rows, empty) {
    let body;
    if (empty) body = emptyNote(empty);
    else {
      const head = `<tr><th class="stk" style="text-align:left">의원</th>${JOBS.map((j) => `<th style="text-align:left">${j}</th>`).join('')}<th style="text-align:left">파트타임</th></tr>`;
      const trs = rows.map((r) => {
        if (!r.p) return `<tr>${nameCell(r.c, null)}<td class="none" colspan="${JOBS.length + 1}">${T.payNone(mNum(st.cmpMonth))}</td></tr>`;
        const cells = JOBS.map((j) => {
          const [n, avg, lo, hi] = r.p[j];
          if (n === 0) return `<td class="na" style="text-align:left">–</td>`;
          if (n === 1) return `<td style="text-align:left"><span class="a">${manOnly(avg)}</span><span class="b">1명</span></td>`;
          return `<td style="text-align:left"><span class="a">평균 ${manOnly(avg)}</span><span class="b">${n}명 · ${fmt(lo)}만~${fmt(hi)}만 원</span></td>`;
        }).join('');
        return `<tr>${nameCell(r.c, null)}${cells}<td style="text-align:left">${r.p.part > 0 ? `${r.p.part}명` : '<span style="color:var(--st-muted)">–</span>'}</td></tr>`;
      }).join('');
      // 전체: 직군마다 모든 사람 평균
      const all = JOBS.map((j) => {
        let n = 0, sum = 0, lo = Infinity, hi = -Infinity;
        rows.forEach((r) => { if (!r.p) return; const [k, avg, l, h] = r.p[j]; if (k === 0) return; n += k; sum += avg * k; lo = Math.min(lo, l ?? avg); hi = Math.max(hi, h ?? avg); });
        return n === 0 ? `<td class="na" style="text-align:left">–</td>` : `<td style="text-align:left"><span class="a">평균 ${manOnly(Math.round(sum / n))}</span><span class="b" style="font-weight:400">${n}명 · ${fmt(lo)}만~${fmt(hi)}만 원</span></td>`;
      }).join('');
      const parts = rows.reduce((a, r) => a + (r.p ? r.p.part : 0), 0);
      body = `<div class="rank-wrap"><table class="rank pay" aria-label="${T.payTitle}"><thead>${head}</thead><tbody>${trs}</tbody>
        <tfoot><tr><td class="stk">${T.total} ${rows.length}곳</td>${all}<td style="text-align:left">${parts}명</td></tr></tfoot></table></div><p class="note">${T.payFoot}</p>`;
    }
    return `<section class="stc" id="cmp-pay"><div class="stc-h"><h2>${T.payTitle}</h2><span class="d">${ymText(st.cmpMonth)} 급여 · ${T.payDesc}</span></div><div class="stc-b"><div>${body}</div></div></section>`;
  }

  function salesCard(rows, empty) {
    let body;
    if (empty) body = emptyNote(empty);
    else {
      const head = `<tr><th class="stk" style="text-align:left">의원</th>${SALES.map((s) => `<th>${s.label}</th>`).join('')}</tr>`;
      const trs = rows.map((r) => `<tr>${nameCell(r.c, null)}${SALES.map((s) => (r.m ? `<td>${s.text(r.m)}</td>` : `<td class="na">–</td>`)).join('')}</tr>`).join('');
      const has = rows.filter((r) => r.m);
      const sum = (f) => has.reduce((a, r) => a + f(r.m), 0);
      const foot = `<tr><td class="stk">${T.total} ${rows.length}곳</td><td>${manWon(sum((m) => m.rev))}</td><td>${fmt(sum((m) => m.visits))}건</td><td>${fmt(sum((m) => m.newp))}명</td><td>${fmt(sum((m) => m.visits - m.newp - m.f90))}건</td><td>의원 평균 ${one(sum((m) => m.visits / m.days) / Math.max(1, has.length))}건</td></tr>`;
      body = `<div class="rank-wrap"><table class="rank" aria-label="${T.salesTitle}" style="width:100%"><thead>${head}</thead><tbody>${trs}</tbody><tfoot>${foot}</tfoot></table></div>`;
    }
    return `<section class="stc" id="cmp-sales"><div class="stc-h"><h2>${T.salesTitle}</h2><span class="d">${ymText(st.cmpMonth)} · ${T.salesDesc}</span></div><div class="stc-b"><div>${body}</div></div></section>`;
  }

  // 통계 나란히 보기: 줄 = 통계 탭 큰 카드, 칸 = 의원
  const SIDE_ROWS = [
    ['요약', '환자 요약 · 매출 요약 · 평소와 다른 것(그 달 마지막 주를 앞 4주와 견줌) · 이번 달 목표(그 달 목표)'],
    ['환자', '일별 내원 · 환자 구성 · 신환 재방문율 · 몇 번까지 받나'],
    ['매출', '매출 추이 · 급여·비급여·기타'],
    ['예약·전환', '신환 예약률 · 90일 예약률 · Block 전환'],
    ['예약', '예약 수 · 취소율 · 변경율 · 안 옴율'],
    ['처방', '처방별 추세 · 처방별 신환·재진'],
    ['진료 운영', '원장님별 · 시간대별 접수 · 요일별 내원 · 휴일에 따라'],
  ];
  function sideCard(rowIdx, c, m) {
    const who = `<p class="who">${esc(c.name)}</p>`;
    if (!m) return `<div class="mc">${who}<p class="na">자료 없음</p></div>`;
    const r = seeded(hash(c.id + 'side' + rowIdx));
    const days = dailySeries(c.id, m);
    const sub = (title, inner) => `<div class="sb"><h4>${title}</h4>${inner}</div>`;
    const ret = m.visits - m.newp - m.f90;
    if (rowIdx === 0) {
      const alerts = [
        [r() > 0.4 ? 'up' : 'down', '신환', Math.round(10 + r() * 20)],
        [r() > 0.5 ? 'up' : 'down', '물리치료', Math.round(15 + r() * 12)],
      ];
      return `<div class="mc">${who}
        ${sub('환자 요약', `<div class="mk"><p>하루 평균 내원<strong>${one(m.visits / m.days)}<small>건</small></strong></p><p>신환<strong>${fmt(m.newp)}<small>명</small></strong></p><p>90일초진<strong>${fmt(m.f90)}<small>건</small></strong></p><p>재진<strong>${fmt(ret)}<small>건</small></strong></p></div>`)}
        ${sub('매출 요약', `<div class="mk"><p>총매출<strong>${manWon(m.rev).replace(' 원', '')}<small>원</small></strong></p><p>건당 진료비<strong>${fmt(Math.trunc(m.rev / m.visits))}<small>원</small></strong></p></div>`)}
        ${sub('평소와 다른 것', `<div class="al">${alerts.map(([d, n, v]) => `<p><span class="${d}">${d === 'up' ? '▲' : '▼'} ${v}%</span> ${n}${n === '신환' ? '이' : '가'} 평소보다 ${d === 'up' ? '많아요' : '적어요'}</p>`).join('')}</div>`)}
        ${sub('이번 달 목표', m.goalWon === null ? `<p class="na">${T.noGoal}</p>` : `<p class="ln"><b>${one(m.rev / m.goalWon * 100)}%</b> · 목표 ${manWon(m.goalWon)}</p><div class="goalbar" style="height:8px;margin-top:8px"><i style="width:${Math.min(100, m.rev / m.goalWon * 100)}%"></i></div>`)}
      </div>`;
    }
    if (rowIdx === 1) {
      const bands = [[m.age[0], m.age[1]], ['40대', 17 + r() * 4], ['60대', 15 + r() * 4]].filter((x, i, a) => a.findIndex((y) => y[0] === x[0]) === i);
      if (bands.length < 3) bands.push(['30대', 12 + r() * 3]);
      const maxB = Math.max(...bands.map((b) => b[1]));
      return `<div class="mc">${who}
        ${sub('일별 내원', `${barSvg(days.map((x) => [x.n, x.v - x.n]), ['var(--accent)', 'var(--chart-3)'])}<div class="ax"><span>10월 1일</span><span>10월 31일</span></div>`)}
        ${sub('환자 구성', `<div class="hb">${bands.map(([b, v]) => `<div><span>${b}</span><i style="width:${(v / maxB) * 100}%"></i><b>${one(v)}%</b></div>`).join('')}</div>`)}
        ${sub('신환 재방문율', `<div class="mk mk3"><p>7일 안<strong>${one(m.revisit * 0.42)}<small>%</small></strong></p><p>14일 안<strong>${one(m.revisit * 0.68)}<small>%</small></strong></p><p>30일 안<strong>${one(m.revisit)}<small>%</small></strong></p></div>`)}
        ${sub('몇 번까지 받나', `<div class="hb">${[['1번', 100], ['2번', 52 + r() * 22], ['3번 이상', m.three]].map(([b, v]) => `<div><span>${b}</span><i style="width:${v}%;background:var(--st-f90)"></i><b>${one(v)}%</b></div>`).join('')}</div>`)}
      </div>`;
    }
    if (rowIdx === 2) {
      const cov = 100 - m.nonpay - 4.2;
      return `<div class="mc">${who}
        ${sub('매출 추이', `${barSvg(days.map((x) => Math.round((x.v * m.rev) / m.visits)), ['var(--accent)'])}<div class="ax"><span>10월 1일</span><span>10월 31일</span></div><p class="ln">합계 <b>${manWon(m.rev)}</b></p>`)}
        ${sub('급여·비급여·기타', `<div class="split"><i style="width:${cov}%;background:var(--cat-1)"></i><i style="width:${m.nonpay}%;background:var(--cat-2)"></i><i style="width:4.2%;background:var(--cat-3)"></i></div>
          <div class="lg" style="flex-wrap:wrap"><span><i style="background:var(--cat-1)"></i>급여 ${one(cov)}%</span><span><i style="background:var(--cat-2)"></i>비급여 ${one(m.nonpay)}%</span><span><i style="background:var(--cat-3)"></i>기타 4.2%</span></div>`)}
      </div>`;
    }
    if (rowIdx === 3) {
      if (m.rsv === null) return `<div class="mc">${who}<p class="na">${T.noSunap}</p></div>`;
      return `<div class="mc">${who}<div class="mk mk3" style="margin-top:0"><p>신환 예약률<strong>${one(m.rsv)}<small>%</small></strong></p><p>90일 예약률<strong>${one(m.rsv90)}<small>%</small></strong></p><p>Block 전환<strong>${one(m.block)}<small>%</small></strong></p></div><p class="na" style="font-size:12px">수납일지 마감한 날만</p></div>`;
    }
    if (rowIdx === 4) {
      if (m.rsvCount === null) return `<div class="mc">${who}<p class="na">${T.noCal}</p></div>`;
      return `<div class="mc">${who}<div class="mk" style="margin-top:0"><p>예약 수<strong>${fmt(m.rsvCount)}<small>건</small></strong></p><p>취소율<strong>${one(m.cancel)}<small>%</small></strong></p><p>변경율<strong>${one(m.moved)}<small>%</small></strong></p><p>안 옴율<strong>${one(m.noshow)}<small>%</small></strong></p></div></div>`;
    }
    if (rowIdx === 5) {
      const k = m.visits / 3412;
      const groups = [['물리치료 묶음', 1460], ['도수치료', 812], ['체외충격파', 344], ['주사', 298]].map(([n, v]) => [n, Math.round(v * k * (0.85 + r() * 0.3))]).sort((a, b) => b[1] - a[1]).slice(0, 3);
      const maxG = groups[0][1];
      return `<div class="mc">${who}
        ${sub('처방별 추세', `<div class="hb">${groups.map(([n, v]) => `<div><span>${n}</span><i style="width:${(v / maxG) * 100}%;background:var(--st-ret)"></i><b>${fmt(v)}건</b></div>`).join('')}</div>`)}
        ${sub('처방별 신환·재진', `<table class="mt"><tbody>${groups.map(([n, v]) => { const nn = Math.round(v * (0.08 + r() * 0.06)); return `<tr><td>${n}</td><td>신환 ${fmt(nn)}명</td><td>재진 ${fmt(v - nn)}건</td></tr>`; }).join('')}</tbody></table>`)}
      </div>`;
    }
    // 진료 운영
    const docs = Array.from({ length: m.docs }, (_, i) => i);
    const share = m.docs === 1 ? [1] : m.docs === 2 ? [0.56, 0.44] : [0.41, 0.33, 0.26];
    const hours = [0.9, 1.0, 0.95, 0.55, 0.35, 0.8, 0.7, 0.62, 0.5, 0.3].map((x) => x * (0.85 + r() * 0.3));
    const heatColor = (x) => (x > 0.95 ? 'var(--st-h5)' : x > 0.8 ? 'var(--st-h4)' : x > 0.62 ? 'var(--st-h3)' : x > 0.45 ? 'var(--st-h2)' : 'var(--st-h1)');
    const week = [1.22, 1.05, 1.0, 0.98, 1.02, c.id === 'saa' ? 0 : 0.6].map((f) => Math.round((m.visits / m.days) * f * (0.95 + r() * 0.1)));
    return `<div class="mc">${who}
      ${sub('원장님별', m.docs === 1 ? `<p class="na">원장님이 한 분이라 나누어 볼 것이 없어요.</p>` : `<table class="mt"><tbody>${docs.map((i) => `<tr><td>원장님 ${i + 1}</td><td>${fmt(Math.round(m.visits * share[i]))}건</td><td>${manWon(Math.round(m.rev * share[i]))}</td></tr>`).join('')}</tbody></table>`)}
      ${sub('시간대별 접수', `<div class="heat">${hours.map((x) => `<i style="background:${heatColor(x)}"></i>`).join('')}</div><div class="ax"><span>9시</span><span>18시</span></div>`)}
      ${sub('요일별 내원', `${barSvg(week, ['var(--accent)'], { h: 48 })}<div class="ax axg" style="grid-template-columns:repeat(6,minmax(0,1fr))">${['월', '화', '수', '목', '금', '토'].map((d) => `<span>${d}</span>`).join('')}</div>`)}
      ${sub('휴일에 따라', `<table class="mt"><tbody><tr><td>공휴일 앞날</td><td>평소보다 +${Math.round(6 + r() * 12)}%</td></tr><tr><td>공휴일 다음 날</td><td>평소보다 +${Math.round(12 + r() * 14)}%</td></tr></tbody></table>`)}
    </div>`;
  }
  function sideSection(rows, empty) {
    let body;
    if (empty) body = `<div class="stc" style="margin-top:12px">${emptyNote(empty)}</div>`;
    else if (st.cmpRegion === '전체') body = `<div class="stc" style="margin-top:12px">${emptyNote(T.sideAll)}</div>`;
    else {
      const n = rows.length;
      const head = rows.map(({ c }) => `<div class="colh"><b>${esc(c.name)}</b><span>${esc(regionOf(c))}${c.id === OWN ? ` <span class="chip chip-accent">${T.mine}</span>` : ''}</span></div>`).join('');
      const grid = SIDE_ROWS.map(([t, d], i) => `<div class="rowh"><div><h3>${t}</h3><span>${d}</span></div></div>${rows.map(({ c, m }) => sideCard(i, c, m)).join('')}`).join('');
      body = `<div class="side-s"><div class="side-g" style="grid-template-columns:repeat(${n}, 288px)">${head}${grid}</div></div>`;
    }
    return `<section class="side" id="cmp-side" aria-labelledby="side-t"><div class="side-h"><h2 id="side-t">${T.sideTitle}</h2><span class="d">${empty || st.cmpRegion === '전체' ? ymText(st.cmpMonth) : `${ymText(st.cmpMonth)} · ${st.cmpRegion} ${rows.length}곳 · ${T.sideDesc}`}</span></div>${body}</section>`;
  }

  function pageCompare() {
    const rows = cmpClinics();
    const noClinic = rows.length === 0;
    const noData = !noClinic && rows.every((r) => r.m === null);
    const empty = noClinic ? T.emptyRegion(st.cmpRegion) : noData ? T.emptyMonth(ymText(st.cmpMonth)) : null;
    const payEmpty = noClinic ? T.emptyRegion(st.cmpRegion) : rows.every((r) => !r.p) ? T.emptyMonthPay(ymText(st.cmpMonth)) : null;
    const prevOff = st.cmpMonth <= FIRST_MONTH, nextOff = st.cmpMonth >= LAST_MONTH;
    const regionOpts = [`<option ${st.cmpRegion === '전체' ? 'selected' : ''}>${T.regionAll}</option>`, ...REGIONS.map((r) => `<option ${st.cmpRegion === r ? 'selected' : ''}>${r}</option>`)].join('');
    const where = st.cmpRegion === '전체' ? `의원 ${rows.length}곳` : `${st.cmpRegion} 의원 ${rows.length}곳`;
    return `<div class="admin" style="gap:0">
      ${adminHead('compare')}
      <p class="intro" style="margin-top:16px">${T.cmpIntro}</p>
      <div class="pline">
        <div class="cmp-pick">
          <label><p class="cap">${T.region}</p><select class="sel" data-act="cmpRegion" aria-label="${T.region}">${regionOpts}</select></label>
          <div><p class="cap">${T.month}</p><div class="stepbox" role="group" aria-label="달 옮기기"><button type="button" aria-label="앞 달" data-act="month" data-d="-1" ${prevOff ? 'disabled' : ''}>${ic(I.chev, 16, 'style="transform:rotate(90deg)"')}</button><span aria-live="polite">${ymText(st.cmpMonth)}</span><button type="button" aria-label="다음 달" data-act="month" data-d="1" ${nextOff ? 'disabled' : ''}>${ic(I.chev, 16, 'style="transform:rotate(-90deg)"')}</button></div></div>
        </div>
        <p class="rng"><b>${ymText(st.cmpMonth)}</b> · ${mNum(st.cmpMonth)}월 1일 – ${mNum(st.cmpMonth)}월 ${lastDayOf(st.cmpMonth)}일 · ${where}</p>
      </div>
      <nav class="toc" aria-label="의원 비교 바로가기"><div class="toc-s">${T.toc.map((n, i) => `<a href="#${['cmp-rank', 'cmp-side', 'cmp-pay', 'cmp-sales'][i]}" data-act="toc" ${i === 0 ? 'aria-current="true"' : ''}>${n}</a>`).join('')}</div></nav>
      <div class="stack">
        ${rankCard(rows, empty)}
        ${sideSection(rows, empty)}
        ${payCard(rows, payEmpty)}
        ${salesCard(rows, empty)}
      </div>
    </div>`;
  }

  // ─────────────────────────── 그리기 · 누름 ───────────────────────────
  function render() {
    renderBar();
    let body = '';
    if (st.page === 'dashboard') body = pageDashboard();
    else if (st.page === 'stats') body = pageStats();
    else if (st.page === 'admin') body = pageAdmin();
    else body = pageCompare();
    document.getElementById('app').innerHTML = shell(body, { canvas: st.page === 'stats' || st.page === 'compare' });
    const find = document.getElementById('vpFind');
    if (find) find.addEventListener('input', (e) => { st.find = e.target.value; const pos = e.target.selectionStart; render(); const f = document.getElementById('vpFind'); f.focus(); f.setSelectionRange(pos, pos); });
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) { if (st.pickerOpen && !e.target.closest('.vp')) { st.pickerOpen = false; render(); } return; }
    const act = el.dataset.act;
    if (act === 'picker') { st.pickerOpen = !st.pickerOpen; render(); if (st.pickerOpen) document.getElementById('vpFind')?.focus(); }
    else if (act === 'view') {
      e.preventDefault();
      st.viewing = el.dataset.id === OWN ? null : el.dataset.id; st.pickerOpen = false; st.find = '';
      if (st.page === 'admin' || st.page === 'compare') st.page = 'dashboard';
      render(); window.scrollTo(0, 0);
    } else if (act === 'back') { st.viewing = null; render(); }
    else if (act === 'tab') {
      e.preventDefault();
      const p = el.dataset.page;
      if (['dashboard', 'stats', 'admin', 'compare'].includes(p)) { st.page = p; st.pickerOpen = false; render(); window.scrollTo(0, 0); }
    } else if (act === 'sort') {
      const key = el.dataset.key;
      st.sort = st.sort.key === key ? { key, dir: st.sort.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: 'asc' };
      render();
      document.querySelector(`[data-act="sort"][data-key="${key}"]`)?.focus({ preventScroll: true });
    } else if (act === 'month') {
      st.cmpMonth = addMonth(st.cmpMonth, Number(el.dataset.d)); render();
    } else if (act === 'toc') {
      e.preventDefault();
      document.querySelectorAll('.toc a').forEach((a) => a.removeAttribute('aria-current'));
      el.setAttribute('aria-current', 'true');
      document.querySelector(el.getAttribute('href'))?.scrollIntoView({ block: 'start' });
    }
  });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.dataset.act === 'region') {
      const c = byId(el.dataset.id);
      st.regions[c.id] = el.value || null;
      st.message = T.regionChanged(c.name, el.value || UNKNOWN);
      render();
    } else if (el.dataset.act === 'cmpRegion') { st.cmpRegion = el.value; render(); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && st.pickerOpen) { st.pickerOpen = false; render(); document.querySelector('[data-act="picker"]')?.focus(); } });

  render();
})();
</script>
</body>
</html>
