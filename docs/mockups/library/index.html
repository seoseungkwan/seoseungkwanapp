<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자료실 탭 시안</title>
<!--
  자료실 탭(library) 시안. 관리자가 올린 파일(설치 파일·설명서·그 밖)을 승인된 사람 누구나 받는 화면.
  옛 '설치 파일' 칸 둘(관리자 화면 · 설정 탭)은 자료실로 가는 작은 칸이 된다. 결정·상태 목록은 notes.md.
  ?s=user(기본) · admin · upload · uploading · too-big · done · delete · empty · error · settings · admin-tab · menu · desk
  색·글자는 앱 토큰(src/app/globals.css :root)만 쓴다. 파일·크기·날짜는 모두 지어낸 값이다.
  오늘은 2026-11-25 (수) 10:40으로 고정. 어디로도 보내지 않는다. PC 화면만(폰 모양 없음).
-->
<style>
@font-face { font-family: 'AppPretendard'; font-weight: 400; src: url('../../../src/app/fonts/Pretendard-Regular.subset.woff2') format('woff2'); }
@font-face { font-family: 'AppPretendard'; font-weight: 500; src: url('../../../src/app/fonts/Pretendard-Medium.subset.woff2') format('woff2'); }
@font-face { font-family: 'AppPretendard'; font-weight: 600; src: url('../../../src/app/fonts/Pretendard-SemiBold.subset.woff2') format('woff2'); }
/* 앱 토큰(src/app/globals.css :root) */
:root {
  --canvas: #F7F8FA; --surface: #FFFFFF; --line: #E5E7EB; --line-strong: #D1D5DB; --faint: #9CA3AF;
  --muted: #6B7280; --ink-2: #374151; --ink: #111827; --accent: #2563EB; --accent-strong: #1D4ED8; --accent-soft: #EAF1FE;
  --positive: #15803D; --positive-soft: #ECF7EF; --negative: #C2410C; --negative-soft: #FDF0EA;
  --warning: #B45309; --warning-soft: #FDF4E3; --r: 4px; --r-float: 8px;
  --elev: 0 1px 2px rgb(17 24 39 / 6%), 0 6px 16px rgb(17 24 39 / 10%);
  --ui: 'AppPretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--ink); font: 400 14px/22px var(--ui); word-break: keep-all; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3, h4, p { margin: 0; }
svg { flex: none; }

/* 시안 머리(앱 밖) */
.mhead { background: #E9ECF0; border-bottom: 1px solid var(--line-strong); }
.mhead-in { max-width: 1280px; margin: 0 auto; padding: 12px 24px; display: grid; gap: 6px; }
.mhead b { color: var(--ink); font-size: 15px; font-weight: 600; }
.mhead .ex { margin-left: 6px; padding: 1px 7px; border-radius: 4px; background: #FEF3C7; color: #92400E; font-size: 12px; font-weight: 600; }
.mdesc { font-size: 13px; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg a { padding: 3px 10px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); font-size: 12px; line-height: 18px; color: var(--ink-2); text-decoration: none; white-space: nowrap; }
.seg a[aria-current="true"] { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
.mnote { font-size: 12px; line-height: 18px; color: var(--ink-2); }
.mnote b { font-size: 12px; }
/* 시안 표시(만들지 않음): 새로 생기거나 바뀌는 자리 */
.mark-new { outline: 2px dashed #F59E0B; outline-offset: 4px; }
.mark-new-in { outline: 2px dashed #F59E0B; outline-offset: -3px; }
.mark-tag { display: inline-block; padding: 1px 7px; border-radius: 4px; background: #FEF3C7; color: #92400E; font-size: 12px; line-height: 18px; font-weight: 600; white-space: nowrap; }

/* 앱 틀 */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1280px; margin: 0 auto; height: 56px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; font-size: 16px; line-height: 24px; font-weight: 600; color: var(--ink); }
.brand span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-r { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--muted); }
.acct { height: 32px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r); display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-weight: 500; white-space: nowrap; background: var(--surface); }
.tabsbar { position: relative; background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs-in { max-width: 1280px; margin: 0 auto; display: flex; }
.tabs { display: flex; min-width: 0; flex: 1; padding: 0 24px; }
.tabs > :first-child { margin-left: -12px; }
.tabs a, .more { position: relative; height: 44px; padding: 0 12px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; color: var(--ink-2); font-weight: 500; text-decoration: none; flex: none; border: 0; background: none; border-radius: var(--r); }
.tabs a:hover, .more:hover { color: var(--ink); }
.tabs a[aria-current="page"], .more.on { color: var(--ink); font-weight: 600; }
.tabs a[aria-current="page"]::after, .more.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; background: var(--accent); }
.morewrap { position: relative; display: flex; flex: none; margin-right: 12px; }
.more svg { transition: transform .15s; }
.more[aria-expanded="true"] svg { transform: rotate(180deg); }
.mpanel { position: absolute; top: 100%; right: 12px; margin-top: 1px; z-index: 15; width: 320px; padding: 4px 16px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-float); box-shadow: var(--elev); }
.mpanel .mh { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; line-height: 20px; color: var(--muted); }
.mpanel ul { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
.mpanel li:last-child a { border-bottom: 0; }
.mpanel a { display: flex; align-items: center; justify-content: space-between; gap: 6px; height: 44px; padding: 0 4px; border-bottom: 1px solid var(--line); font-weight: 500; color: var(--ink); text-decoration: none; }
.mpanel a:hover { background: var(--canvas); }
.mpanel a span:first-child { flex: 1; }
.mpanel a[aria-current="page"] { font-weight: 600; color: var(--accent-strong); }
.mpanel a[aria-current="page"]::before { content: ""; width: 2px; height: 20px; margin-left: -4px; background: var(--accent); flex: none; }
main { max-width: 1280px; margin: 0 auto; padding: 24px 24px 48px; }
main > * { min-width: 0; }

/* 단추 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); color: var(--ink); font-size: 14px; line-height: 22px; font-weight: 500; white-space: nowrap; text-decoration: none; transition: background-color .15s; }
.btn:hover:not(:disabled):not([aria-busy="true"]) { background: var(--canvas); }
.btn:active:not(:disabled):not([aria-busy="true"]) { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn[aria-busy="true"] { opacity: .6; cursor: progress; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; line-height: 20px; }
.btn.primary { border-color: transparent; background: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled):not([aria-busy="true"]) { background: var(--accent-strong); }
.btn.danger { color: var(--negative); }
.tbtn { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 4px; margin-left: -4px; border: 0; background: none; color: var(--accent); font-size: 13px; line-height: 20px; font-weight: 500; white-space: nowrap; border-radius: var(--r); }
.tbtn:hover { text-decoration: underline; text-underline-offset: 3px; }

/* 칩 */
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border: 1px solid transparent; border-radius: var(--r); font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; vertical-align: 1px; }
.chip.neutral { background: var(--canvas); border-color: var(--line); color: var(--ink-2); }
.chip.pos { background: var(--positive-soft); color: var(--positive); }
.chip.warn { background: var(--warning-soft); color: var(--warning); }

/* 머리 줄 */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; }
.tl { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.tl h1 { font-size: 20px; line-height: 28px; font-weight: 600; color: var(--ink); }
.tl .cnt { font-size: 13px; color: var(--muted); white-space: nowrap; }
.lead { margin-top: 4px; color: var(--ink-2); }
.cats { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px; }
.fc { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); color: var(--ink-2); font-size: 14px; font-weight: 500; white-space: nowrap; }
.fc:hover { background: var(--canvas); }
.fc .n { color: var(--muted); font-weight: 500; }
.fc[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; box-shadow: inset 0 0 0 1px var(--accent); }
.fc[aria-pressed="true"] .n { color: var(--accent-strong); }
.fc.zero .n { color: var(--faint); }

/* 알림 · 오류 카드 */
.okc, .errc { display: flex; align-items: flex-start; gap: 8px; padding: 12px 16px; border-radius: var(--r); }
.okc { margin-top: 16px; background: var(--positive-soft); }
.okc svg { margin-top: 3px; color: var(--positive); }
.okc .t { font-weight: 600; color: var(--ink); }
.okc .s { font-size: 13px; line-height: 20px; color: var(--ink-2); }
.okc .x { margin-left: auto; }
.errc { background: var(--negative-soft); }
.errc svg { margin-top: 2px; color: var(--negative); }
.errc .w { font-size: 13px; line-height: 20px; font-weight: 600; color: var(--negative); }
.errc .f { font-size: 13px; line-height: 20px; color: var(--ink-2); }
.errc .no { font-size: 12px; line-height: 16px; color: var(--ink-2); }
.errc > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

/* 표 */
.panel { min-width: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.list { margin-top: 12px; }
.tbw { min-width: 0; overflow-x: auto; }
.tb { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 20px; }
.tb th { height: 40px; padding: 0 12px; border-bottom: 1px solid var(--line); text-align: left; font-weight: 500; color: var(--muted); white-space: nowrap; }
.tb td { height: 44px; padding: 0 12px; border-bottom: 1px solid var(--line); white-space: nowrap; color: var(--ink); }
.tb th:first-child, .tb td:first-child { padding-left: 20px; }
.tb th:last-child, .tb td:last-child { padding-right: 20px; }
.tb tbody tr:last-child td { border-bottom: 0; }
.tb tr.r:hover td { background: var(--canvas); }
.tb th.num, .tb td.num { text-align: right; }
.tb .c-cat { width: 112px; }
.tb .c-size { width: 96px; }
.tb .c-at { width: 112px; }
.tb .c-act { width: 1%; }
.tb td.sub { color: var(--ink-2); }
.tb td.nmc { white-space: normal; padding-top: 10px; padding-bottom: 10px; }
.tb td.act { text-align: right; }
.tb td.act .acts { display: inline-flex; gap: 8px; }
.fn { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.fn b { font-size: 14px; line-height: 22px; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
.fd { display: block; color: var(--muted); }
.tb tr.hasold td { border-bottom: 0; }
.tb tr.tg td { height: auto; padding-top: 0; padding-bottom: 8px; }
.tb tr.old td { background: var(--canvas); }
.tb tr.old td.nmc { padding-left: 20px; }
.tb tr.old .fn b { font-weight: 500; color: var(--ink-2); }
.oldwrap { display: flex; gap: 8px; align-items: flex-start; }
.oldwrap > svg { margin-top: 3px; color: var(--faint); }
.tb tr.fresh td { background: var(--accent-soft); }
.tb td.emptyc { height: auto; padding: 32px 20px; white-space: normal; }
.emptyc b { display: block; font-size: 16px; line-height: 24px; font-weight: 600; color: var(--ink); }
.emptyc p { margin-top: 4px; color: var(--muted); }
.emptyc .btn { margin-top: 16px; }
.foot { margin-top: 12px; padding-left: 20px; font-size: 13px; line-height: 20px; color: var(--muted); }
.retry { margin-top: 12px; }

/* 확인 창 · 올리기 창 */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgb(17 24 39 / 36%); }
.dlg { position: fixed; z-index: 50; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 400px; max-width: calc(100% - 32px); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-float); box-shadow: var(--elev); padding: 24px; display: grid; gap: 12px; }
.dlg.wide { width: 520px; gap: 20px; }
.dlg h2 { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
.dlg p.t { color: var(--ink-2); }
.dlg p.sm { font-size: 13px; line-height: 20px; color: var(--muted); }
.dlg .foot2 { margin-top: 8px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.dlg.wide .foot2 { margin-top: 4px; }
.field { display: grid; gap: 6px; align-content: start; min-width: 0; }
.field > label, .field > .lb { font-size: 13px; line-height: 20px; font-weight: 600; color: var(--ink); display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; }
.field .req { font-size: 12px; font-weight: 400; color: var(--muted); }
.help { font-size: 12px; line-height: 16px; color: var(--muted); }
.ferr { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--negative); }
.inp { width: 100%; min-width: 0; height: 44px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); font-size: 14px; color: var(--ink); }
.inp::placeholder { color: var(--faint); }
.inp:hover:not(:disabled) { border-color: var(--muted); }
.inp:focus { outline: 1px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.inp[aria-invalid="true"] { border-color: var(--negative); }
.inp:disabled { background: var(--canvas); border-color: var(--line); color: var(--ink-2); cursor: not-allowed; }
.pick { display: flex; align-items: center; gap: 12px; min-width: 0; }
.fname { display: inline-flex; align-items: center; gap: 6px; min-width: 0; color: var(--ink); }
.fname > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fname > svg { color: var(--muted); }
.fname em { font-style: normal; color: var(--muted); white-space: nowrap; }
.fname em.big { color: var(--negative); font-weight: 600; }
.fname.none { color: var(--muted); }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.ob { margin: 0; height: 36px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); color: var(--ink); font-size: 14px; white-space: nowrap; }
.ob:hover:not(:disabled) { background: var(--canvas); }
.ob[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; box-shadow: inset 0 0 0 1px var(--accent); }
.ob:disabled { opacity: .4; cursor: not-allowed; }
.prog { display: grid; gap: 6px; padding: 12px 16px; border-radius: var(--r); background: var(--canvas); }
.prog .row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; line-height: 20px; color: var(--ink-2); }
.prog .row b { font-weight: 600; color: var(--ink); }
.bar { height: 6px; border-radius: var(--r); background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .2s linear; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; padding: 10px 16px; border-radius: var(--r-float); background: var(--ink); color: #fff; font-size: 13px; line-height: 20px; box-shadow: var(--elev); max-width: calc(100vw - 32px); }
.toast:empty { display: none; }

/* 설정 · 관리자 화면(잘라 보기) */
.stack { display: flex; flex-direction: column; gap: 16px; }
.head3 { display: flex; flex-direction: column; gap: 12px; }
.loc { display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 20px; font-weight: 600; color: var(--muted); }
.head3 h1 { font-size: 20px; line-height: 28px; font-weight: 600; color: var(--ink); }
.subnav { display: flex; border-bottom: 1px solid var(--line); }
.subnav > a, .subnav > span { position: relative; display: inline-flex; flex-shrink: 0; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border-radius: var(--r); white-space: nowrap; font-weight: 500; color: var(--ink-2); text-decoration: none; }
.subnav > :first-child { margin-left: -12px; }
.subnav [aria-current="page"], .subnav [aria-selected="true"] { font-weight: 600; color: var(--ink); }
.subnav [aria-current="page"]::after, .subnav [aria-selected="true"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--accent); }
.subnav .n { color: var(--muted); font-weight: 500; }
.intro { max-width: 560px; color: var(--ink-2); }
.card { padding: 20px; }
.card h2 { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--ink); }
.card .s { margin-top: 4px; font-size: 13px; line-height: 20px; color: var(--muted); }
.mini-card { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.mini-card .txt { min-width: 0; }
.mini-card .txt p.m { margin-top: 2px; color: var(--ink-2); }
.same { padding: 20px; }
.same h2 { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--ink); }

</style>
</head>
<body>
<div class="mhead"><div class="mhead-in">
  <div><b>자료실 탭 시안</b><span class="ex">예시</span> <span class="mdesc">파일 이름·크기·날짜는 모두 지어낸 값이에요. 오늘은 11월 25일 (수)로 정해 두었어요. 점선과 노란 표시는 시안에서만 보이는 표시예요(만들지 않음).</span></div>
  <div class="seg" id="seg"></div>
  <div class="mnote" id="mnote"></div>
</div></div>

<div class="app" id="app">
  <header class="top"><div class="top-in">
    <div class="brand"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 30 30"><rect x="3" y="3" width="24" height="24" rx="6" fill="none" stroke="#14C8BA" stroke-width="2.4"/><path d="M13.5 8h3a1 1 0 0 1 1 1v3.5H21a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-3.5V21a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1v-3.5H9a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h3.5V9a1 1 0 0 1 1-1z" fill="#6D5DF5"/></svg><span>샘플정형외과의원</span></div>
    <div class="top-r" id="topr"></div>
  </div></header>
  <nav class="tabsbar" aria-label="메뉴"><div class="tabs-in" id="tabs"></div></nav>
  <main id="main"></main>
  <div id="layer"></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* ───────── 상태 고르기 ───────── */
const STATES = [

    <p class="lead">의원 PC에 깔 파일과 설명서를 여기서 받아요.</p>`
  if (st.failed) {
    return head + `<div style="margin-top:16px;max-width:640px">${errCard('자료실 목록을 읽지 못했어요.', '인터넷 연결을 확인하고 [다시 읽기]를 눌러 보세요. 계속되면 오류 번호와 함께 알려 주세요.', 'E-LIBRARY-READ-FAILED')}</div>
      <div class="retry"><button class="btn" data-act="retry">다시 읽기</button></div>`
  }
  const notice = st.notice ? `<div class="okc" role="status">${ICON.check}<div><p class="t">${esc(st.notice.file)} 파일을 올렸어요</p><p class="s">${st.notice.kind ? `이제 모든 의원이 받을 수 있어요. 비트 PC 연결 화면의 [${KIND_LABEL[st.notice.kind]} 내려받기]도 이 판을 줘요.` : '이제 모든 의원이 자료실에서 받을 수 있어요.'}</p></div></div>` : ''
  const cnt = k => k === 'all' ? n : st.files.filter(f => f.cat === k).length
  const chips = n ? `<div class="cats" role="group" aria-label="분류">${['all', ...CAT_KEYS].map(k => { const c = cnt(k); return `<button class="fc ${c ? '' : 'zero'}" data-act="cat" data-k="${k}" aria-pressed="${st.filter === k}">${k === 'all' ? '전체' : CAT[k]}<span class="n">${c}</span></button>` }).join('')}</div>` : ''
  const table = `<div class="panel list${n ? '' : ''}" style="${n ? '' : 'margin-top:16px'}"><div class="tbw"><table class="tb" aria-label="자료실 파일">
    <thead><tr><th>이름</th><th class="c-cat">분류</th><th class="c-size num">크기</th><th class="c-at">올린 날</th><th class="c-act"><span hidden>받기</span></th></tr></thead>
    <tbody>${tableBody()}</tbody></table></div></div>`
  const foot = isAdmin() && n ? `<p class="foot">로그인하고 승인된 사람(데스크 포함)은 누구나 받을 수 있어요. 올리기·지우기는 관리자만 해요. 어떤 파일이든 한 파일에 50MB까지 올릴 수 있어요.</p>` : ''
  return head + notice + chips + table + foot
}

/* ───────── 그리기: 설정 · 관리자 화면(잘라 보기) ───────── */
function miniCard(title, text) {
  return `<div class="mark-new"><section class="panel card mini-card" aria-label="${title}">
    <div class="txt"><h2>${title}</h2><p class="m">${text}</p></div>
    <a class="btn" href="${isAdmin() ? '?s=admin' : '?s=user'}">자료실 열기${ICON.arrow}</a></section></div>`
}
const sameBlock = (title, sub) => `<section class="panel same"><h2>${title}</h2><p class="s">${sub}</p><div class="blk"></div></section>`
function settingsHtml() {
  return `<div class="stack">
    <div class="head3"><h1>설정</h1><nav class="subnav" aria-label="설정 안 메뉴"><a href="#" aria-current="page">설정</a><a href="#">비트 PC 연결</a></nav></div>
    ${sameBlock('병원 정보', '(지금 칸 그대로 · 바뀌지 않음)')}
    <div><div class="tagrow"><span class="mark-tag">바뀜 · 옛 '비트 PC 연결 · 설치 파일' 받기 표 자리</span></div>
    ${miniCard('설치 파일', '설치 파일은 자료실에서 받아요. 청구 도우미·크롬 확장과 설명서가 모두 거기 있어요.')}</div>
    ${sameBlock('청구 · 병원 문구 · 진단 링크 · 시재금 · 데스크 계정 …', '(지금 칸들 그대로 · 바뀌지 않음)')}
  </div>`
}
function adminHtml() {
  return `<div class="stack">
    <div class="head3"><div style="display:flex;flex-direction:column;gap:4px"><p class="loc">${ICON.userCheck}관리자</p><h1>가입 승인</h1></div>
      <nav class="subnav" aria-label="관리자 안 메뉴"><a href="#" aria-current="page">가입 승인</a><a href="#">의원 비교</a></nav></div>
    <p class="intro">승인하면 그 계정은 바로 대시보드를 쓸 수 있어요. 거절한 신청은 거절 탭에서 되돌릴 수 있어요. 승인 탭에서 관리자를 정하거나 뺄 수 있어요. 의원 이름을 누르면 그 의원 화면을 읽기만 할 수 있어요.</p>
    <div><div class="tagrow"><span class="mark-tag">바뀜 · 옛 '설치 파일' 올리기 표 자리</span></div>
    ${miniCard('설치 파일', '설치 파일은 이제 자료실에서 올리고 지워요. 자료실에는 설명서 같은 다른 파일도 올릴 수 있어요.')}</div>
    <div class="subnav" role="tablist" aria-label="신청 상태"><span role="tab" aria-selected="true">대기 <span class="n">2</span></span><span role="tab" aria-selected="false">승인 <span class="n">14</span></span><span role="tab" aria-selected="false">거절 <span class="n">1</span></span></div>
    ${sameBlock('신청 목록 · 본 기록', '(지금 화면 그대로 · 바뀌지 않음)')}
  </div>`
}

/* ───────── 그리기: 창 ───────── */
function layerHtml() {
  const d = st.dlg
  if (!d) return ''
  if (d.kind === 'delete') {
    const f = st.files.find(x => x.id === d.id)
    const v = verOf(f.file)
    let extra = ''
    if (v) {
      const g = versionGroups(st.files)[v.kind]
      if (g[0].f === f) extra = g[1] ? `지우면 ${g[1].f.file}이 최신이 되고, 비트 PC 연결 화면의 [${KIND_LABEL[v.kind]} 내려받기]도 그 판을 줘요.` : `지우면 비트 PC 연결 화면의 [${KIND_LABEL[v.kind]} 내려받기]가 눌리지 않아요.`
    }
    return `<div class="scrim" data-act="close"></div>
      <div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dt">
        <h2 id="dt">${esc(f.name)} 파일을 지울까요?</h2>
        <p class="t">모든 의원의 자료실에서 사라져요.${extra ? ` ${extra}` : ''}</p>
        <p class="sm">지우면 되돌릴 수 없어요.</p>
        <div class="foot2"><button class="btn" data-act="close" id="first">취소</button><button class="btn danger" data-act="do-del">지우기</button></div>
      </div>`
  }
  // 올리기 창
  const p = d.pick, big = p && p.size > LIMIT, up = d.phase === 'uploading'
  const lock = up || big || !p ? 'disabled' : ''
  const fileLine = p
    ? `<span class="fname">${ICON.file}<span>${esc(p.file)}</span><em class="${big ? 'big' : ''}">· ${sizeTxt(p.size)}</em></span>`
    : '<span class="fname none">아직 고른 파일이 없어요.</span>'
  const nameErr = d.nameErr ? `<p class="ferr">이름을 적어 주세요.</p>` : ''
  const prog = up ? `<div class="prog" role="status"><div class="row"><b>올리는 중… ${d.pct}%</b><span>${mbTxt(p.size * d.pct / 100)} / ${mbTxt(p.size)}</span></div><div class="bar"><i style="width:${d.pct}%"></i></div><p class="help">다 올라갈 때까지 이 창을 열어 두세요.</p></div>` : ''
  return `<div class="scrim" ${up ? '' : 'data-act="close"'}></div>
    <div class="dlg wide" role="dialog" aria-modal="true" aria-labelledby="ut">
      <h2 id="ut">파일 올리기</h2>
      <div class="field"><span class="lb">파일</span>
        <div class="pick"><button class="btn sm" data-act="pick" ${up ? 'disabled' : ''}>파일 고르기</button>${fileLine}</div>
        ${big ? errCard('파일이 너무 커요.', '한 파일에 50MB까지 올릴 수 있어요. 나눠서 압축하거나 더 작은 파일을 고르세요.', 'E-LIBRARY-FILE-SIZE') : '<p class="help">어떤 파일이든 돼요. 한 파일에 50MB까지.</p>'}
      </div>
      <div class="field"><label for="u-name">이름</label>
        <input class="inp" id="u-name" value="${esc(d.name)}" ${lock} ${d.nameErr ? 'aria-invalid="true"' : ''} autocomplete="off">
        ${nameErr || '<p class="help">자료실 목록에 보이는 이름이에요. 파일을 고르면 파일 이름으로 채워지고, 고쳐도 돼요.</p>'}
      </div>
      <div class="field"><span class="lb">분류</span>
        <div class="opts" role="group" aria-label="분류">${CAT_KEYS.map(k => `<button class="ob" data-act="ucat" data-k="${k}" aria-pressed="${!lock && d.cat === k}" ${lock}>${CAT[k]}</button>`).join('')}</div>
      </div>
      <div class="field"><label for="u-desc">설명 한 줄 <span class="req">선택 · 60자까지</span></label>
        <input class="inp" id="u-desc" maxlength="60" value="${esc(d.desc)}" placeholder="예) 청구 도우미 · 비트 자료를 읽는 PC 프로그램" ${lock} autocomplete="off">
      </div>
      ${prog}
      <div class="foot2"><button class="btn" data-act="${up ? 'stop' : 'close'}">취소</button><button class="btn primary" data-act="send" ${!p || big ? 'disabled' : ''} ${up ? 'aria-busy="true"' : ''}>${ICON.upload}${up ? '올리는 중…' : '올리기'}</button></div>
    </div>`
}

/* ───────── 움직임 ───────── */
let upTimer = 0
function startUpload() {
  const d = st.dlg
  d.name = ($('#u-name')?.value || '').trim()
  d.desc = ($('#u-desc')?.value || '').trim()
  if (!d.name) { d.nameErr = true; render(); $('#u-name')?.focus(); return }
  d.nameErr = false; d.phase = 'uploading'; d.pct = 0; render()
  clearInterval(upTimer)
  upTimer = setInterval(() => {
    if (!st.dlg || st.dlg.phase !== 'uploading') { clearInterval(upTimer); return }
    st.dlg.pct = Math.min(100, st.dlg.pct + 9)
    if (st.dlg.pct >= 100) { clearInterval(upTimer); finishUpload(); return }
    render()
  }, 180)
}
function finishUpload() {
  const d = st.dlg, p = d.pick
  const id = 'n' + Date.now()
  st.files.push({ id, file: p.file, name: d.name, cat: d.cat, size: p.size, at: '2026-11-25T10:40', desc: d.desc })
  const v = verOf(p.file)
  st.notice = { file: p.file, kind: v ? v.kind : null }
  st.fresh = id; st.dlg = null; st.filter = 'all'
  render(); window.scrollTo(0, 0)
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]')
  if (st.menu && !e.target.closest('#mpanel') && !(t && t.dataset.act === 'menu')) { st.menu = false; $('#tabs').innerHTML = tabsHtml() }
  if (!t) return
  const a = t.dataset.act
  if (t.tagName === 'A' && t.getAttribute('href') === '#') e.preventDefault()
  switch (a) {
    case 'menu': st.menu = !st.menu; $('#tabs').innerHTML = tabsHtml(); break
    case 'cat': st.filter = t.dataset.k; render(); break
    case 'old': st.open[t.dataset.k] = !st.open[t.dataset.k]; render(); break
    case 'get': { const f = st.files.find(x => x.id === t.dataset.id); toast(`${f.file} 파일을 받아요. (시안이라 실제로 받지는 않아요)`); break }
    case 'retry': st.failed = false; render(); toast('다시 읽었어요.'); break
    case 'upload': st.dlg = uploadDlg(null); st.notice = null; render(); break
    case 'pick': { const d = st.dlg; const next = d.pick == null ? 0 : (d.pick.i + 1) % PICKS.length; st.dlg = uploadDlg(next, { desc: ($('#u-desc')?.value || '') }); render(); break }
    case 'ucat': st.dlg.cat = t.dataset.k; st.dlg.name = $('#u-name').value; st.dlg.desc = $('#u-desc').value; render(); break
    case 'send': if (st.dlg.phase !== 'uploading') startUpload(); break
    case 'stop': clearInterval(upTimer); st.dlg.phase = 'form'; st.dlg.pct = 0; render(); toast('올리기를 멈췄어요. 아무것도 올라가지 않았어요.'); break
    case 'close': if (st.dlg && st.dlg.phase === 'uploading') break; st.dlg = null; render(); break
    case 'del': st.dlg = { kind: 'delete', id: t.dataset.id }; render(); setTimeout(() => $('#first')?.focus(), 0); break
    case 'do-del': { const f = st.files.find(x => x.id === st.dlg.id); st.files = st.files.filter(x => x.id !== st.dlg.id); st.dlg = null; render(); toast(`${f.name} 파일을 지웠어요.`); break }
  }
})
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return
  if (st.menu) { st.menu = false; $('#tabs').innerHTML = tabsHtml(); return }
  if (st.dlg && st.dlg.phase !== 'uploading') { st.dlg = null; render() }
})
render()
</script>
</body>
</html>
