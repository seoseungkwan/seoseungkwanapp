<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>입지 분석 탭 시안</title>
<!--
  입지 분석 탭(location) 시안. 새로 개원할 자리 찾기: 동네 훑기 → 후보 깊게 보기 → 매물 → 후보 견주기 → 개원 준비 → 한 장 보고서. 결정·물을 것은 notes.md.
  ?s=scan(기본) · candidate · listings · compare · plan · plan-filled · report · sources · add · menu · dashboard · empty · no-key
  &c=A|B|C 로 볼 후보를 고른다(대시보드 알림 링크가 쓴다).
  색·글자는 앱 토큰(src/app/globals.css :root)만 쓴다. 지도는 손으로 그린 그림이고, 동·건물·의원·사람 이름(예시○○)과 번호, 숫자는 모두 지어낸 값이다.
  오늘은 2026-11-22 (일) 10:40으로 고정. 어디로도 보내지 않는다.
-->
<style>
@font-face { font-family: 'AppPretendard'; font-weight: 400; src: url('../../../src/app/fonts/Pretendard-Regular.subset.woff2') format('woff2'); }
@font-face { font-family: 'AppPretendard'; font-weight: 500; src: url('../../../src/app/fonts/Pretendard-Medium.subset.woff2') format('woff2'); }
@font-face { font-family: 'AppPretendard'; font-weight: 600; src: url('../../../src/app/fonts/Pretendard-SemiBold.subset.woff2') format('woff2'); }
/* 앱 토큰(src/app/globals.css :root) */
:root {
  --canvas: #F7F8FA; --surface: #FFFFFF; --line: #E5E7EB; --line-strong: #D1D5DB; --faint: #9CA3AF;
  --muted: #6B7280; --ink-2: #374151; --ink: #111827; --accent: #2563EB; --accent-strong: #1D4ED8; --accent-soft: #EAF1FE;
  --positive: #15803D; --positive-soft: #ECF7EF; --negative: #C2410C; --negative-soft: #FDF0EA;
  --warning: #B45309; --warning-soft: #FDF4E3; --r: 4px; --r-float: 8px;
  --chart-1: #DBE7FD; --chart-2: #B4CDFA; --chart-3: #8DB0F4; --chart-4: #2563EB; --chart-5: #1D4ED8;
  --elev: 0 1px 2px rgb(17 24 39 / 6%), 0 6px 16px rgb(17 24 39 / 10%);
  --ui: 'AppPretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--ink); font: 400 14px/22px var(--ui); word-break: keep-all; overflow-x: clip; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3, h4, p { margin: 0; }
svg { flex: none; }
.mut { color: var(--muted); }
.sm { font-size: 13px; line-height: 20px; }

/* 시안 머리(앱 밖) */
.mhead { background: #E9ECF0; border-bottom: 1px solid var(--line-strong); }
.mhead-in { max-width: 1280px; margin: 0 auto; padding: 12px 24px; display: grid; gap: 6px; }
.mhead b { color: var(--ink); font-size: 15px; font-weight: 600; }
.mhead .ex { margin-left: 6px; padding: 1px 7px; border-radius: 4px; background: #FEF3C7; color: #92400E; font-size: 12px; font-weight: 600; }
.mdesc { font-size: 13px; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg a { padding: 3px 10px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); font-size: 12px; line-height: 18px; color: var(--ink-2); text-decoration: none; white-space: nowrap; }
.seg a[aria-current="true"] { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
.mnote { font-size: 12px; line-height: 18px; color: var(--ink-2); }
.mnote b { font-size: 12px; }

/* 앱 틀 */
.app { position: relative; background: var(--surface); }
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1280px; margin: 0 auto; height: 56px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; font-size: 16px; font-weight: 600; color: var(--ink); }
.brand span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-r { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--muted); }
.acct { height: 32px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r); display: inline-flex; align-items: center; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.tabsbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs-in { position: relative; max-width: 1280px; margin: 0 auto; padding: 0 12px; display: flex; }
.tabs { display: flex; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; }
.tabs a, .more { position: relative; height: 44px; padding: 0 12px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; color: var(--ink-2); font-weight: 500; text-decoration: none; flex: none; border: 0; background: none; }
.tabs a[aria-current="page"], .more.on { color: var(--ink); font-weight: 600; }
.tabs a[aria-current="page"]::after, .more.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; background: var(--accent); }
.more { margin-left: auto; }
.mpop { position: absolute; right: 12px; top: 44px; z-index: 15; width: 248px; padding: 6px 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-float); box-shadow: var(--elev); }
.mpop a { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 40px; padding: 0 16px; color: var(--ink-2); text-decoration: none; font-weight: 500; }
.mpop a:hover { background: var(--canvas); }
.mpop a[aria-current="page"] { color: var(--ink); font-weight: 600; background: var(--accent-soft); }
.mpop .newi { outline: 2px dashed #F59E0B; outline-offset: -3px; }
main { max-width: 1280px; margin: 0 auto; padding: 24px 24px 48px; }
main > * { min-width: 0; }

/* 단추 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 500; white-space: nowrap; text-decoration: none; }
.btn:hover:not(:disabled) { background: var(--canvas); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn.lg { height: 44px; padding: 0 20px; font-weight: 600; }
.btn.primary { border-color: transparent; background: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent-strong); }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); }
.tbtn { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 4px; border: 0; background: none; color: var(--accent); font-size: 13px; font-weight: 500; white-space: nowrap; border-radius: var(--r); text-decoration: none; }
.tbtn:hover { text-decoration: underline; }
.tbtn.mut { color: var(--ink-2); }
.tbtn.danger { color: var(--negative); }

/* 칩 */
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border: 1px solid transparent; border-radius: var(--r); font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; vertical-align: 1px; }
.chip.neutral { background: var(--canvas); border-color: var(--line); color: var(--ink-2); }
.chip.accent { background: var(--accent-soft); color: var(--accent-strong); }
.chip.warn { background: var(--warning-soft); color: var(--warning); }
.chip.neg { background: var(--negative-soft); color: var(--negative); }
.chip.pos { background: var(--positive-soft); color: var(--positive); }

/* 입력 */
.field { display: grid; gap: 6px; align-content: start; min-width: 0; }
.field > label, .field > .lb { font-size: 13px; line-height: 20px; font-weight: 600; color: var(--ink); display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; }
.field .req { font-size: 12px; font-weight: 400; color: var(--muted); }
.help { font-size: 12px; line-height: 16px; color: var(--muted); }
.ferr { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--negative); }
.inp { width: 100%; min-width: 0; height: 44px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); font-size: 14px; color: var(--ink); }
.inp::placeholder { color: var(--faint); }
.inp:hover { border-color: var(--muted); }
.inp:focus { outline: 1px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.inp[aria-invalid="true"] { border-color: var(--negative); }
.inp.sm { height: 36px; font-size: 13px; padding: 0 8px; }
textarea.inp { height: 88px; padding: 10px 12px; line-height: 22px; resize: vertical; }
select.inp { padding-right: 8px; }
.suf { position: relative; }
.suf .inp { padding-right: 52px; text-align: right; font-variant-numeric: tabular-nums; }
.suf span { position: absolute; right: 12px; top: 11px; color: var(--muted); font-size: 14px; pointer-events: none; }
.ob { margin: 0; height: 36px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); color: var(--ink); font-size: 14px; white-space: nowrap; }
.ob:hover { background: var(--canvas); }
.ob[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; box-shadow: inset 0 0 0 1px var(--accent); }
.ob .n { margin-left: 4px; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.ob[aria-pressed="true"] .n { color: var(--accent-strong); }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; height: 24px; }
input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); flex: none; }

/* 출처 줄 */
.src { display: block; margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--muted); text-decoration: none; }
.src:hover { color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; }
.src.in { display: inline; margin: 0; }
.nodata { color: var(--muted); }

/* 입지 분석 머리 · 안쪽 탭 · 후보 고르기 */
.ltop { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; }
.tl { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tl h1 { font-size: 20px; line-height: 28px; font-weight: 600; color: var(--ink); }
.tl .cnt { font-size: 13px; color: var(--muted); white-space: nowrap; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.tools .when { font-size: 12px; line-height: 16px; color: var(--muted); }
.subtabs { margin-top: 12px; display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.subtabs button { position: relative; flex: none; height: 40px; padding: 0 12px; border: 0; background: none; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.subtabs button:hover { color: var(--ink); }
.subtabs button[aria-current="page"] { color: var(--ink); font-weight: 600; }
.subtabs button[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; background: var(--accent); }
.subtabs .n { margin-left: 4px; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.candbar { margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.candbar .cbl { font-size: 13px; color: var(--muted); margin-right: 4px; }
.cb { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); color: var(--ink-2); white-space: nowrap; }
.cb:hover { background: var(--canvas); }
.cb .lt { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: var(--r); background: var(--ink); color: #fff; font-size: 12px; font-weight: 600; }
.cb .nm { color: var(--ink); font-weight: 500; }
.cb .sc { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.cb[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.cb[aria-pressed="true"] .nm { font-weight: 600; }

/* 묶음 머리 */
.sh { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line-strong); }
.sh h2, .sh h3 { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--ink); }
.sh h3 .n, .sh h2 .n { font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; }
.sh .aside { font-size: 13px; line-height: 20px; color: var(--muted); }
.lead { font-size: 13px; line-height: 20px; color: var(--ink-2); margin-top: 8px; max-width: 760px; }

/* 숫자 칸 */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.stats.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stat { padding: 12px 16px; border-left: 1px solid var(--line); min-width: 0; }
.stat:first-child, .stats.c3 .stat:nth-child(3n+1), .stats.wrap4 .stat:nth-child(4n+1) { border-left: 0; padding-left: 0; }
.stats.c3 .stat:nth-child(n+4), .stats.wrap4 .stat:nth-child(n+5) { border-top: 1px solid var(--line); }
.stat .l { font-size: 13px; line-height: 20px; color: var(--muted); }
.stat .v { margin-top: 2px; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -.01em; color: var(--ink); font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 2px; letter-spacing: 0; }
.stat .v.t { font-size: 16px; line-height: 24px; letter-spacing: 0; }
.stat .e { font-size: 13px; line-height: 20px; color: var(--ink-2); }
.up { color: var(--positive); font-weight: 500; }
.down { color: var(--negative); font-weight: 500; }

/* 정보 줄 */
.info { margin: 0; }
.info > div { display: grid; grid-template-columns: 148px minmax(0, 1fr); align-items: baseline; gap: 4px 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.info dt { font-size: 13px; line-height: 22px; color: var(--muted); }
.info dd { margin: 0; min-width: 0; color: var(--ink); overflow-wrap: anywhere; }
.info dd .x { color: var(--ink-2); font-size: 13px; }

/* 표 */
.tw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 20px; }
table.t th { height: 40px; padding: 0 12px; text-align: left; font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
table.t td { height: 44px; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; color: var(--ink); }
table.t th:first-child, table.t td:first-child { padding-left: 0; }
table.t th:last-child, table.t td:last-child { padding-right: 0; }
table.t .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t .c { text-align: center; }
table.t td.nw, table.t .nw { white-space: nowrap; }
table.t tbody tr:hover td { background: var(--canvas); }
table.t td b { font-weight: 600; }
table.t td .s2 { display: block; font-size: 12px; line-height: 16px; color: var(--muted); }
table.t tr.me td { background: var(--accent-soft); }
.eqs { display: inline-flex; flex-wrap: wrap; gap: 4px; }

/* 막대 */
.hb { position: relative; height: 8px; background: var(--canvas); box-shadow: inset 0 0 0 1px var(--line); }
.hb > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
.hb.soft > i { background: var(--chart-3); }

/* 동네 훑기 */
.scanbar { margin-top: 16px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; }
.scanbar .field { width: 180px; }
.scanbar .when { margin-left: auto; font-size: 12px; line-height: 16px; color: var(--muted); text-align: right; }
.scan { margin-top: 16px; display: grid; grid-template-columns: minmax(0, 1fr) 384px; gap: 24px 32px; align-items: start; }
.mapbox { position: relative; background: var(--canvas); border: 1px solid var(--line); border-radius: var(--r); }
.mapbox svg { display: block; width: 100%; height: auto; }
.mapbox .cap { position: absolute; left: 12px; top: 10px; font-size: 12px; line-height: 16px; color: var(--muted); }
.dong { cursor: pointer; }
.dong path { stroke: var(--surface); stroke-width: 2; }
.dong:hover path { stroke: var(--ink); stroke-width: 2; }
.dong.sel path { stroke: var(--ink); stroke-width: 3; }
.dong text { pointer-events: none; font-family: var(--ui); }
.legend { margin-top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 12px; line-height: 16px; color: var(--ink-2); }
.legend i { display: inline-block; width: 14px; height: 10px; margin-right: 4px; vertical-align: -1px; box-shadow: inset 0 0 0 1px rgb(17 24 39 / 12%); }
.dsel { margin-top: 16px; border-top: 1px solid var(--line-strong); padding-top: 12px; display: grid; gap: 12px; }
.dsel-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.dsel-h h3 { font-size: 16px; line-height: 24px; font-weight: 600; }
.dsel-h .sc { font-size: 24px; line-height: 32px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dsel-h .sc small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.dsel-acts { display: flex; flex-wrap: wrap; gap: 8px; }
.ibars { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px 16px; }
.ibar .l { display: flex; justify-content: space-between; gap: 4px; font-size: 12px; line-height: 16px; color: var(--muted); }
.ibar .l b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.ibar .hb { margin-top: 4px; }
.rank { list-style: none; margin: 0; padding: 0; }
.rank li { border-bottom: 1px solid var(--line); }
.rank button { width: 100%; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: baseline; gap: 2px 8px; padding: 10px 8px 10px 0; border: 0; background: none; text-align: left; color: inherit; }
.rank button:hover { background: var(--canvas); }
.rank button[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.rank .no { font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.rank .nm { font-weight: 600; color: var(--ink); display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rank .sc { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.rank .sc small { font-size: 12px; font-weight: 500; color: var(--muted); }
.rank .why { grid-column: 2 / -1; font-size: 13px; line-height: 20px; color: var(--ink-2); }
.rank .hb { grid-column: 2 / -1; margin-top: 4px; height: 6px; }
.wts { margin-top: 24px; }
.wrow { display: grid; grid-template-columns: 112px minmax(0, 1fr) 40px; align-items: center; gap: 12px; padding: 6px 0; }
.wrow label { font-size: 13px; line-height: 20px; color: var(--ink-2); font-weight: 500; }
.wrow output { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.wsum { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 8px; margin-top: 4px; font-size: 12px; line-height: 16px; color: var(--muted); }

/* 후보 자세히 */
.chead { margin-top: 20px; display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 16px; }
.chead .ct { min-width: 0; }
.chead .ctop { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.chead h2 { margin-top: 6px; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -.01em; }
.chead .addr { margin-top: 2px; color: var(--ink-2); }
.chead .frz { margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 13px; line-height: 20px; color: var(--muted); }
.cacts { display: flex; flex-wrap: wrap; gap: 8px; }
.cgrid { margin-top: 20px; display: grid; grid-template-columns: 176px minmax(0, 1fr); gap: 32px; align-items: start; }
.toc { position: sticky; top: 16px; display: grid; border-top: 1px solid var(--line-strong); }
.toc a { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 34px; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 20px; color: var(--ink-2); text-decoration: none; }
.toc a:hover { color: var(--ink); background: var(--canvas); }
.toc a .chip { height: 18px; padding: 0 5px; }
.cmain { min-width: 0; display: grid; gap: 40px; }
.csec { min-width: 0; scroll-margin-top: 16px; }
.csec > .body { margin-top: 12px; display: grid; gap: 16px; min-width: 0; }

/* 옆 판 · 알림 */

let GEOM = null
function mapGeom() {
  if (GEOM) return GEOM
  const xs = [24, 200, 372, 540, 696], ys = [24, 168, 316, 452]
  const R = rng(11)
  const V = ys.map((y, r) => xs.map((x, c) => {
    const ex = c === 0 || c === 4, ey = r === 0 || r === 3
    return [x + (R() - .5) * (ex ? 16 : 64), y + (R() - .5) * (ey ? 16 : 52)]
  }))
  const cache = {}
  const mid = (ka, a, kb, b) => {
    const fwd = ka < kb, key = fwd ? ka + '|' + kb : kb + '|' + ka
    if (!cache[key]) {
      const [p, q] = fwd ? [a, b] : [b, a]
      const R2 = rng(hash(key)), dx = q[0] - p[0], dy = q[1] - p[1], len = Math.hypot(dx, dy), nx = -dy / len, ny = dx / len
      cache[key] = [0.28, 0.52, 0.76].map(t => { const o = (R2() - .5) * len * 0.14; return [p[0] + dx * t + nx * o, p[1] + dy * t + ny * o] })
    }
    return fwd ? cache[key] : cache[key].slice().reverse()
  }
  const cells = []
  for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) {
    const cs = [[r, c], [r, c + 1], [r + 1, c + 1], [r + 1, c]]
    let pts = []
    cs.forEach((v, i) => { const w = cs[(i + 1) % 4]; pts.push(V[v[0]][v[1]]); pts = pts.concat(mid(v.join(','), V[v[0]][v[1]], w.join(','), V[w[0]][w[1]])) })
    const cx = cs.reduce((a, v) => a + V[v[0]][v[1]][0], 0) / 4, cy = cs.reduce((a, v) => a + V[v[0]][v[1]][1], 0) / 4
    cells.push({ d: 'M' + pts.map(p => p.map(n => n.toFixed(1)).join(' ')).join('L') + 'Z', cx, cy })
  }
  GEOM = cells
  return cells
}

const RADII = [300, 500, 700, 1000, 1500, 2000, 3000]
const rLabel = m => m < 1000 ? `${m}m` : `${m / 1000}km`
const diffPct = (a, b) => Math.floor(Math.abs(a - b) / b * 100 + 1e-9)
function calc(c) {
  const r = st.radius[c.id] / 1000, f = Math.pow(r, 1.6), sc = k => Math.floor(k * f + 1e-9)
  const n = sc(c.pop.n)
  const comps = c.comps.filter(x => x.d <= r), rivals = comps.filter(x => x.k !== '한의원')
  return {
    r, f, sc, n, hh: sc(c.pop.hh), old: Math.floor(n * c.pop.ages[3] / 100), trend: c.pop.trend.map(sc),
    apts: c.pop.apts.filter(a => a.d <= r), soon: c.pop.soon.filter(a => a.d <= r),
    comps, rivals, events: c.events.filter(e => e.d <= r),
    pharm: c.traffic.pharm.filter(p => p.d <= r), mart: c.traffic.mart.filter(p => p.d <= r),
    welfare: c.demand.welfare.filter(p => p.d <= r),
  }
}
const DAYS = ['월', '화', '수', '목', '금', '토', '일']
const SLOTS = [[8, 9, '아침 8~9시'], [9, 13, '오전 9~13시'], [13, 14, '점심 13~14시'], [14, 18, '오후 14~18시'], [18, 19, '저녁 18~19시'], [19, 20, '저녁 19~20시'], [20, 21, '밤 20~21시']]
function openAt(h, day, s, e) {
  const weekday = day !== '토' && day !== '일'
  const rg = day === '토' ? h.sat : day === '일' ? h.sun : (h.wk ? [h.wk[0], (h.night && h.night[day]) || h.wk[1]] : null)
  if (!rg) return false
  if (h.lunch && weekday && s === 13) return false
  return rg[0] <= s + 0.5 && rg[1] >= e - 0.5
}
function hoursGrid(list) { return SLOTS.map(([s, e]) => DAYS.map(d => list.filter(x => openAt(x.h, d, s, e)).length)) }
function gapText(g) {
  const parts = []
  const wk = [0, 1, 2, 3, 4]
  for (const [si, name] of [[0, '아침 8~9시'], [2, '점심 13~14시'], [5, '저녁 19~20시'], [6, '밤 20~21시']]) {
    const z = wk.filter(d => g[si][d] === 0)
    if (z.length === 5) parts.push(`평일 ${name}`); else if (z.length) parts.push(`${z.map(d => DAYS[d]).join('·')}요일 ${name}`)
  }
  if (g[3][5] === 0) parts.push('토요일 오후')
  if (g[1][6] === 0) parts.push('일요일')
  return parts
}

function estimate(c) {
  const e = c.est
  const r1 = MY.day * (e.pop / MY.pop) * ((MY.comp + 1) / (e.comp + 1))
  const r2 = e.pop * e.rate / 1000 / (e.comp + 1)
  const a = Math.floor(r1 + 1e-9), b = Math.floor(r2 + 1e-9)
  const diff = Math.floor(Math.abs(a - b) / Math.min(a, b) * 100 + 1e-9)
  return { a, b, diff, warn: diff >= 30 }
}

  <section><div class="sh"><h2>건물 요건 표</h2><span class="aside">○ 됨 · ✕ 안 됨 · ? 모름 — 칸을 누르면 바뀌어요</span></div>
    <div class="tw" style="margin-top:8px"><table class="t req"><thead><tr><th>요건</th><th>있어야 하는 것</th><th class="c">이 자리</th><th>어떻게 알았나</th><th>법 근거</th></tr></thead><tbody>
      ${REQS.map((r, i) => { const v = st.req[c.id][i]; return `<tr><td><b>${r[0]}</b></td><td class="sm">${r[1]}</td><td class="c"><button class="oxb" data-act="ox" data-i="${i}" aria-label="${r[0]}: ${v === 'o' ? '됨' : v === 'x' ? '안 됨' : '모름'} (누르면 바뀜)"><span class="ox ${v}">${OX[v]}</span></button></td><td class="sm">${esc(REQ_DEF[c.id][i][1])}</td><td class="sm">${r[2] ? `<a class="tbtn" href="?s=sources#law-${r[2]}" data-act="law" data-k="${r[2]}" style="height:auto;padding:0;font-size:13px">${LAWS.find(x => x[0] === r[2])[1]}</a>` : '<span class="mut">–</span>'}</td></tr>` }).join('')}</tbody></table></div>
    <p class="sm" style="margin-top:8px">○ ${st.req[c.id].filter(x => x === 'o').length} · ✕ ${st.req[c.id].filter(x => x === 'x').length} · ? ${st.req[c.id].filter(x => x === 'q').length}</p></section>

  <section><div class="sh"><h2>계약 전 위험</h2></div>
    <div class="two" style="margin-top:12px"><div>
      <p style="font-weight:600">등기부 확인 — 계약하기 전에 꼭</p>
      <ol class="regi"><li><span><b>인터넷등기소에서 건물 등기부를 떼요.</b> 한 통에 몇백 원이고 누구나 뗄 수 있어요.</span></li><li><span><b>소유자</b> 이름이 계약하는 사람(건물주)과 같은지 봐요.</span></li><li><span><b>근저당(건물을 맡기고 빌린 돈)</b>이 얼마인지 봐요. 보증금보다 많이 잡혀 있으면 보증금을 못 돌려받을 수 있어요.</span></li><li><span><b>압류·가압류·경매</b> 글자가 있으면 계약하지 않아요.</span></li><li><span>계약하는 날 한 번 더 떼서 그사이 바뀐 것이 없는지 봐요.</span></li></ol>
      <p style="margin-top:12px"><button class="btn" data-act="ext" data-v="인터넷등기소">인터넷등기소 바로 가기${ICON.ext}</button></p></div>
      <div><div class="field"><label for="leasememo">임대 조건 메모</label><textarea id="leasememo" class="inp" style="height:120px" placeholder="중개사와 말한 것, 건물주에게 물을 것">${ci === 0 ? '무상 기간 3개월 다시 물어보기. 원상 복구에서 방사선 벽·바닥 빼 달라고 하기. 전기 증설 비용 건물주와 반반?' : ''}</textarea><p class="help">임대 조건 협상표(매물)에 적은 것: ${NEGO.map((r, i) => `${r[0]} ${st.nego[i][ci][1] || st.nego[i][ci][0] || '–'}`).slice(0, 3).join(' · ')} …</p></div>
        <p class="sm" style="font-weight:600;margin-top:16px">계약서에 꼭 넣을 것</p>
        <div class="cklist" style="grid-template-columns:1fr;margin-top:6px">${CLAUSES.map((t, i) => `<label><input type="checkbox" ${ci === 0 && i < 2 ? 'checked' : ''}>${t}</label>`).join('')}</div></div></div></section>

  <section><div class="sh"><h2>보러 갈 때 점검표</h2><span class="aside">${st.checks[c.id].length} / ${VISIT.length} 했어요</span></div>
    <div class="cklist" style="margin-top:12px">${VISIT.map((t, i) => { const on2 = st.checks[c.id].includes(i); return `<label class="${on2 ? 'on' : ''}"><input type="checkbox" data-act="visit" data-i="${i}" ${on2 ? 'checked' : ''}>${t}</label>` }).join('')}</div>
    <p class="sm" style="font-weight:600;margin-top:20px">사진 <span class="mut" style="font-weight:400">${st.photos[c.id].length}장 · 이 후보에만 붙어요</span></p>
    <div class="photos" style="margin-top:8px">${st.photos[c.id].map(p => `<div class="ph"><div class="im">${p[2] ? `<img src="${p[2]}" alt="${esc(p[0])}">` : '사진'}</div><p class="cp">${esc(p[0])}<small>${md(p[1])}</small></p></div>`).join('')}<button class="ph addp" data-act="photo">${ICON.camera}<span>사진 올리기</span></button></div></section>

  <section><div class="sh"><h2>진행 메모</h2><span class="aside">날짜별 · 새것이 위</span></div>
    <ul class="memos" style="margin-top:12px">${st.memos[c.id].map(m => `<li><span class="d">${m[0]}</span><span>${esc(m[1])}</span></li>`).join('')}</ul>
    <div class="memoadd"><input type="date" class="inp" id="mdate" value="${TODAY}" aria-label="메모 날짜"><input class="inp" id="mtext" placeholder="예: 중개사와 통화 — 무상 기간 3개월 됨" aria-label="메모"><button class="btn" data-act="memo">메모 더하기</button></div></section>
  </div>`
}

/* ───────── 그리기: 한 장 보고서 ───────── */
function reportHtml() {
  const c = curC(), v = calc(c), l = st.listings.find(x => x.id === c.listing), e = estimate(c), p = pts(c.sub, st.w), mx = maxPts(st.w)
  const g = hoursGrid(v.rivals), gaps = gapText(g), ci = CANDS.indexOf(c)
  const used = ['pop', 'apt', 'income', 'deal', 'dis', 'hira', 'price', 'permit', 'kakao', 'bld', 'store', 'rent', 'land', 'subscr'].concat(c.seoul ? ['live'] : [])
  const d = (t, x) => `<div><dt>${t}</dt><dd>${x}</dd></div>`
  return headHtml() + candBar() + `<div class="rbar" style="margin-top:16px"><button class="btn" data-act="view" data-v="candidate">${ICON.left}후보 ${c.id}로 돌아가기</button><div class="tools"><span class="help">A4 한 장 · 인쇄하면 앱 틀은 빠지고 종이만 나와요</span><button class="btn" data-act="pdf">${ICON.download}PDF로 저장</button><button class="btn primary" data-act="print">${ICON.print}인쇄</button></div></div>
  <div class="paperwrap"><article class="paper" aria-label="한 장 보고서">
    <div class="ph1"><div><p class="k">입지 분석 보고서 · 후보 ${c.id} · ${STEPS[st.status[c.id]]}</p><h1>${esc(c.name)}</h1><p>${esc(c.addr)}</p><p class="k">${ymd(TODAY)} 뽑음 · 자료는 ${ymd(c.saved)}(저장한 날) 값 · 살필 범위 ${rLabel(st.radius[c.id])} · 샘플정형외과의원</p></div>
      <div class="sc"><span class="k">종합 점수</span><b>${candTotal(c)}</b><span class="k">/ 100점</span></div></div>
    <div class="pi">${ITEMS.map((t, i) => `<div><span>${t}</span><b>${p[i]}<span style="font-size:11px;font-weight:500;color:var(--muted)">/${mx[i]}</span></b></div>`).join('')}</div>
    <h2>위험 신호 ${c.flags.length}개</h2><div class="pf">${c.flags.map(f => `<p><span><b>${esc(f.t)}</b> — ${esc(f.d)}</span></p>`).join('')}</div>
    <div class="p2"><div><h2>사는 사람·수요</h2><dl>${d('사는 사람', `${nf(v.n)}명 · ${nf(v.hh)}세대`)}${d('60대 이상', `${nf(v.old)}명 (${c.pop.ages[3]}%)`)}${d('5년 추세', `${pct1((c.pop.trend[5] - c.pop.trend[0]) / c.pop.trend[0] * 100)}% 늘어남`)}${d('입주 예정', v.soon.length ? v.soon.map(a => `${a.when} ${nf(a.hh)}세대`).join(', ') : '없음')}${d('뼈·관절 환자', `1,000명당 ${c.demand.joint}명(시·군·구)`)}${d('낮 인구', c.demand.live ? `${nf(v.sc(c.demand.live[0]))}명` : '이 지역은 자료 없음')}</dl></div>
      <div><h2>경쟁</h2><dl>${d('정형외과·통증·재활', `${v.rivals.length}곳 · 1곳당 ${v.rivals.length ? nf(Math.floor(v.n / v.rivals.length)) + '명' : '–'}`)}${d('한의원', `${v.comps.length - v.rivals.length}곳`)}${d('3년 개폐업', `문 엶 ${v.events.filter(x => x.kind === 'open').length} · 문 닫음 ${v.events.filter(x => x.kind === 'close').length}`)}${d('진료 시간 빈틈', gaps.length ? gaps.join(', ') : '없음')}${d('도수치료 평균', (() => { const ps = v.comps.filter(x => x.p).map(x => x.p[0]); return ps.length ? won(Math.floor(ps.reduce((a, b) => a + b, 0) / ps.length)) : '–' })())}</dl></div>
      <div><h2>자리·교통</h2><dl>${d('역', `${esc(c.traffic.station.n)} ${dist(c.traffic.station.d)} (걸어서 ${c.traffic.station.walk}분)`)}${d('버스', `정류장 ${c.traffic.bus[0]}곳 · 노선 ${c.traffic.bus[1]}개`)}${d('건물', `${c.building.year}년 · ${esc(c.building.scale)}`)}${d('엘리베이터·주차', `${esc(c.building.elev.split('(')[0])} · ${esc(c.building.park.split(' (')[0])}`)}${d('위반 건축물', esc(c.building.viol))}${d('빈 층', `${c.building.floors.filter(f => !f[3] && f[1] !== '주차장').length}개 층(짐작)`)}</dl></div>
      <div><h2>매물·비용</h2><dl>${d('층 · 전용', `${c.building.me} · ${l.py}평`)}${d('보증금 / 월세', `${man(l.dep)} / ${man(l.rent)}`)}${d('관리비 · 권리금', `${man(l.mgmt)} · ${man(l.key)}`)}${d('평당 월세', `${won(perPy(l))} (상권 평균 ${won(AREA_AVG[l.dong])})`)}${d('하루 예상 환자', `${Math.min(e.a, e.b)}~${Math.max(e.a, e.b)}명${e.warn ? ' (두 계산이 크게 달라요)' : ''}`)}${d('중개사', `${esc(l.agent)} ${esc(l.tel)}`)}</dl></div></div>
    <h2>임대 조건(제안 → 바람)</h2>${(() => { const items = NEGO.map((r, i) => d(r[0], `${esc(st.nego[i][ci][0] || '–')}${st.nego[i][ci][1] ? ` → ${esc(st.nego[i][ci][1])}` : ''}`)); return `<div class="p2"><dl>${items.slice(0, 3).join('')}</dl><dl>${items.slice(3).join('')}</dl></div>` })()}
    <h2>진행 메모</h2><dl>${st.memos[c.id].slice(0, 2).map(m => d(m[0], esc(m[1]))).join('')}</dl>
    <p class="foot">출처(가안): ${used.map(k => `${SRC[k].short} ${SRC[k].date}`).join(' · ')}. 숫자는 저장한 날 값이고 버림으로 적었어요. 예상 환자는 짐작이에요.</p>
  </article></div>`
}

      <div class="range"><div class="rh"><span class="sm" style="font-weight:600">살필 범위</span><b class="num">1km</b></div><input type="range" min="0" max="6" value="3" aria-label="살필 범위" disabled><div class="ticks"><span>300m</span><span>1km</span><span>3km</span></div><p class="help">저장한 뒤 후보 자세히에서 바꿔요.</p></div>
      <div class="field"><label for="a-m">메모</label><textarea id="a-m" class="inp" placeholder="예: 네이버 부동산에서 봄, 중개사 김예시"></textarea></div></div>
    <div class="dwf"><p class="need">저장하면 오늘(${md(TODAY)}) 받은 자료로 굳혀 두고 기준 날짜를 함께 남겨요.</p><button class="btn" data-act="close">그만두기</button><button class="btn primary" data-act="csave">후보로 저장</button></div></aside>`
}

/* ───────── 그리기 · 옮기기 ───────── */
function render() {
  $('#tabs').innerHTML = tabsHtml()
  const V = st.view
  $('#main').innerHTML = V === 'scan' ? scanHtml() : V === 'candidate' ? candidateHtml() : V === 'listings' ? listingsHtml() : V === 'compare' ? compareHtml() : V === 'plan' ? planHtml() : V === 'report' ? reportHtml() : V === 'sources' ? sourcesHtml() : V === 'dashboard' ? dashHtml() : V === 'empty' ? emptyHtml() : nokeyHtml()
  $('#layer').innerHTML = layerHtml()
}
function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y) }
function setView(v, hashEl) {
  st.view = v; st.menu = false
  history.replaceState(null, '', `?s=${v}${['candidate', 'plan', 'report'].includes(v) ? `&c=${st.cand}` : ''}`)
  document.querySelectorAll('#seg a').forEach(a => a.setAttribute('aria-current', String(a.getAttribute('href') === `?s=${v}`)))
  setNote(v)
  render()
  const el = hashEl && document.getElementById(hashEl)
  if (el) el.scrollIntoView({ block: 'center' }); else window.scrollTo(0, 0)
}
let toastT
function toast(msg) { const t = $('#toast'); t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => { t.textContent = '' }, 3600) }
const ga = w => { const c = String(w).trim().slice(-1).charCodeAt(0); if (c < 0xAC00 || c > 0xD7A3) return '이(가)'; return (c - 0xAC00) % 28 ? '이' : '가' }
const EXAMPLE_COST = { dep: '10,000', key: '0', intPy: '250', equip: '32,000', staff: '2,600', rentM: '598', etc: '400', loan: '30,000', rate: '5.2', visit: '42,000', days: '26' }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]')
  if (!t) { if (st.menu && !e.target.closest('.mpop')) { st.menu = false; $('#tabs').innerHTML = tabsHtml() } return }
  const act = t.dataset.act, c = curC()
  switch (act) {
    case 'view': e.preventDefault(); setView(t.dataset.v); break
    case 'menu': st.menu = !st.menu; $('#tabs').innerHTML = tabsHtml(); break
    case 'cand': st.cand = t.dataset.id; history.replaceState(null, '', `?s=${st.view}&c=${st.cand}`); rerender(); break
    case 'dong': st.dong = +t.dataset.i; $('#scanL').innerHTML = scanLeft(); $('#scanR').innerHTML = scanRank(); break
    case 'alldongs': st.allDongs = !st.allDongs; $('#scanR').innerHTML = scanRank(); break
    case 'wreset': st.w = DEF_W.slice(); rerender(); break
    case 'add': st.drawer = { tab: 'addr' }; $('#layer').innerHTML = layerHtml(); break
    case 'tocand': st.drawer = { tab: 'listing', listing: t.dataset.id }; $('#layer').innerHTML = layerHtml(); break
    case 'dtab': st.drawer.tab = t.dataset.v; $('#layer').innerHTML = layerHtml(); break
    case 'close': st.drawer = null; $('#layer').innerHTML = ''; break
    case 'csave': st.drawer = null; $('#layer').innerHTML = ''; toast('후보로 저장했어요. 오늘 받은 자료로 굳혀 두었어요. (시안이라 목록에는 더하지 않아요)'); break
    case 'naver': { const d = t.dataset.d || $('#ndong')?.value || '가람동'; toast(`새 창에서 네이버 부동산 상가 매물 지도(${d})가 열려요. 시안이라 열지 않아요.`); break }
    case 'ext': e.preventDefault(); toast(`${t.dataset.v}${ga(t.dataset.v)} 새 창으로 열려요. 시안이라 열지 않아요.`); break
    case 'refresh': toast('다시 받으면 굳혀 둔 값과 무엇이 바뀌었는지 먼저 보여 드려요. (시안이라 받지 않아요)'); break
    case 'src': e.preventDefault(); st.srcHit = t.dataset.k; setView('sources', 'src-' + t.dataset.k); break
    case 'law': e.preventDefault(); st.srcHit = 'law-' + t.dataset.k; setView('sources', 'law-' + t.dataset.k); break
    case 'toc': e.preventDefault(); document.getElementById('sec-' + t.dataset.id)?.scrollIntoView({ block: 'start' }); break
    case 'kind': st.kind = t.dataset.k; rerender(); break
    case 'sign': st.sign = st.sign || {}; st.sign[c.id] = t.dataset.v; rerender(); break
    case 'pyf': st.pyF = t.dataset.k; rerender(); break
    case 'psave': {
      const f = $('#pform'), val = n => f.querySelector(`[name="${n}"]`).value.trim(), num = n => { const x = val(n).replace(/[^0-9.]/g, ''); return x === '' ? null : Number(x) }
      f.querySelectorAll('.ferr').forEach(p => { p.hidden = true }); f.querySelectorAll('[aria-invalid]').forEach(i => i.removeAttribute('aria-invalid'))
      const errs = []
      if (!val('bld')) errs.push(['bld', '건물 이름을 적어 주세요.'])
      if (!num('py')) errs.push(['py', '전용 평수를 숫자로 적어 주세요.'])
      if (num('rent') == null) errs.push(['rent', '월세를 숫자로 적어 주세요(만 원).'])
      if (errs.length) { errs.forEach(([n, m]) => { const p = f.querySelector(`[data-err="${n}"]`); p.textContent = m; p.hidden = false; f.querySelector(`[name="${n}"]`).setAttribute('aria-invalid', 'true') }); f.querySelector(`[name="${errs[0][0]}"]`).focus(); break }
      const agent = val('agent')
      st.listings.push({ id: 'L' + (st.listings.length + 1), bld: val('bld'), floor: val('floor'), dong: val('dong'), py: num('py'), dep: num('dep') ?? 0, rent: num('rent'), mgmt: num('mgmt') ?? 0, key: num('key') ?? 0, agent, tel: val('tel'), cand: null, at: TODAY })
      const book = $('#p-book').checked && agent
      rerender(); toast(`매물을 저장했어요.${book ? ` 중개사 ${agent}${eul(agent)} 주소록(기타)에도 넣었어요.` : ''}`); break
    }
    case 'step': { const id = t.dataset.id, i = +t.dataset.i; if (st.status[id] === i) break; st.status[id] = i; st.memos[id].unshift([TODAY, `진행 상태를 '${STEPS[i]}'(으)로 바꿨어요.`]); rerender(); toast(`후보 ${id}: ${STEPS[i]}`); break }
    case 'drop': { const id = t.dataset.id; st.dropped[id] = true; if (st.cand === id) st.cand = CANDS.find(x => !st.dropped[x.id])?.id || 'A'; rerender(); toast(`후보 ${id}${ga(id)} 내려놓음으로 갔어요. 아래 '내려놓은 후보'에서 다시 올릴 수 있어요.`); break }
    case 'undrop': delete st.dropped[t.dataset.id]; rerender(); break
    case 'ox': { const a = st.req[c.id], i = +t.dataset.i; a[i] = a[i] === 'o' ? 'x' : a[i] === 'x' ? 'q' : 'o'; rerender(); break }
    case 'sdone': st.sdone[t.dataset.i] = !st.sdone[t.dataset.i]; rerender(); break
    case 'visit': { const a = st.checks[c.id], i = +t.dataset.i, k = a.indexOf(i); if (k >= 0) a.splice(k, 1); else a.push(i); rerender(); break }
    case 'photo': $('#photoIn').click(); break
    case 'memo': { const tx = $('#mtext').value.trim(); if (!tx) { $('#mtext').focus(); toast('메모를 적어 주세요.'); break } st.memos[c.id].unshift([$('#mdate').value || TODAY, tx]); st.memos[c.id].sort((a, b) => b[0].localeCompare(a[0])); rerender(); toast('메모를 더했어요.'); break }
    case 'fill': st.cost = { ...EXAMPLE_COST }; rerender(); break
    case 'print': window.print(); break
    case 'pdf': toast("인쇄 창이 열리면 프린터(대상)를 'PDF로 저장'으로 골라요."); setTimeout(() => window.print(), 600); break
    case 'toast': e.preventDefault(); toast(t.dataset.msg); break
    case 'kshow': { const i = document.getElementById(t.dataset.id); const on = i.type === 'password'; i.type = on ? 'text' : 'password'; t.textContent = on ? '가리기' : '보기'; break }
    case 'kin': toast('넣으면 자료 하나를 받아 보고 맞는 열쇠인지 알려 줘요. (시안이라 넣지 않아요)'); break
    case 'start': location.href = `?s=${t.dataset.v || 'scan'}`; break
  }
})
document.addEventListener('input', e => {
  const t = e.target, act = t.dataset && t.dataset.act
  if (act === 'weight') {
    st.w[+t.dataset.i] = +t.value; $('#wo' + t.dataset.i).textContent = t.value; $('#wsum').textContent = st.w.reduce((a, b) => a + b, 0)
    $('#scanL').innerHTML = scanLeft(); $('#scanR').innerHTML = scanRank()
  } else if (act === 'radius') {
    const c = curC(); st.radius[c.id] = RADII[+t.value]; const v = calc(c)
    $('#radv').textContent = rLabel(st.radius[c.id]); t.setAttribute('aria-valuetext', rLabel(st.radius[c.id]))
    $('#mmap').innerHTML = miniMap(c, v); $('#restS').innerHTML = restSecs(c, v); $('#toc').innerHTML = tocHtml(c, v)
  } else if (act === 'cost') {
    st.cost[t.dataset.k] = t.value
    const c = curC(), l = st.listings.find(x => x.id === c.listing), k = costCalc(l)
    $('#sumbox').innerHTML = sumboxHtml(c)
    if ($('#a-interior')) $('#a-interior').textContent = man(k.interior)
    if ($('#a-interest')) $('#a-interest').textContent = man(k.interest)
    $('#a-six').textContent = man(k.six)
  } else if (act === 'nego') {
    st.nego[+t.dataset.i][+t.dataset.c][+t.dataset.k] = t.value
  }
})
document.addEventListener('change', e => {
  const t = e.target, act = t.dataset && t.dataset.act
  if (act === 'opendate' && t.value) { st.open = t.value; rerender() }
  else if (act === 'region') toast('시안은 서울특별시 예시구만 그려요.')
  else if (t.id === 'photoIn' && t.files.length) {
    const c = curC()
    for (const f of t.files) st.photos[c.id].push([f.name.replace(/\.[^.]+$/, ''), TODAY, URL.createObjectURL(f)])
    toast(`사진 ${t.files.length}장을 올렸어요. (시안은 이 화면에서만 보여요)`); t.value = ''; rerender()
  }
})
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (st.drawer || st.menu)) { st.drawer = null; st.menu = false; render() } })

render()
{ const h = (location.hash || '').slice(1); const el = h && document.getElementById(h); if (el) el.scrollIntoView({ block: S === 'sources' ? 'center' : 'start' }) }
</script>
