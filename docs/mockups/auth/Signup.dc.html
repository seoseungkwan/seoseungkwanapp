<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>가입 신청</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #F5F8FC; word-break: keep-all; }
a { color: #077A73; } a:hover { color: #055F59; }
input::placeholder { color: #5B6785; }
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column; background: #F5F8FC; color: #0B1530; font-family: 'IBM Plex Sans KR', system-ui, sans-serif">

<header style="background: #FFFFFF; border-bottom: 1px solid rgba(11, 21, 48, 0.08)">
<div style="max-width: 1200px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 700; font-size: 18px">
<svg aria-hidden="true" width="30" height="30" viewBox="0 0 30 30" fill="none"><rect x="9" y="3" width="12" height="6" rx="3" stroke="#14C8BA" stroke-width="2.2"></rect><rect x="11" y="12" width="12" height="6" rx="3" stroke="#14C8BA" stroke-width="2.2"></rect><rect x="8" y="21" width="12" height="6" rx="3" stroke="#6D5DF5" stroke-width="2.2"></rect></svg>
<span>[서비스 이름]</span>
</div>
</header>

<main style="flex: 1; padding: 56px 24px 80px">
<div style="max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">

<ol aria-label="가입 단계" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; font-weight: 600">
<li style="display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 8px; background: #E6FAF8; color: #077A73"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#077A73" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>구글 로그인</li>
<li aria-current="step" style="display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 8px; background: #FFEDE8; color: #B83A26"><span style="font-family: 'Space Grotesk', sans-serif">02</span>가입 신청</li>
<li style="display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 8px; background: #FFFFFF; color: #5B6785; border: 1px solid rgba(11, 21, 48, 0.08)"><span style="font-family: 'Space Grotesk', sans-serif">03</span>관리자 승인</li>
</ol>

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 36px; font-weight: 700; line-height: 1.25; letter-spacing: -0.02em">가입 신청</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #3D4A66">처음 로그인하셨어요. 아래 내용을 보내 주시면 관리자가 확인한 뒤 승인합니다.</p>
</div>

<form style="background: #FFFFFF; border: 1px solid rgba(11, 21, 48, 0.08); border-radius: 20px; padding: 32px; box-shadow: 0 10px 30px rgba(11, 21, 48, 0.05); display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="su-email" style="font-size: 15px; font-weight: 600">구글 계정</label>
<div style="display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(11, 21, 48, 0.1); background: #F5F8FC">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6785" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
<input id="su-email" type="email" value="manager@example.com" readonly style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 15px; color: #3D4A66; outline: none">
</div>
<p style="margin: 0; font-size: 13px; color: #5B6785">로그인한 계정이라 바꿀 수 없습니다.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="su-clinic" style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600">병원 이름 <span style="font-size: 13px; font-weight: 600; color: #B83A26">필수</span></label>
<input id="su-clinic" type="text" required placeholder="예: 가나 정형외과의원" style="min-height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(11, 21, 48, 0.15); background: #FFFFFF; font: inherit; font-size: 15px; color: #0B1530; box-sizing: border-box">
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="su-name" style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600">신청자 이름 <span style="font-size: 13px; font-weight: 600; color: #B83A26">필수</span></label>
<input id="su-name" type="text" required placeholder="예: 홍길동" style="min-height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(11, 21, 48, 0.15); background: #FFFFFF; font: inherit; font-size: 15px; color: #0B1530; box-sizing: border-box">
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="su-phone" style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600">연락처 <span style="font-size: 13px; font-weight: 500; color: #5B6785">선택</span></label>
<input id="su-phone" type="tel" placeholder="010-0000-0000" style="min-height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(11, 21, 48, 0.15); background: #FFFFFF; font: inherit; font-size: 15px; color: #0B1530; box-sizing: border-box">
<p style="margin: 0; font-size: 13px; color: #5B6785">승인 관련해 연락이 필요할 때만 씁니다.</p>
</div>

<label style="display: flex; align-items: flex-start; gap: 10px; min-height: 44px; padding: 12px 14px; border-radius: 12px; background: #F5F8FC; font-size: 14px; line-height: 1.6; color: #3D4A66; box-sizing: border-box">
<input type="checkbox" required style="width: 18px; height: 18px; margin: 2px 0 0; accent-color: #077A73; flex: none">
<span>가입 확인을 위해 이메일·이름·연락처를 저장하는 데 동의합니다. <span style="font-weight: 600; color: #B83A26">필수</span></span>
</label>

<a href="Pending.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; padding: 0 24px; border-radius: 999px; background: #0B1530; color: #FFFFFF; font-weight: 700; font-size: 16px; text-decoration: none">가입 신청</a>
</form>

<a href="Main.dc.html" style="align-self: center; display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; font-size: 15px; color: #3D4A66">다른 계정으로 로그인</a>

</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
