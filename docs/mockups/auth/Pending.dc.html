<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>승인 대기</title>

</head>

<x-dc>
<helmet>

<style>
body { margin: 0; background: #F5F8FC; word-break: keep-all; }
a { color: #077A73; } a:hover { color: #055F59; }
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column; background: #F5F8FC; color: #0B1530; font-family: 'IBM Plex Sans KR', system-ui, sans-serif">

<header style="background: #FFFFFF; border-bottom: 1px solid rgba(11, 21, 48, 0.08)">
<div style="max-width: 1200px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-weight: 700; font-size: 18px">
<svg aria-hidden="true" width="30" height="30" viewBox="0 0 30 30" fill="none"><rect x="9" y="3" width="12" height="6" rx="3" stroke="#14C8BA" stroke-width="2.2"></rect><rect x="11" y="12" width="12" height="6" rx="3" stroke="#14C8BA" stroke-width="2.2"></rect><rect x="8" y="21" width="12" height="6" rx="3" stroke="#6D5DF5" stroke-width="2.2"></rect></svg>
<span>[서비스 이름]</span>
<a href="Main.dc.html" style="margin-left: auto; display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; font-size: 15px; font-weight: 500; color: #3D4A66">로그아웃</a>
</div>
</header>

<main style="flex: 1; padding: 56px 24px 80px">
<div style="max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">

<ol aria-label="가입 단계" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; font-weight: 600">
<li style="display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 8px; background: #E6FAF8; color: #077A73"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#077A73" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>구글 로그인</li>
<li style="display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 8px; background: #E6FAF8; color: #077A73"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#077A73" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>가입 신청</li>
<li aria-current="step" style="display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 8px; background: #EAF2FF; color: #2556D6"><span style="font-family: 'Space Grotesk', sans-serif">03</span>관리자 승인</li>
</ol>

<div style="display: flex; gap: 20px; align-items: flex-start">
<div aria-hidden="true" style="flex: none; width: 56px; height: 56px; border-radius: 16px; background: #EAF2FF; display: flex; align-items: center; justify-content: center">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2556D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 36px; font-weight: 700; line-height: 1.25; letter-spacing: -0.02em">신청을 확인하고 있습니다</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #3D4A66">관리자가 승인하면 대시보드를 쓸 수 있습니다. 승인된 뒤에는 이 화면을 새로 고치거나 다시 로그인해 주세요.</p>
</div>
</div>

<section aria-labelledby="pd-summary" style="background: #FFFFFF; border: 1px solid rgba(11, 21, 48, 0.08); border-radius: 20px; padding: 28px; box-shadow: 0 10px 30px rgba(11, 21, 48, 0.05); display: flex; flex-direction: column; gap: 16px">
<h2 id="pd-summary" style="margin: 0; font-size: 18px; font-weight: 700">보낸 신청 내용</h2>
<dl style="margin: 0; display: grid; grid-template-columns: 120px minmax(0, 1fr); row-gap: 12px; column-gap: 16px; font-size: 15px">
<dt style="color: #5B6785">신청일</dt><dd style="margin: 0; font-family: 'Space Grotesk', 'IBM Plex Sans KR', sans-serif; font-weight: 500">2026-10-28</dd>
<dt style="color: #5B6785">병원 이름</dt><dd style="margin: 0; font-weight: 600">가나 정형외과의원</dd>
<dt style="color: #5B6785">신청자</dt><dd style="margin: 0">홍길동</dd>
<dt style="color: #5B6785">구글 계정</dt><dd style="margin: 0; overflow-wrap: anywhere">manager@example.com</dd>
<dt style="color: #5B6785">연락처</dt><dd style="margin: 0">010-0000-1234</dd>
</dl>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
<a href="Dashboard.dc.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 24px; border-radius: 999px; background: #FFFFFF; border: 1px solid rgba(11, 21, 48, 0.15); color: #0B1530; font-weight: 700; font-size: 15px; text-decoration: none; box-sizing: border-box">상태 다시 확인</a>
<a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; font-size: 15px; color: #3D4A66">로그아웃</a>
</div>

</div>
</main>
</div>
</x-dc>
