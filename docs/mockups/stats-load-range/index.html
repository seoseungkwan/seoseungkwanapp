<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시안 — 통계 불러올 기간</title>
<link rel="stylesheet" href="file:///C:/Users/tjtmd/Desktop/seoseungkwanapp-split/.next/static/css/0f9e5190508923fc.css">
<link rel="stylesheet" href="file:///C:/Users/tjtmd/Desktop/seoseungkwanapp-split/.next/static/css/5f8fa8e72395295b.css">
<link rel="stylesheet" href="file:///C:/Users/tjtmd/Desktop/seoseungkwanapp-split/.next/static/css/b4549193828ed77f.css">
<style>
  .mock-bar { font: 13px/1.4 sans-serif; background: #fff8d6; border-bottom: 1px solid #e5d58a; padding: 8px 16px; display: flex; gap: 8px; align-items: center; }
  .mock-bar button { border: 1px solid #c9b860; background: #fff; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  .mock-bar button[aria-pressed="true"] { background: #e9d877; font-weight: 600; }
  [hidden] { display: none !important; }
  @layer base { button { border: 0 solid; background-color: transparent; font: inherit; color: inherit; } }
  .new { outline: 2px dashed #e0a100; outline-offset: 6px; border-radius: 6px; }
</style>
</head>
<body class="bg-canvas">
<div class="mock-bar">
  <b>시안 상태</b>
  <button data-state="idle" aria-pressed="true">고르기</button>
  <button data-state="working">읽는 중</button>
  <button data-state="done">다 읽음</button>
  <button data-state="stopped">중간에 멈춤</button>
  <span style="margin-left:12px;color:#7a6a10">점선 = 새로 생기는 곳 · 날짜는 오늘 2026년 11월 9일, '최근 30일'을 보는 중이라고 친 예시</span>
</div>

<div class="mx-auto max-w-[1200px] px-8 py-8">
  <div class="rounded-card border border-line bg-surface p-6">
    <h1 class="text-title font-semibold text-ink">통계</h1>

    <div class="mt-4 flex flex-wrap items-start gap-x-8 gap-y-4 rounded-control bg-canvas px-5 py-4">
      <div class="flex min-w-0 flex-[1_1_420px] flex-wrap items-center gap-x-4 gap-y-2">

        <div class="new basis-full flex flex-wrap items-center gap-x-3 gap-y-1.5">
          <span class="text-small font-semibold text-ink">불러올 기간</span>
          <div role="group" aria-label="불러올 기간" class="inline-flex shrink-0 overflow-clip rounded-control border border-line-strong bg-surface" id="spans">
            <button type="button" data-span="view" class="h-7.5 cursor-pointer border-l border-line-strong px-3 text-small first:border-l-0">지금 보는 기간</button>
            <button type="button" data-span="1y" class="h-7.5 cursor-pointer border-l border-line-strong px-3 text-small first:border-l-0">최근 1년</button>
            <button type="button" data-span="2y" class="h-7.5 cursor-pointer border-l border-line-strong px-3 text-small first:border-l-0">최근 2년</button>
            <button type="button" data-span="all" class="h-7.5 cursor-pointer border-l border-line-strong px-3 text-small first:border-l-0">전체 기간</button>
          </div>
        </div>

        <button type="button" id="load" class="inline-flex cursor-pointer items-center justify-center gap-2 whitespace-nowrap rounded-control border transition h-9 px-4 text-body font-medium border-transparent bg-accent text-surface">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
          <span id="loadText">비트에서 불러오기</span>
        </button>
        <label class="inline-flex min-h-9 cursor-pointer items-center gap-2 text-body font-medium text-ink">
          <span class="relative inline-flex size-4 shrink-0">
            <input type="checkbox" id="close" class="peer size-4 shrink-0 cursor-pointer appearance-none rounded-control border border-line-strong bg-surface checked:border-accent checked:bg-accent">
            <svg aria-hidden="true" class="pointer-events-none absolute inset-0 hidden size-4 text-surface peer-checked:block" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>
          </span>
          오늘 진료 끝
        </label>
        <p class="basis-full text-small text-ink-2"><span class="new" id="spanHint"></span></p>
        <p class="basis-full text-small text-ink-2" id="closeHint"></p>
      </div>

      <div class="flex min-w-0 flex-[1_1_320px] flex-wrap items-center gap-x-3 gap-y-2 border-l border-line-strong pl-8">
        <button type="button" class="inline-flex cursor-pointer items-center justify-center gap-2 whitespace-nowrap rounded-control border h-9 px-4 text-body font-medium border-line-strong bg-surface text-ink">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
          파일 고르기
        </button>
        <span class="text-small text-ink-2">또는 비트에서 내보낸 파일을 여기에 끌어다 놓아요</span>
      </div>
    </div>

    <p class="mt-3 flex items-center gap-2 text-body text-ink-2" id="working" hidden>
      <svg class="shrink-0 text-accent" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span id="workingText"></span>
    </p>
    <div class="new mt-3 text-body" id="result" hidden></div>

    <div class="mt-6 border-t border-line-strong pt-4">
      <p class="mb-1.5 text-caption text-muted">빠르게 보기</p>
      <div class="inline-flex shrink-0 overflow-clip rounded-control border border-line-strong bg-surface">
        <button class="h-7.5 border-l border-line-strong px-3 text-small first:border-l-0 font-medium text-ink-2">최근 7일</button>
        <button class="h-7.5 border-l border-line-strong px-3 text-small first:border-l-0 bg-accent-soft font-semibold text-accent-strong">최근 30일</button>
        <button class="h-7.5 border-l border-line-strong px-3 text-small first:border-l-0 font-medium text-ink-2">최근 90일</button>
        <button class="h-7.5 border-l border-line-strong px-3 text-small first:border-l-0 font-medium text-ink-2">최근 12개월</button>
      </div>
      <p class="mt-3 text-small text-ink-2">2026년 10월 10일 – 11월 8일 · 지난 30일과 비교</p>
    </div>
  </div>
</div>

<script>
  const SPANS = {
    view: { hint: '지금 보는 기간(최근 30일)과 비교할 지난 30일이 든 9월 1일 – 11월 9일을 읽어요. 빨리 끝나요.', parts: 1 },
    '1y': { hint: '2025년 12월 1일 – 2026년 11월 9일(1년)을 읽어요. 30초쯤 걸려요.', parts: 1 },
    '2y': { hint: '2024년 12월 1일 – 2026년 11월 9일(2년)을 읽어요. 1분쯤 걸려요.', parts: 1 },
    all: { hint: '2020년 1월 1일 – 2026년 11월 9일을 2년씩 4번에 나눠 읽어요. 4분쯤 걸려요. 한 번 저장한 달은 남으니 처음 한 번만 하면 돼요.', parts: 4 },
  }
  const PARTS = ['2024년 12월 – 2026년 11월', '2022년 12월 – 2024년 11월', '2020년 12월 – 2022년 11월', '2020년 1월 – 2020년 11월']
  const ON = 'bg-accent-soft font-semibold text-accent-strong', OFF = 'font-medium text-ink-2'
  let span = 'view', state = 'idle', timer = null, step = 1
  const $ = (id) => document.getElementById(id)

  function draw() {
    for (const b of document.querySelectorAll('#spans button')) {
      const on = b.dataset.span === span
      b.setAttribute('aria-pressed', on)
      b.className = 'h-7.5 cursor-pointer border-l border-line-strong px-3 text-small first:border-l-0 ' + (on ? ON : OFF)
      b.disabled = state === 'working'
    }
    $('spanHint').textContent = SPANS[span].hint
    $('closeHint').textContent = $('close').checked
      ? '켜고 불러오면 오늘(11월 9일) 숫자도 끝난 날로 저장해요. 진료가 다 끝난 뒤에 켜 주세요.'
      : '꺼 두면 오늘(11월 9일)은 진료 중이라, 어제까지만 끝난 날로 저장해요.'
    $('loadText').textContent = state === 'working' ? '불러오는 중' : '비트에서 불러오기'
    $('load').style.opacity = state === 'working' ? '0.4' : ''
    const parts = SPANS[span].parts
    $('working').hidden = state !== 'working'
    $('workingText').textContent = parts > 1
      ? `비트 PC에서 읽는 중이에요 (${step}/${parts} · ${PARTS[step - 1]}). 다 끝날 때까지 이 창을 닫지 마세요.`
      : '비트 PC에서 읽는 중이에요. 기간이 길면 1분쯤 걸려요.'
    const r = $('result')
    r.hidden = state !== 'done' && state !== 'stopped'
    if (state === 'done') {
      r.innerHTML = '<p class="font-semibold text-ink">2020년 1월 1일 – 11월 8일을 저장했어요.</p><p class="mt-0.5 text-small text-ink-2">이제 위쪽 기간 고르기에서 2020년부터 어느 달·해든 볼 수 있어요.</p>'
    } else if (state === 'stopped') {
      r.innerHTML = '<p class="font-semibold text-ink">4번 가운데 2번째까지 저장하고 멈췄어요.</p>'
        + '<p class="mt-0.5 text-small text-ink-2">2022년 12월 – 2026년 11월은 저장됐어요. 남은 2020년 1월 – 2022년 11월은 [이어서 불러오기]로 읽어요. (오류 번호 E-BRIDGE-…)</p>'
        + '<button type="button" class="mt-2 inline-flex items-center gap-2 rounded-control border h-9 px-4 text-body font-medium border-line-strong bg-surface text-ink">이어서 불러오기</button>'
    }
    for (const b of document.querySelectorAll('.mock-bar button')) b.setAttribute('aria-pressed', b.dataset.state === state)
  }
  function setState(next) {
    clearInterval(timer)
    state = next
    if (next === 'stopped' || next === 'done') span = 'all'
    if (next === 'working') {
      step = 1
      if (SPANS[span].parts > 1) timer = setInterval(() => { if (step < SPANS[span].parts) { step++; draw() } else { setState('done') } }, 1500)
      else timer = setTimeout(() => setState('idle'), 1500)
    }
    draw()
  }
  document.querySelectorAll('#spans button').forEach((b) => b.addEventListener('click', () => { span = b.dataset.span; if (state !== 'working') state = 'idle'; draw() }))
  document.querySelectorAll('.mock-bar button').forEach((b) => b.addEventListener('click', () => setState(b.dataset.state)))
  $('load').addEventListener('click', () => state !== 'working' && setState('working'))
  $('close').addEventListener('change', draw)
  const q = new URLSearchParams(location.search)
  if (q.get('span')) span = q.get('span')
  if (q.get('state') === 'working') { state = 'working'; step = Number(q.get('step') || 2); draw() } else if (q.get('state')) setState(q.get('state')); else draw()
</script>
</body>
</html>
