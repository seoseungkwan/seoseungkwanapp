<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>점검 규칙 저절로 바꾸기 시안</title>
<!--
  점검 규칙 저절로 바꾸기(specs/rule-auto) 시안. 결정은 notes.md.
  상태 ?s= : changed(바뀜 있음, 기본) · human(사람이 봐야 함) · reverted(되돌림) · none(바꿀 것 없음)
  화면 ?v= : dashboard(대시보드 맨 위 알림, 기본) · detail(글 화면 규칙 상자) · list(글 목록 칩) · settings(설정 → 점검 규칙)
  PC 화면 하나만 그린다(폰 전용 모양 없음, 2026-11-21 사용자 지시). 색·크기는 앱 토큰(src/app/globals.css :root)과 고시·공지 시안 그대로.
  고시 번호·규칙 번호·규칙 제목·숫자는 모두 지어낸 예시다. 환자 자료는 없다. 어디로도 보내지 않는다.
  화면 글자는 아래 T(앱 글자)에 모았다. 시안 표시(.mhead·.anno)는 앱 글자가 아니다.
-->
<style>
@font-face{font-family:'Pretendard';font-weight:400;src:url(../../../src/app/fonts/Pretendard-Regular.subset.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:500;src:url(../../../src/app/fonts/Pretendard-Medium.subset.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:600;src:url(../../../src/app/fonts/Pretendard-SemiBold.subset.woff2) format('woff2')}
:root {
  --canvas: #F7F8FA; --surface: #FFFFFF; --line: #E5E7EB; --line-strong: #D1D5DB; --faint: #9CA3AF;
  --muted: #6B7280; --ink-2: #374151; --ink: #111827; --accent: #2563EB; --accent-strong: #1D4ED8; --accent-soft: #EAF1FE;
  --positive: #15803D; --positive-soft: #ECF7EF; --negative: #C2410C; --negative-soft: #FDF0EA;
  --warning: #B45309; --warning-soft: #FDF4E3;
  --r: 4px; --r-float: 8px;
  --ui: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--ink); font: 14px/22px var(--ui); word-break: keep-all; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
svg { flex: none; }

/* 시안 머리(앱 밖) */
.mhead { background: #E9ECF0; border-bottom: 1px solid var(--line-strong); }
.mhead-in { max-width: 1280px; margin: 0 auto; padding: 12px 24px; display: grid; gap: 8px; }
.mhead b { color: var(--ink); font-size: 15px; }
.mhead .ex { margin-left: 6px; padding: 1px 7px; border-radius: 4px; background: #FEF3C7; color: #92400E; font-size: 12px; font-weight: 600; }
.mhead .mnote { font-size: 13px; color: var(--muted); }
.switch { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.switch .lab { font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 0 4px 0 8px; }
.switch .lab:first-child { margin-left: 0; }
.switch a { padding: 3px 10px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.switch a[aria-current="true"] { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
.anno { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border: 1px dashed #A78BFA; border-radius: 999px; background: #F5F3FF; color: #6D28D9; font-size: 11px; font-weight: 600; white-space: nowrap; }

/* 앱 머리 · 탭 줄 */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1280px; margin: 0 auto; height: 56px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 600; }
.top-r { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.acct { height: 32px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r); display: inline-flex; align-items: center; color: var(--ink-2); font-weight: 500; }
nav.tabs { background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs-in { max-width: 1280px; margin: 0 auto; display: flex; padding: 0 12px; }
.tab { position: relative; height: 44px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--ink-2); font-weight: 500; }
.tab[aria-current="page"] { color: var(--ink); font-weight: 600; }
.tab[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; background: var(--accent); }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; line-height: 18px; font-weight: 600; text-align: center; }

main { max-width: 1280px; margin: 0 auto; padding: 24px 24px 48px; }

/* 공통 모양 (classes.ts ds 옮김) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 500; white-space: nowrap; transition: background-color .15s; }
.btn:hover { background: var(--canvas); }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.txt { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-weight: 500; text-underline-offset: 3px; white-space: nowrap; }
.txt:hover { text-decoration: underline; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border: 1px solid transparent; border-radius: var(--r); font-size: 12px; font-weight: 500; white-space: nowrap; }
.chip.n { border-color: var(--line); background: var(--canvas); color: var(--ink-2); }
.chip.a { background: var(--accent-soft); color: var(--accent-strong); }
.chip.w { background: var(--warning-soft); color: var(--warning); }
.panel { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); min-width: 0; }
.muted { color: var(--muted); }
.err { display: grid; gap: 2px; padding: 10px 14px; border-radius: var(--r); background: var(--negative-soft); border: 1px solid #F5C9B3; font-size: 13px; line-height: 20px; }
.err b { color: var(--negative); font-weight: 600; }
.err span { color: var(--ink-2); }

/* 대시보드 맨 위 알림 */
.bands { display: grid; gap: 8px; }
.dwarn { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 10px 16px; border-radius: var(--r); background: var(--warning-soft); border: 1px solid #F3D9A8; font-size: 14px; color: var(--ink-2); }
.dwarn > svg { color: var(--warning); }
.dwarn b { color: #78350F; font-weight: 600; }
.dwarn .grow { flex: 1 1 320px; min-width: 0; }
.dchg { background: var(--accent-soft); border-color: #C7D7F8; }
.dchg > svg { color: var(--accent); }
.dchg b { color: var(--accent-strong); }
.dline { margin-top: 20px; font-size: 13px; color: var(--muted); }
.dline b { color: var(--ink); font-weight: 600; }
.dh { margin-top: 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-bottom: 16px; border-bottom: 1px solid var(--line-strong); }
.dh h1 { font-size: 24px; line-height: 32px; font-weight: 600; }
.dim { opacity: .45; filter: grayscale(.4); pointer-events: none; }
.kpis { margin-top: 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.kpi { padding: 16px 20px; border-left: 1px solid var(--line); }
.kpi:first-child { border-left: 0; padding-left: 0; }
.kpi .l { font-size: 13px; color: var(--muted); }
.kpi .v { font-size: 28px; line-height: 36px; font-weight: 600; }
.kpi .v small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.dsec { margin-top: 32px; }
.dsec .shh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin-bottom: 12px; }
.dsec h2 { font-size: 20px; line-height: 28px; font-weight: 600; }
.dsec .cntb { font-size: 14px; font-weight: 600; color: var(--accent-strong); }
.dsec .sp { flex: 1; }
.ncard { padding: 4px 20px; }
.ncard li { border-bottom: 1px solid var(--line); }
.ncard li:last-child { border-bottom: 0; }
.ncard a { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 2px 12px; padding: 12px 0; }
.ncard .nd { font-size: 13px; color: var(--muted); white-space: nowrap; }
.ncard .nt { font-weight: 600; color: var(--ink); }
.ncard .nm { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 12px; color: var(--muted); }
.ghost-blk { height: 100px; border-radius: var(--r-float); background: var(--canvas); display: grid; place-items: center; color: var(--muted); font-size: 13px; }

/* 글 화면 */
.back { display: inline-flex; align-items: center; gap: 4px; height: 32px; color: var(--ink-2); font-weight: 500; }
.dgrid { margin-top: 8px; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px 32px; align-items: start; }
.dmain, .dside { display: grid; gap: 16px; min-width: 0; }
.dhead { display: grid; gap: 8px; padding-bottom: 16px; border-bottom: 1px solid var(--line-strong); }
.dmeta { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 13px; color: var(--muted); }
.dmeta .srcl { color: var(--ink-2); font-weight: 600; }
.dtitle { font-size: 22px; line-height: 31px; font-weight: 600; letter-spacing: -.01em; }
.dsub { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13px; color: var(--ink-2); }

/* 규칙 상자 넷: 사람이 봐야 함(노랑) · 바뀜(파랑) · 살펴보는 중 · 바꿀 것 없음(회색) */
.rule { padding: 16px 20px; border-radius: var(--r); display: grid; gap: 10px; border: 1px solid; }
.rule h2 { display: flex; gap: 8px; align-items: flex-start; font-size: 15px; line-height: 23px; font-weight: 600; }
.rule h2 svg { margin-top: 3px; }
.rule > p { font-size: 13px; line-height: 20px; color: var(--ink-2); }
.rule .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.rule.hum { background: var(--warning-soft); border-color: #F3D9A8; }
.rule.hum h2 { color: #78350F; }
.rule.hum h2 svg { color: var(--warning); }
.rule.chg { background: var(--accent-soft); border-color: #C7D7F8; }
.rule.chg h2 { color: var(--accent-strong); }
.rule.chg h2 svg { color: var(--accent); }
.rule.calm { background: var(--canvas); border-color: var(--line); }
.rule.calm h2 { color: var(--ink-2); }
.rule.calm h2 svg { color: var(--muted); }
.rule.done h2 svg { color: var(--positive); }
.rlist { display: grid; gap: 4px; }
.rlist li { display: grid; gap: 2px; padding: 6px 10px; border-radius: var(--r); background: rgb(255 255 255 / .7); }
.rlist li > b { font-size: 14px; color: var(--ink); font-weight: 500; }
.rlist li > b small { margin-left: 6px; font-size: 12px; color: var(--muted); font-weight: 400; }
.rlist li > span { font-size: 13px; line-height: 20px; color: var(--ink-2); }
.hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hd .txt { font-size: 13px; }

.ccard { padding: 12px 14px; border-radius: var(--r); background: var(--surface); box-shadow: inset 0 0 0 1px #D6E2FB; display: grid; gap: 8px; }
.ccard.off { box-shadow: inset 0 0 0 1px var(--line); background: rgb(255 255 255 / .6); }
.chead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.chead b { font-size: 15px; line-height: 23px; font-weight: 600; color: var(--ink); }
.chead .rid { font-size: 12px; color: var(--muted); }
.chead .sp { flex: 1; }
.bfa { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 4px 12px; }
.bfa dt { font-size: 12px; line-height: 22px; font-weight: 600; color: var(--muted); }
.bfa dd { font-size: 14px; line-height: 22px; color: var(--ink); }
.bfa dd.was { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.bfa dd.now { font-weight: 600; }
.ccard.off .bfa dd.was { color: var(--ink); text-decoration: none; font-weight: 600; }
.ccard.off .bfa dd.now { color: var(--muted); font-weight: 400; text-decoration: line-through; text-decoration-color: var(--faint); }
.cfoot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 12px; line-height: 18px; color: var(--muted); }
.cfoot b { color: var(--ink-2); font-weight: 600; }
.caution { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; line-height: 18px; color: var(--muted); }
.caution svg { margin-top: 1px; }

.sum { padding: 20px; display: grid; gap: 14px; }
.sum h2 { font-size: 16px; line-height: 24px; font-weight: 600; }
.three { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px 16px; }
.three dt { font-size: 13px; font-weight: 600; color: var(--muted); }
.three dd { font-size: 15px; color: var(--ink); }
.sblock { padding: 16px 20px; display: grid; gap: 10px; }
.sblock h2 { font-size: 15px; font-weight: 600; }

/* 글 목록 */
.phead h1 { font-size: 24px; line-height: 32px; font-weight: 600; }
.phead .lede { margin-top: 4px; color: var(--ink-2); }
.list { margin-top: 16px; }
.list > li.month { padding: 14px 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); }
.item { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 0 12px; padding: 14px 0 14px 8px; border-bottom: 1px solid var(--line); }
.idate { font-size: 13px; color: var(--muted); }
.ibody { display: grid; gap: 4px; min-width: 0; }
.ititle { font-size: 15px; line-height: 23px; font-weight: 600; }
.iline { font-size: 13px; line-height: 20px; color: var(--ink-2); }
.imeta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12px; line-height: 20px; color: var(--muted); }
.imeta .srcl { color: var(--ink-2); font-weight: 500; }

/* 설정 → 점검 규칙 */
.stitle { font-size: 24px; line-height: 32px; font-weight: 600; }
.spanel { margin-top: 16px; }
.spanel .ph { display: flex; align-items: baseline; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.spanel .ph h2 { font-size: 16px; font-weight: 600; }
.spanel .ph span { font-size: 13px; color: var(--muted); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--canvas); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 14px; }
td.sub { font-size: 13px; color: var(--ink-2); }
td .rid2 { display: block; font-size: 12px; color: var(--muted); }
td .tline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.cbox { width: 18px; height: 18px; border-radius: 4px; background: var(--accent); display: grid; place-items: center; color: #fff; }
.sel { height: 32px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--r); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.dfl { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="mhead"><div class="mhead-in">
  <div><b>점검 규칙 저절로 바꾸기 시안</b><span class="ex">예시</span> <span class="mnote">고시 번호·규칙 번호·규칙 제목·숫자는 모두 지어낸 예시예요. 환자 정보는 없어요. PC 화면만 그렸어요.</span></div>
  <div class="switch" id="switch"></div>
</div></div>

<header class="top"><div class="top-in">
  <div class="brand"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 30 30"><rect x="3" y="3" width="24" height="24" rx="6" fill="none" stroke="#14C8BA" stroke-width="2.4"/><path d="M13.5 8h3a1 1 0 0 1 1 1v3.5H21a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-3.5V21a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1v-3.5H9a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h3.5V9a1 1 0 0 1 1-1z" fill="#6D5DF5"/></svg><span>샘플정형외과의원</span></div>

<main id="app"></main>

<script>
/* ───────── 화면 글자(앱 글자). notes.md '화면 글자'와 한 글자도 다르면 안 된다 ───────── */
const T = {
  // 대시보드 맨 위 — 저절로 바뀜(파랑)
  chgBandTitle: '점검 규칙이 바뀌었어요',
  chgBandOne: (n, no) => `새 고시(${no})로 점검 규칙 ${n}개가 저절로 바뀌었어요. 틀려 보이면 글 화면에서 되돌릴 수 있어요.`,
  chgBandNoNo: (n) => `새 글로 점검 규칙 ${n}개가 저절로 바뀌었어요. 틀려 보이면 글 화면에서 되돌릴 수 있어요.`,
  chgBandMany: (k, n) => `새 고시 ${k}개로 점검 규칙 ${n}개가 저절로 바뀌었어요. 틀려 보이면 글 화면에서 되돌릴 수 있어요.`,
  chgBandLink: '바뀐 내용 보기',
  // 대시보드 맨 위 — 사람이 봐야 함(노랑)
  humBandTitle: '점검 규칙 확인 필요',
  humBandOne: (n, no) => `새 고시(${no})가 점검 규칙 ${n}개를 바꿨는데, 저절로 고칠 수 없는 내용이라 직접 확인해야 해요.`,
  humBandNoNo: (n) => `새 글이 점검 규칙 ${n}개를 바꿨는데, 저절로 고칠 수 없는 내용이라 직접 확인해야 해요.`,
  humBandMany: (k, n) => `새 고시 ${k}개가 점검 규칙 ${n}개를 바꿨는데, 저절로 고칠 수 없는 내용이라 직접 확인해야 해요.`,
  humBandLink: '글 보기',

  // 글 화면 — 사람이 봐야 함 상자
  humTitle: (n) => `이 글이 점검 규칙 ${n}개를 바꿔요 — 확인 필요`,
  humBody: '저절로 고칠 수 없는 내용이에요. 아래 규칙이 새 기준과 맞는지 설정 → 점검 규칙에서 확인해 주세요.',
  humOpen: '점검 규칙 보기',
  humDoneBtn: '확인했어요',
  humDoneTitle: (n) => `점검 규칙 ${n}개 확인함`,
  humDoneWhen: (at) => `${at}에 확인했어요.`,
  // 글 화면 — 저절로 바뀜 상자
  chgTitle: (n) => `이 글로 점검 규칙 ${n}개가 저절로 바뀌었어요`,
  chgBody: 'AI가 새 고시를 읽고 규칙을 고쳤어요. 틀려 보이면 ‘되돌리기’를 누르세요. 우리 병원만 전 규칙으로 돌아가요.',

  const rowsHtml = rules.map((r) => {
    let badge = ''
    let title = r.title
    let basis = r.basis
    const c = S === 'none' || S === 'human' && r.id === 'MN-03' ? null : r.ch
    if (c) {
      if (revertedIds.has(r.id)) badge = `<span class="chip n">${T.badgeReverted}</span>`
      else {
        badge = `<span class="chip a">${T.badgeChanged(c.from)}</span>`
        if (fromYmd[r.id] <= today) { title = c.title; basis = `${r.basis} · ${NO}` }
      }
    }
    return `<tr><td><span class="cbox">${I.check}</span></td><td><span class="rid2">${r.id}</span><span class="tline"><span>${title}</span>${badge}</span></td>
      <td><span class="chip n">${r.dom}</span></td><td><span class="sel">${r.g} ${I.down}</span><span class="dfl">기본: ${r.g}</span></td>
      <td class="sub">${basis}</td><td class="sub">—</td><td><span class="txt" style="color:var(--faint)">기본값으로</span></td></tr>`
  }).join('')
  return `<h1 class="stitle">설정</h1>
    <section class="panel spanel"><div class="ph"><h2>점검 규칙</h2><span>262개 · 켜짐 250 · 꺼짐 12</span><span class="anno">시안: 찾기·묶음 고르기는 지금 화면 그대로라 줄였어요</span></div>
    <table><thead><tr><th>켜기</th><th>규칙</th><th>묶음</th><th>등급</th><th>고시 근거</th><th>바꾼 날</th><th>기본값</th></tr></thead><tbody>${rowsHtml}</tbody></table></section>`
}

/* ───────── 그리기·누름 ───────── */
const app = document.getElementById('app')
function render() {
  renderSwitch()
  renderTabs()
  app.innerHTML = V === 'detail' ? detailPage() : V === 'list' ? listPage() : V === 'settings' ? settingsPage() : dashboardPage()
}
app.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]')
  if (!b) return
  const act = b.dataset.act
  if (act === 'same') sameOpen = !sameOpen
  else if (act === 'humdone') humDone = true
  else if (act === 'revert') { revertedIds.add(b.dataset.id); saveFail = null }
  else if (act === 'reapply') { revertedIds.delete(b.dataset.id); saveFail = null }
  render()
})
render()
</script>
</body>
