<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주소록 탭 시안</title>
<!--
  주소록 탭(contacts) 시안. 업체 연락처 · 담당자 · 장비와 수리 기록 · 엑셀로 한 번에 넣기 · 대시보드 무상 수리 알림. 결정·화면 글자 목록은 notes.md.
  ?s=list(기본) · search · detail · pw-shown · edit · new · repair-add · empty · upload-preview · upload-bad-file · upload-done · delete-confirm · dashboard · dashboard-off
  &c=<업체 id> 로 자세히 볼 업체를 고른다(대시보드 알림 링크가 쓴다).
  색·글자는 앱 토큰(src/app/globals.css :root)만 쓴다. 업체 이름(예시○○)·사람 이름(○예시)·번호는 모두 지어낸 값이다(뉴메디코어만 실제 이름, 번호는 가짜).
  오늘은 2026-11-21 (토) 10:40으로 고정. 어디로도 보내지 않는다.
-->
<style>
@font-face { font-family: 'AppPretendard'; font-weight: 400; src: url('../../../src/app/fonts/Pretendard-Regular.subset.woff2') format('woff2'); }
@font-face { font-family: 'AppPretendard'; font-weight: 500; src: url('../../../src/app/fonts/Pretendard-Medium.subset.woff2') format('woff2'); }
@font-face { font-family: 'AppPretendard'; font-weight: 600; src: url('../../../src/app/fonts/Pretendard-SemiBold.subset.woff2') format('woff2'); }
/* 앱 토큰(src/app/globals.css :root) */
:root {
  --canvas: #F7F8FA; --surface: #FFFFFF; --line: #E5E7EB; --line-strong: #D1D5DB; --faint: #9CA3AF;
  --muted: #6B7280; --ink-2: #374151; --ink: #111827; --accent: #2563EB; --accent-strong: #1D4ED8; --accent-soft: #EAF1FE;
  --positive: #15803D; --positive-soft: #ECF7EF; --negative: #C2410C; --negative-soft: #FDF0EA;
  --warning: #B45309; --warning-soft: #FDF4E3; --r: 4px; --r-float: 8px;
  --elev: 0 1px 2px rgb(17 24 39 / 6%), 0 6px 16px rgb(17 24 39 / 10%);
  --ui: 'AppPretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--ink); font: 400 14px/22px var(--ui); word-break: keep-all; overflow-x: clip; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3, h4, p { margin: 0; }
svg { flex: none; }

/* 시안 머리(앱 밖) */
.mhead { background: #E9ECF0; border-bottom: 1px solid var(--line-strong); }
.mhead-in { max-width: 1280px; margin: 0 auto; padding: 12px 24px; display: grid; gap: 6px; }
.mhead b { color: var(--ink); font-size: 15px; font-weight: 600; }
.mhead .ex { margin-left: 6px; padding: 1px 7px; border-radius: 4px; background: #FEF3C7; color: #92400E; font-size: 12px; font-weight: 600; }
.mdesc { font-size: 13px; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg a { padding: 3px 10px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); font-size: 12px; line-height: 18px; color: var(--ink-2); text-decoration: none; white-space: nowrap; }
.seg a[aria-current="true"] { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
.mnote { font-size: 12px; line-height: 18px; color: var(--ink-2); }
.mnote b { font-size: 12px; }

/* 앱 틀 */
.app { position: relative; background: var(--surface); }
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1280px; margin: 0 auto; height: 56px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; font-size: 16px; font-weight: 600; color: var(--ink); }
.brand span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-r { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--muted); }
.acct { height: 32px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r); display: inline-flex; align-items: center; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.tabsbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs-in { max-width: 1280px; margin: 0 auto; padding: 0 12px; display: flex; }
.tabs { display: flex; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; }
.tabs a, .more { position: relative; height: 44px; padding: 0 12px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; color: var(--ink-2); font-weight: 500; text-decoration: none; flex: none; border: 0; background: none; }
.tabs a[aria-current="page"], .more.on { color: var(--ink); font-weight: 600; }
.tabs a[aria-current="page"]::after, .more.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; background: var(--accent); }
.more { margin-left: auto; }
main { max-width: 1280px; margin: 0 auto; padding: 24px 24px 48px; }
main > * { min-width: 0; }

/* 단추 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 500; white-space: nowrap; text-decoration: none; }
.btn:hover:not(:disabled) { background: var(--canvas); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn.lg { height: 44px; padding: 0 20px; font-weight: 600; }
.btn.primary { border-color: transparent; background: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent-strong); }
.btn.danger { color: var(--negative); }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); }
.btn.ghost.sm { padding: 0 8px; }
.btn.icon { width: 36px; padding: 0; }
.tbtn { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 4px; border: 0; background: none; color: var(--accent); font-size: 13px; font-weight: 500; white-space: nowrap; border-radius: var(--r); }
.tbtn:hover { text-decoration: underline; }
.tbtn.mut { color: var(--ink-2); }
.tbtn.danger { color: var(--negative); }
.mini { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); color: var(--ink-2); font-size: 12px; font-weight: 500; white-space: nowrap; }
.mini:hover { background: var(--canvas); }
.mini.done { color: var(--positive); border-color: #A7D7B5; background: var(--positive-soft); }

/* 칩 */
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border: 1px solid transparent; border-radius: var(--r); font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; vertical-align: 1px; }
.chip.neutral { background: var(--canvas); border-color: var(--line); color: var(--ink-2); }
.chip.accent { background: var(--accent-soft); color: var(--accent-strong); }
.chip.warn { background: var(--warning-soft); color: var(--warning); }
.chip.warn.today { border-color: #EBC88A; font-weight: 600; }
.chip.ended { background: var(--canvas); border-color: var(--line); color: var(--muted); font-weight: 400; }
.chip.pos { background: var(--positive-soft); color: var(--positive); }

/* 도구 줄 · 찾기 */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; }
.tl { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.tl h1 { font-size: 20px; line-height: 28px; font-weight: 600; color: var(--ink); }
.tl .cnt { font-size: 13px; color: var(--muted); white-space: nowrap; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.findrow { margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.search { position: relative; flex: 0 1 400px; min-width: 0; }
.search svg.si { position: absolute; left: 12px; top: 14px; color: var(--muted); pointer-events: none; }
.search input { width: 100%; height: 44px; padding: 0 40px 0 36px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); font-size: 14px; color: var(--ink); }
.search input::placeholder { color: var(--faint); }
.search input:hover { border-color: var(--muted); }
.search input:focus { outline: 1px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.search .clr { position: absolute; right: 4px; top: 4px; width: 36px; height: 36px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; border-radius: var(--r); }
.cats { display: flex; flex-wrap: wrap; gap: 6px; }
.fc { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); color: var(--ink-2); font-size: 14px; font-weight: 500; white-space: nowrap; }
.fc:hover { background: var(--canvas); }
.fc .n { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 500; }
.fc[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; box-shadow: inset 0 0 0 1px var(--accent); }
.fc[aria-pressed="true"] .n { color: var(--accent-strong); }
.fc.zero .n { color: var(--faint); }

/* 알림 줄(넣은 뒤) */
.notice { margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px; border-radius: var(--r); background: var(--positive-soft); color: var(--ink); }
.notice svg { color: var(--positive); }
.notice p { flex: 1 1 320px; min-width: 0; }
.notice p b { font-weight: 600; color: var(--positive); }

/* 목록 + 자세히 */
.cbody { margin-top: 16px; display: grid; grid-template-columns: 360px minmax(0, 1fr); border-top: 1px solid var(--line-strong); }
.lcol { border-right: 1px solid var(--line); min-width: 0; }
.dcol { min-width: 0; padding: 20px 0 0 32px; }
.grp { display: flex; align-items: baseline; gap: 6px; padding: 16px 12px 6px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); }
.grp:first-child { padding-top: 12px; }
.grp .n { font-weight: 500; font-variant-numeric: tabular-nums; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 8px; width: 100%; margin: 0; padding: 10px 12px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; color: inherit; }
.row:hover { background: var(--canvas); }
.row[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.row .nm { font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { grid-column: 1 / -1; display: flex; min-width: 0; font-size: 13px; line-height: 20px; color: var(--muted); white-space: nowrap; }
.row .sub .jb { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.row .sub .num, .row .sub .sep { flex: none; }
.row .sub .sep { white-space: pre; }
.row .sub .num { color: var(--ink-2); }
.nw { white-space: nowrap; }
.row .hit { grid-column: 1 / -1; font-size: 12px; line-height: 18px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .hit i { font-style: normal; color: var(--muted); }
mark { background: var(--warning-soft); color: inherit; box-shadow: 0 -1px 0 var(--warning-soft), 0 1px 0 var(--warning-soft); }
.nores { padding: 24px 12px; color: var(--ink-2); }
.nores small { display: block; margin-top: 4px; font-size: 13px; color: var(--muted); }
.ph { position: sticky; top: 16px; padding: 32px 0; color: var(--muted); max-width: 420px; }
.ph b { display: block; color: var(--ink); font-size: 16px; line-height: 24px; font-weight: 600; margin-bottom: 4px; }

/* 자세히 */
.dhead { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 16px; }
.dtitle { min-width: 0; }
.dtitle h2 { margin-top: 6px; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -.01em; color: var(--ink); overflow-wrap: anywhere; }
.dtitle .job { margin-top: 2px; color: var(--ink-2); }
.dacts { display: flex; gap: 8px; }
.dtel { margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.dtel .lb { width: 104px; font-size: 13px; color: var(--muted); }
.nb { display: inline-flex; align-items: center; gap: 8px; margin: 0; padding: 0; border: 0; background: none; color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; text-decoration: none; border-radius: var(--r); white-space: nowrap; }
.nb:hover .v { text-decoration: underline; text-underline-offset: 3px; }
.nb.big { font-size: 20px; line-height: 28px; font-weight: 600; }
.nb .cpk { font-size: 12px; line-height: 16px; font-weight: 400; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.nb:not(.big) .cpk { display: none; }
.nb:not(.big):hover .cpk, .nb.done .cpk { display: inline-flex; }
.nb.done .cpk { color: var(--positive); font-weight: 500; }
.dgrid { margin-top: 24px; display: grid; gap: 32px; }
.w2 .dgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px 40px; align-items: start; }
.dgrid > div { display: grid; gap: 32px; align-content: start; min-width: 0; }
.sh { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line-strong); }
.sh h3 { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--ink); }
.sh h3 .n { font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; }
.none { padding: 12px 0; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 4px 12px; padding: 8px 0; min-height: 48px; border-bottom: 1px solid var(--line); }
.prow .who { min-width: 0; }
.prow .who b { font-weight: 600; color: var(--ink); }
.prow .who span { margin-left: 8px; font-size: 13px; color: var(--muted); }
.info { margin: 0; }
.info > div { display: grid; grid-template-columns: 104px minmax(0, 1fr) auto; align-items: baseline; gap: 4px 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.info dt { font-size: 13px; line-height: 22px; color: var(--muted); }
.info dd { margin: 0; min-width: 0; overflow-wrap: anywhere; color: var(--ink); }
.info dd.memo { white-space: pre-line; color: var(--ink-2); }
.info .act { display: flex; gap: 4px; align-self: center; }
.mask { letter-spacing: 2px; color: var(--ink-2); font-size: 9px; line-height: 22px; vertical-align: 1px; }
.lnk { color: var(--accent-strong); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.lnk:hover { text-decoration: underline; }
.eq { padding: 12px 0 14px; border-bottom: 1px solid var(--line); }
.eqh { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.eqh b { font-size: 15px; line-height: 22px; font-weight: 600; color: var(--ink); }
.eqh .sp { margin-left: auto; }
.eqm { margin-top: 2px; display: flex; flex-wrap: wrap; gap: 0 14px; font-size: 13px; line-height: 20px; color: var(--muted); }
.eqm span { white-space: nowrap; }
.eqm em { font-style: normal; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.eq.ended .eqh b { color: var(--ink-2); font-weight: 500; }
.rh { margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; line-height: 20px; font-weight: 600; color: var(--ink-2); }
.rh .n { font-weight: 500; color: var(--muted); margin-left: 2px; }
.rrow { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto auto; align-items: baseline; gap: 2px 12px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; line-height: 20px; }
.rrow .rd { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.rrow .rw { min-width: 0; color: var(--ink); }
.rrow .rc { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.rrow .rc.no { color: var(--faint); }
.rnone { padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }

/* 바로 고치는 칸(담당자·장비·수리 기록) */
.iform { margin-top: 8px; padding: 12px; border-radius: var(--r); background: var(--canvas); display: grid; gap: 12px; }
.iform h4 { font-size: 13px; line-height: 20px; font-weight: 600; color: var(--ink); }
.ig { display: grid; gap: 12px; }
.ig.p3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.ig.r3 { grid-template-columns: 160px minmax(0, 1fr); }
.ig.e2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.ifoot { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }
.ifoot .tbtn.danger { margin-right: auto; }
.field { display: grid; gap: 6px; align-content: start; min-width: 0; }
.field > label, .field > .lb { font-size: 13px; line-height: 20px; font-weight: 600; color: var(--ink); display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; }
.field .req { font-size: 12px; font-weight: 400; color: var(--muted); }
.help { font-size: 12px; line-height: 16px; color: var(--muted); }
.ferr { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--negative); }
.inp { width: 100%; min-width: 0; height: 44px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); font-size: 14px; color: var(--ink); }
.inp::placeholder { color: var(--faint); }
.inp:hover { border-color: var(--muted); }
.inp:focus { outline: 1px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.inp[aria-invalid="true"] { border-color: var(--negative); }
textarea.inp { height: 88px; padding: 10px 12px; line-height: 22px; resize: vertical; }
.suf { position: relative; }
.suf .inp { padding-right: 32px; }
.suf span { position: absolute; right: 12px; top: 11px; color: var(--muted); font-size: 14px; }
.sec-inp { position: relative; }
.sec-inp .inp { padding-right: 64px; }
.sec-inp .mini { position: absolute; right: 8px; top: 8px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.ob { margin: 0; height: 36px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); color: var(--ink); font-size: 14px; white-space: nowrap; }
.ob:hover { background: var(--canvas); }
.ob[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; box-shadow: inset 0 0 0 1px var(--accent); }

/* 옆에서 나오는 판 · 확인 창 */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgb(17 24 39 / 36%); }
.scrim.light { background: rgb(17 24 39 / 18%); }
.drawer { position: fixed; z-index: 21; top: 0; right: 0; bottom: 0; width: 520px; max-width: 100%; background: var(--surface); border-left: 1px solid var(--line-strong); box-shadow: var(--elev); display: flex; flex-direction: column; }
.dwh { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px 10px 24px; border-bottom: 1px solid var(--line); }
.dwh h3 { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--ink); }
.dwb { flex: 1; overflow-y: auto; padding: 20px 24px 24px; display: grid; align-content: start; gap: 20px; }
.dwf { padding: 12px 24px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }
.dwf .need { flex: 1 1 160px; font-size: 12px; line-height: 16px; color: var(--muted); }
.dwf .need.err { color: var(--negative); font-weight: 500; }
.f2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px 12px; }
.dlg { position: fixed; z-index: 31; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 400px; max-width: calc(100% - 32px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-float); box-shadow: var(--elev); padding: 24px; display: grid; gap: 12px; }
.dlg h3 { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--ink); }
.dlg p { color: var(--ink-2); }
.dlg p.sm { font-size: 13px; line-height: 20px; color: var(--muted); }
.dlg .fname { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.dlg .foot { margin-top: 8px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }

// 폰 전용 모양은 없다(폰에서도 PC 화면 그대로). 폭에 따라 목록 칸(1024 미만)과 자세히 두 칸(1200 이상)만 바뀐다
function setMode() {
  const w = window.innerWidth
  const before = document.body.className
  document.body.classList.toggle('mid', w < 1024)
  document.body.classList.toggle('w2', w >= 1200)
  return before !== document.body.className
}
// 손가락으로 누르는 기기(폰·태블릿)인지. 배치는 바꾸지 않고 번호를 눌렀을 때 전화/복사만 가른다
const isTouch = () => matchMedia('(pointer: coarse)').matches

/* ───────── 찾기·나누기 ───────── */
const norm = s => String(s || '').toLowerCase().replace(/\s+/g, '')
function hitsOf(c, q) {
  if (!q) return { ok: true, hits: [] }
  const n = norm(q)
  const has = s => norm(s).includes(n)
  const hits = []
  // 업체 이름·하는 일·품목은 목록 줄에 이미 보여 그 자리에 노란 표시만, 담당자·장비는 줄 아래에 어디서 찾았는지 적는다
  const inRow = has(c.name) || has(c.job)
  for (const p of c.people || []) if (has(p.name)) hits.push(['담당자', p.name])
  for (const e of c.equips || []) if (has(e.name)) hits.push(['장비', e.name])
  return { ok: inRow || hits.length > 0, hits }
}
function hl(text, q) {
  const t = String(text ?? '')
  if (!q) return esc(t)
  const n = q.trim().toLowerCase()
  const i = n ? t.toLowerCase().indexOf(n) : -1
  if (i < 0) return esc(t)
  return esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + n.length)) + '</mark>' + esc(t.slice(i + n.length))
}
const byName = (a, b) => a.name.localeCompare(b.name, 'ko')
function found() { return st.list.filter(c => hitsOf(c, st.q).ok) }
function shownList() { const f = found(); return st.cat === 'all' ? f : f.filter(c => c.cat === st.cat) }
const cur = () => st.list.find(c => c.id === st.sel) || null

// 무상 수리 칩: 끝나기 30일 전부터 'n일 남음', 당일 '오늘 끝나요', 지나면 '끝남'(흐리게). 30일보다 많이 남으면 칩 없음
function wState(e) {
  if (!e.wEnd) return null
  const d = daysLeft(e.wEnd)
  if (d > 30) return null
  return d > 0 ? { d, cls: 'warn', text: `무상 수리 ${d}일 남음` } : d === 0 ? { d, cls: 'warn today', text: '무상 수리 오늘 끝나요' } : { d, cls: 'ended', text: '무상 수리 끝남' }
}
const wChip = e => { const w = wState(e); return w ? `<span class="chip ${w.cls}">${w.text}</span>` : '' }
// 목록 줄 칩: 아직 안 끝난 것 가운데 가장 급한 것 하나
function listChip(c) {
  const ws = (c.equips || []).map(wState).filter(w => w && w.d >= 0).sort((a, b) => a.d - b.d)
  return ws.length ? `<span class="chip ${ws[0].cls}">${ws[0].text}</span>` : ''
}
// 대시보드 줄: 남은 날 0~30, 적게 남은 것 먼저
function alertLines() {
  const out = []
  for (const c of st.list) (c.equips || []).forEach(e => { const w = wState(e); if (w && w.d >= 0) out.push({ id: c.id, company: c.name, eq: e.name, d: w.d }) })
  return out.sort((a, b) => a.d - b.d)
}

function toolbarHtml(withTools) {
  const n = st.list.length
  return `<div class="toolbar"><div class="tl"><h1>주소록</h1>${n ? `<span class="cnt">업체 ${n}곳</span>` : ''}</div>
    ${withTools ? `<div class="tools"><button class="btn" data-act="upload">${ICON.upload}엑셀 올리기</button><button class="btn" data-act="template">${ICON.download}양식 받기</button><button class="btn primary" data-act="new">${ICON.plus}업체 더하기</button></div>` : ''}</div>`
}
function findHtml() {
  const f = found()
  const cnt = k => k === 'all' ? f.length : f.filter(c => c.cat === k).length
  const chips = ['all', ...CATS].map(k => { const n = cnt(k); return `<button class="fc ${n ? '' : 'zero'}" data-act="cat" data-k="${k}" aria-pressed="${st.cat === k}">${k === 'all' ? '전체' : k}<span class="n">${n}</span></button>` }).join('')
  return `<div class="findrow"><div class="search">${ICON.search}<input id="q" type="search" value="${esc(st.q)}" placeholder="업체·담당자·품목·장비 찾기" aria-label="업체·담당자·품목·장비 찾기" autocomplete="off">${st.q ? `<button class="clr" data-act="clear" aria-label="찾기 지우기">${ICON.close}</button>` : ''}</div>
    <div class="cats" role="group" aria-label="분류">${chips}</div></div>`
}
function rowHtml(c) {
  const h = hitsOf(c, st.q).hits
  // 하는 일·품목이 길면 그것만 줄이고 대표 전화는 늘 보인다
  const sub = [c.job ? `<span class="jb">${hl(c.job, st.q)}</span>` : '', c.tel ? `<span class="num">${esc(c.tel)}</span>` : ''].filter(Boolean).join('<span class="sep"> · </span>')
  const hit = h.length ? `<span class="hit">${h.slice(0, 2).map(([k, v]) => `<i>${k}:</i> ${hl(v, st.q)}`).join(' · ')}</span>` : ''
  return `<button class="row" data-act="pick" data-id="${c.id}" aria-current="${c.id === st.sel}"><span class="nm">${hl(c.name, st.q)}</span>${listChip(c)}${sub ? `<span class="sub">${sub}</span>` : ''}${hit}</button>`
}
function listHtml() {
  const l = shownList()
  if (!l.length) {
    return st.q
      ? `<p class="nores">'${esc(st.q)}'에 맞는 업체가 없어요.<small>업체 이름·담당자 이름·하는 일·품목·장비 이름으로 찾아요.</small></p>`
      : `<p class="nores">이 분류에는 업체가 없어요.</p>`
  }
  if (st.cat !== 'all') return l.slice().sort(byName).map(rowHtml).join('')
  return CATS.map(k => { const g = l.filter(c => c.cat === k).sort(byName); return g.length ? `<div class="grp">${k}<span class="n">${g.length}</span></div>` + g.map(rowHtml).join('') : '' }).join('')
}

  if (!st.list.length) return toolbarHtml(false) + emptyHtml()

  const head = toolbarHtml(true) + notice + findHtml()
  return head + `<div class="cbody"><div class="lcol">${listHtml()}</div><div class="dcol">${c ? detailHtml(c) : `<div class="ph"><b>업체를 골라 주세요</b>왼쪽에서 업체를 누르면 연락처·담당자·장비가 여기에 보여요.</div>`}</div></div>`
}
function emptyHtml() {
  return `<section class="empty" aria-labelledby="emh"><h2 id="emh">주소록이 비어 있어요</h2>
    <p class="lead">거래처와 수리·관리 업체 연락처를 한곳에 모아 둬요. 업체가 많으면 엑셀 양식에 적어 한 번에 올리고, 몇 곳 안 되면 하나씩 더해요.</p>
    <ol class="steps">
      <li><span>1</span><div><b>양식 받기</b><small>빈 엑셀 양식(주소록-양식.xlsx)을 받아요. '쓰는 법' 시트에 적는 법과 예시가 있어요.</small></div></li>
      <li><span>2</span><div><b>엑셀에 적기</b><small>'연락처' 시트에 사람마다 한 줄씩 적어요. 업체 이름을 똑같이 적은 줄은 한 업체로 묶여요. 장비는 '장비' 시트에 적어요.</small></div></li>
      <li><span>3</span><div><b>엑셀 올리기</b><small>올리면 넣기 전에 미리 보여 줘요. 틀린 줄은 빼고 나머지만 넣을 수 있어요.</small></div></li>
    </ol>
    <div class="acts"><button class="btn" data-act="template">${ICON.download}양식 받기</button><button class="btn" data-act="upload">${ICON.upload}엑셀 올리기</button><button class="btn primary" data-act="new">${ICON.plus}업체 더하기</button></div>
    <p class="note">수리 기록은 엑셀로 넣지 않아요. 장비를 넣은 뒤 화면에서 장비마다 더해요.</p>
  </section>`
}

/* 번호: 마우스 기기(PC)는 누르면 복사, 터치 기기는 바로 전화. 모양은 같다 */
function numHtml(tel, big) {
  if (isTouch()) return `<a class="nb ${big ? 'big' : ''}" href="${telHref(tel)}" data-act="call"><span class="v">${esc(tel)}</span></a>`
  return `<button class="nb ${big ? 'big' : ''}" data-act="copy-num" data-v="${esc(tel)}" title="누르면 복사돼요"><span class="v">${esc(tel)}</span><span class="cpk">누르면 복사돼요</span></button>`
}
const copyBtn = (v, label = '복사') => `<button class="mini" data-act="copy" data-v="${esc(v)}">${ICON.copy}${label}</button>`

function detailHtml(c) {
  const head = `<div class="dhead"><div class="dtitle"><span class="chip neutral">${esc(c.cat)}</span><h2>${esc(c.name)}</h2>${c.job ? `<p class="job">${esc(c.job)}</p>` : ''}</div>
    <div class="dacts"><button class="btn sm" data-act="edit">고치기</button><button class="btn sm danger" data-act="del-company">지우기</button></div></div>`
  const tel = c.tel ? `<div class="dtel"><span class="lb">대표 전화</span>${numHtml(c.tel, true)}</div>` : ''
  const left = peopleHtml(c) + infoHtml(c)
  const right = equipHtml(c)
  return head + tel + `<div class="dgrid"><div>${left}</div><div>${right}</div></div>`
}
function peopleHtml(c) {
  const ps = c.people || []
  const I = st.inline
  const rows = ps.map((p, i) => (I && I.kind === 'person' && I.i === i) ? personForm(p, i) : `<div class="prow"><div class="who"><b>${esc(p.name)}</b>${p.role ? `<span>${esc(p.role)}</span>` : ''}</div>${p.phone ? numHtml(p.phone) : '<span></span>'}<button class="tbtn mut" data-act="edit-person" data-i="${i}">고치기</button></div>`).join('')
  const add = I && I.kind === 'person' && I.i == null ? personForm(null) : ''
  return `<section aria-labelledby="h-people"><div class="sh"><h3 id="h-people">담당자<span class="n">${ps.length}</span></h3><button class="tbtn" data-act="add-person">${ICON.plus}담당자</button></div>
    ${rows || (add ? '' : '<p class="none">담당자가 없어요.</p>')}${add}</section>`
}
const INFO = [['addr', '주소', 'copy'], ['web', '홈페이지', 'link'], ['biz', '사업자번호', 'copy'], ['acct', '계좌', 'secret'], ['siteId', '사이트 아이디', 'copy'], ['sitePw', '사이트 비밀번호', 'secret'], ['memo', '업체 메모']]
function infoHtml(c) {
  const rows = INFO.filter(([k]) => c[k]).map(([k, label, kind]) => {
    const v = c[k]
    let dd = esc(v), act = ''
    if (kind === 'copy') act = copyBtn(v)
    if (kind === 'link') { const href = /^https?:/.test(v) ? v : 'https://' + v; dd = `<a class="lnk" href="${esc(href)}" target="_blank" rel="noopener" data-act="ext">${esc(v)}${ICON.ext}</a>` }
    if (kind === 'secret') {
      const shown = !!st.shown[k]
      dd = shown ? `<span class="num">${esc(v)}</span>` : '<span class="mask" aria-label="가려 둠">●●●●●●</span>'
      act = `<button class="mini" data-act="toggle" data-k="${k}" aria-pressed="${shown}">${shown ? '가리기' : '보기'}</button>${copyBtn(v)}`
    }
    return `<div><dt>${label}</dt><dd class="${k === 'memo' ? 'memo' : ''}">${dd}</dd>${act ? `<span class="act">${act}</span>` : '<span></span>'}</div>`
  }).join('')
  return `<section aria-labelledby="h-info"><div class="sh"><h3 id="h-info">업체 정보</h3><button class="tbtn mut" data-act="edit">고치기</button></div>
    ${rows ? `<dl class="info">${rows}</dl>` : '<p class="none">적힌 정보가 없어요. [고치기]로 채워요.</p>'}</section>`
}
function equipHtml(c) {
  const es = c.equips || []
  const I = st.inline
  const blocks = es.map((e, ei) => {
    if (I && I.kind === 'equip' && I.i === ei) return `<div class="eq">${equipForm(e, ei)}</div>`
    const w = wState(e)
    const reps = e.repairs || []
    const rForm = I && I.kind === 'repair' && I.eq === ei && I.i == null ? repairForm(null, ei) : ''
    const rRows = reps.map((r, ri) => (I && I.kind === 'repair' && I.eq === ei && I.i === ri) ? repairForm(r, ei, ri)
      : `<div class="rrow"><span class="rd">${esc(r.date)}</span><span class="rw">${esc(r.what)}</span><span class="rc ${r.cost == null ? 'no' : ''}">${r.cost == null ? '–' : won(r.cost)}</span><button class="tbtn mut" data-act="edit-repair" data-eq="${ei}" data-i="${ri}">고치기</button></div>`).join('')
    const meta = [e.serial && `<span>일련번호 <em>${esc(e.serial)}</em></span>`, e.inDate && `<span>들여온 날 <em>${esc(e.inDate)}</em></span>`, e.wEnd && `<span>무상 수리 끝나는 날 <em>${esc(e.wEnd)}</em></span>`].filter(Boolean).join('')
    return `<div class="eq ${w && w.d < 0 ? 'ended' : ''}"><div class="eqh"><b>${esc(e.name)}</b>${wChip(e)}<span class="sp"></span><button class="tbtn mut" data-act="edit-equip" data-i="${ei}">고치기</button></div>
      ${meta ? `<div class="eqm">${meta}</div>` : ''}
      <div class="rh"><span>수리 기록<span class="n">${reps.length}</span></span><button class="tbtn" data-act="add-repair" data-eq="${ei}">${ICON.plus}수리 기록</button></div>
      ${rForm}${rRows || (rForm ? '' : '<p class="rnone">수리 기록이 없어요.</p>')}</div>`
  }).join('')
  const add = I && I.kind === 'equip' && I.i == null ? `<div class="eq">${equipForm(null)}</div>` : ''
  return `<section aria-labelledby="h-eq"><div class="sh"><h3 id="h-eq">장비<span class="n">${es.length}</span></h3><button class="tbtn" data-act="add-equip">${ICON.plus}장비</button></div>
    ${blocks || (add ? '' : '<p class="none">장비가 없어요. 수리·관리하는 기계가 있으면 더해요.</p>')}${add}</section>`
}
const fld = (name, label, val, o = {}) => `<div class="field"><label for="f-${name}">${label}${o.req ? '<span class="req">필수</span>' : ''}${o.opt ? '<span class="req">선택</span>' : ''}</label>${o.suf ? '<div class="suf">' : ''}<input class="inp ${o.num ? 'num' : ''}" id="f-${name}" name="${name}" type="${o.type || 'text'}" value="${esc(val ?? '')}" placeholder="${esc(o.ph || '')}" ${o.mode ? `inputmode="${o.mode}"` : ''}>${o.suf ? `<span>${o.suf}</span></div>` : ''}${o.help ? `<p class="help">${o.help}</p>` : ''}<p class="ferr" data-err="${name}" hidden></p></div>`
const formFoot = (kind, isEdit, extra = '') => `<div class="ifoot">${isEdit ? `<button class="tbtn danger" data-act="del-${kind}">지우기</button>` : ''}${extra}<button class="btn sm" data-act="inline-cancel">그만두기</button><button class="btn sm primary" data-act="save-${kind}">저장</button></div>`
function personForm(p, i) {
  return `<form class="iform" data-form="person" onsubmit="return false"><h4>${p ? '담당자 고치기' : '담당자 더하기'}</h4><div class="ig p3">${fld('name', '이름', p?.name, { req: true, ph: '예: 김예시' })}${fld('phone', '휴대폰', p?.phone, { ph: '010-0000-0000', mode: 'tel', num: true })}${fld('role', '맡은 일', p?.role, { ph: '예: 영업·주문' })}</div>${formFoot('person', !!p)}</form>`
}
function equipForm(e, i) {
  return `<form class="iform" data-form="equip" onsubmit="return false"><h4>${e ? '장비 고치기' : '장비 더하기'}</h4><div class="ig e2">${fld('name', '장비 이름', e?.name, { req: true, ph: '예: 충격파 기계' })}${fld('serial', '일련번호', e?.serial, { ph: '기계 뒷면 이름표', num: true })}${fld('inDate', '들여온 날', e?.inDate, { type: 'date' })}${fld('wEnd', '무상 수리 끝나는 날', e?.wEnd, { type: 'date', help: '끝나기 30일 전부터 주소록과 대시보드에 알려 줘요.' })}</div>${formFoot('equip', !!e)}</form>`
}
function repairForm(r, ei, ri) {
  return `<form class="iform" data-form="repair" onsubmit="return false"><h4>${r ? '수리 기록 고치기' : '수리 기록 더하기'}</h4><div class="ig r3">${fld('date', '날짜', r?.date ?? TODAY, { type: 'date', req: true })}${fld('what', '내용', r?.what, { req: true, ph: '예: 헤드 교체' })}${fld('cost', '비용', r?.cost ?? '', { suf: '원', mode: 'numeric', ph: '비워도 돼요', num: true })}</div>${formFoot('repair', !!r)}</form>`
}

/* ───────── 그리기: 판·확인 창 ───────── */
function layerHtml() {
  if (st.drawer) return drawerHtml()
  if (st.dlg) return dlgHtml()
  return ''
}
const CFIELDS = [
  ['tel', '대표 전화', { ph: '02-000-0000', mode: 'tel', help: '숫자만 적어도 02-000-0000 모양으로 바꿔 보여 줘요.' }],
  ['job', '하는 일·품목', { ph: '예: 의료기기 판매·수리, 충격파 기계', help: '찾기에 쓰여요.' }],
  ['addr', '주소', {}],
  ['web', '홈페이지', { ph: '예: www.example.com' }],
  ['biz', '사업자번호', { ph: '000-00-00000', mode: 'numeric' }],
  ['acct', '계좌', { ph: '예: 예시은행 000-000000-00-000 (예금주)', secret: true }],
]
function drawerHtml() {
  const D = st.drawer, c = D.mode === 'edit' ? st.list.find(x => x.id === D.id) : {}
  const cat = D.cat || c.cat || (st.cat !== 'all' ? st.cat : '거래처')
  const sec = (k, label, o = {}) => `<div class="field"><label for="f-${k}">${label}</label><div class="sec-inp"><input class="inp" id="f-${k}" name="${k}" type="${st.shown['f-' + k] ? 'text' : 'password'}" value="${esc(c[k] || '')}" placeholder="${esc(o.ph || '')}" autocomplete="off"><button type="button" class="mini" data-act="ftoggle" data-k="${k}">${st.shown['f-' + k] ? '가리기' : '보기'}</button></div></div>`
  const body = `<div class="field"><span class="lb">분류<span class="req">필수</span></span><div class="opts" role="group" aria-label="분류">${CATS.map(k => `<button type="button" class="ob" data-act="fcat" data-k="${k}" aria-pressed="${cat === k}">${k}</button>`).join('')}</div></div>
    ${fld('name', '업체 이름', c.name, { req: true, ph: '예: 예시메디칼', help: '엑셀로 고칠 때 업체 이름으로 찾아요. 같은 이름의 업체는 하나만 둘 수 있어요.' })}
    ${CFIELDS.map(([k, l, o]) => o.secret ? sec(k, l, o) : fld(k, l, c[k], o)).join('')}
    <div class="f2">${fld('siteId', '사이트 아이디', c.siteId, { ph: '주문·수리 접수 사이트' })}${sec('sitePw', '사이트 비밀번호')}</div>
    <div class="field"><label for="f-memo">업체 메모</label><textarea class="inp" id="f-memo" name="memo" placeholder="예: 주문은 오후 3시 전에">${esc(c.memo || '')}</textarea></div>
    ${D.mode === 'edit' ? '<p class="help">담당자·장비·수리 기록은 자세히 화면에서 줄마다 바로 고쳐요.</p>' : '<p class="help">담당자·장비는 저장한 뒤 자세히 화면에서 더해요.</p>'}`
  const title = D.mode === 'edit' ? '업체 고치기' : '업체 더하기'
  return `<div class="scrim light" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${title}" data-cat="${cat}"><div class="dwh"><h3>${title}</h3><button class="btn icon ghost" data-act="close" aria-label="닫기">${ICON.close}</button></div>
    <form class="dwb" id="cform" onsubmit="return false">${body}</form>
    <div class="dwf"><span class="need" id="need">업체 이름만 꼭 적어요. 나머지는 비워도 돼요.</span><button class="btn" data-act="close">그만두기</button><button class="btn primary" data-act="save-company">저장</button></div></aside>`
}
function dlgHtml() {
  const D = st.dlg
  if (D.kind === 'del-company') {
    const c = st.list.find(x => x.id === D.id)
    const np = (c.people || []).length, ne = (c.equips || []).length, nr = (c.equips || []).reduce((s, e) => s + (e.repairs || []).length, 0)
    const has = [np && `담당자 ${np}명`, ne && `장비 ${ne}대`, nr && `수리 기록 ${nr}줄`].filter(Boolean).join(' · ')
    return `<div class="scrim" data-act="close"></div><div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlgt"><h3 id="dlgt">${esc(c.name)}${eul(c.name)} 지울까요?</h3>
      <p>담당자·장비·수리 기록도 함께 지워져요.</p>${has ? `<p class="sm">이 업체에는 ${has}이 있어요. 지우면 되돌릴 수 없어요.</p>` : '<p class="sm">지우면 되돌릴 수 없어요.</p>'}
      <div class="foot"><button class="btn" data-act="close">그만두기</button><button class="btn danger" data-act="do-del-company">지우기</button></div></div>`
  }
  if (D.kind === 'del-equip') {
    const c = cur(), e = c.equips[D.i], nr = (e.repairs || []).length
    return `<div class="scrim" data-act="close"></div><div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlgt"><h3 id="dlgt">${esc(e.name)}${eul(e.name)} 지울까요?</h3>
      <p>${nr ? `수리 기록 ${nr}줄도 함께 지워져요.` : '이 장비를 주소록에서 지워요.'}</p><p class="sm">지우면 되돌릴 수 없어요.</p>
      <div class="foot"><button class="btn" data-act="close">그만두기</button><button class="btn danger" data-act="do-del-equip">지우기</button></div></div>`
  }
  if (D.kind === 'bad-file') {
    return `<div class="scrim" data-act="close"></div><div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlgt"><h3 id="dlgt">주소록 양식이 아니에요</h3>
      <p class="fname">${ICON.file}거래처정리_최종.xlsx</p>
      <p>이 엑셀에서 주소록 양식의 시트와 칸 이름을 찾지 못했어요. [양식 받기]로 받은 엑셀에 적어서 올려 주세요.</p>
      <p class="sm">시트 이름(연락처·장비)과 첫 줄 칸 이름은 바꾸지 말아 주세요.</p>
      <div class="foot three"><button class="btn" data-act="close">닫기</button><button class="btn" data-act="template">${ICON.download}양식 받기</button><button class="btn primary" data-act="upload">다른 파일 고르기</button></div></div>`
  }
  return ''
}

/* ───────── 그리기: 엑셀 미리 보기 ───────── */

  const byId = id => BASE.find(c => c.id === id)
  const fresh = UP.fresh.map(f => `<div class="uprow"><span><span class="chip accent">새로</span></span><span class="who"><b>${esc(f.name)}</b><small>${esc(f.cat)}</small></span><span class="what">${esc(f.job)}${f.more ? ` · ${esc(f.more)}` : ''}</span></div>`).join('')
  const changed = UP.changed.map(x => { const c = byId(x.id); return `<div class="uprow"><span><span class="chip warn">바뀜</span></span><span class="who"><b>${esc(c.name)}</b><small>${esc(c.cat)}</small></span><span class="what">${x.what.map(w => `<span class="k">${esc(w)}</span>`).join('')}</span></div>` }).join('')

  const same = UP.same.map(id => byId(id).name).join(' · ')
  const notIn = UP.notIn.map(id => byId(id).name).join('·')
  const acts = `<button class="btn" data-act="up-cancel">그만두기</button><button class="btn primary" data-act="up-apply">넣기</button>`
  return `<div class="toolbar"><div class="tl"><h1>엑셀 미리 보기</h1></div><div class="tools up">${acts}</div></div>
    <p class="upfile">${ICON.file}<span>${esc(UP.file)}</span><span class="mut">${esc(UP.sheets)}</span></p>
    <div class="upsum">
      <div><p class="l">새로</p><p class="v">${UP.fresh.length}<small>곳</small></p></div>
      <div><p class="l">바뀜</p><p class="v">${UP.changed.length}<small>곳</small></p></div>
      <div><p class="l">그대로</p><p class="v">${UP.same.length}<small>곳</small></p></div>
      <div class="bad"><p class="l">${ICON.warn}넣지 않는 줄</p><p class="v">${UP.bad.length}<small>줄</small></p></div>
    </div>
    <p class="rules">업체 이름이 같으면 고치고, 새 업체는 더해요. 엑셀에 없는 업체는 그대로 두고, 엑셀의 빈 칸은 지금 값을 지우지 않아요. 엑셀로는 아무것도 지우지 않아요. 수리 기록은 엑셀로 넣지 않아요(화면에서 장비마다 더해요).</p>
    <section class="upsec"><div class="sh"><h3>새로 더할 업체<span class="n">${UP.fresh.length}</span></h3></div>${fresh}</section>
    <section class="upsec"><div class="sh"><h3>바뀌는 업체<span class="n">${UP.changed.length}</span></h3><p>바뀌는 칸만 보여 줘요</p></div>${changed}</section>
    <section class="upsec"><div class="sh"><h3>넣지 않는 줄<span class="n">${UP.bad.length}</span></h3><p>이 줄만 빼고 나머지는 넣을 수 있어요</p></div>${bad}</section>
    <section class="upsec"><div class="sh"><h3>그대로인 업체<span class="n">${UP.same.length}</span></h3></div>
      <details class="same"><summary>그대로인 업체 ${UP.same.length}곳 보기</summary><p>${esc(same)}</p></details>
      <p class="rules">엑셀에 없는 업체 ${UP.notIn.length}곳(${esc(notIn)})도 그대로 둬요.</p></section>
    <div class="upbar"><p>새로 ${UP.fresh.length}곳을 더하고 ${UP.changed.length}곳을 고쳐요. 넣지 않는 줄 ${UP.bad.length}개는 빼요.</p>${acts}</div>`
}

/* ───────── 그리기: 대시보드(잘라 보기) ───────── */
function dashHtml() {
  const lines = alertLines()
  const note = lines.length ? `<div class="wnote mark-new" role="status" aria-label="무상 수리 알림">${lines.slice(0, 3).map(l => `<a class="wn" href="?s=detail&c=${l.id}">${ICON.wrench}<span class="wt">${esc(l.eq)} 무상 수리 <b>${l.d === 0 ? '오늘 끝나요' : `${l.d}일 남음`}</b> · ${esc(l.company)}</span><span class="go"><span>주소록에서 보기</span>${ICON.right}</span></a>`).join('')}${lines.length > 3 ? `<a class="wn" href="?s=list">${ICON.wrench}<span class="wt">무상 수리가 곧 끝나는 장비가 ${lines.length - 3}개 더 있어요</span><span class="go"><span>주소록에서 보기</span>${ICON.right}</span></a>` : ''}</div>` : ''
  const tag = '<span class="mark-tag">새로 생기는 줄</span>'
  if (!st.dashOn) {
    return `<p class="dline"><b>11월 21일 토요일</b></p>${note}${tag}
      <h1 class="big">비트 PC를 연결하면 오늘 숫자가 여기에 채워져요</h1>
      <p class="dlead">아직 받은 진료 자료가 없어 오늘 분석이 비어 있어요. 연결은 처음 한 번만 하면 되고, 연결한 뒤에는 이 화면에 오늘 숫자와 보고 문장이 채워져요.</p>
      <div style="margin-top:24px"><a class="btn primary lg" href="#">비트 PC 연결 시작${ICON.arrow}</a></div>
      <p class="cut">여기부터 아래(연결 순서 · 연결하면 바로 쓸 수 있어요 · 오늘 하루 분석 · 기능 목차)는 지금 대시보드 그대로예요</p>`
  }
  const K = [['오늘 환자 수', '86', '명', '오늘 지금까지'], ['신환', '12', '명'], ['90일초진', '9', '명'], ['재진', '74', '명', '90일초진 포함'], ['물리치료', '41', '명'], ['지난주 같은 요일보다', '–', '', '오늘 진료가 끝나면 비교해요']]
  return `<div class="dh-head"><h1>대시보드</h1><span class="chip pos">비트에서 읽은 숫자</span><span class="dh-when">${ICON.clock}<span>비트에서 읽은 시각 오늘 오전 10:32</span></span><span class="dh-sp"><button class="btn sm">비트에서 다시 읽기</button></span></div>
    ${note}${tag}
    <section class="dsec"><div class="dsh"><h2>오늘 하루 분석</h2><div class="scope"><span class="cap">일별 현황 기준일</span><span class="srow"><button class="step" aria-label="이전 날">${ICON.left}</button><span class="datebox">11월 21일 토요일${ICON.chev}</span><button class="step" aria-label="다음 날" disabled>${ICON.right}</button></span></div></div>
      <div class="kpis">${K.map(k => `<div class="kpi"><p class="l">${k[0]}</p><p class="v" ${k[1] === '–' ? 'style="font-size:20px;color:var(--muted)"' : ''}>${k[1]}${k[2] ? `<small>${k[2]}</small>` : ''}</p>${k[3] ? `<p class="e">${k[3]}</p>` : ''}</div>`).join('')}</div></section>
    <p class="cut">여기부터 아래(보고 문장 · AI 요약 · 기간별 흐름 · 바로 가기 · 기능 목차)는 지금 대시보드 그대로예요</p>`
}

/* ───────── 누름 ───────── */
let toastT
function toast(msg) { const t = $('#toast'); t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => { t.textContent = '' }, 3200) }
function writeClip(v) { try { navigator.clipboard?.writeText(v)?.catch(() => {}) } catch (e) {} }
function flash(el, html) {
  if (el._t) clearTimeout(el._t); else el._orig = el.innerHTML
  el.innerHTML = html; el.classList.add('done')
  el._t = setTimeout(() => { el.innerHTML = el._orig; el.classList.remove('done'); el._t = null }, 1600)
}
function formVals(form) { const o = {}; form.querySelectorAll('[name]').forEach(i => { o[i.name] = i.value.trim() }); return o }
function showErr(form, name, msg) { const p = form.querySelector(`[data-err="${name}"]`); const i = form.querySelector(`[name="${name}"]`); if (p) { p.textContent = msg; p.hidden = false } if (i) { i.setAttribute('aria-invalid', 'true'); i.focus() } }
function rerender(keepScroll = true) { const y = window.scrollY; render(); if (keepScroll) window.scrollTo(0, y) }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]')
  if (!t) return
  const act = t.dataset.act
  const c = cur()
  switch (act) {
    case 'cat': st.cat = t.dataset.k; rerender(); break
    case 'clear': st.q = ''; rerender(); $('#q')?.focus(); break
    case 'pick':
      if (st.sel !== t.dataset.id) st.shown = {}
      st.sel = t.dataset.id; st.inline = null
      rerender()
      break
    case 'call': e.preventDefault(); toast('터치 기기에서는 누르면 이 번호로 바로 전화가 걸려요. (시안이라 걸지 않아요)'); break
    case 'ext': e.preventDefault(); toast('홈페이지가 새 탭으로 열려요. (시안이라 열지 않아요)'); break
    case 'copy-num': writeClip(t.dataset.v); flash(t, `<span class="v">${esc(t.dataset.v)}</span><span class="cpk">${ICON.check}복사했어요</span>`); break
    case 'copy': writeClip(t.dataset.v); flash(t, `${ICON.check}복사했어요`); break
    case 'toggle': st.shown[t.dataset.k] = !st.shown[t.dataset.k]; rerender(); break
    case 'template': toast('주소록-양식.xlsx를 받았어요.'); break
    case 'upload': st.dlg = null; st.drawer = null; st.page = 'upload'; render(); window.scrollTo(0, 0); break
    case 'up-cancel': st.page = 'contacts'; render(); window.scrollTo(0, 0); break
    case 'up-apply': if (!st.list.some(x => x.id === 'rehab')) applyUpload(st.list); st.notice = { fresh: 5, changed: 3, bad: 3 }; st.page = 'contacts'; st.sel = null; render(); window.scrollTo(0, 0); break
    case 'notice-close': st.notice = null; rerender(); break
    case 'new': st.drawer = { mode: 'new' }; st.shown = {}; rerender(); setTimeout(() => $('#f-name')?.focus(), 0); break
    case 'edit': st.drawer = { mode: 'edit', id: st.sel }; rerender(); break
    case 'close': st.drawer = null; st.dlg = null; rerender(); break
    case 'fcat': { const d = t.closest('.drawer'); d.querySelectorAll('[data-act="fcat"]').forEach(b => b.setAttribute('aria-pressed', String(b === t))); d.dataset.cat = t.dataset.k; break }
    case 'ftoggle': { const i = $('#f-' + t.dataset.k); const on = i.type === 'password'; i.type = on ? 'text' : 'password'; t.textContent = on ? '가리기' : '보기'; break }
    case 'save-company': {
      const form = $('#cform'), v = formVals(form), d = t.closest('.drawer') || $('.drawer')
      if (!v.name) { showErr(form, 'name', '업체 이름을 적어 주세요.'); $('#need').textContent = '업체 이름을 적으면 저장할 수 있어요.'; $('#need').classList.add('err'); break }
      const dup = st.list.find(x => x.name === v.name && x.id !== st.drawer.id)
      if (dup) { showErr(form, 'name', '같은 이름의 업체가 이미 있어요.'); break }
      v.cat = d.dataset.cat
      if (st.drawer.mode === 'edit') { const x = st.list.find(y => y.id === st.drawer.id); for (const k of Object.keys(v)) x[k] = v[k] }
      else { const id = 'n' + Date.now(); st.list.push({ id, ...v, people: [], equips: [] }); st.sel = id; st.cat = 'all'; st.q = '' }
      st.drawer = null; rerender(); toast('저장했어요.'); break
    }
    case 'del-company': st.dlg = { kind: 'del-company', id: st.sel }; rerender(); break
    case 'do-del-company': { const x = st.list.find(y => y.id === st.dlg.id); st.list = st.list.filter(y => y.id !== st.dlg.id); st.dlg = null; st.sel = null; render(); toast(`${x.name}${eul(x.name)} 지웠어요.`); break }
    case 'add-person': st.inline = { kind: 'person', i: null }; rerender(); break
    case 'edit-person': st.inline = { kind: 'person', i: +t.dataset.i }; rerender(); break
    case 'add-equip': st.inline = { kind: 'equip', i: null }; rerender(); break
    case 'edit-equip': st.inline = { kind: 'equip', i: +t.dataset.i }; rerender(); break
    case 'add-repair': st.inline = { kind: 'repair', eq: +t.dataset.eq, i: null }; rerender(); break
    case 'edit-repair': st.inline = { kind: 'repair', eq: +t.dataset.eq, i: +t.dataset.i }; rerender(); break
    case 'inline-cancel': st.inline = null; rerender(); break
    case 'save-person': case 'save-equip': case 'save-repair': {
      const form = t.closest('form'), v = formVals(form), I = st.inline
      if (I.kind === 'person') { if (!v.name) { showErr(form, 'name', '이름을 적어 주세요.'); break } c.people = c.people || []; I.i == null ? c.people.push(v) : (c.people[I.i] = v) }
      if (I.kind === 'equip') { if (!v.name) { showErr(form, 'name', '장비 이름을 적어 주세요.'); break } c.equips = c.equips || []; if (I.i == null) c.equips.push({ ...v, repairs: [] }); else Object.assign(c.equips[I.i], v) }
      if (I.kind === 'repair') {
        if (!v.what) { showErr(form, 'what', '내용을 적어 주세요.'); break }
        const cost = v.cost.replace(/[^0-9]/g, ''); const r = { date: v.date || TODAY, what: v.what, cost: cost ? Number(cost) : null }
        const reps = c.equips[I.eq].repairs; I.i == null ? reps.push(r) : (reps[I.i] = r); reps.sort((a, b) => b.date.localeCompare(a.date))
      }
      st.inline = null; rerender(); toast('저장했어요.'); break
    }
    case 'del-person': c.people.splice(st.inline.i, 1); st.inline = null; rerender(); toast('담당자를 지웠어요.'); break
    case 'del-repair': c.equips[st.inline.eq].repairs.splice(st.inline.i, 1); st.inline = null; rerender(); toast('수리 기록을 지웠어요.'); break
    case 'del-equip': st.dlg = { kind: 'del-equip', i: st.inline.i }; rerender(); break
    case 'do-del-equip': { const nm = c.equips[st.dlg.i].name; c.equips.splice(st.dlg.i, 1); st.dlg = null; st.inline = null; rerender(); toast(`${nm}${eul(nm)} 지웠어요.`); break }
  }
})
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return
  const pos = e.target.selectionStart
  st.q = e.target.value
  rerender()
  const i = $('#q'); i.focus(); try { i.setSelectionRange(pos, pos) } catch (err) {}
})
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (st.drawer || st.dlg)) { st.drawer = null; st.dlg = null; rerender() } })
window.addEventListener('resize', () => { if (setMode()) render() })
setMode(); render()
</script>
</body>
</html>
