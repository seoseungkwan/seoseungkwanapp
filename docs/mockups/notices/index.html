<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고시·공지 시안</title>
<!--
  '고시·공지' 탭(/notices) 시안. 결정은 notes.md, 정한 것은 고시·공지 인터뷰(2026-11-21).
  ?s=list(기본, 관련 글만) · all(전체) · detail(글 열기) · detail-mohw(본문만 요약한 글) · ask(AI에게 묻기) · ask-blocked(환자 정보 막음)
     · ask-answer(답) · ask-limit(오늘 다 씀) · weekly(주간 모음) · search-empty(찾기 결과 없음) · backfill(처음 채우는 중)
     · stopped(한 곳 못 가져옴) · dashboard(대시보드 새 칸·맨 위 경고)
  색·크기는 앱 토큰(src/app/globals.css :root)과 탭 줄(src/components/shell/TabBar.tsx) 그대로. 글 제목·번호·요약·숫자는 모두 지어낸 예시다. 환자 자료는 없다. 어디로도 보내지 않는다.
  화면 글자는 아래 T(앱 글자)에 모았다. 시안 표시(.mhead·.anno)는 앱 글자가 아니다.
-->
<style>
@font-face{font-family:'Pretendard';font-weight:400;src:url(../../../src/app/fonts/Pretendard-Regular.subset.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:500;src:url(../../../src/app/fonts/Pretendard-Medium.subset.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:600;src:url(../../../src/app/fonts/Pretendard-SemiBold.subset.woff2) format('woff2')}
:root {
  --canvas: #F7F8FA; --surface: #FFFFFF; --line: #E5E7EB; --line-strong: #D1D5DB; --faint: #9CA3AF;
  --muted: #6B7280; --ink-2: #374151; --ink: #111827; --accent: #2563EB; --accent-strong: #1D4ED8; --accent-soft: #EAF1FE;
  --positive: #15803D; --positive-soft: #ECF7EF; --negative: #C2410C; --negative-soft: #FDF0EA;
  --warning: #B45309; --warning-soft: #FDF4E3;
  --r: 4px; --r-float: 8px;
  --float: 0 1px 2px rgb(17 24 39 / .06), 0 6px 16px rgb(17 24 39 / .1);
  --ui: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--ink); font: 14px/22px var(--ui); word-break: keep-all; font-variant-numeric: tabular-nums; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
svg { flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* 시안 머리(앱 밖) */
.mhead { background: #E9ECF0; border-bottom: 1px solid var(--line-strong); }
.mhead-in { max-width: 1280px; margin: 0 auto; padding: 12px 24px; display: grid; gap: 8px; }
.mhead b { color: var(--ink); font-size: 15px; }
.mhead .ex { margin-left: 6px; padding: 1px 7px; border-radius: 4px; background: #FEF3C7; color: #92400E; font-size: 12px; font-weight: 600; }
.mhead .mnote { font-size: 13px; color: var(--muted); }
.switch { display: flex; flex-wrap: wrap; gap: 4px; }
.switch a { padding: 3px 10px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.switch a[aria-current="true"] { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
.anno { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border: 1px dashed #A78BFA; border-radius: 999px; background: #F5F3FF; color: #6D28D9; font-size: 11px; font-weight: 600; white-space: nowrap; }

/* 앱 머리 · 탭 줄 (AppShell·TabBar 그대로) */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1280px; margin: 0 auto; height: 56px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; font-size: 16px; font-weight: 600; color: var(--ink); }
.brand span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-r { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.acct { height: 32px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r); display: inline-flex; align-items: center; color: var(--ink-2); font-weight: 500; }
nav.tabs { background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs-in { max-width: 1280px; margin: 0 auto; display: flex; }
.strip { flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: thin; }
.row-t { display: flex; width: max-content; min-width: 100%; padding: 0 24px; }
.row-t > :first-child { margin-left: -12px; }
.tab, .more { position: relative; height: 44px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--ink-2); font-weight: 500; }
.tab[aria-current="page"] { color: var(--ink); font-weight: 600; }
.tab[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; background: var(--accent); }
.more { flex: none; gap: 4px; margin-right: 12px; }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; line-height: 18px; font-weight: 600; text-align: center; }

/* 본문 */
main { max-width: 1280px; margin: 0 auto; padding: 24px 24px 48px; }
main > * { min-width: 0; }

/* 공통 모양 (classes.ts ds 옮김) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 500; white-space: nowrap; transition: background-color .15s; }
.btn:hover { background: var(--canvas); }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn.pri { border-color: transparent; background: var(--accent); color: #fff; }
.btn.pri:hover { background: var(--accent-strong); }
.btn.outline { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.btn.outline:hover { background: var(--accent-soft); }
.btn.ghost { border-color: transparent; color: var(--ink-2); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn[aria-pressed="true"].star { border-color: #F59E0B; background: #FFFBEB; color: #92400E; }
.txt { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-weight: 500; text-underline-offset: 3px; }
.txt:hover { text-decoration: underline; }
.txt.sm { font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border: 1px solid transparent; border-radius: var(--r); font-size: 12px; font-weight: 500; white-space: nowrap; }
.chip.n { border-color: var(--line); background: var(--canvas); color: var(--ink-2); }
.chip.a { background: var(--accent-soft); color: var(--accent-strong); }
.chip.p { background: var(--positive-soft); color: var(--positive); }
.chip.w { background: var(--warning-soft); color: var(--warning); }
.chip.ng { background: var(--negative-soft); color: var(--negative); }
.panel { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); min-width: 0; }
.muted { color: var(--muted); }
.help { font-size: 12px; line-height: 18px; color: var(--muted); }
.input { height: 44px; width: 100%; min-width: 0; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); color: var(--ink); }
.input::placeholder, .area::placeholder { color: var(--muted); }
.input:focus-visible, .area:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.area { display: block; width: 100%; min-width: 0; min-height: 88px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); color: var(--ink); resize: vertical; line-height: 22px; }
.area[aria-invalid="true"] { border-color: var(--negative); }
.area[disabled] { background: var(--canvas); color: var(--muted); cursor: not-allowed; }

/* 쪽 머리 */
.phead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; }
.phead h1 { font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -.01em; }
.phead .lede { margin-top: 4px; font-size: 14px; color: var(--ink-2); }
.subtabs { margin-top: 16px; display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.subtabs a { position: relative; height: 40px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.subtabs a:first-child { margin-left: -12px; }
.subtabs a[aria-current="page"] { color: var(--ink); font-weight: 600; }
.subtabs a[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--accent); }

/* 고르기 줄 */
.filters { margin-top: 16px; display: grid; gap: 12px; }
.frow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r); overflow: hidden; background: var(--surface); flex: none; }
.seg button { height: 34px; padding: 0 14px; font-size: 13px; font-weight: 500; color: var(--ink-2); border-left: 1px solid var(--line-strong); transition: background-color .15s; }
.seg button:first-child { border-left: 0; }
.seg button:hover { background: var(--canvas); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
.tog { height: 36px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--ink-2); background: var(--surface); white-space: nowrap; }
.tog[aria-pressed="true"] { border-color: #F59E0B; background: #FFFBEB; color: #92400E; font-weight: 600; }
.search { margin-left: auto; display: flex; gap: 8px; flex: 1 1 360px; max-width: 460px; min-width: 0; }
.search .box { position: relative; flex: 1; min-width: 0; }
.search .box svg { position: absolute; left: 12px; top: 14px; color: var(--muted); pointer-events: none; }
.search .input { height: 36px; padding-left: 36px; }
.search .btn { height: 36px; }
.srcs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.srcs .flab { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-right: 4px; }
.src { height: 30px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; color: var(--ink-2); background: var(--surface); white-space: nowrap; }
.src[aria-pressed="true"] { border-color: transparent; background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
.src[aria-pressed="false"] svg { visibility: hidden; width: 0; margin-left: -4px; }
.checked { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 14px; font-size: 12px; line-height: 18px; color: var(--muted); }
.checked .lead { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); font-weight: 500; }
.checked b { font-weight: 500; color: var(--ink-2); }
.checked .bad, .checked .bad b { color: var(--warning); font-weight: 600; }

/* 알림 띠 */
.note { margin-top: 16px; display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border-radius: var(--r); font-size: 13px; line-height: 20px; }
.note > svg { margin-top: 2px; }
.note b { display: block; font-size: 14px; line-height: 22px; font-weight: 600; color: var(--ink); }
.note p { color: var(--ink-2); }
.note .acts { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.note.warn { background: var(--warning-soft); }
.note.warn > svg { color: var(--warning); }
.note.info { background: var(--accent-soft); }
.note.info > svg { color: var(--accent-strong); }
.note.ng { background: var(--negative-soft); }
.note.ng > svg { color: var(--negative); }
.note .grow { flex: 1; min-width: 0; }
.prog { margin-top: 8px; display: flex; align-items: center; gap: 10px; }
.prog .bar { flex: 1; max-width: 420px; height: 8px; border-radius: 4px; background: #fff; overflow: hidden; box-shadow: inset 0 0 0 1px #C7D7F8; }
.prog .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.prog span { font-size: 13px; font-weight: 600; color: var(--accent-strong); white-space: nowrap; }

/* 목록 */
.lhead { margin-top: 20px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; padding-bottom: 8px; border-bottom: 1px solid var(--line-strong); }
.lhead .cnt { font-size: 13px; color: var(--ink-2); }
.lhead .cnt b { color: var(--ink); font-weight: 600; }
.lhead .help { max-width: 52ch; }
.list > li.month { padding: 14px 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); }
.item { display: grid; grid-template-columns: minmax(0, 1fr) 44px; align-items: start; border-bottom: 1px solid var(--line); transition: background-color .15s; }
.item:hover { background: var(--canvas); }
.ilink { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 0 12px; padding: 14px 0 14px 8px; min-width: 0; }
.idate { font-size: 13px; line-height: 22px; color: var(--muted); white-space: nowrap; }
.ibody { position: relative; min-width: 0; display: grid; gap: 4px; }
.ititle { display: block; font-size: 15px; line-height: 23px; color: var(--ink); font-weight: 400; }
.ititle .dot { position: absolute; left: -14px; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

.item.unread .ititle { font-weight: 600; }
.item:not(.unread) .ititle .dot { visibility: hidden; }
.iline { font-size: 13px; line-height: 20px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iline.wait { color: var(--muted); }
.imeta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12px; line-height: 20px; color: var(--muted); }
.imeta .srcl { color: var(--ink-2); font-weight: 500; }
.imeta .d2 { display: none; }
.istar { height: 52px; display: grid; place-items: center; color: var(--faint); border-radius: var(--r); }
.istar:hover { color: #B45309; }
.istar[aria-pressed="true"] { color: #F59E0B; }
.lmore { margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.empty { padding: 40px 16px; text-align: center; display: grid; justify-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
.empty b { font-size: 16px; line-height: 24px; color: var(--ink); font-weight: 600; }
.empty p { max-width: 46ch; color: var(--ink-2); font-size: 14px; }
.empty .acts { margin-top: 8px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

/* 글 열기 */
.back { display: inline-flex; align-items: center; gap: 4px; height: 32px; color: var(--ink-2); font-weight: 500; }
.back:hover { color: var(--ink); }
.dgrid { margin-top: 8px; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px 32px; align-items: start; }
.dmain { display: grid; gap: 16px; min-width: 0; }
.dside { display: grid; gap: 16px; min-width: 0; }
.dhead { display: grid; gap: 8px; padding-bottom: 16px; border-bottom: 1px solid var(--line-strong); }
.dmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 13px; color: var(--muted); }
.dmeta .srcl { color: var(--ink-2); font-weight: 600; }
.dtitle { font-size: 22px; line-height: 31px; font-weight: 600; letter-spacing: -.01em; color: var(--ink); }
.dsub { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13px; color: var(--ink-2); }
.dacts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.rule { padding: 16px 20px; border-radius: var(--r); background: var(--warning-soft); border: 1px solid #F3D9A8; display: grid; gap: 10px; }
.rule h2 { display: flex; gap: 8px; align-items: flex-start; font-size: 15px; line-height: 23px; font-weight: 600; color: #78350F; }
.rule h2 svg { color: var(--warning); margin-top: 3px; }
.rule p { font-size: 13px; line-height: 20px; color: var(--ink-2); }
.rule ul { display: grid; gap: 4px; }
.rule li { display: flex; gap: 8px; align-items: baseline; padding: 6px 10px; border-radius: var(--r); background: rgb(255 255 255 / .7); font-size: 14px; color: var(--ink); font-weight: 500; }
.rule li small { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: auto; white-space: nowrap; }
.rule .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.rule.done { background: var(--canvas); border-color: var(--line); }
.rule.done h2 { color: var(--ink-2); }
.rule.done h2 svg { color: var(--positive); }
.sum { padding: 20px; display: grid; gap: 14px; }
.sh { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.sh h2 { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.sh h2 svg { color: var(--accent); }
.sh .right { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; }
.three { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px 16px; }
.three dt { font-size: 13px; line-height: 23px; font-weight: 600; color: var(--muted); }
.three dd { font-size: 15px; line-height: 23px; color: var(--ink); }
.ours { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 4px 16px; padding: 12px 14px; border-radius: var(--r); background: var(--accent-soft); }
.ours b { font-size: 13px; line-height: 23px; color: var(--accent-strong); font-weight: 600; }
.ours span { font-size: 15px; line-height: 23px; color: var(--ink); font-weight: 600; }
.caution { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; line-height: 18px; color: var(--muted); }
.caution svg { margin-top: 1px; color: var(--muted); }
.files { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 10px; }
.files .frow2 { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.files ul { display: grid; gap: 2px; }
.files li a { display: flex; gap: 8px; align-items: center; min-height: 32px; color: var(--accent); font-weight: 500; overflow-wrap: anywhere; }
.files li a:hover { text-decoration: underline; text-underline-offset: 3px; }
.files li a svg { color: var(--muted); }
.ask { padding: 20px; display: grid; gap: 12px; }
.ask .lede { font-size: 14px; color: var(--ink-2); }
.pii { display: flex; gap: 8px; align-items: flex-start; padding: 8px 12px; border-radius: var(--r); background: var(--warning-soft); font-size: 13px; line-height: 20px; font-weight: 600; color: #78350F; }
.pii svg { margin-top: 2px; color: var(--warning); }
.ask .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ask .acts .left { margin-left: auto; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.ask .acts .left b { font-weight: 600; color: var(--ink); }
.block { margin: 0; }
.qa { display: grid; gap: 10px; }
.ques { padding: 10px 14px; border-radius: var(--r); background: var(--canvas); }
.ques small, .ans small { display: block; font-size: 12px; line-height: 18px; font-weight: 600; color: var(--muted); }
.ques p { color: var(--ink); }
.ans { padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); border-radius: 0 var(--r) var(--r) 0; display: grid; gap: 8px; }
.ans p { font-size: 15px; line-height: 24px; color: var(--ink); }
.ans p.caution { font-size: 12px; line-height: 18px; color: var(--muted); }
.ans .acts2 { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.sblock { padding: 16px 20px; display: grid; gap: 10px; }
.sblock h2 { font-size: 15px; line-height: 23px; font-weight: 600; color: var(--ink); }
.memo .area { min-height: 104px; }
.memo .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.memo .saved { font-size: 12px; color: var(--muted); }
.origin li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.origin li:last-child { border-bottom: 0; }
.origin li b { font-weight: 600; color: var(--ink); }
.origin li span { color: var(--muted); white-space: nowrap; }

/* 주간 모음 */
.wtool { margin-top: 16px; max-width: 880px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }

if (S === 'stopped') { byId('n218').src = ['심평원 심사기준']; N.splice(N.findIndex((n) => n.id === 'u1'), 1) }
if (V.open) byId(V.open).unread = false

function badgeCount() { return N.filter((n) => n.rel && n.unread).length }

function renderTabs() {
  const here = S === 'dashboard' ? '대시보드' : '고시·공지'
  const TABS = ['대시보드', '통계', '청구', '고시·공지', '환자', '업무일지', '수납일지', '예약']
  const n = badgeCount()
  document.getElementById('tabs').innerHTML = TABS.map((t) => {
    const cur = t === here ? 'aria-current="page"' : ''
    const b = t === '고시·공지' && n > 0 ? `<span class="badge" aria-hidden="true">${n}</span><span class="sr">${T.badgeLabel(n)}</span>` : ''
    const go = t === '고시·공지' ? '?s=list' : t === '대시보드' ? '?s=dashboard' : '#'
    return `<a class="tab" href="${go}" ${cur}>${t}${b}</a>`
  }).join('')
}

/* ───────── 부품 ───────── */
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

function pageHead(sub) {
  return `<div class="phead"><div><h1>${T.h1}</h1><p class="lede">${T.lede}</p></div></div>
  <nav class="subtabs" aria-label="${T.h1}">
    <a href="?s=list" ${sub === 'list' ? 'aria-current="page"' : ''}>${T.subList}</a>
    <a href="?s=weekly" ${sub === 'weekly' ? 'aria-current="page"' : ''}>${T.subWeekly}</a>
  </nav>`
}

function checkedLine(stopped) {
  const items = CHECK.map(([src, t]) => {
    if (stopped && src === STOPPED) return `<span class="bad">${T.checkedBad(src)}</span>`
    return `<span>${T.checkedOk(`<b>${src}</b>`, t)}</span>`
  }).join('')
  return `<p class="checked"><span class="lead">${I.clock}${T.checkedLead}</span>${items}</p>`
}

function filters(stopped) {
  return `<div class="filters">
    <div class="frow">
      <div class="seg" role="group" aria-label="보기">
        <button data-act="rel" aria-pressed="${V.rel}">${T.segRel}</button><button data-act="all" aria-pressed="${!V.rel}">${T.segAll}</button>
      </div>
      <button class="tog" data-act="staronly" aria-pressed="${V.starOnly}">${I.star(V.starOnly)}${T.starOnly}</button>
      <form class="search" role="search" data-act="search">
        <label class="box"><span class="sr">${T.searchLabel}</span>${I.search}<input class="input" name="q" value="${esc(V.q)}" placeholder="${T.searchPh}"></label>
        <button class="btn" type="submit">${T.searchBtn}</button>
      </form>
    </div>
    <div class="srcs" role="group" aria-label="${T.srcLabel}"><span class="flab">${T.srcLabel}</span>
      ${T.sources.map((s) => `<button class="src" data-act="src" data-src="${s}" aria-pressed="${!V.srcOff.has(s)}">${I.check}${s}</button>`).join('')}
    </div>
    ${checkedLine(stopped)}
  </div>`
}

function chips(n) {
  const c = []
  if (n.rel === null) c.push(`<span class="chip n">${T.chipWait}</span>`)
  if (n.rel) c.push(`<span class="chip a">${T.chipRel}</span>`)
  if (n.rules && !n.ruleDone) c.push(`<span class="chip w">${T.chipRule}</span>`)
  if (n.rules && n.ruleDone) c.push(`<span class="chip n">${T.chipRuleDone}</span>`)
  if (n.files && n.files.length) c.push(`<span class="chip n">${T.chipFiles(n.files.length)}</span>`)
  return c.join('')
}

function item(n) {
  const to = n.id === 'n214' ? '?s=detail-mohw' : '?s=detail'
  const line = n.rel === null ? `<span class="iline wait">${T.waitLine}</span>` : `<span class="iline">${n.line}</span>`
  return `<li class="item ${n.unread ? 'unread' : ''}" data-id="${n.id}">
    <a class="ilink" href="${to}">
      <span class="idate">${n.d}</span>
      <span class="ibody">
        <span class="ititle"><span class="dot" aria-hidden="true"></span><span class="t">${n.unread ? `<span class="sr">${T.unreadSr} </span>` : ''}${n.title}</span></span>
        ${line}
        <span class="imeta"><span class="d2">${n.d}</span><span class="srcl">${n.src.join(' · ')}</span>${n.no ? `<span>${n.no}</span>` : ''}${chips(n)}</span>
      </span>
    </a>
    <button class="istar" data-act="star" data-id="${n.id}" aria-pressed="${n.star}" aria-label="${n.star ? T.starOn : T.starOff}">${I.star(n.star)}</button>
  </li>`
}

function matches(n, q) {
  const hay = `${n.title} ${n.line || ''} ${n.text || ''} ${n.s1 || ''} ${n.ours || ''}`
  return q.split(/\s+/).filter(Boolean).every((w) => hay.includes(w))
}

function listBody(extraOld) {
  let rows = N.filter((n) => (V.rel ? n.rel : true))
  if (extraOld) rows = rows.concat(OLD)
  rows = rows.filter((n) => n.src.some((s) => !V.srcOff.has(s)))
  if (V.starOnly) rows = rows.filter((n) => n.star)
  const searching = V.q.trim() !== ''
  if (searching) rows = rows.filter((n) => matches(n, V.q.trim()))
  const unread = rows.filter((n) => n.unread).length
  const cnt = searching ? T.cntFound(rows.length) : V.rel ? T.cntRel(extraOld ? 318 : 318, 2) : T.cntAll('1,184', 5)
  const help = searching ? '' : V.rel ? T.relHelp : T.allHelp
  let body
  if (rows.length === 0 && searching) {
    body = `<div class="empty" role="status"><b>${T.emptyTitle(esc(V.q.trim()))}</b><p>${T.emptyBody}${V.rel ? ` ${T.emptyRelNote}` : ''}</p>
      <div class="acts">${V.rel ? `<button class="btn outline" data-act="all">${T.emptyAllBtn}</button>` : ''}<button class="btn" data-act="clear">${T.emptyClear}</button></div></div>`
  } else if (rows.length === 0 && V.starOnly) {
    body = `<div class="empty" role="status"><b>${T.starEmptyTitle}</b><p>${T.starEmptyBody}</p></div>`
  } else {
    let lastM = ''
    body = '<ul class="list">' + rows.map((n) => {
      const head = n.m !== lastM ? `<li class="month" aria-hidden="true">${n.m}</li>` : ''
      lastM = n.m
      return head + item(n)
    }).join('') + '</ul>'
    if (!searching && !V.starOnly) body += `<div class="lmore"><button class="btn">${T.moreBtn}</button><span class="help">${T.listFoot}</span></div>`
  }
  void unread
  return `<div class="lhead"><span class="cnt">${cnt}</span>${help ? `<span class="help">${help}</span>` : ''}</div>${body}`
}

function listPage() {
  const stopped = S === 'stopped'
  const backfill = S === 'backfill'
  let notes = ''
  if (stopped) notes += `<div class="note warn" role="status">${I.warn}<div class="grow"><b>${T.stoppedTitle(STOPPED)}</b><p>${T.stoppedBody(STOPPED, '11월 19일 (목) 07:03')}</p><div class="acts"><a class="txt sm" href="#">${T.stoppedLink(STOPPED)}${I.ext}</a></div></div></div>`
  if (backfill) notes += `<div class="note info" role="status">${I.clock}<div class="grow"><b>${T.backfillTitle}</b>
      <div class="prog"><span class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="1240" aria-valuenow="530" aria-label="${T.backfillProg('1,240', 530)}"><i style="width:43%"></i></span><span>${T.backfillProg('1,240', 530)} (43%)</span></div>
      <p style="margin-top:6px">${T.backfillBody}</p></div></div>`
  return pageHead('list') + filters(stopped) + notes + listBody(backfill)
}

function ruleBox(n) {
  if (n.ruleDone) {
    return `<section class="rule done" aria-label="${T.ruleDoneTitle(n.rules.length)}"><h2>${I.checkC}<span>${T.ruleDoneTitle(n.rules.length)}</span></h2>
      <ul>${n.rules.map((r) => `<li>${r}</li>`).join('')}</ul><p>${T.ruleDoneWhen(n.ruleWhen)}</p></section>`
  }
  return `<section class="rule" id="rule"><h2>${I.warn}<span>${T.ruleTitle(n.rules.length)}</span></h2><p>${T.ruleBody}</p>
    <ul>${n.rules.map((r) => `<li>${r}</li>`).join('')}</ul>
    <div class="acts"><a class="btn sm" href="#">${T.ruleOpen}${I.arrow}</a><button class="btn sm" data-act="ruledone">${I.check}${T.ruleDoneBtn}</button></div></section>`
}

function summary(n) {
  const label = n.full ? `<span class="chip p">${T.sumFull}</span>` : `<span class="chip n">${T.sumBody}</span>`
  const files = n.files.length
    ? `<div><p class="help" style="font-weight:600;color:var(--ink-2)">${T.filesHead}</p><ul>${n.files.map((f) => `<li><a href="#" target="_blank" rel="noopener">${I.file}<span>${f}</span>${I.ext}</a></li>`).join('')}</ul></div>`
    : `<p class="help">${T.noFiles}</p>`
  return `<section class="panel sum" aria-labelledby="sumh">
    <div class="sh"><h2 id="sumh">${I.spark}${T.sumTitle}</h2>${label}</div>
    ${n.full ? '' : `<p class="help">${T.sumBodyWhy}</p>`}
    <dl class="three"><dt>${T.k1}</dt><dd>${n.s1}</dd><dt>${T.k2}</dt><dd>${n.s2}</dd><dt>${T.k3}</dt><dd>${n.s3}</dd></dl>
    <p class="ours"><b>${T.ours}</b><span>${n.ours}</span></p>
    <p class="caution">${I.info}<span>${T.caution}</span></p>
    <div class="files"><div class="frow2"><a class="btn sm" href="#" target="_blank" rel="noopener">${T.orig}${I.ext}</a><span class="help">${T.filesNote}</span></div>${files}</div>
  </section>`
}

function askBox(n) {
  const lede = n.full ? T.askLede : T.askLedeBody
  const left = `<span class="left">${T.askLeft(V.askLeft)}</span>`
  if (!V.ask) {
    return `<section class="panel ask" aria-labelledby="askh"><div class="sh"><h2 id="askh">${T.askTitle}</h2><span class="right">${T.askLeft(V.askLeft)}</span></div>
      <p class="lede">${lede}</p><div><a class="btn outline" href="?s=ask">${T.askOpen}</a></div></section>`
  }
  const limit = V.askLeft === 0
  const qa = V.answer ? `<div class="qa"><div class="ques"><small>${T.qLabel}</small><p>${esc(V.answer.q)}</p></div>
      <div class="ans" role="status"><small>${T.aLabel}</small><p>${esc(V.answer.a)}</p><p class="caution">${I.info}<span>${T.aCaution}</span></p>
      <div class="acts2"><button class="btn sm" data-act="tomemo">${T.aToMemo}</button><span class="help">${T.aNotSaved}</span></div></div></div>` : ''
  const blocked = V.blocked ? `<div class="note ng block" role="alert">${I.stop}<div class="grow"><b>${T.askBlockedTitle}</b><p>${T.askBlockedBody(V.blocked.map((k) => T.piiKinds[k]).join('·'))}</p></div></div>` : ''
  const limitNote = limit ? `<div class="note info block" role="status">${I.clock}<div class="grow"><p>${T.askLimit}</p></div></div>` : ''
  return `<section class="panel ask" aria-labelledby="askh" id="ask"><div class="sh"><h2 id="askh">${T.askTitle}</h2></div>
    <p class="lede">${lede}</p>
    ${qa}
    <p class="pii">${I.shield}<span>${T.askPii}</span></p>
    <label><span class="sr">${T.askLabel}</span><textarea class="area" id="askText" placeholder="${T.askPh}" ${V.blocked ? 'aria-invalid="true"' : ''} ${limit ? 'disabled' : ''}>${esc(V.askText)}</textarea></label>
    ${blocked}${limitNote}
    <div class="acts"><button class="btn pri" data-act="send" ${limit ? 'disabled' : ''}>${T.askSend}</button><a class="btn ghost" href="?s=detail">${T.askClose}</a>${left}</div>
    <p class="help">${T.askShared}</p>
  </section>`
}

function memoBox(n) {
  const saved = n.memo ? `<span class="saved">${T.memoSaved(n.memoWhen)}</span>` : '<span class="saved" id="memoSaved"></span>'
  return `<section class="panel sblock memo" aria-labelledby="memoh"><h2 id="memoh">${T.memoTitle}</h2>
    <label><span class="sr">${T.memoTitle}</span><textarea class="area" id="memo" placeholder="${T.memoPh}">${esc(n.memo || '')}</textarea></label>
    <p class="help">${T.memoHelp}</p>
    <div class="acts"><button class="btn sm" data-act="memosave">${T.memoSave}</button>${saved}</div></section>`
}

function originBox(n) {
  return `<section class="panel sblock origin" aria-labelledby="origh"><h2 id="origh">${T.originTitle}</h2>
    <ul>${n.origin.map(([s, d]) => `<li><b>${s}</b><span>${d}</span></li>`).join('')}</ul>
    ${n.origin.length > 1 ? `<p class="help">${T.originNote}</p>` : ''}</section>`
}

function detailPage() {
  const n = byId(V.open)
  return `<a class="back" href="?s=list">${I.left}${T.back}</a>
  <div class="dgrid">
    <article class="dmain">
      <header class="dhead">
        <p class="dmeta"><span class="srcl">${n.src.join(' · ')}</span><span>${T.posted(n.d)}</span></p>
        <h1 class="dtitle">${n.title}</h1>
        <p class="dsub">${n.no ? `<span>${n.no}</span>` : ''}${n.rel ? `<span class="chip a">${T.chipRel}</span>` : ''}</p>
        <div class="dacts"><button class="btn sm star" data-act="dstar" aria-pressed="${n.star}">${I.star(n.star)}<span>${n.star ? T.starBtnOn : T.starBtnOff}</span></button></div>
      </header>
      ${n.rules ? ruleBox(n) : ''}
      ${summary(n)}
      ${askBox(n)}
    </article>
    <aside class="dside">
      ${memoBox(n)}
      ${originBox(n)}
    </aside>
  </div>`
}

function weeklyPage() {
  return pageHead('weekly') + `<div class="wtool">
      <button class="btn sm">${I.left}${T.wPrev}</button><span class="wk">${WEEK.period}</span><button class="btn sm" disabled>${T.wNext}${I.right}</button>
      <span class="sp"></span><button class="btn print" data-act="print">${I.print}${T.wPrint}</button>
    </div>
    <article class="panel sheet">
      <header class="shd"><h2>${T.wSheet}</h2><p><b>${WEEK.period}</b> · ${T.wCount(WEEK.n, WEEK.each.length)}</p><p class="muted">${T.wMade(WEEK.made)} · 샘플정형외과의원</p></header>
      <section><h3>${T.wTop}</h3><ol class="top3">${WEEK.top.map(([b, p], i) => `<li><span class="no">${i + 1}</span><b>${b}</b><p>${p}</p></li>`).join('')}</ol></section>
      <section><h3>${T.wEach} <small class="muted" style="font-size:13px;font-weight:500">${T.wEachCount(WEEK.each.length)}</small></h3><ul class="wlist">${WEEK.each.map(([d, s, t, p, r]) => `<li><span class="wm"><span>${d}</span><b>${s}</b>${r === 'done' ? `<span class="chip n">${T.chipRuleDone}</span>` : ''}</span><span class="wt">${t}</span><p>${p}</p></li>`).join('')}</ul></section>
      <section><h3>${T.wOthers(WEEK.others.length)}</h3><ul class="others">${WEEK.others.map(([d, t]) => `<li><span>${d}</span>${t}</li>`).join('')}</ul></section>
      <p class="caution">${I.info}<span>${T.wCaution}</span></p>
    </article>`
}

function dashboardPage() {
  const news = N.filter((n) => n.rel && n.unread)
  const warnN = N.find((n) => n.rules && !n.ruleDone)
  return `<div class="dwarn" role="status">${I.warn}<span class="grow"><b>${T.dWarnTitle}</b> · ${T.dWarnBody(warnN.rules.length, warnN.no)}</span><a class="txt" href="?s=detail">${T.dWarnLink}${I.arrow}</a><span class="anno">시안: 대시보드 맨 위에 새로 생김</span></div>
    <p class="dline"><b>11월 21일 (토)</b></p>
    <div class="dh dim"><h1>대시보드</h1><span class="chip p">비트에서 읽은 숫자</span><span class="when">오늘 오전 9:18 비트에서 읽음</span></div>
    <div class="dim"><div class="kpis">
      <div class="kpi"><div class="l">오늘 환자 수</div><div class="v">42<small>명</small></div></div>
      <div class="kpi"><div class="l">신환</div><div class="v">6<small>명</small></div></div>
      <div class="kpi"><div class="l">재진</div><div class="v">36<small>명</small></div></div>
      <div class="kpi"><div class="l">지난주 같은 요일보다</div><div class="v" style="font-size:20px">—</div></div>
    </div></div>
    <section class="dsec" aria-labelledby="dnh"><div class="shh"><h2 id="dnh">${T.dCardTitle}</h2><span class="cntb">${T.dCardCount(news.length)}</span><span class="anno">시안: 새 칸</span><span class="sp"></span><a class="txt" href="?s=list">${T.dCardOpen}${I.arrow}</a></div>
      <ul class="panel ncard">${news.slice(0, 3).map((n) => `<li><a href="${n.id === 'n214' ? '?s=detail-mohw' : '?s=detail'}"><span class="nd">${n.d}</span><span class="nt">${n.title}</span><span class="nm"><span>${n.src.join(' · ')}</span>${n.rules && !n.ruleDone ? `<span class="chip w">${T.chipRule}</span>` : ''}</span></a></li>`).join('')}</ul>
    </section>
    <section class="dsec dim"><div class="shh"><h2>우리 병원 AI 경영 리포트</h2></div><div class="ghost-blk">지금 대시보드 그대로 (줄인 모습)</div></section>
    <section class="dsec dim"><div class="shh"><h2>추이</h2></div><div class="ghost-blk">지금 대시보드 그대로 (줄인 모습)</div></section>`
}

/* ───────── 그리기·누름 ───────── */
const app = document.getElementById('app')
function render() {
  renderTabs()
  if (S === 'dashboard') app.innerHTML = dashboardPage()
  else if (S === 'weekly') app.innerHTML = weeklyPage()
  else if (V.open) app.innerHTML = detailPage()
  else app.innerHTML = listPage()
  document.title = (S === 'dashboard' ? '대시보드' : T.tab) + ' 시안'
}

// 환자 정보 모양 거르기(시안용 규칙 — 명세에서 정한다)
function piiKinds(s) {
  const k = []
  if (/\d{6}\s*-\s*[1-8]\d{6}|\b\d{6}[1-8]\d{6}\b/.test(s)) k.push('rrn')
  if (/0\d{1,2}\s*-\s*\d{3,4}\s*-\s*\d{4}|\b01[016789]\d{7,8}\b/.test(s)) k.push('tel')
  if (/(차트|챠트|등록번호|환자번호)\s*(번호)?\s*[:：]?\s*\d{2,}/.test(s)) k.push('chart')
  if (!k.length && /\d{6,}/.test(s.replace(/제?\d{4}-\d{1,4}호/g, ''))) k.push('digits')
  return k
}

app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]')
  if (!el || el.tagName === 'FORM') return
  const act = el.dataset.act
  if (act === 'rel' || act === 'all') { V.rel = act === 'rel'; render(); return }
  if (act === 'staronly') { V.starOnly = !V.starOnly; render(); return }
  if (act === 'clear') { V.q = ''; render(); return }
  if (act === 'src') {
    const s = el.dataset.src
    if (V.srcOff.has(s)) V.srcOff.delete(s); else if (V.srcOff.size < T.sources.length - 1) V.srcOff.add(s)
    render(); return
  }
  if (act === 'star') { const n = byId(el.dataset.id); n.star = !n.star; render(); return }
  if (act === 'dstar') { const n = byId(V.open); n.star = !n.star; render(); return }
  if (act === 'ruledone') {
    const n = byId(V.open); n.ruleDone = true; n.ruleWhen = '11월 21일 (토) 09:20'; render(); return
  }
  if (act === 'memosave') { const s = document.getElementById('memoSaved'); if (s) s.textContent = T.memoSaved('11월 21일 (토) 09:20'); return }
  if (act === 'tomemo') {
    const m = document.getElementById('memo'); m.value = (m.value ? m.value + '\n' : '') + V.answer.a; m.focus(); return
  }
  if (act === 'print') { window.print(); return }
  if (act === 'send') {
    const text = document.getElementById('askText').value
    V.askText = text
    const k = piiKinds(text)
    if (k.length) { V.blocked = k; render(); document.getElementById('ask').scrollIntoView({ block: 'center' }); return }
    if (!text.trim()) return
    V.blocked = null
    V.answer = { q: text, a: '네. 이번 개정은 관절 부위를 나누지 않아서 어깨에도 똑같이 적용돼요. 다만 ‘같은 관절’ 기준이라 무릎과 어깨는 따로 세요. 근거는 붙임1 고시 전문 2쪽 ‘나. 인정 횟수’예요.' }
    V.askText = ''
    V.askLeft = Math.max(0, V.askLeft - 1)
    render(); document.getElementById('ask').scrollIntoView({ block: 'start' }); return
  }
})
app.addEventListener('submit', (e) => {
  const f = e.target.closest('form[data-act="search"]')
  if (!f) return
  e.preventDefault()
  V.q = new FormData(f).get('q') || ''
  render()
})
render()
</script>
