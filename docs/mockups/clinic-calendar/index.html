<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>예약 탭 시안</title>
<!--
  예약 탭(clinic-calendar) 시안. 의원 공용 구글 캘린더를 대신하는 예약표. 결정·기본값은 notes.md.
  ?s=week(기본) · day · month · summary · new · phone-new · overlap-warn · off-warn · detail · settings · phone-week · phone-day · stats · empty
  summary = 도구 줄 아래 기간 합계 줄 + 시행자별·종류별 표, stats = 통계 탭의 새 '예약' 칸(최근 12개월).
  색은 앱 토큰(src/app/globals.css :root)과 예약 색판 10색만 쓴다. 이름은 ○○, 차트번호·담당 표시 (가)(나)(다)는 모두 지어낸 값이다.
  지금 시각은 2026-11-17 (화) 10:40으로 고정. 어디로도 보내지 않는다.
-->
<style>
:root {
  --canvas: #F7F8FA; --surface: #FFFFFF; --line: #E5E7EB; --line-strong: #D1D5DB; --faint: #9CA3AF;
  --muted: #6B7280; --ink-2: #374151; --ink: #111827; --accent: #2563EB; --accent-strong: #1D4ED8; --accent-soft: #EAF1FE;
  --positive: #15803D; --positive-soft: #ECF7EF; --negative: #C2410C; --negative-soft: #FDF0EA;
  --warning: #B45309; --warning-soft: #FDF4E3; --r: 4px; --r-float: 8px;
  --elev: 0 1px 2px rgb(17 24 39 / 6%), 0 6px 16px rgb(17 24 39 / 10%);
  --ui: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --slot: 20px; /* 10분 한 칸 */
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--canvas); color: var(--ink-2); font: 14px/22px var(--ui); word-break: keep-all; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num, .ch { font-variant-numeric: tabular-nums; }
.mut { color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app b, .app strong { font-weight: 600; } /* 앱 글꼴 굵기는 400·500·600뿐 */

/* 시안 머리(앱 밖) */
.mhead { background: #E9ECF0; border-bottom: 1px solid var(--line-strong); }
.mhead-in { max-width: 1280px; margin: 0 auto; padding: 12px 24px; display: grid; gap: 6px; }
.mhead b { color: var(--ink); font-size: 15px; }
.mhead .ex { margin-left: 6px; padding: 1px 7px; border-radius: 4px; background: #FEF3C7; color: #92400E; font-size: 12px; font-weight: 600; }
.mdesc { font-size: 13px; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg a { padding: 3px 10px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); font-size: 12px; color: var(--ink-2); text-decoration: none; white-space: nowrap; }
.seg a[aria-current="true"] { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
.mnote { font-size: 12px; line-height: 18px; color: var(--ink-2); }
.mnote b { font-size: 12px; }

/* 앱 */
.app { position: relative; background: var(--canvas); }
.framed .app { width: 390px; max-width: 100%; margin: 16px auto 32px; border: 1px solid var(--line-strong); border-radius: 12px; overflow: clip; box-shadow: var(--elev); min-height: 800px; }
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1280px; margin: 0 auto; height: 56px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; font-size: 16px; font-weight: 600; color: var(--ink); }
.brand span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-r { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--muted); }
.acct { height: 32px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r); display: inline-flex; align-items: center; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.tabsbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs { max-width: 1280px; margin: 0 auto; padding: 0 12px; display: flex; overflow-x: auto; scrollbar-width: none; }
.tabs a { position: relative; height: 44px; padding: 0 12px; display: inline-flex; align-items: center; white-space: nowrap; color: var(--ink-2); font-weight: 500; text-decoration: none; flex: none; }
.tabs a[aria-current="page"] { color: var(--ink); font-weight: 600; }
.tabs a[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; background: var(--accent); }
main { max-width: 1280px; margin: 0 auto; padding: 16px 24px 40px; display: grid; gap: 12px; }
main > * { min-width: 0; }

/* 단추 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 500; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--canvas); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.icon { width: 36px; padding: 0; }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); }
.btn.primary { border-color: transparent; background: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--accent-strong); }
.btn.accent { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.btn.accent:hover:not(:disabled) { background: var(--accent-soft); }
.btn.danger { color: var(--negative); }
.btn.dangerfill { border-color: transparent; background: var(--negative); color: #fff; font-weight: 600; }
.btn.text { border: 0; background: none; padding: 0 4px; height: 28px; font-size: 13px; color: var(--accent); }
.btn.text.danger { color: var(--negative); }
.btn svg { flex: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border: 1px solid transparent; border-radius: var(--r); font-size: 12px; font-weight: 500; white-space: nowrap; }
.chip.gray { background: var(--canvas); border-color: var(--line); color: var(--ink-2); }
.chip.ok { background: var(--positive-soft); color: var(--positive); font-weight: 600; }
.chip.ng { background: var(--negative-soft); color: var(--negative); font-weight: 600; }

/* 도구 줄 */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.tb1, .tb2 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.tb2 { gap: 8px; }
.toolbar h1 { margin: 0 0 0 6px; font-size: 20px; line-height: 28px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; font-variant-numeric: tabular-nums; }
.vseg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r); overflow: clip; background: var(--surface); flex: none; }
.vseg button { border: 0; margin: 0; background: none; height: 34px; padding: 0 16px; font-size: 14px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.vseg button + button { border-left: 1px solid var(--line-strong); }
.vseg button:hover { background: var(--canvas); }
.vseg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
.vseg button:focus-visible { outline-offset: -2px; }
.vseg.sm button { height: 30px; padding: 0 12px; font-size: 13px; }

/* 표시 안내 */
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px; font-size: 12px; line-height: 18px; color: var(--muted); }
.lg { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.lg > b { color: var(--ink-2); font-weight: 600; }
.lg > span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
i.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); flex: none; }
i.sw.follow { background: conic-gradient(#2563EB 0 25%, #0F766E 0 50%, #7C3AED 0 75%, #EA580C 0); border-radius: 50%; }
i.gh { display: inline-block; width: 18px; height: 10px; border-radius: 2px; background: repeating-linear-gradient(135deg, #E5E7EB 0 3px, #F9FAFB 3px 6px); outline: 1px dashed var(--faint); outline-offset: -1px; }
.bit { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: var(--r); font-size: 12px; font-weight: 600; white-space: nowrap; }
.bit.on { background: var(--positive-soft); color: var(--positive); }
.bit.on::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.bit.off { background: var(--surface); border: 1px solid var(--line-strong); color: var(--muted); font-weight: 500; }
details.legend-d summary { font-size: 13px; color: var(--ink-2); cursor: pointer; padding: 2px 0; }
details.legend-d .legend { margin-top: 8px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }

/* 도착 표시 */
.mk { display: inline-grid; place-items: center; width: 13px; height: 13px; border-radius: 50%; color: #fff; font-size: 10px; line-height: 1; font-weight: 600; vertical-align: -2px; margin-right: 3px; flex: none; }
.mk.came { background: var(--positive); }
.mk.noshow { background: var(--negative); }
.mk.cancel { width: auto; height: 14px; padding: 0 4px; border-radius: 3px; background: #E5E7EB; color: var(--ink-2); font-size: 10px; font-weight: 600; }

/* 예약표(주·일) */
.cal { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: clip; --gw: 52px; }
.crow { display: grid; grid-template-columns: var(--gw) repeat(var(--days), minmax(0, 1fr)); }
.chead { position: sticky; top: 0; z-index: 8; background: var(--surface); border-bottom: 1px solid var(--line); }
.dh { border: 0; margin: 0; background: none; text-align: left; padding: 6px 8px; border-left: 1px solid var(--line); display: flex; align-items: center; gap: 6px; min-width: 0; color: inherit; }
.dh:hover { background: var(--canvas); }
.dh .n { font-size: 20px; line-height: 28px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.dh .w { font-size: 13px; color: var(--muted); font-weight: 500; }
.dh.today .n { color: #fff; background: var(--accent); border-radius: 50%; width: 30px; height: 30px; display: inline-grid; place-items: center; font-size: 16px; line-height: 1; }
.dh.today .w { color: var(--accent-strong); font-weight: 600; }
.dh .c { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
.allday { border-bottom: 1px solid var(--line-strong); }
.gh { min-width: 0; }
.adlb { font-size: 11px; color: var(--muted); padding: 7px 8px 0 0; text-align: right; white-space: nowrap; }
.ad { position: relative; border-left: 1px solid var(--line); padding: 4px; min-height: 34px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-width: 0; }
.ad:hover { background: var(--canvas); }
.ad .adadd { font-size: 11px; color: var(--accent); opacity: 0; padding: 2px 4px; line-height: 16px; }
.ad:hover .adadd { opacity: 1; }
.ad.has .adadd { display: none; }
.adc { border: 0; margin: 0; display: flex; align-items: center; gap: 4px; height: 22px; padding: 0 6px; border-radius: 3px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; min-width: 0; text-align: left; }
.adc.memo { background: #EEF0F4; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
.adc.off { background: color-mix(in srgb, var(--c) 12%, white); color: var(--ink); box-shadow: inset 3px 0 0 var(--c); }
.adc span { overflow: hidden; text-overflow: ellipsis; }
.gut { position: relative; height: var(--h); }
.hl { position: absolute; right: 6px; transform: translateY(-50%); font-size: 11px; line-height: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hl.first { transform: none; top: 2px !important; }
.col { position: relative; height: var(--h); border-left: 1px solid var(--line); min-width: 0;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(#F1F2F5 1px, transparent 1px);
  background-size: 100% calc(var(--slot) * 6), 100% calc(var(--slot) * 3); }
.col.today { background-color: #FBFCFF; }

/* 예약 칸 */
.ev { position: absolute; z-index: 1; display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; margin: 0; border: 0; padding: 1px 3px 1px 6px; border-radius: 4px; text-align: left; overflow: hidden;
  background: color-mix(in srgb, var(--c) 13%, white); color: var(--ink);
  box-shadow: inset 3px 0 0 var(--c), inset 0 0 0 1px color-mix(in srgb, var(--c) 26%, white);
  font-size: 11px; line-height: 13px; }
.ev.day { font-size: 12.5px; line-height: 16px; padding: 2px 6px 2px 9px; }
.ev:hover { z-index: 4; box-shadow: inset 3px 0 0 var(--c), inset 0 0 0 1px var(--c), 0 2px 8px rgb(17 24 39 / 16%); }
.ev:focus-visible { z-index: 4; outline-offset: 1px; }
.evt { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--lines, 1); overflow: hidden; }
.tk { white-space: nowrap; }
.tk.ch { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tk.nm { font-weight: 600; }
.tk.len, .tk.memo { color: var(--muted); }
.tk.tm { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.ev.st-cancel { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--muted); }
.ev.st-cancel .tk { text-decoration: line-through; color: var(--muted); }
.ev.st-noshow { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 13%, white) 0 6px, color-mix(in srgb, var(--c) 5%, white) 6px 12px); }
.ev.ghost { background: repeating-linear-gradient(135deg, #EEF0F3 0 5px, #F9FAFB 5px 10px); box-shadow: none; outline: 1px dashed var(--faint); outline-offset: -1px; color: var(--muted); cursor: help; }
.ev.ghost .gl { font-weight: 600; color: var(--ink-2); }
.now { position: absolute; left: -1px; right: 0; height: 0; border-top: 2px solid var(--negative); z-index: 6; pointer-events: none; }
.now::before { content: ""; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--negative); }
.hov { position: absolute; left: 2px; right: 2px; height: calc(var(--slot) * 3 - 2px); border: 1px dashed var(--accent); border-radius: 4px; background: rgb(37 99 235 / 6%); color: var(--accent-strong); font-size: 11px; line-height: 14px; padding: 2px 6px; pointer-events: none; z-index: 3; font-weight: 600; }
.draft { position: absolute; left: 2px; right: 2px; z-index: 7; border: 2px dashed var(--accent); border-radius: 4px; background: rgb(234 241 254 / 92%); color: var(--accent-strong); font-size: 12px; line-height: 15px; font-weight: 600; padding: 2px 6px; pointer-events: none; overflow: hidden; }
.draft.warn { border-color: var(--warning); background: rgb(253 244 227 / 94%); color: var(--warning); }
.emptycard { position: absolute; left: 50%; top: 150px; transform: translateX(-50%); z-index: 7; width: min(420px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-float); box-shadow: var(--elev); padding: 20px; display: grid; gap: 8px; justify-items: start; }
.emptycard h2 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; color: var(--ink); }
.emptycard p { margin: 0; font-size: 13px; line-height: 20px; color: var(--ink-2); }
.emptycard .btn { margin-top: 4px; }

/* 월 보기 */
.mon { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: clip; }
.mh { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.mh span { padding: 8px 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
.mg { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.mc { border: 0; margin: 0; background: none; text-align: left; color: inherit; min-height: 124px; padding: 6px 8px 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; align-items: stretch; gap: 4px; min-width: 0; }
.mc:nth-child(7n) { border-right: 0; }
.mc:hover { background: var(--canvas); }
.mtop { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.mn { font-size: 13px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; min-width: 24px; height: 24px; display: inline-grid; place-items: center; }
.mc.today .mn { background: var(--accent); color: #fff; border-radius: 50%; }
.mc.out { background: #FBFBFC; }
.mc.out .mn, .mc.out .cnt, .mc.out .kc, .mc.out .ns, .mc.out .chgn { color: var(--faint); }
.mc.sun .mn { color: var(--muted); }
.cnt { font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.kc { font-size: 12px; line-height: 17px; color: var(--muted); }
.ns { color: var(--negative); font-weight: 600; font-size: 12px; line-height: 17px; }
.mchip { display: block; font-size: 11px; line-height: 18px; font-weight: 600; padding: 0 5px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mchip.memo { background: #EEF0F4; color: var(--ink); }
.mchip.off { background: color-mix(in srgb, var(--c) 12%, white); box-shadow: inset 3px 0 0 var(--c); color: var(--ink); }
.mdot { display: none; }

/* 폰 주 보기(날짜별 목록) */
.wl { display: grid; gap: 8px; }
.dcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: clip; }
.dch { border: 0; margin: 0; background: none; width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 12px; min-height: 52px; text-align: left; color: inherit; }
.dch .n { font-size: 17px; font-weight: 600; color: var(--ink); min-width: 28px; height: 28px; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.dcard.today .dch .n { background: var(--accent); color: #fff; border-radius: 50%; font-size: 15px; }
.dch .w { font-size: 14px; color: var(--ink-2); font-weight: 500; }
.dch .sum { margin-left: auto; font-size: 12px; line-height: 16px; color: var(--muted); text-align: right; }
.dch .car { color: var(--faint); font-size: 11px; width: 12px; text-align: center; }
.adl { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 0 12px 8px; }
.adl .adc { height: 26px; }
.adl .btn.text { height: 26px; font-size: 12px; }
.alist { border-top: 1px solid var(--line); }
.arow { border: 0; margin: 0; background: none; width: 100%; display: grid; grid-template-columns: 44px 4px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 7px 12px; min-height: 52px; border-bottom: 1px solid var(--line); text-align: left; color: inherit; }
.arow:last-child { border-bottom: 0; }
.arow:hover { background: var(--canvas); }
.arow .at { font-size: 14px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 18px; }
.arow .at small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
.arow .bar { align-self: stretch; border-radius: 2px; background: var(--c); }
.arow .ab { min-width: 0; line-height: 18px; }
.arow .ab b { display: block; font-size: 14px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.arow .ab b .ch { font-weight: 500; color: var(--ink-2); margin-right: 4px; }
.arow .ab small { display: block; font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.arow.st-cancel .ab b, .arow.st-cancel .at { text-decoration: line-through; color: var(--muted); }
.arow.ghost .bar { background: repeating-linear-gradient(180deg, var(--faint) 0 3px, transparent 3px 6px); }
.arow.ghost .ab b { color: var(--muted); font-weight: 600; }
.noappt { padding: 12px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }

/* 옆에서 나오는 판 */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgb(17 24 39 / 18%); }
.drawer { position: fixed; z-index: 21; top: 0; right: 0; bottom: 0; width: 460px; max-width: 100%; background: var(--surface); border-left: 1px solid var(--line-strong); box-shadow: -8px 0 28px rgb(17 24 39 / 14%); display: flex; flex-direction: column; }
.dwh { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px 10px 20px; border-bottom: 1px solid var(--line); }
.dwh h3 { margin: 0; font-size: 17px; line-height: 24px; font-weight: 600; color: var(--ink); }
.dwb { flex: 1; overflow-y: auto; padding: 16px 20px 20px; display: grid; align-content: start; gap: 16px; }
.dwf { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }
.dwf .need { flex: 1 1 140px; font-size: 12px; line-height: 18px; color: var(--muted); }
.dwf .need.err { color: var(--negative); }
.dwf .sp { flex: 1; }
.narrow .drawer { width: 100%; border-left: 0; }
.framed .scrim, .framed .drawer { position: absolute; }
.framed .drawer { bottom: auto; min-height: 800px; }

/* 예약 더하기 */
.bithint { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; line-height: 18px; color: #1E3A8A; background: var(--accent-soft); padding: 8px 10px; border-radius: var(--r); }
.bithint svg, .phnote svg, .info svg, .wbox svg { flex: none; margin-top: 2px; }
.phnote { display: flex; gap: 6px; align-items: flex-start; margin: -6px 0 0; font-size: 12px; line-height: 18px; color: var(--muted); }
.fgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.field { display: grid; gap: 6px; align-content: start; min-width: 0; }
.field > label, .field > .lb { font-size: 13px; line-height: 20px; font-weight: 600; color: var(--ink); display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; }
.hint, .help { font-size: 12px; line-height: 18px; font-weight: 400; color: var(--muted); margin: 0; }
.inp { height: 40px; width: 100%; min-width: 0; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); font-size: 14px; color: var(--ink); }
.inp::placeholder { color: var(--faint); }
.inp:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.inp.filled { background: var(--positive-soft); border-color: #A7D7B5; }
textarea.inp { height: 60px; padding: 8px 10px; resize: vertical; line-height: 20px; }
.lk { grid-column: 1 / -1; display: grid; gap: 6px; }
.lk:empty { display: none; }
.lk .ok { margin: 0; font-size: 12px; line-height: 18px; color: var(--positive); font-weight: 600; }
.lk .no { margin: 0; font-size: 12px; line-height: 18px; color: var(--muted); }
.picks { border: 1px solid var(--accent); border-radius: 6px; background: var(--surface); box-shadow: var(--elev); overflow: clip; }
.picks .ph { padding: 7px 12px; background: var(--accent-soft); color: #1E3A8A; font-size: 12px; line-height: 18px; font-weight: 600; }
.pr { border: 0; margin: 0; background: none; width: 100%; display: grid; grid-template-columns: 52px auto minmax(0, 1fr); align-items: baseline; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line); text-align: left; color: var(--ink); font-size: 14px; }
.pr:hover, .pr:focus-visible { background: var(--accent-soft); outline-offset: -2px; }
.pr b { font-variant-numeric: tabular-nums; }
.pr small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opts2 { display: flex; flex-wrap: wrap; gap: 6px; }
.ob { margin: 0; height: 36px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--r); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); background: var(--surface); white-space: nowrap; }
.ob:hover { background: var(--canvas); }
.ob[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; box-shadow: inset 0 0 0 1px var(--accent); }
.ob i.sw { width: 10px; height: 10px; border-radius: 50%; }
.ob small { font-size: 11px; color: var(--muted); font-weight: 400; }
.ob .offt { font-size: 11px; color: var(--warning); font-weight: 600; background: var(--warning-soft); padding: 0 4px; border-radius: 3px; line-height: 16px; }
.lenrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: var(--r); overflow: clip; background: var(--surface); }
.stepper button { border: 0; margin: 0; background: none; width: 36px; height: 36px; display: grid; place-items: center; font-size: 17px; color: var(--ink-2); }
.stepper button:hover { background: var(--canvas); }
.stepper output { min-width: 64px; height: 36px; display: grid; place-items: center; border-left: 1px solid var(--line); border-right: 1px solid var(--line); font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.lenrow .tr { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.wbox { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r); background: var(--warning-soft); border: 1px solid #F1D9A8; font-size: 13px; line-height: 20px; color: var(--ink); }
.wbox b { color: var(--warning); }
#warns { display: grid; gap: 8px; }
#warns:empty { display: none; }

/* 예약 자세히 */
.dtop { display: grid; grid-template-columns: 6px minmax(0, 1fr); gap: 12px; }
.dtop .bar { border-radius: 3px; background: var(--c); }
.dname { font-size: 20px; line-height: 28px; font-weight: 600; color: var(--ink); }
.dname .ch { font-weight: 600; color: var(--ink-2); margin-right: 8px; }
.dsub { font-size: 14px; color: var(--ink-2); }
.dl { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 6px 12px; margin: 0; font-size: 14px; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; color: var(--ink); }
.fs { display: grid; gap: 8px; }
.fs > h4 { margin: 0; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--ink); }
.fs > p { margin: 0; font-size: 12px; line-height: 18px; color: var(--muted); }
.arr { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 14px; font-weight: 600; color: var(--ink); }
.arr .mut { font-size: 12px; font-weight: 400; }
.rep { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.meta { margin: 0; font-size: 12px; color: var(--muted); }
.hr { height: 1px; background: var(--line); }

/* 설정 */
.klist { display: grid; gap: 6px; }
.krow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "ord name del" "ord opts opts" "pal pal pal"; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); align-items: center; }
.krow .ord { grid-area: ord; display: grid; gap: 4px; align-self: start; }
.krow .nm { grid-area: name; }
.krow .del { grid-area: del; }
.krow .opts { grid-area: opts; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.krow .opts label, .krow .opts .lbl { display: inline-flex; align-items: center; gap: 6px; }
.krow .pal { grid-area: pal; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 8px; align-items: center; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r); }
.srow .pal { grid-column: 1 / -1; }
.srow .mk1 { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.tin { height: 32px; width: 100%; min-width: 0; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); font-size: 13px; color: var(--ink); }
.tin.one { width: 40px; text-align: center; font-weight: 600; }
.tin.bad { border-color: var(--negative); background: var(--negative-soft); }
.tin:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.krow .nm.tin { font-weight: 600; }
.sel { height: 32px; padding: 0 6px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); font-size: 13px; color: var(--ink); }
.mini { margin: 0; width: 28px; height: 28px; border: 1px solid var(--line-strong); border-radius: var(--r); display: grid; place-items: center; font-size: 10px; color: var(--ink-2); background: var(--surface); padding: 0; }
.mini:disabled { opacity: .35; cursor: default; }
.del { border: 0; margin: 0; background: none; height: 28px; padding: 0 6px; font-size: 12px; color: var(--negative); border-radius: var(--r); }
.del:hover:not(:disabled) { background: var(--negative-soft); }
.del:disabled { color: var(--faint); cursor: default; }
.cbtn { margin: 0; height: 32px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--r); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); background: var(--surface); white-space: nowrap; }
.cbtn i.sw { width: 14px; height: 14px; border-radius: 3px; }
.cbtn i.sw.follow { border-radius: 50%; }
.cbtn .car { font-size: 10px; color: var(--muted); }
.cbtn[aria-expanded="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pal { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; background: var(--canvas); border-radius: var(--r); align-items: center; }
.pal .pc { margin: 0; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--surface); background: var(--c); box-shadow: 0 0 0 1px var(--line-strong); padding: 0; }
.pal .pc[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.pal .pf { margin: 0; height: 28px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
.pal .pf[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 600; }
.addline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.rowx { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.info { padding: 10px 12px; border-radius: var(--r); background: var(--canvas); border: 1px solid var(--line); font-size: 12px; line-height: 18px; color: var(--ink-2); display: grid; gap: 6px; }
.info p { margin: 0; display: flex; gap: 8px; align-items: flex-start; }

/* 종일 떠 있는 판 */
.popscrim { position: fixed; inset: 0; z-index: 30; }
.pop { position: fixed; z-index: 31; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-float); box-shadow: var(--elev); padding: 14px; display: grid; gap: 10px; }
.pop h4 { margin: 0; font-size: 15px; line-height: 22px; font-weight: 600; color: var(--ink); }
.pop ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.pop li { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ink); padding: 2px 0; }
.pop .foot { display: flex; justify-content: flex-end; gap: 8px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 40; padding: 10px 16px; border-radius: var(--r-float); background: var(--ink); color: #fff; font-size: 13px; line-height: 20px; box-shadow: 0 8px 24px rgb(17 24 39 / 20%); max-width: calc(100vw - 32px); }
.toast:empty { display: none; }

/* 변경 표시(날짜·시작 시간을 옮긴 예약) */
.mk.chg { width: auto; height: 14px; padding: 0 3px; border-radius: 3px; background: var(--accent-soft); color: var(--accent-strong); font-size: 10px; font-weight: 600; box-shadow: inset 0 0 0 1px #B4CDFA; }
.chgn { color: var(--accent-strong); font-weight: 600; font-size: 12px; line-height: 17px; }
.mlast { display: flex; flex-wrap: wrap; gap: 0 10px; }

/* 기간 합계 줄 + 나눠 보기 */
.sumline { width: 100%; margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; min-height: 40px; padding: 8px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); text-align: left; color: var(--ink-2); font-size: 14px; line-height: 20px; }
.sumline:hover { border-color: var(--line-strong); }
.sumline[aria-expanded="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.sl-p { font-size: 12px; color: var(--muted); white-space: nowrap; }
.sl-items { display: flex; flex-wrap: wrap; align-items: baseline; }
.sl-i { white-space: nowrap; font-variant-numeric: tabular-nums; }
.sl-i + .sl-i::before { content: "·"; margin: 0 10px; color: var(--faint); }
.sl-i b { color: var(--ink); }
.sl-i em { font-style: normal; color: var(--muted); }
.sl-more { margin-left: auto; color: var(--accent); font-size: 13px; font-weight: 600; white-space: nowrap; }
.sumpanel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px 16px; display: grid; gap: 12px; margin-top: -4px; min-width: 0; }
.sp-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
.sp-h h3 { margin: 0; font-size: 15px; line-height: 22px; font-weight: 600; color: var(--ink); }
.sp-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px 28px; }
.sp-grid > div { min-width: 0; }
.sp-grid h4 { margin: 0 0 2px; font-size: 13px; line-height: 20px; font-weight: 600; color: var(--ink-2); }
.tw { overflow-x: auto; }
.bt { width: 100%; border-collapse: collapse; font-size: 13px; }
.bt th, .bt td { height: 34px; padding: 0 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--ink); }
.bt th:first-child, .bt td:first-child { text-align: left; padding-left: 0; }
.bt th:last-child, .bt td:last-child { padding-right: 0; }
.bt thead th { height: 30px; font-size: 12px; font-weight: 600; color: var(--muted); }
.bt td.rc { color: var(--ink-2); }
.bt tfoot td { font-weight: 600; border-bottom: 0; border-top: 1px solid var(--line-strong); }
.bt tbody tr[data-act] { cursor: pointer; }
.bt tbody tr[data-act]:hover td { background: #F7F9FC; }
.bt tbody tr.on td { background: var(--accent-soft); }
.rs { display: none; }
.bn { display: inline-flex; align-items: center; gap: 6px; }
.bt i.sw { width: 8px; height: 8px; border-radius: 50%; }

/* 통계 탭 '예약' 칸 — 지금 통계 화면(first90) 모양과 값 */
.app.stats { --sx-canvas: #F4F6F9; --sx-ink: #172B4D; --sx-ink-2: #3B4A63; --sx-muted: #5B6B82; --sx-line: #E5EAF1; --sx-line-2: #CBD3DF; --sx-ret: #6B89BF; --sx-r: 14px; background: var(--sx-canvas); }
.app.stats main { padding-top: 20px; padding-bottom: 56px; }
.sx { display: grid; gap: 12px; color: var(--sx-ink); min-width: 0; }
.sx > * { min-width: 0; }
.sx-h1 { margin: 0; font-size: 22px; line-height: 30px; font-weight: 600; letter-spacing: -.01em; }
.sx-load { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; background: #fff; border: 1px solid var(--sx-line); border-radius: var(--sx-r); padding: 12px 16px; font-size: 14px; color: var(--sx-ink-2); }
.sx-load p { margin: 0; }
.sx-la { display: flex; align-items: center; gap: 12px; }
.sx-m { color: var(--sx-muted); font-weight: 400; }
.sx-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 14px; border: 1px solid var(--sx-line-2); border-radius: 8px; background: #fff; color: var(--sx-ink); font-size: 14px; font-weight: 600; white-space: nowrap; }
.sx-btn.pri { background: var(--accent); border-color: transparent; color: #fff; }
.sx-btn.icon { width: 36px; min-height: 36px; padding: 0; font-size: 16px; }
.sx-btn:disabled { opacity: .4; cursor: not-allowed; }
.sx-link { border: 0; background: none; color: var(--accent); font-size: 14px; font-weight: 600; padding: 8px 0; min-height: 40px; }
.sx-period { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.sx-period p { margin: 0; font-size: 14px; }
.sx-seg { display: inline-flex; gap: 2px; padding: 3px; background: #E9EDF3; border-radius: 10px; }
.sx-seg button { min-height: 36px; padding: 0 14px; border: 0; border-radius: 8px; background: transparent; color: var(--sx-ink-2); font-size: 14px; font-weight: 600; white-space: nowrap; }
.sx-seg button[aria-pressed="true"] { background: #fff; color: var(--sx-ink); box-shadow: 0 1px 2px rgb(23 43 77 / 12%); }
.sx-nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 -24px; padding: 8px 24px; border-top: 1px solid var(--sx-line); border-bottom: 1px solid var(--sx-line); }
.sx-nav a { flex: none; padding: 8px 14px; border-radius: 999px; color: var(--sx-ink-2); font-size: 14px; font-weight: 600; text-decoration: none; min-height: 36px; display: inline-flex; align-items: center; }
.sx-nav a:hover { background: #E3E8EF; }
.sx-nav a[aria-current="true"] { background: var(--sx-ink); color: #fff; }
.sx-new { margin-left: 4px; padding: 0 5px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-strong); font-size: 11px; line-height: 16px; }
.sx-nav a[aria-current="true"] .sx-new { background: rgb(255 255 255 / 18%); color: #fff; }
.sx-skip { margin: 0; font-size: 13px; line-height: 20px; color: var(--sx-muted); }
.sx-card { background: #fff; border: 1px solid var(--sx-line); border-radius: var(--sx-r); padding: 20px 24px 22px; box-shadow: 0 1px 2px rgb(23 43 77 / 4%); display: grid; gap: 20px; min-width: 0; }
.sx-card-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
.sx-card-h h2 { margin: 0; font-size: 18px; line-height: 26px; font-weight: 600; letter-spacing: -.01em; }
.sx-d { margin: 0; font-size: 13px; line-height: 20px; color: var(--sx-muted); }
.sx-two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px 40px; }
.sx-sub { display: grid; gap: 4px; align-content: start; min-width: 0; }
.sx-sub h3 { margin: 0; font-size: 15px; line-height: 22px; font-weight: 600; color: var(--sx-ink); }
.sx-line { border-top: 1px solid var(--sx-line); padding-top: 18px; gap: 8px; }
.sx-subh { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.sx-mp { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sx-mp span { min-width: 104px; text-align: center; }
.sx-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; line-height: 20px; color: var(--sx-ink-2); margin-top: 2px; }
.sx-legend > span { display: inline-flex; align-items: center; gap: 6px; }
.sx-tag { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; margin-left: 4px; border-radius: 999px; background: #E9EDF3; color: var(--sx-ink-2); font-size: 11px; font-weight: 600; vertical-align: 1px; }
.sx-foot { margin: -8px 0 0; font-size: 13px; line-height: 20px; color: var(--sx-muted); }
.sx .bt { font-size: 14px; }
.sx .bt th, .sx .bt td { height: 38px; padding: 0 12px; color: var(--sx-ink-2); border-color: var(--sx-line); }
.sx .bt th:first-child, .sx .bt td:first-child { padding-left: 0; color: var(--sx-ink); }
.sx .bt th:last-child, .sx .bt td:last-child { padding-right: 0; }
.sx .bt thead th { height: 32px; font-size: 13px; color: var(--sx-muted); }
.sx .bt tfoot td { color: var(--sx-ink); border-top-color: var(--sx-line-2); }
.sx .sp-grid h4 { font-size: 14px; color: var(--sx-ink); }
.sx-how { font-size: 13px; line-height: 21px; color: var(--sx-ink-2); }
.sx-how summary { cursor: pointer; color: var(--sx-ink); font-size: 14px; font-weight: 600; }
.sx-how ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 2px; }
/* 막대·선 그림 공통: 12달 칸, 왼쪽 눈금 */
.chv { --gl: 40px; --gr: 0px; padding-top: 10px; }
.chv.ln { --gr: 78px; }
.cplot { position: relative; height: 200px; margin: 0 var(--gr) 0 var(--gl); border-bottom: 1px solid var(--sx-line-2); }
.cg { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--sx-line); }
.cg em { position: absolute; left: calc(-1 * var(--gl)); width: calc(var(--gl) - 7px); top: -8px; text-align: right; font-size: 11px; line-height: 14px; font-style: normal; color: var(--sx-muted); font-variant-numeric: tabular-nums; }
.ccols { position: absolute; inset: 0; z-index: 2; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.cc { border: 0; margin: 0; padding: 0; background: none; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-width: 0; border-radius: 6px 6px 0 0; }
.cc:hover { background: rgb(23 43 77 / 4%); }
.cc.on { background: rgb(37 99 235 / 8%); }
.cc:focus-visible { outline-offset: -2px; }
.bb { flex: none; display: block; width: 60%; max-width: 24px; background: var(--sx-ret); border-radius: 4px 4px 0 0; }
.cc.on .bb { background: var(--accent); }
.cc.part .bb { background: #fff; box-shadow: inset 0 0 0 2px var(--sx-ret); }
.cc.part.on .bb { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.bv { flex: none; margin-bottom: 4px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--sx-ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cx { margin: 0 var(--gr) 0 var(--gl); display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); text-align: center; font-size: 12px; line-height: 16px; color: var(--sx-muted); padding-top: 6px; }
.cx span { white-space: nowrap; min-width: 0; }
.cx small { display: block; font-size: 10px; line-height: 13px; }
.cx .on { color: var(--accent-strong); font-weight: 600; }

}

const MF = { '2025-12': [.92, .068, .082, .052], '2026-01': [.95, .072, .079, .055], '2026-02': [.88, .061, .088, .047], '2026-03': [1.02, .052, .07, .041], '2026-04': [1, .048, .068, .043], '2026-05': [.97, .055, .074, .046], '2026-06': [.98, .05, .071, .039], '2026-07': [1.04, .058, .077, .044], '2026-08': [.96, .064, .083, .05], '2026-09': [.93, .06, .086, .048], '2026-10': [1, .053, .072, .042], '2026-11': [1, .056, .075, .044] }

function dayData(date) {

  DATA[date] = dd

  const r = rng('ssk-cal-' + date)
  const r2 = rng('ssk-cal-chg-' + date) // 변경 기록은 따로 굴려서 칸 자리는 그대로
  const F = MF[date.slice(0, 7)] || [1, .05, .07, .045]
  const pick = arr => arr[Math.floor(r() * arr.length)]
  const pt = () => ({ chart: String(10000 + Math.floor(r() * 29000)), name: pick(SUR) + '○○' })
  const sessions = w === 6 ? [[540, 780]] : [[540, 780], [840, 1110]]
  const CFG = [

  ]
  for (const c of CFG) {
    if (isOff(date, c.st)) continue
    for (const [s0, s1] of sessions) {
      if (c.pmOnly && s0 < 800) continue
      if (c.st === 'won' && date === '2026-11-19' && s0 >= 840) continue
      let t = s0
      while (t < s1) {

function lay(items) {
  const ev = items.map(x => ({ x, s: x.start, e: x.start + Math.max(x.len, 10) }))
    .sort((a, b) => a.s - b.s || b.e - a.e || staffIdx(a.x.staff) - staffIdx(b.x.staff))
  const clusters = []; let cl = null, end = -1
  for (const v of ev) { if (!cl || v.s >= end) { cl = []; clusters.push(cl); end = v.e } else end = Math.max(end, v.e); cl.push(v) }
  for (const c of clusters) {
    const cols = []
    for (const v of c) { let i = cols.findIndex(t => t <= v.s); if (i < 0) { i = cols.length; cols.push(0) } cols[i] = v.e; v.col = i }
    const n = cols.length
    for (const v of c) {
      let span = 1
      while (v.col + span < n && !c.some(o => o.col === v.col + span && o.s < v.e && v.s < o.e)) span++
      v.left = v.col / n; v.width = span / n
    }
  }
  return ev
}

}

/* ───────── 그리기: 월 보기 ───────── */
function monthHTML() {
  const a = toD(UI.anchor), y = a.getUTCFullYear(), m = a.getUTCMonth()
  const first = toS(new Date(Date.UTC(y, m, 1))), last = toS(new Date(Date.UTC(y, m + 1, 0)))
  const cells = []
  for (let d = mondayOf(first), e = addDays(mondayOf(last), 6); d <= e; d = addDays(d, 1)) cells.push(d)
  const body = cells.map(d => {
    const dd = dayData(d), live = dd.appts.filter(x => !x.cancel)
    const kc = SET.kinds.map(k => [k, live.filter(x => x.kind === k.id).length]).filter(x => x[1])
    const ns = d <= NOW.date ? live.filter(x => status(x) === 'noshow').length : 0
    const chg = live.filter(x => x.orig).length
    const items = ALLDAY[d] || []
    const chips = items.map(it => it.type === 'memo' ? `<span class="mchip memo">${esc(it.text)}</span>` : `<span class="mchip off" style="--c:${staffOf(it.staff).color}">(${esc(staffOf(it.staff).mark)}) ${esc(staffOf(it.staff).name)} 휴무</span>`).join('')
    const out = d < first || d > last
    return `<button class="mc ${out ? 'out' : ''} ${d === NOW.date ? 'today' : ''} ${dowOf(d) === 0 ? 'sun' : ''}" data-act="mday" data-date="${d}" aria-label="${mdw(d)} 예약 ${live.length}">
      <span class="mtop"><span class="mn">${toD(d).getUTCDate()}</span>${live.length ? `<span class="cnt">예약 ${live.length}</span>` : ''}</span>${items.length ? '<span class="mdot" aria-hidden="true"></span>' : ''}
      ${chips}${kc.length ? `<span class="kc">${kc.map(([k, n]) => `<span class="tk">${esc(k.name)} ${n}</span>`).join(' · ')}</span>` : ''}${ns || chg ? `<span class="mlast">${ns ? `<span class="ns">안 옴 ${ns}</span>` : ''}${chg ? `<span class="chgn">변경 ${chg}</span>` : ''}</span>` : ''}${HOLI.has(d) ? '<span class="kc">공휴일</span>' : ''}</button>`
  }).join('')
  return `<section class="mon" aria-label="월 보기"><div class="mh">${['월', '화', '수', '목', '금', '토', '일'].map(x => `<span>${x}</span>`).join('')}</div><div class="mg">${body}</div></section>`
}

/* ───────── 예약 더하기·고치기 판 ───────── */
function warns(D) {
  const out = []

  const s = staffOf(D.staff), end = D.start + D.len
  const ov = dayData(D.date).appts.filter(a => a.id !== D.id && a.staff === D.staff && !a.cancel && a.start < end && D.start < a.start + a.len)
  if (ov.length) out.push(`<b>(${esc(s.mark)}) ${esc(s.name)}</b> 담당에게 같은 시간 예약이 있어요: ${ov.map(a => `${hm(a.start)}–${hm(a.start + a.len)} ${a.chart} ${a.name} ${esc(kindOf(a.kind).name)}`).join(', ')}. 겹쳐도 저장할 수 있어요.`)
  if (isOff(D.date, D.staff)) out.push(`<b>(${esc(s.mark)}) ${esc(s.name)}</b> 담당은 ${mdw(D.date)} 휴무예요. 그래도 저장할 수 있어요.`)

}

function refreshAdd(D) {
  $('#lk').innerHTML = lookupHTML(D)
  $('#warns').innerHTML = warnHTML(D)
  // 단추를 갈아 끼우지 않고 그 자리에서 고친다(누르는 중에 바뀌면 눌림이 사라진다)
  const miss = missing(D), need = $('#need'), btn = $('#savebtn')
  need.textContent = miss.length ? `${miss.join('·')} 칸을 채우면 저장할 수 있어요` : ''
  btn.disabled = miss.length > 0; btn.textContent = warns(D).length ? '그래도 저장' : '저장'
  $('#f-name').classList.toggle('filled', D.filled === 'name')
  $('#f-chart').classList.toggle('filled', D.filled === 'chart')
}
function onAddInput(D, f, el) {
  if (f === 'name') {
    D.name = el.value; D.filled = null; D.notFound = false; D.picks = null
    const q = D.name.trim()
    if (BIT && q) {
      const m = lookupName(q)
      if (m.length === 1) { D.name = m[0].name; el.value = D.name; D.chart = m[0].chart; $('#f-chart').value = D.chart; D.filled = 'chart' }
      else if (m.length > 1) D.picks = m
      else if (q.length >= 2) D.notFound = true
    }
  } else if (f === 'chart') {
    D.chart = el.value.replace(/\D/g, '').slice(0, 8); el.value = D.chart; D.filled = null; D.notFound = false; D.picks = null
    if (BIT && D.chart.length >= 5) {
      const p = BITPT.find(x => x.chart === D.chart)
      if (p) { D.name = p.name; $('#f-name').value = p.name; D.filled = 'name' } else D.notFound = true
    }
  } else if (f === 'memo') D.memo = el.value
  refreshAdd(D)
}
function saveAdd(D) {
  if (missing(D).length) return
  const fields = { date: D.date, start: D.start, len: D.len, name: D.name.trim(), chart: D.chart, staff: D.staff, kind: D.kind, memo: D.memo.trim() }
  if (D.mode === 'edit') {
    const a = findAppt(D.id)
    const moved = a.date !== D.date || a.start !== D.start
    // 변경 기록: 날짜·시작이 바뀔 때만. 처음 시간 하나만 남기고, 처음 시간으로 되돌리면 지운다
    if (moved && !a.orig) a.orig = { date: a.date, start: a.start }
    if (a.orig && a.orig.date === D.date && a.orig.start === D.start) a.orig = null
    if (a.date !== D.date) { DATA[a.date].appts = DATA[a.date].appts.filter(x => x !== a); dayData(D.date).appts.push(a) }
    Object.assign(a, fields)
    toast(moved && a.orig ? `예약을 옮겼어요. '변경'으로 표시하고 원래 시간(${fmtOrig(a.orig)})을 남겼어요.` : '예약을 고쳤어요. 다른 PC에도 몇 초 안에 보여요.')
  } else {
    dayData(D.date).appts.push(mkAppt(fields))
    toast(`${mdw(D.date)} ${hm(D.start)} 예약을 넣었어요. 다른 PC에도 몇 초 안에 보여요.`)
  }
  UI.anchor = D.date; UI.layer = null; render()
}

function openPop(el, date) {

/* ───────── 합계 줄·나눠 보기 ───────── */
const monthDays = ym => { const [y, m] = ym.split('-').map(Number), n = new Date(Date.UTC(y, m, 0)).getUTCDate(); return Array.from({ length: n }, (_, i) => `${ym}-${pad(i + 1)}`) }
const apptsOf = days => days.flatMap(d => dayData(d).appts) // 지운 예약은 이미 빠져 있고, 비트 예약 칸은 세지 않는다
function tally(appts) { const t = { n: appts.length, c: 0, g: 0, x: 0 }; for (const a of appts) { if (a.cancel) t.c++; if (a.orig) t.g++; if (status(a) === 'noshow') t.x++ } return t }
const pct = (k, n) => n ? (k / n * 100).toFixed(1) + '%' : '–'
const fmtN = n => n.toLocaleString('ko-KR')
function groupT(appts, key, list) {
  const extra = [...new Set(appts.map(a => a[key]))].filter(id => !list.some(x => x.id === id))
  return [...list.map(x => x.id), ...extra].map(id => ({ id, t: tally(appts.filter(a => a[key] === id)) }))
}
function btHTML(head, rows, total, totalLab = '합계') {
  const c = (k, n) => `<td>${fmtN(k)}<span class="rs">${pct(k, n)}</span></td><td class="rc">${pct(k, n)}</td>`
  const tr = (lab, t, attrs = '') => `<tr ${attrs}><td>${lab}</td><td>${fmtN(t.n)}</td>${c(t.c, t.n)}${c(t.g, t.n)}${c(t.x, t.n)}</tr>`
  return `<table class="bt"><thead><tr><th scope="col">${head}</th><th scope="col">예약</th><th scope="col">취소</th><th scope="col" class="rc">취소율</th><th scope="col">변경</th><th scope="col" class="rc">변경율</th><th scope="col">안 옴</th><th scope="col" class="rc">안 옴율</th></tr></thead>
    <tbody>${rows.map(r => tr(r.lab, r.t, r.attrs)).join('')}</tbody><tfoot>${tr(totalLab, total)}</tfoot></table>`
}
function breakHTML(appts) {
  const T = tally(appts)
  const st = groupT(appts, 'staff', SET.staff).map(r => { const s = staffOf(r.id); return { lab: `<span class="bn"><i class="sw" style="--c:${s.color}"></i>(${esc(s.mark)}) ${esc(s.name)}</span>`, t: r.t } })
  const kd = groupT(appts, 'kind', SET.kinds).map(r => { const k = kindOf(r.id); return { lab: `<span class="bn"><i class="sw ${k.color ? '' : 'follow'}" style="--c:${k.color || ''}"></i>${esc(k.name)}</span>`, t: r.t } })
  return `<div class="sp-grid"><div><h4>시행자별</h4><div class="tw">${btHTML('시행자', st, T)}</div></div><div><h4>종류별</h4><div class="tw">${btHTML('종류', kd, T)}</div></div></div>`
}
function viewDays() { return UI.view === 'month' ? monthDays(UI.anchor.slice(0, 7)) : UI.view === 'day' ? [UI.anchor] : weekDays() }
function sumHTML() {
  const appts = apptsOf(viewDays()), t = tally(appts)
  const per = { day: '이 날', week: '이 주', month: '이 달' }[UI.view]
  const it = (k, v, r) => `<span class="sl-i"><span class="k">${k}</span> <b>${fmtN(v)}</b>${r ? ` <em>(${r})</em>` : ''}</span>`
  const line = `<button class="sumline" data-act="sum" aria-expanded="${UI.sum}" aria-controls="sumpanel"><span class="sl-p">${per} 합계</span><span class="sl-items">${it('예약', t.n)}${it('취소', t.c, pct(t.c, t.n))}${it('변경', t.g, pct(t.g, t.n))}${it('안 옴', t.x, pct(t.x, t.n))}</span><span class="sl-more">${UI.sum ? '접기 ▴' : '시행자·종류별 ▾'}</span></button>`
  if (!UI.sum) return line
  return line + `<section class="sumpanel" id="sumpanel" aria-label="${per} 나눠 보기">
    <div class="sp-h"><h3>${rangeLabel(false)} · 나눠 보기</h3><span class="hint">예약 수는 취소 포함·지운 것 빼고 · 비율은 그 줄 예약 수로 나눠요 · 안 옴은 시간이 지난 예약만 · 비트 예약 칸은 세지 않아요</span></div>

/* ───────── 통계 탭 '예약' 칸 ───────── */
const YMS = Array.from({ length: 12 }, (_, i) => { const d = new Date(Date.UTC(2025, 11 + i, 1)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}` })
const CURYM = NOW.date.slice(0, 7)
const ymLabel = ym => `${ym.slice(0, 4)}년 ${+ym.slice(5)}월`
let STM = null
const statMonths = () => STM || (STM = YMS.map(ym => ({ ym, t: tally(apptsOf(monthDays(ym))) })))
const SER = [['c', '취소율', '취소', '#0D9488', ''], ['g', '변경율', '변경', '#2563EB', 'sq'], ['x', '안 옴율', '안 옴', '#EA580C', 'dm']]
function tipOf(m) { const t = m.t; return `${ymLabel(m.ym)}${m.ym === CURYM ? ' (진행 중)' : ''}\n예약 ${fmtN(t.n)}\n취소 ${fmtN(t.c)} (${pct(t.c, t.n)})\n변경 ${fmtN(t.g)} (${pct(t.g, t.n)})\n안 옴 ${fmtN(t.x)} (${pct(t.x, t.n)})` }
function xAxis(M) {
  const nw = isNarrow() // 폰은 칸이 좁아 '12'·'25년'처럼 줄여 쓴다
  return `<div class="cx" aria-hidden="true">${M.map(m => `<span class="${m.ym === UI.sm ? 'on' : ''}">${+m.ym.slice(5)}${nw ? '' : '월'}${m.ym.endsWith('-12') || m.ym.endsWith('-01') ? `<small>${nw ? m.ym.slice(2, 4) + '년' : m.ym.slice(0, 4)}</small>` : m.ym === CURYM ? `<small>${nw ? '진행' : '진행 중'}</small>` : ''}</span>`).join('')}</div>`
}
function colBtn(m, inner) { return `<button class="cc ${m.ym === UI.sm ? 'on' : ''} ${m.ym === CURYM ? 'part' : ''}" data-act="sx-month" data-ym="${m.ym}" data-tip="${esc(tipOf(m))}" aria-label="${esc(tipOf(m).replace(/\n/g, ', '))}">${inner}</button>` }
function barChart(M) {
  const max = Math.max(...M.map(m => m.t.n), 1), raw = max / 4, p = 10 ** Math.floor(Math.log10(raw))
  const step = [1, 2, 2.5, 5, 10].map(x => x * p).find(x => x >= raw), top = Math.ceil(max / step) * step
  let g = ''; for (let v = 0; v <= top; v += step) g += `<div class="cg" style="bottom:${v / top * 100}%"><em>${fmtN(v)}</em></div>`
  const cols = M.map(m => colBtn(m, `${m.ym === UI.sm ? `<span class="bv">${fmtN(m.t.n)}</span>` : ''}<span class="bb" style="height:${(m.t.n / top * 100).toFixed(2)}%"></span>`)).join('')
  return `<div class="chv"><div class="cplot">${g}<div class="ccols">${cols}</div></div>${xAxis(M)}</div>`
}
function lineChart(M) {
  const val = (m, k) => m.t.n ? m.t[k] / m.t.n * 100 : 0
  const top = Math.max(10, Math.ceil(Math.max(...M.flatMap(m => SER.map(s => val(m, s[0])))) / 2) * 2)
  let g = ''; for (let v = 0; v <= top; v += 2) g += `<div class="cg" style="bottom:${v / top * 100}%"><em>${v}%</em></div>`
  const X = i => (i + .5) / 12, Y = v => 1 - v / top, last = M.length - 1
  const pts = (s, a, b) => M.slice(a, b + 1).map((m, j) => `${(X(a + j) * 1200).toFixed(1)},${(Y(val(m, s[0])) * 1000).toFixed(1)}`).join(' ')
  const lines = SER.map(s => `<polyline points="${pts(s, 0, last - 1)}" stroke="${s[3]}"/><polyline points="${pts(s, last - 1, last)}" stroke="${s[3]}" stroke-dasharray="3 4"/>`).join('')
  const dots = SER.map(s => M.map((m, i) => `<span class="ld ${s[4]} ${i === last ? 'part' : ''}" style="--c:${s[3]};left:${(X(i) * 100).toFixed(3)}%;top:${(Y(val(m, s[0])) * 100).toFixed(3)}%"></span>`).join('')).join('')
  // 끝 이름표: 겹치지 않게 16px씩 띄운다
  const H = isNarrow() ? 180 : 200
  const ends = SER.map(s => ({ s, y: Y(val(M[last], s[0])) * H })).sort((a, b) => a.y - b.y)
  for (let i = 1; i < ends.length; i++) ends[i].y = Math.max(ends[i].y, ends[i - 1].y + 16)
  const labels = ends.map(e => `<span class="le" style="top:${e.y.toFixed(1)}px"><i class="lgm ${e.s[4]}" style="--c:${e.s[3]}"></i>${e.s[2]} <b>${val(M[last], e.s[0]).toFixed(1)}%</b></span>`).join('')
  const cols = M.map(m => colBtn(m, '')).join('')
  return `<div class="chv ln"><div class="cplot">${g}<svg class="lsvg" viewBox="0 0 1200 1000" preserveAspectRatio="none" aria-hidden="true">${lines}</svg>${dots}${labels}<div class="ccols">${cols}</div></div>${xAxis(M)}</div>`
}

      <div class="sx-two">

        <li><b>취소</b>: [예약 취소]를 누른 예약. <b>취소율</b> = 취소 ÷ 예약 수.</li>
        <li><b>변경</b>: [고치기]로 날짜나 시작 시간을 옮긴 예약. 옮긴 뒤 날짜의 달에 세고, 여러 번 옮겨도 한 번이에요. 길이·담당·종류·메모만 바꾼 건 빼요.</li>
        <li><b>안 옴</b>: 예약 시간이 끝났는데 비트 접수가 없거나 손으로 '안 옴'을 고른 예약. 취소한 예약은 빼요.</li>
        <li>비율은 소수 첫째 자리까지(반올림). 시행자·종류는 예약에 적힌 담당·종류로 나눠요.</li>
      </ul></details>
    </section>
  </div>`
}

/* ───────── 전체 그리기 ───────── */
function renderMain() {
  tip.hidden = true
  if (STATS) {
    $('#main').innerHTML = statsHTML()
    const nav = $('.sx-nav'), a = nav.querySelector('[aria-current]'); nav.scrollLeft = a.offsetLeft - nav.clientWidth / 2 + a.offsetWidth / 2
    return
  }
  let v
  if (UI.view === 'month') v = monthHTML()
  else if (UI.view === 'day') v = gridHTML([UI.anchor])
  else v = isNarrow() ? listHTML(weekDays()) : gridHTML(weekDays())
  $('#main').innerHTML = toolbarHTML() + sumHTML() + legendHTML() + v
}
function renderLayer() {
  const L = UI.layer, el = $('#layer')
  const keep = el.dataset.k === (L && L.type) ? (el.querySelector('.dwb')?.scrollTop || 0) : 0
  el.dataset.k = L ? L.type : ''
  if (!L) { el.innerHTML = ''; return }
  el.innerHTML = L.type === 'add' ? addDrawer(L.D) : L.type === 'detail' ? detailDrawer(L) : settingsDrawer(L)
  const db = el.querySelector('.dwb'); if (db) db.scrollTop = keep
}
function render() { renderMain(); renderLayer() }
let toastT
function toast(msg) { const t = $('#toast'); t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => { t.textContent = '' }, 3200) }

/* ───────── 누르기 ───────── */
function slotMin(col, y) { const r = col.getBoundingClientRect(); return SET.open + clamp(Math.floor((y - r.top) / SLOT), 0, (SET.close - SET.open) / 10 - 1) * 10 }
function newAt(date, start) { UI.layer = { type: 'add', D: draft({ date, start }) }; render(); setTimeout(() => $('#f-name')?.focus(), 0) }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return
  const act = t.dataset.act, L = UI.layer
  const step = UI.view === 'day' ? 1 : 7
  switch (act) {
    case 'today': UI.anchor = NOW.date; renderMain(); break
    case 'prev': case 'next': {
      const sg = act === 'prev' ? -1 : 1
      if (UI.view === 'month') { const d = toD(UI.anchor); UI.anchor = toS(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + sg, 1))) }
      else { UI.anchor = addDays(UI.anchor, sg * step); if (UI.view === 'day' && !SET.sunday && dowOf(UI.anchor) === 0) UI.anchor = addDays(UI.anchor, sg) }
      renderMain(); break
    }
    case 'view': UI.view = t.dataset.v; renderMain(); break
    case 'gotoday': case 'mday': UI.view = 'day'; UI.anchor = t.dataset.date; renderMain(); break
    case 'lday': { const d = t.dataset.date; UI.open.has(d) ? UI.open.delete(d) : UI.open.add(d); renderMain(); break }
    case 'add': { const d = UI.view === 'day' ? UI.anchor : weekDays().includes(NOW.date) ? NOW.date : weekDays()[0]; newAt(d, d === NOW.date ? Math.ceil((NOW.min + 1) / 10) * 10 : 540); break }
    case 'slot': if (!e.target.closest('.ev')) newAt(t.dataset.date, slotMin(t, e.clientY)); break
    case 'appt': UI.layer = { type: 'detail', id: t.dataset.id }; renderLayer(); break
    case 'ghost': toast('비트에 있는 예약이에요. 여기서는 보기만 하고, 고치려면 비트에서 해요.'); break
    case 'settings': UI.layer = { type: 'settings', E: structuredClone(SET), menu: null }; renderLayer(); break
    case 'close': UI.layer = null; render(); break
    // 합계 줄·통계
    case 'sum': UI.sum = !UI.sum; renderMain(); $('.sumline')?.focus(); break
    case 'sx-month': UI.sm = t.dataset.ym; renderMain(); break
    case 'sx-prev': case 'sx-next': { const i = YMS.indexOf(UI.sm) + (act === 'sx-prev' ? -1 : 1); if (i >= 0 && i < YMS.length) { UI.sm = YMS[i]; renderMain(); $(`[data-act=${act}]`)?.focus() } break }
    case 'sx-noop': e.preventDefault(); toast('시안이에요. 이 단추는 지금 통계 탭 그대로예요.'); break
    // 예약 더하기
    case 'pick': { const p = BITPT.find(x => x.chart === t.dataset.chart); Object.assign(L.D, { name: p.name, chart: p.chart, picks: null, filled: 'chart', notFound: false }); renderLayer(); break }
    case 'staff': L.D.staff = t.dataset.id; render(); break
    case 'kind': L.D.kind = t.dataset.id; L.D.len = kindOf(t.dataset.id).len; render(); break
    case 'len': L.D.len = clamp(L.D.len + Number(t.dataset.d), 5, 240); render(); break
    case 'save': saveAdd(L.D); break
    // 자세히
    case 'arr': findAppt(L.id).mode = t.dataset.m; render(); break
    case 'nextweek': {
      const a = findAppt(L.id), nd = addDays(a.date, 7)
      const D = draft({ date: nd, start: a.start, len: a.len, staff: a.staff, kind: a.kind })
      const w = warns(D)
      dayData(nd).appts.push(mkAppt({ date: nd, start: a.start, len: a.len, staff: a.staff, kind: a.kind, chart: a.chart, name: a.name, memo: a.memo }))
      L.copied = true; render()
      toast(`${mdw(nd)} ${hm(a.start)}에 똑같이 넣었어요.${w.length ? ' 그 시간에 같은 담당 예약이 있거나 휴무예요 — 확인해 주세요.' : ''}`)
      break
    }
    case 'edit': { const a = findAppt(L.id); UI.layer = { type: 'add', D: draft({ mode: 'edit', id: a.id, date: a.date, start: a.start, len: a.len, name: a.name, chart: a.chart, staff: a.staff, kind: a.kind, memo: a.memo }) }; render(); break }
    case 'cancel-appt': { const a = findAppt(L.id); a.cancel = !a.cancel; render(); toast(a.cancel ? '예약을 취소했어요. 칸은 흐리게 남아요.' : '취소를 되돌렸어요.'); break }
    case 'del': L.confirmDel = true; renderLayer(); break
    case 'del-no': L.confirmDel = false; renderLayer(); break
    case 'del-yes': { const a = findAppt(L.id); DATA[a.date].appts = DATA[a.date].appts.filter(x => x !== a); UI.layer = null; render(); toast('예약을 지웠어요.'); break }
    // 설정
    case 'k-up': case 'k-down': { const i = +t.dataset.i, j = act === 'k-up' ? i - 1 : i + 1; [L.E.kinds[i], L.E.kinds[j]] = [L.E.kinds[j], L.E.kinds[i]]; L.menu = null; renderLayer(); break }
    case 'k-del': L.E.kinds.splice(+t.dataset.i, 1); L.menu = null; renderLayer(); break
    case 'k-add': L.E.kinds.push({ id: 'k' + (++seq), name: '', len: 30, color: null }); L.menu = null; renderLayer(); setTimeout(() => { const ins = document.querySelectorAll('[data-f="k-name"]'); ins[ins.length - 1]?.focus() }, 0); break
    case 'k-color': case 's-color': { const tt = act === 'k-color' ? 'k' : 's', i = +t.dataset.i; L.menu = L.menu && L.menu.t === tt && L.menu.i === i ? null : { t: tt, i }; renderLayer(); break }
    case 'pal': { const c = t.dataset.c || null; if (L.menu.t === 'k') L.E.kinds[L.menu.i].color = c; else L.E.staff[L.menu.i].color = c || '#6B7280'; L.menu = null; renderLayer(); break }
    case 's-del': L.E.staff.splice(+t.dataset.i, 1); L.menu = null; renderLayer(); break
    case 's-add': { const used = new Set(L.E.staff.map(s => s.color)); L.E.staff.push({ id: 's' + (++seq), name: '', mark: '', color: (PALETTE.find(p => !used.has(p[1])) || PALETTE[9])[1] }); L.menu = null; renderLayer(); break }
    case 'sun': L.E.sunday = t.dataset.v === '1'; renderLayer(); break
    case 'set-save': {
      if (setErrors(L.E)) break
      for (const k of SET.kinds) if (!L.E.kinds.some(x => x.id === k.id)) ARCH.kinds[k.id] = k
      for (const s of SET.staff) if (!L.E.staff.some(x => x.id === s.id)) ARCH.staff[s.id] = s
      SET = L.E; UI.layer = null; render(); toast('설정을 저장했어요. 다른 PC에도 몇 초 안에 보여요.'); break
    }
    // 종일
    case 'ad': case 'adchip': openPop(t, t.dataset.date); break
    case 'pop-close': UI.pop = null; renderPop(); break
    case 'ad-kind': UI.pop.kind = t.dataset.v; renderPop(); break
    case 'ad-add': {
      const P = UI.pop, list = ALLDAY[P.date] || (ALLDAY[P.date] = [])
      if (P.kind === 'memo') { const v = $('#ad-text').value.trim(); if (!v) { $('#ad-text').focus(); break } list.push({ type: 'memo', text: v }) }
      else { const s = $('#ad-staff').value; if (!isOff(P.date, s)) list.push({ type: 'off', staff: s }) }
      UI.pop = null; renderPop(); renderMain(); break
    }
    case 'ad-del': { (ALLDAY[UI.pop.date] || []).splice(+t.dataset.i, 1); UI.pop = null; renderPop(); renderMain(); break }
  }
})
document.addEventListener('input', e => {
  const f = e.target.dataset && e.target.dataset.f, L = UI.layer; if (!f || !L) return
  if (L.type === 'add' && ['name', 'chart', 'memo'].includes(f)) onAddInput(L.D, f, e.target)
  if (L.type === 'settings') {
    const i = +e.target.dataset.i
    if (f === 'k-name') { L.E.kinds[i].name = e.target.value; e.target.classList.toggle('bad', !e.target.value.trim()) }
    if (f === 's-name') L.E.staff[i].name = e.target.value
    if (f === 's-mark') { L.E.staff[i].mark = e.target.value; e.target.classList.toggle('bad', [...e.target.value.trim()].length !== 1) }
    updateSetFoot(L.E)
  }
})
document.addEventListener('change', e => {
  const f = e.target.dataset && e.target.dataset.f, L = UI.layer; if (!f || !L) return
  if (L.type === 'add') {
    if (f === 'date' && e.target.value) { L.D.date = e.target.value; UI.anchor = e.target.value; render() }
    if (f === 'start') { L.D.start = +e.target.value; render() }
  }
  if (L.type === 'settings') {
    const i = +e.target.dataset.i
    if (f === 'k-len') L.E.kinds[i].len = +e.target.value
    if (f === 'open') L.E.open = +e.target.value
    if (f === 'close') L.E.close = +e.target.value
    updateSetFoot(L.E)
  }
})
document.addEventListener('mousemove', e => {
  const hov = document.getElementById('hov')
  const col = e.target.closest && e.target.closest('.col')
  if (!col || e.target.closest('.ev') || UI.layer || isNarrow()) { hov?.remove(); return }
  const m = slotMin(col, e.clientY)
  let el = hov
  if (!el || el.parentNode !== col) { el?.remove(); el = document.createElement('div'); el.id = 'hov'; el.className = 'hov'; col.appendChild(el) }
  el.style.top = yOf(m) + 'px'; el.textContent = '+ ' + hm(m)
})
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return
  if (UI.pop) { UI.pop = null; renderPop() } else if (UI.layer) { UI.layer = null; render() }
})
window.addEventListener('resize', () => { if (setMode()) render() })
// 그림 말풍선: 마우스를 올리거나 칸에 들어가면 그 달 숫자
const tip = document.createElement('div'); tip.className = 'ttip'; tip.hidden = true; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip)
function showTip(el, x, y) { tip.textContent = el.dataset.tip; tip.hidden = false; const w = tip.offsetWidth, h = tip.offsetHeight; tip.style.left = clamp(x + 14, 8, innerWidth - w - 8) + 'px'; tip.style.top = clamp(y - h - 12, 8, innerHeight - h - 8) + 'px' }
document.addEventListener('mousemove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else tip.hidden = true })
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2, r.top) } else tip.hidden = true })

setMode()
render()
if (isNarrow()) { const tabs = $('#tabs'), c = $('#tab-cur'); tabs.scrollLeft = c.offsetLeft - tabs.clientWidth / 2 + c.offsetWidth / 2 }
</script>
</body>
</html>
