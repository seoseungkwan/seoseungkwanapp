<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>의사랑 엑셀 올리기 시안</title>
<!--
  의사랑 엑셀 올리기(uisarang-upload) 시안. 의사랑 의원 원장이 의사랑 통계 엑셀을 끌어다 놓으면 이 PC 안에서 읽어 숫자만 저장하고
  대시보드 첫 화면 · 통계 탭 · 관리자 의원 비교에 보인다. 결정·상태 목록은 notes.md, 글자는 specs/uisarang-upload/requirements.md '화면 글자'.
  ?s=dash-empty(기본) · reading · dash-missing · dash-ok · refused · dash-data · stats · stats-gap · admin
  색·글자는 앱 토큰(src/app/globals.css :root)만 쓴다. 파일 이름·숫자·의원 이름은 모두 지어낸 값이다.
  오늘은 2026-11-26 (목) 19:10으로 고정. 어디로도 보내지 않는다. PC 화면만(폰 모양 없음).
-->
<style>
@font-face { font-family: 'AppPretendard'; font-weight: 400; src: url('../../../src/app/fonts/Pretendard-Regular.subset.woff2') format('woff2'); }
@font-face { font-family: 'AppPretendard'; font-weight: 500; src: url('../../../src/app/fonts/Pretendard-Medium.subset.woff2') format('woff2'); }
@font-face { font-family: 'AppPretendard'; font-weight: 600; src: url('../../../src/app/fonts/Pretendard-SemiBold.subset.woff2') format('woff2'); }
/* 앱 토큰(src/app/globals.css :root) */
:root {
  --canvas: #F7F8FA; --surface: #FFFFFF; --line: #E5E7EB; --line-strong: #D1D5DB; --faint: #9CA3AF;
  --muted: #6B7280; --ink-2: #374151; --ink: #111827; --accent: #2563EB; --accent-strong: #1D4ED8; --accent-soft: #EAF1FE;
  --positive: #15803D; --positive-soft: #ECF7EF; --negative: #C2410C; --negative-soft: #FDF0EA;
  --warning: #B45309; --warning-soft: #FDF4E3; --r: 4px; --r-float: 8px;
  /* 통계 탭 토큰 */
  --st-canvas: #F4F6F9; --st-ink: #172B4D; --st-ink-2: #3B4A63; --st-muted: #5B6B82; --st-line: #E5EAF1; --st-line-2: #CBD3DF;
  --st-r: 14px; --st-r-sm: 8px; --st-card-shadow: 0 1px 2px rgb(23 43 77 / 0.04); --st-h2: #B5CEF8; --st-h4: #3F7BE6;
  --elev: 0 1px 2px rgb(17 24 39 / 6%), 0 6px 16px rgb(17 24 39 / 10%);
  --ui: 'AppPretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--ink); font: 400 14px/22px var(--ui); word-break: keep-all; font-variant-numeric: tabular-nums; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3, h4, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
svg { flex: none; }

/* 시안 머리(앱 밖) */
.mhead { background: #E9ECF0; border-bottom: 1px solid var(--line-strong); }
.mhead-in { max-width: 1280px; margin: 0 auto; padding: 12px 24px; display: grid; gap: 6px; }
.mhead b { color: var(--ink); font-size: 15px; font-weight: 600; }
.mhead .ex { margin-left: 6px; padding: 1px 7px; border-radius: 4px; background: #FEF3C7; color: #92400E; font-size: 12px; font-weight: 600; }
.mdesc { font-size: 13px; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg a { padding: 3px 10px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); font-size: 12px; line-height: 18px; color: var(--ink-2); text-decoration: none; white-space: nowrap; }
.seg a[aria-current="true"] { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
.mnote { font-size: 12px; line-height: 18px; color: var(--ink-2); }
.mnote b { font-size: 12px; }
/* 시안 표시(만들지 않음): 새로 생기거나 바뀌는 자리 */
.mark-new { outline: 2px dashed #F59E0B; outline-offset: 4px; }
.mark-tag { display: inline-block; padding: 1px 7px; border-radius: 4px; background: #FEF3C7; color: #92400E; font-size: 12px; line-height: 18px; font-weight: 600; white-space: nowrap; }
.same { color: var(--faint); font-size: 12px; }

/* 앱 틀 */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1280px; margin: 0 auto; height: 56px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; font-size: 16px; line-height: 24px; font-weight: 600; color: var(--ink); }
.brand span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-r { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--muted); }
.acct { height: 32px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r); display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-weight: 500; white-space: nowrap; background: var(--surface); }
.tabsbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs-in { max-width: 1280px; margin: 0 auto; display: flex; }
.tabs { display: flex; min-width: 0; flex: 1; padding: 0 24px; }
.tabs > :first-child { margin-left: -12px; }
.tabs a, .more { position: relative; height: 44px; padding: 0 12px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; color: var(--ink-2); font-weight: 500; text-decoration: none; flex: none; border: 0; background: none; }
.tabs a[aria-current="page"], .more.on { color: var(--ink); font-weight: 600; }
.tabs a[aria-current="page"]::after, .more.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; background: var(--accent); }
.morewrap { display: flex; flex: none; margin-right: 12px; }
main { max-width: 1280px; margin: 0 auto; padding: 24px 24px 48px; }
main > * { min-width: 0; }
.stbg { background: var(--st-canvas); }

/* 단추 · 칩 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); color: var(--ink); font-size: 14px; line-height: 22px; font-weight: 500; white-space: nowrap; text-decoration: none; }
.btn:hover:not(:disabled) { background: var(--canvas); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; line-height: 20px; }
.btn.primary { border-color: transparent; background: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent-strong); }
.tbtn { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 4px; border: 0; background: none; color: var(--accent); font-size: 13px; line-height: 20px; font-weight: 500; white-space: nowrap; border-radius: var(--r); }
.tbtn:hover { text-decoration: underline; text-underline-offset: 3px; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border: 1px solid transparent; border-radius: var(--r); font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; vertical-align: 1px; }
.chip.neutral { background: var(--canvas); border-color: var(--line); color: var(--ink-2); }
.chip.pos { background: var(--positive-soft); color: var(--positive); }
.chip.neg { background: var(--negative-soft); color: var(--negative); }
.chip.accent { background: var(--accent-soft); color: var(--accent-strong); }

/* 오류 카드 */
.errc { display: flex; align-items: flex-start; gap: 8px; padding: 12px 16px; border-radius: var(--r); background: var(--negative-soft); }
.errc svg { margin-top: 2px; color: var(--negative); }
.errc .w { font-size: 13px; line-height: 20px; font-weight: 600; color: var(--negative); }
.errc .f { font-size: 13px; line-height: 20px; color: var(--ink-2); }
.errc .d { font-size: 13px; line-height: 20px; color: var(--ink-2); }
.errc .no { font-size: 12px; line-height: 16px; color: var(--ink-2); }
.errc > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

/* 올리기 칸 */
.ubox { margin-top: 16px; border-radius: var(--r); background: var(--canvas); padding: 16px 20px; display: grid; gap: 12px; min-width: 0; }
.ubox.stbox { background: var(--surface); border: 1px solid var(--st-line); border-radius: var(--st-r-sm); }
.uhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.uhead h2 { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--ink); }
.uhelp { color: var(--ink-2); }
.ufiles { display: grid; gap: 2px; }
.ufiles .cap { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--muted); }
.ufiles li { display: flex; align-items: center; gap: 8px; color: var(--ink); }
.ufiles li svg { color: var(--muted); }
.uperiod { font-size: 13px; line-height: 20px; color: var(--ink-2); }
.uerp { display: flex; align-items: flex-start; gap: 8px; padding: 10px 14px; border-radius: var(--r); background: var(--warning-soft); color: var(--warning); font-size: 13px; line-height: 20px; font-weight: 500; }
.uerp svg { margin-top: 2px; }
.udrop { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 16px; min-height: 96px; padding: 16px; border: 1.5px dashed var(--line-strong); border-radius: var(--r); background: var(--surface); color: var(--ink-2); }
.udrop.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
.udrop svg { color: var(--muted); }
.upriv { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.ubar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.ubar .grow { flex: 1; min-width: 0; color: var(--ink-2); font-size: 13px; line-height: 20px; }
.ubar h2 { font-size: 15px; line-height: 22px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.uwork { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: var(--r); background: var(--surface); color: var(--ink-2); }
.spin { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* 결과 */
.res { display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); min-width: 0; }
.res-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.res-h b { font-weight: 600; color: var(--ink); }
.res-h span { font-size: 13px; color: var(--muted); }
.rrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); align-items: start; }
.rrow:last-child { border-bottom: 0; }
.rrow .nm { font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
.rrow .kd { display: block; font-size: 13px; line-height: 20px; color: var(--muted); }
.rrow .chip { margin-top: 2px; }
.rrow .below { grid-column: 1 / -1; }
.rrow .note { font-size: 13px; line-height: 20px; color: var(--ink-2); }
.miss { display: grid; gap: 6px; padding: 12px 16px; border-radius: var(--r); background: var(--warning-soft); }
.miss b { font-weight: 600; color: var(--ink); }
.miss p { font-size: 13px; line-height: 20px; color: var(--ink-2); }
.miss li { font-size: 13px; line-height: 20px; color: var(--ink); }
.miss li span { color: var(--ink-2); }
.allok { display: flex; align-items: center; gap: 6px; color: var(--positive); font-weight: 500; }

/* 대시보드 */
.dline { font-size: 13px; line-height: 20px; color: var(--muted); font-weight: 500; }
.hero { margin-top: 8px; max-width: 880px; }
.hero h1 { font-size: 24px; line-height: 32px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
.hero .lead { margin-top: 8px; font-size: 16px; line-height: 24px; color: var(--ink-2); max-width: 64ch; }
.hero .after { margin-top: 16px; }
.shead { margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.shead h1 { font-size: 24px; line-height: 32px; font-weight: 600; color: var(--ink); }
.shead .when { display: flex; min-width: 0; align-items: center; gap: 6px; font-size: 13px; line-height: 20px; color: var(--ink-2); }
.shead .when svg { color: var(--muted); }
.shead .acts { margin-left: auto; display: flex; gap: 8px; }
.sect { margin-top: 48px; border-top: 1px solid var(--line-strong); padding-top: 20px; }
.sect-h { margin-bottom: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.sect-h h2 { font-size: 20px; line-height: 28px; font-weight: 600; color: var(--ink); }
.datec { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--r); font-size: 13px; color: var(--ink); background: var(--surface); }
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.kpi { min-width: 0; border-left: 1px solid var(--line); padding: 16px 20px; }
.kpi:first-child { border-left: 0; padding-left: 0; }
.kpi .l { font-size: 13px; line-height: 20px; color: var(--ink-2); font-weight: 500; }
.kpi .v { margin-top: 4px; font-size: 28px; line-height: 36px; font-weight: 600; color: var(--ink); }
.kpi .v small { margin-left: 2px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.kpi .v.dash { color: var(--faint); }
.kpi .n { margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--muted); }
.kpi .v.up { font-size: 20px; color: var(--positive); }
.rep { margin-top: 20px; display: grid; gap: 4px; max-width: 760px; }
.rep .t { font-size: 13px; line-height: 20px; color: var(--muted); font-weight: 500; }
.rep .f { font-size: 18px; line-height: 28px; font-weight: 600; color: var(--ink); }
.rep .r { color: var(--ink-2); }
.flow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 32px; }
.fpanel { min-width: 0; border-top: 1px solid var(--line); padding-top: 12px; }
.fpanel h3 { font-size: 15px; line-height: 22px; font-weight: 600; color: var(--ink); }
.fpanel .s { font-size: 12px; line-height: 16px; color: var(--muted); }
.bars { margin-top: 12px; height: 120px; display: flex; align-items: flex-end; gap: 6px; border-bottom: 1px solid var(--line); }
.bars i { flex: 1; min-width: 0; background: var(--accent); border-radius: 2px 2px 0 0; opacity: .85; }
.bars i.zero { background: var(--line); height: 2px !important; }
.bars-x { display: flex; gap: 6px; margin-top: 4px; }
.bars-x span { flex: 1; min-width: 0; text-align: center; font-size: 11px; line-height: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.enote { margin-top: 12px; font-size: 14px; line-height: 22px; color: var(--ink-2); }
.enote b { font-weight: 600; color: var(--ink); }

/* 통계 탭 */
.st-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; }
.st-top h1 { font-size: 20px; line-height: 28px; font-weight: 600; color: var(--ink); }
.pchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pchips .cap { font-size: 12px; color: var(--muted); margin-right: 4px; }
.pc { height: 32px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); font-size: 13px; color: var(--ink-2); font-weight: 500; }
.pc[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; box-shadow: inset 0 0 0 1px var(--accent); }
.srcline { margin-top: 12px; font-size: 13px; line-height: 20px; color: var(--st-ink-2); }
.srcline b { font-weight: 600; color: var(--st-ink); }
.cards { margin-top: 24px; display: grid; gap: 20px; }
.card { min-width: 0; border-radius: var(--st-r); background: var(--surface); padding: 20px 24px; box-shadow: var(--st-card-shadow); }
.card-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.card-h h2 { font-size: 18px; line-height: 28px; font-weight: 600; color: var(--st-ink); }
.card-h .d { font-size: 13px; color: var(--st-muted); }
.card-b { margin-top: 16px; }
.card-b > * + * { margin-top: 24px; border-top: 1px solid var(--st-line); padding-top: 20px; }
.sub-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.sub-h h3 { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--st-ink); }
.sub-h .d { font-size: 13px; color: var(--st-muted); }
.sumcells { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.sumcells > div { min-width: 0; padding: 4px 20px; border-left: 1px solid var(--st-line); }
.sumcells > div:first-child { border-left: 0; padding-left: 0; }
.sumcells .l { font-size: 13px; color: var(--st-ink-2); font-weight: 500; }
.sumcells .v { margin-top: 2px; font-size: 28px; line-height: 36px; font-weight: 600; color: var(--st-ink); }
.sumcells .v small { margin-left: 2px; font-size: 14px; color: var(--st-ink-2); }
.sumcells .v.dash { color: var(--faint); }
.sumcells .n { font-size: 12px; line-height: 16px; color: var(--st-muted); }
.tablist { margin-top: 8px; display: flex; gap: 24px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.tab { position: relative; height: 40px; padding: 0; border: 0; background: none; font-size: 14px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.tab[aria-selected="true"] { font-weight: 600; color: var(--ink); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--accent); }
.tlead { margin-top: 12px; font-size: 13px; line-height: 20px; color: var(--st-muted); }
.covl { margin-top: 8px; font-size: 13px; line-height: 20px; color: var(--st-ink-2); }
.tbw { margin-top: 12px; min-width: 0; overflow-x: auto; }
.tb { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 20px; }
.tb th { height: 36px; padding: 0 12px; border-bottom: 1px solid var(--st-line); text-align: left; font-weight: 500; color: var(--st-muted); white-space: nowrap; }
.tb td { height: 40px; padding: 0 12px; border-bottom: 1px solid var(--st-line); white-space: nowrap; color: var(--st-ink); }
.tb th:first-child, .tb td:first-child { padding-left: 0; }
.tb th.num, .tb td.num { text-align: right; }
.tb tr.sum td { font-weight: 600; border-bottom: 0; }
.tb tr.oth td { color: var(--st-ink-2); }
.tb td.dash { color: var(--faint); }
.tb td.code { font-weight: 600; }
.tfoot { margin-top: 8px; font-size: 13px; line-height: 20px; color: var(--st-muted); }
.agebar { display: inline-block; height: 8px; border-radius: 2px; background: var(--st-h4); vertical-align: middle; margin-left: 8px; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.three > div { min-width: 0; }
.mini-l { font-size: 13px; font-weight: 500; color: var(--st-ink-2); }
.mini-v { margin-top: 2px; font-size: 24px; line-height: 32px; font-weight: 600; color: var(--st-ink); }
.mini-n { font-size: 12px; color: var(--st-muted); }
.opsrow { display: flex; gap: 32px; }
.opsrow > div { flex: 1; min-width: 0; }
.wkbars { margin-top: 12px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 96px; }
.wkbars i { display: block; background: var(--st-h4); border-radius: 2px 2px 0 0; }
.wkx { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-top: 4px; font-size: 11px; color: var(--st-muted); text-align: center; }
.rx-notes { margin-top: 8px; }

/* 관리자 비교 */
.adm-loc { font-size: 13px; line-height: 20px; font-weight: 600; color: var(--muted); }
.adm-h1 { margin-top: 4px; font-size: 20px; line-height: 28px; font-weight: 600; color: var(--ink); }
.pick-row { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.selbox { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); }
.selbox .k { font-size: 12px; color: var(--muted); }

function render() {
  const main = document.getElementById('main'), wrap = document.getElementById('mainwrap')
  wrap.className = ''
  if (S === 'stats' || S === 'stats-gap') { frame('통계'); wrap.className = 'stbg'; main.innerHTML = S === 'stats' ? stats() : statsGap() }
  else if (S === 'monthly') { frame('통계'); wrap.className = 'stbg'; main.innerHTML = monthly() }
  else if (S === 'ai') { frame(''); wrap.className = 'stbg'; main.innerHTML = aiPage() }
  else if (S === 'admin') { frame('관리자'); main.innerHTML = admin() }
  else {
    frame('대시보드')
    if (S === 'dash-empty') main.innerHTML = dashStart(openBox())
    else if (S === 'reading') main.innerHTML = dashStart(openBox({ phase: 'reading', n: 4 }))
    else if (S === 'dash-missing') main.innerHTML = dashStart(openBox({ rows: R.missing, miss: MISS.missing }))
    else if (S === 'dash-ok') main.innerHTML = dashData(foldedBox({ rows: R.ok, miss: [] }))
    else if (S === 'refused') main.innerHTML = dashData(foldedBox({ rows: R.refused, miss: MISS.refused }))
    else main.innerHTML = dashData(foldedBox())
  }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]')
  if (!t) { if (e.target.closest('a[href="#"]')) e.preventDefault(); return }
  e.preventDefault()
  const a = t.dataset.act
  if (a === 'help') { st.help = !st.help; render() }
  else if (a === 'rxtab') { st.rxTab = +t.dataset.i; render() }
  else if (a === 'revtab') { st.revTab = +t.dataset.i; render() }
  else if (a === 'pick') { location.search = '?s=reading' }
})
document.addEventListener('dragover', e => { if (e.target.closest('[data-drop]')) { e.preventDefault(); if (!st.drag) { st.drag = true; render() } } })
document.addEventListener('dragleave', e => { if (st.drag && !e.relatedTarget) { st.drag = false; render() } })
document.addEventListener('drop', e => { if (e.target.closest('[data-drop]')) { e.preventDefault(); location.search = '?s=reading' } })
render()
</script>
