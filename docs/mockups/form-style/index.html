<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서식 글씨·로고 조절 시안</title>
<!-- spec form-style 시안. 진료일정 안내·환자 안내문 편집 칸 아래 '글씨·로고' 칸과 미리보기. 그림은 실제 배치 값(진료일정안내 120·안내 두 줄 27·카드 이름 46·상태 50, 안내문 큰 문구 109·줄 글 34)을 줄여 그린 것.
     ?logo=<파일>로 로고, ?s=<상태>로 처음 값(default|big|small|dark) -->
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e3e6eb; --ink:#1f2328; --sub:#5b636e; --accent:#2563eb; --soft:#eff4ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p.lead { margin: 0 0 16px; color: var(--sub); font-size: 14px; line-height: 1.6; }
  .tabs { display:flex; gap:0; margin-bottom: 14px; }
  .tabs button { border:1px solid var(--line); background:#fff; padding:8px 14px; font-size:14px; cursor:pointer; }
  .tabs button:first-child { border-radius:8px 0 0 8px; } .tabs button:last-child { border-radius:0 8px 8px 0; border-left:0; }
  .tabs button[aria-pressed="true"] { background:var(--soft); color:var(--accent); font-weight:700; }
  .grid { display:grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items:start; }
  .panel, .preview { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  fieldset { border:1px solid var(--line); border-radius:10px; padding: 10px 14px 14px; margin:0; }
  legend { font-size: 12px; color: var(--sub); padding: 0 4px; }
  .row { padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .row:last-of-type { border-bottom: 0; }
  .row h3 { font-size: 14px; margin: 0 0 8px; }
  .ctl { display:flex; flex-wrap:wrap; align-items:center; gap: 8px 12px; }
  .ctl label.size { display:flex; align-items:center; gap:8px; font-size: 13px; color: var(--sub); min-width: 240px; flex:1; }
  .ctl input[type=range] { flex:1; min-width: 120px; accent-color: var(--accent); }
  .ctl output { font-weight:700; color: var(--ink); min-width: 44px; text-align:right; font-variant-numeric: tabular-nums; }
  .seg { display:inline-flex; }
  .seg button { border:1px solid var(--line); background:#fff; padding:6px 10px; font-size:13px; cursor:pointer; }
  .seg button + button { border-left: 0; }
  .seg button:first-child { border-radius:6px 0 0 6px; } .seg button:last-child { border-radius:0 6px 6px 0; }
  .seg button[aria-pressed="true"] { background: var(--soft); color: var(--accent); font-weight:700; }
  input[type=color] { width: 40px; height: 30px; border:1px solid var(--line); border-radius:6px; padding:2px; background:#fff; }
  .swatches { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:8px; width:100%; }
  .swatches .group { font-size: 11px; color: var(--sub); margin-right: 2px; }
  .swatches .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  .sw { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(0,0,0,.18); cursor: pointer; padding:0; }
  .sw[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
  .help { font-size: 12px; color: var(--sub); margin: 8px 0 0; line-height:1.5; }
  .reset { margin-top: 10px; border:1px solid var(--line); background:#fff; border-radius:6px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .preview h2 { font-size: 13px; margin: 0 0 8px; } .preview h2 small { color: var(--sub); font-weight: 400; }
  .preview svg { width:100%; height:auto; display:block; border:1px solid var(--line); }
  .bgtoggle { font-size: 12px; color: var(--sub); margin-top: 8px; display:flex; gap:6px; align-items:center; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>서식 글씨·로고 조절</h1>
  <p class="lead">진료일정 안내와 환자 안내문 편집 칸 맨 아래에 <b>'글씨·로고'</b> 칸이 생겨요. 제목 글씨·본문 글씨·로고의 크기를 밀어서 %로 바꾸고, 색은 <b>로고에서 뽑은 색</b>, <b>기본 색 16가지</b>, <b>직접 고르기</b> 중에서 골라요. 진료일정 안내의 '글자 색'은 '강조 색'이 되어 이 칸으로 옮겨 와요. 고른 값은 그 서식과 함께 저장돼요.</p>
  <div class="tabs" role="group" aria-label="서식">
    <button type="button" id="tab-notice" aria-pressed="true">진료일정 안내</button>
    <button type="button" id="tab-guide" aria-pressed="false">환자 안내문</button>
  </div>
  <div class="grid">
    <div class="panel">
      <fieldset>
        <legend>글씨·로고</legend>
        <div class="row" data-part="title">
          <h3>제목 글씨</h3>
          <div class="ctl">
            <label class="size">크기 <input type="range" min="80" max="130" step="5" value="100" aria-label="제목 글씨 크기"><output>100%</output></label>
          </div>
          <div class="swatches" data-first="자동" data-label="제목 글씨 색"></div>
        </div>
        <div class="row" data-part="body">
          <h3>본문 글씨</h3>
          <div class="ctl">
            <label class="size">크기 <input type="range" min="80" max="130" step="5" value="100" aria-label="본문 글씨 크기"><output>100%</output></label>
          </div>
          <div class="swatches" data-first="자동" data-label="본문 글씨 색"></div>
        </div>
        <div class="row" data-part="accent">
          <h3>강조 색 <small style="font-weight:400;color:var(--sub)">'N월'·날짜 띠·상태 글씨 — 지금 '배경' 칸의 '글자 색'이 이리로 옮겨 와요</small></h3>
          <div class="swatches" data-first="자동" data-label="강조 색"></div>
        </div>
        <div class="row" data-part="logo">
          <h3>로고</h3>
          <div class="ctl">
            <label class="size">크기 <input type="range" min="60" max="150" step="5" value="100" aria-label="로고 크기"><output>100%</output></label>
          </div>
          <div class="swatches" data-first="원래 색" data-label="로고 색"></div>
        </div>
        <p class="help" id="help"></p>
        <button type="button" class="reset" id="reset">처음대로</button>
      </fieldset>
    </div>
    <div class="preview">
      <h2>미리보기 <small>A4 세로</small></h2>
      <svg id="poster" viewBox="0 0 794 1123"></svg>
      <label class="bgtoggle" id="bgwrap"><input type="checkbox" id="darkbg"> (시안에서만) 어두운 AI 배경으로 보기</label>
    </div>
  </div>
</main>
<script>
// ---- logo-fit 규칙(선 떼기·흰 배경 지우기·자르기) — docs/mockups/logo-fit와 같다 ----
const WHITE_MIN = 230, OPAQUE_MIN = 200, BORDER_SHARE = 0.9, EDGE_MIN = 200, ALPHA_MIN = 16, PEEL_MAX = 3, PEEL_OUTER = 0.5
function peel({ data, width: w, height: h }) {
  const near = (x, y) => { const i = (y * w + x) * 4; return data[i + 3] >= OPAQUE_MIN && Math.min(data[i], data[i + 1], data[i + 2]) >= WHITE_MIN }
  let x0 = 0, x1 = w - 1, y0 = 0, y1 = h - 1
  const rs = (y) => { let n = 0; for (let x = x0; x <= x1; x++) n += near(x, y); return n / (x1 - x0 + 1) }
  const cs = (x) => { let n = 0; for (let y = y0; y <= y1; y++) n += near(x, y); return n / (y1 - y0 + 1) }
  const k = (share, line, step, len) => { for (let k = 1; k <= PEEL_MAX; k++) { if (len - k < 3) return 0; if (share(line + (k - 1) * step) >= PEEL_OUTER) return 0; if (share(line + k * step) >= BORDER_SHARE) return k } return 0 }
  y0 += k(rs, y0, 1, y1 - y0 + 1); y1 -= k(rs, y1, -1, y1 - y0 + 1); x0 += k(cs, x0, 1, x1 - x0 + 1); x1 -= k(cs, x1, -1, x1 - x0 + 1)
  const tw = x1 - x0 + 1, th = y1 - y0 + 1, out = new Uint8ClampedArray(tw * th * 4)
  for (let y = 0; y < th; y++) out.set(data.subarray(((y0 + y) * w + x0) * 4, ((y0 + y) * w + x1 + 1) * 4), y * tw * 4)
  return { data: out, width: tw, height: th }
}
function clearWhite({ data, width: w, height: h }) {
  const out = new Uint8ClampedArray(data)
  const near = (i) => out[i * 4 + 3] >= OPAQUE_MIN && Math.min(out[i * 4], out[i * 4 + 1], out[i * 4 + 2]) >= WHITE_MIN
  const border = []; for (let x = 0; x < w; x++) { border.push(x); if (h > 1) border.push((h - 1) * w + x) } for (let y = 1; y < h - 1; y++) { border.push(y * w); if (w > 1) border.push(y * w + w - 1) }
  if (border.filter(near).length / border.length < BORDER_SHARE) return { data: out, width: w, height: h }
  const seen = new Uint8Array(w * h), st = new Int32Array(w * h); let t = 0
  for (const i of border) if (!seen[i] && near(i)) { seen[i] = 1; st[t++] = i }
  while (t > 0) { const i = st[--t], x = i % w, y = (i - x) / w; for (const j of [x > 0 ? i - 1 : -1, x < w - 1 ? i + 1 : -1, y > 0 ? i - w : -1, y < h - 1 ? i + w : -1]) if (j >= 0 && !seen[j] && near(j)) { seen[j] = 1; st[t++] = j } }
  const a0 = new Uint8ClampedArray(w * h); for (let i = 0; i < w * h; i++) a0[i] = out[i * 4 + 3]
  for (let i = 0; i < w * h; i++) { if (seen[i]) { out[i * 4 + 3] = 0; continue } const x = i % w, y = (i - x) / w; const tc = (x > 0 && seen[i - 1]) || (x < w - 1 && seen[i + 1]) || (y > 0 && seen[i - w]) || (y < h - 1 && seen[i + w]); const m = Math.min(out[i * 4], out[i * 4 + 1], out[i * 4 + 2]); if (tc && m >= EDGE_MIN) out[i * 4 + 3] = Math.max(0, Math.min(255, Math.round(a0[i] * (255 - m) / 55))) }
  return { data: out, width: w, height: h }
}
function trim({ data, width: w, height: h }) {
  let x0 = w, y0 = h, x1 = -1, y1 = -1
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (data[(y * w + x) * 4 + 3] >= ALPHA_MIN) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y }
  if (x1 < 0) return null
  const tw = x1 - x0 + 1, th = y1 - y0 + 1, out = new Uint8ClampedArray(tw * th * 4)
  for (let y = 0; y < th; y++) out.set(data.subarray(((y0 + y) * w + x0) * 4, ((y0 + y) * w + x0 + tw) * 4), y * tw * 4)
  return { data: out, width: tw, height: th }
}
const r1 = (v) => Math.round(v * 10) / 10
function logoRect(area, size) { const s = Math.min(area.width / size.width, area.height / size.height); const w = size.width * s, h = size.height * s; return { x: area.x + area.width / 2 - w / 2, y: area.y + area.height / 2 - h / 2, width: w, height: h } }
// 로고 크기 %: 맞춘 네모를 가운데 기준으로 키우고 줄인다. 큰 쪽 한도 안으로(휴진 안내 600×130, 안내문 692×140)
function scaleRect(r, pct, max) {
  let s = pct / 100; s = Math.min(s, max.width / r.width, max.height / r.height, Math.max(s, 0))
  const w = r.width * s, h = r.height * s, cx = r.x + r.width / 2, cy = r.y + r.height / 2
  return { x: r1(cx - w / 2), y: r1(cy - h / 2), width: r1(w), height: r1(h) }
}

// ---- 상태 ----
const DEF = { title: { scale: 100, color: null }, body: { scale: 100, color: null }, accent: { color: null }, logo: { scale: 100, color: null } }
let tool = 'notice'
const styles = { notice: structuredClone(DEF), guide: structuredClone(DEF) }
let logo = null
const AUTO = { notice: { title: '#262626', body: '#3a3a3a' }, guide: { title: '#1f2a44', body: '#ffffff' } }

// ---- 그리기 ----
const NS = 'http://www.w3.org/2000/svg'
function el(name, attrs, parent, text) { const e = document.createElementNS(NS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; parent.appendChild(e); return e }
const FONT = '"Pretendard","Malgun Gothic",sans-serif'
const ctx = document.createElement('canvas').getContext('2d')
function textW(text, size, weight = 900, spacing = 0) { ctx.font = `${weight} ${size}px ${FONT}`; return ctx.measureText(text).width + spacing * size * text.length }
function fit(text, size, room, weight, spacing, min = 18) { let s = size; while (s > min && textW(text, s, weight, spacing) > room) s -= 1; return s }
function T(svg, x, y, size, weight, fill, text, anchor = 'middle', spacing = 0) { return el('text', { x, y, 'font-size': size, 'font-weight': weight, fill, 'text-anchor': anchor, 'dominant-baseline': 'central', 'font-family': FONT, 'letter-spacing': spacing + 'em' }, svg, text) }
function drawLogo(svg, area, st, fallback) {
  if (!logo) return
  const base = logoRect(area, logo)
  const r = scaleRect(base, st.logo.scale, fallback)
  let filter = null
  if (st.logo.color && !logoLocked) {
    const d = el('defs', {}, svg); const f = el('filter', { id: 'tint', x: 0, y: 0, width: 1, height: 1 }, d)
    el('feFlood', { 'flood-color': st.logo.color, result: 'c' }, f); el('feComposite', { in: 'c', in2: 'SourceAlpha', operator: 'in' }, f); filter = 'url(#tint)'
  }
  const im = el('image', { href: logo.url, x: r.x, y: r.y, width: r.width, height: r.height, preserveAspectRatio: 'xMidYMid meet' }, svg)
  if (filter) im.setAttribute('filter', filter)
}
function drawNotice(svg, st) {
  const dark = document.getElementById('darkbg').checked
  const ts = st.title.scale / 100, bs = st.body.scale / 100
  const auto = autoColors()
  const titleC = st.title.color || auto.title, bodyC = st.body.color || AUTO.notice.body, nameC = st.body.color || '#262626', accent = st.accent.color || auto.accent
  if (dark) {
    el('rect', { x: 0, y: 0, width: 794, height: 1123, fill: '#1c1c1a' }, svg)
    for (const [cx, cy, r, c] of [[40, 200, 120, '#3f6b35'], [760, 140, 110, '#f1efd6'], [60, 1060, 110, '#f1efd6'], [740, 1040, 120, '#3f6b35']]) el('circle', { cx, cy, r, fill: c, opacity: .85 }, svg)
    el('rect', { x: 64, y: 70, width: 666, height: 770, rx: 40, fill: '#fff', 'fill-opacity': .55 }, svg)
  } else {
    el('rect', { x: 0, y: 0, width: 794, height: 1123, fill: '#fff8ec' }, svg)
    el('path', { d: 'M0 1123 L0 1000 Q140 950 260 1020 Q330 1070 380 1123 Z', fill: '#f4c95d', opacity: .7 }, svg)
    el('path', { d: 'M794 1123 L794 980 Q680 950 590 1030 Q530 1090 500 1123 Z', fill: '#e88d67', opacity: .6 }, svg)
  }
  T(svg, 397, 170, 54, 900, accent, '11월')
  T(svg, 397, 296, fit('진료일정안내', Math.round(120 * ts), 746, 900, -0.045), 900, titleC, '진료일정안내', 'middle', -0.045)
  const lead = Math.round(27 * bs)
  T(svg, 397, 417, fit('11월 진료일정을 안내드리오니', lead, 746, 700), 700, bodyC, '11월 진료일정을 안내드리오니')
  T(svg, 397, 459, fit('진료 및 내원에 참고해주시길 바랍니다', lead, 746, 700), 700, bodyC, '진료 및 내원에 참고해주시길 바랍니다')
  const cards = [['11월 19일 (수)', '휴진', '종일'], ['11월 26일 (수)', '단축진료', '오후 1시까지']]
  cards.forEach(([date, name, status], i) => {
    const x = 61 + i * (318 + 36), y = 534, w = 318, headH = 79, bodyH = 224, inner = w - 32
    el('rect', { x, y, width: w, height: headH + bodyH, rx: 22, fill: '#fff' }, svg)
    el('path', { d: `M${x} ${y + 22} Q${x} ${y} ${x + 22} ${y} L${x + w - 22} ${y} Q${x + w} ${y} ${x + w} ${y + 22} L${x + w} ${y + headH} L${x} ${y + headH} Z`, fill: accent }, svg)
    T(svg, x + w / 2, y + headH / 2, Math.min(fit(date, Math.round(33 * bs), inner, 700), Math.floor(headH * 0.6)), 700, '#fff', date)
    T(svg, x + w / 2, y + headH + bodyH * 0.3, Math.min(fit(name, Math.round(46 * bs), inner), Math.floor(bodyH * 0.37)), 900, nameC, name, 'middle', -0.03)
    T(svg, x + w / 2, y + headH + bodyH * 0.67, Math.min(fit(status, Math.round(50 * bs), inner), Math.floor(bodyH * 0.37)), 900, accent, status, 'middle', 0.02)
  })
  drawLogo(svg, { x: 227, y: 990, width: 340, height: 100 }, st, { width: 600, height: 130 })
}
function drawGuide(svg, st) {
  const ts = st.title.scale / 100, bs = st.body.scale / 100
  const Y = '#2f6fd6', D = '#1f2a44', W = '#ffffff'
  const titleC = st.title.color || AUTO.guide.title, bodyC = st.body.color || AUTO.guide.body
  el('rect', { x: 0, y: 0, width: 794, height: 666, fill: Y }, svg)
  el('rect', { x: 0, y: 666, width: 794, height: 288, fill: D }, svg)
  el('rect', { x: 0, y: 954, width: 794, height: 169, fill: W }, svg)
  el('rect', { x: 51, y: 41, width: 230, height: 65, rx: 32.5, fill: D }, svg)
  T(svg, 166, 73.5, 34, 900, Y, '도수치료 안내')
  T(svg, 51, 161.5, 44, 900, D, '처음 오신 분께', 'start')
  const big = Math.min(Math.min(fit('편한 옷차림으로', Math.round(109 * ts), 692, 900, -0.03, 72), fit('와 주세요', Math.round(109 * ts), 692, 900, -0.03, 72)), 116)
  T(svg, 51, 260, big, 900, titleC, '편한 옷차림으로', 'start', -0.03)
  T(svg, 51, 382, big, 900, titleC, '와 주세요', 'start', -0.03)
  el('rect', { x: 51, y: 470, width: 300, height: 120, rx: 22, fill: W }, svg)
  T(svg, 84, 506, 26, 700, D, '치료 시간 약 30분', 'start'); T(svg, 84, 552, 36, 900, D, '예약 후 방문', 'start')
  T(svg, 51, 700, 34, 900, Y, '오시기 전에 확인해 주세요', 'start')
  const rows = ['치료 10분 전까지 와 주세요', '식사는 1시간 전에 마쳐 주세요', '금속 장신구는 빼 주세요']
  const rowH = 60, font = Math.min(Math.round(34 * bs), Math.floor(rowH / 1.35)) // 줄 높이보다 크게는 안 커진다
  rows.forEach((t, i) => { const y = 740 + rowH * (i + 0.5); T(svg, 51, y, font + 2, 900, Y, '✓', 'start'); T(svg, 51 + 0.855 * (font + 2) + 12, y, fit(t, font, 640, 900, 0, 26), 900, bodyC, t, 'start') })
  T(svg, 51, 936, 22, 700, '#c9cfdb', '※ 궁금한 점은 접수처에 물어보세요', 'start')
  drawLogo(svg, { x: 197, y: 984, width: 400, height: 110 }, st, { width: 692, height: 140 })
}
function draw() {
  const svg = document.getElementById('poster'); svg.innerHTML = ''
  const st = styles[tool]
  if (tool === 'notice') drawNotice(svg, st); else drawGuide(svg, st)
  document.getElementById('bgwrap').hidden = tool !== 'notice'
  document.getElementById('help').textContent = tool === 'notice'
    ? "제목은 '진료일정안내', 본문은 위 안내 두 줄과 카드 속 글씨예요. 본문 색은 안내 두 줄과 카드 이름에 들고, 'N월'·날짜 띠·상태 글씨는 '강조 색'을 따라요. [자동]은 로고가 있으면 로고 색이에요. 자리보다 크게는 커지지 않아요."
    : '제목은 큰 문구 두 줄, 본문은 진회색 띠 안의 줄 글이에요. [자동]이면 제목은 띠 색, 본문은 흰색이에요. 자리보다 크게는 커지지 않아요.'
}
// 기본 색 16가지(이름은 색 칩 aria-label)
const BASIC = [['검정', '#111111'], ['진회색', '#3a3a3a'], ['회색', '#6b7280'], ['흰색', '#ffffff'], ['남색', '#1f2a44'], ['파랑', '#2563eb'], ['하늘', '#0ea5e9'], ['청록', '#0d9488'],
  ['초록', '#16a34a'], ['연두', '#65a30d'], ['노랑', '#eab308'], ['주황', '#f97316'], ['빨강', '#dc2626'], ['분홍', '#db2777'], ['보라', '#7c3aed'], ['갈색', '#92400e']]
let logoSwatches = []
let logoLocked = false // 배경이 남은 로고(투명 점 10% 미만): 로고 색을 칠하지 않고 고르기를 막는다(?s=locked)
// 로고 색: 불투명 점(불투명도 200 이상, 옅은 점 뺌)을 4비트로 묶어 많이 쓴 차례로, 서로 멀리 떨어진(거리 60 이상) 색 4개까지
function swatchesOf({ data, width, height }) {
  const bins = new Map()
  for (let i = 0; i < width * height; i++) {
    const r = data[i * 4], g = data[i * 4 + 1], b = data[i * 4 + 2], a = data[i * 4 + 3]
    if (a < 200 || Math.min(r, g, b) >= 200) continue // 글자로 쓰기엔 너무 옅은 색(연회색 등)은 뺀다
    const k = (r >> 4) << 8 | (g >> 4) << 4 | (b >> 4)
    const v = bins.get(k) || [0, 0, 0, 0]; v[0] += r; v[1] += g; v[2] += b; v[3]++; bins.set(k, v)
  }
  const list = [...bins.values()].sort((x, y) => y[3] - x[3]).map((v) => [v[0] / v[3], v[1] / v[3], v[2] / v[3]])
  const out = []
  for (const c of list) { if (out.every((o) => Math.hypot(o[0] - c[0], o[1] - c[1], o[2] - c[2]) >= 60)) out.push(c); if (out.length === 4) break }
  return out.map((c) => '#' + c.map((v) => Math.round(v).toString(16).padStart(2, '0')).join(''))
}
function chooser(part) {
  const box = document.querySelector(`.row[data-part="${part}"] .swatches`)
  const st = styles[tool][part], c = st.color
  box.innerHTML = ''
  const seg = document.createElement('span'); seg.className = 'seg'
  const first = document.createElement('button'); first.type = 'button'; first.textContent = box.dataset.first; first.setAttribute('aria-pressed', String(c === null))
  first.onclick = () => { st.color = null; sync() }
  seg.appendChild(first); box.appendChild(seg)
  const chip = (name, hex) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'sw'; b.style.background = hex; b.title = name; b.setAttribute('aria-label', `${box.dataset.label} ${name}`); b.setAttribute('aria-pressed', String(c === hex)); b.onclick = () => { st.color = hex; sync() }; return b }
  if (logoSwatches.length) {
    const g = document.createElement('span'); g.className = 'group'; g.textContent = '로고 색'; box.appendChild(g)
    logoSwatches.forEach((hex, i) => box.appendChild(chip(`로고 색 ${i + 1}`, hex)))
    const sep = document.createElement('span'); sep.className = 'sep'; box.appendChild(sep)
  }
  const g2 = document.createElement('span'); g2.className = 'group'; g2.textContent = '기본 색'; box.appendChild(g2)
  BASIC.forEach(([name, hex]) => box.appendChild(chip(name, hex)))
  const sep = document.createElement('span'); sep.className = 'sep'; box.appendChild(sep)
  const pick = document.createElement('label'); pick.className = 'group'; pick.style.display = 'inline-flex'; pick.style.gap = '6px'; pick.style.alignItems = 'center'
  pick.append('직접 고르기')
  const input = document.createElement('input'); input.type = 'color'; input.value = c || '#1f2a44'; input.setAttribute('aria-label', `${box.dataset.label} 직접 고르기`)
  const known = c === null || logoSwatches.includes(c) || BASIC.some(([, h]) => h === c)
  if (!known) input.style.outline = '2px solid var(--accent)'
  input.oninput = (e) => { st.color = e.target.value; sync() }
  pick.appendChild(input); box.appendChild(pick)
  const row = box.parentElement
  row.querySelector('.lock-help')?.remove()
  if (part === 'logo' && logoLocked) {
    box.querySelectorAll('button, input').forEach((e) => { e.disabled = true })
    box.style.opacity = '.5'
    const help = document.createElement('p'); help.className = 'help lock-help'
    help.textContent = '배경이 있는 로고라 색을 바꿀 수 없어요. 원래 색으로 그려요'
    row.appendChild(help)
  } else box.style.opacity = ''
}
function sync() {
  const st = styles[tool]
  document.querySelector('.row[data-part="accent"]').hidden = tool !== 'notice'
  for (const part of tool === 'notice' ? ['title', 'body', 'accent', 'logo'] : ['title', 'body', 'logo']) {
    const row = document.querySelector(`.row[data-part="${part}"]`)
    const range = row.querySelector('input[type=range]')
    if (range) { range.value = st[part].scale; row.querySelector('output').textContent = st[part].scale + '%' }
    chooser(part)
  }
  draw()
}
// [자동] 색: 로고에 색이 있으면 로고 색(제목 = 로고 색상의 아주 진한 색, 강조 = 로고 색을 흰 바탕에서 읽히게), 없으면 지금 색
function autoColors() {
  const vivid = [...logoSwatches].filter((h) => satOf(h) >= 0.25).sort((a, b) => satOf(b) - satOf(a))[0]
  if (!vivid) return { title: AUTO.notice.title, accent: '#2f6fd6' }
  const v = [1, 3, 5].map((i) => parseInt(vivid.slice(i, i + 2), 16) / 255), mx = Math.max(...v), mn = Math.min(...v), d = mx - mn
  const h = d === 0 ? 0 : mx === v[0] ? 60 * (((v[1] - v[2]) / d + 6) % 6) : mx === v[1] ? 60 * ((v[2] - v[0]) / d + 2) : 60 * ((v[0] - v[1]) / d + 4)
  const l = 0.16, sat = 0.35, c = (1 - Math.abs(2 * l - 1)) * sat, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = l - c / 2
  const rgb = [[c, x, 0], [x, c, 0], [0, c, x], [0, x, c], [x, 0, c], [c, 0, x]][Math.floor(h / 60) % 6].map((q) => Math.round((q + m) * 255))
  return { title: '#' + rgb.map((q) => q.toString(16).padStart(2, '0')).join(''), accent: readable(vivid) }
}
// 흰 바탕과 대비가 3:1보다 모자라면 색상은 그대로 두고 어둡게(한 번에 2%씩)
function relLum(hex) { const v = [1, 3, 5].map((i) => { const c = parseInt(hex.slice(i, i + 2), 16) / 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4 }); return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2] }
function readable(hex) {
  let v = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16))
  const toHex = (a) => '#' + a.map((x) => Math.round(x).toString(16).padStart(2, '0')).join('')
  for (let n = 0; n < 50 && 1.05 / (relLum(toHex(v)) + 0.05) < 3; n++) v = v.map((x) => x * 0.98)
  return toHex(v)
}
function lumOf(hex) { const v = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16)); return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2] }
function satOf(hex) { const v = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16)); const mx = Math.max(...v), mn = Math.min(...v); return mx === 0 ? 0 : (mx - mn) / mx }

for (const part of ['title', 'body', 'logo']) {
  const row = document.querySelector(`.row[data-part="${part}"]`)
  row.querySelector('input[type=range]').addEventListener('input', (e) => { styles[tool][part].scale = Number(e.target.value); sync() })
}
document.getElementById('reset').addEventListener('click', () => { styles[tool] = structuredClone(DEF); sync() })
document.getElementById('darkbg').addEventListener('change', draw)
for (const [id, t] of [['tab-notice', 'notice'], ['tab-guide', 'guide']]) document.getElementById(id).addEventListener('click', () => {
  tool = t; document.getElementById('tab-notice').setAttribute('aria-pressed', String(t === 'notice')); document.getElementById('tab-guide').setAttribute('aria-pressed', String(t === 'guide')); sync()
})

// ---- 로고 준비 ----
const load = (src) => new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = src })
function fakeLogo() {
  const c = document.createElement('canvas'); c.width = 1080; c.height = 500
  const g = c.getContext('2d'); g.fillStyle = '#f5f5f5'; g.fillRect(0, 0, 1080, 500)
  g.fillStyle = '#d9d21f'; g.beginPath(); g.roundRect(455, 40, 170, 200, 40); g.fill()
  g.fillStyle = '#f5f5f5'; g.beginPath(); g.arc(540, 140, 38, 0, Math.PI * 2); g.fill()
  g.fillStyle = '#333'; g.font = '900 104px "Malgun Gothic", sans-serif'; g.textAlign = 'center'; g.fillText('가상정형외과의원', 540, 390)
  return c.toDataURL('image/png')
}
;(async () => {
  const q = new URLSearchParams(location.search)
  try {
    const im = await load(q.get('logo') || fakeLogo())
    const s = Math.min(1, 1200 / Math.max(im.naturalWidth, im.naturalHeight))
    const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s)
    const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(im, 0, 0, c.width, c.height)
    const raw = { data: g.getImageData(0, 0, c.width, c.height).data, width: c.width, height: c.height }
    const t = q.get('s') === 'locked' ? raw : trim(clearWhite(peel(raw)))
    if (t) { logoSwatches = swatchesOf(t); const o = document.createElement('canvas'); o.width = t.width; o.height = t.height; o.getContext('2d').putImageData(new ImageData(t.data, t.width, t.height), 0, 0); logo = { url: o.toDataURL('image/png'), width: t.width, height: t.height } }
  } catch { logo = null }
  const s = q.get('s')
  if (s === 'big') { for (const k of ['notice', 'guide']) { styles[k].title.scale = 120; styles[k].body.scale = 125; styles[k].logo.scale = 140 } }
  if (s === 'small') { for (const k of ['notice', 'guide']) { styles[k].title.scale = 85; styles[k].body.scale = 85; styles[k].logo.scale = 70 } }
  if (s === 'locked') { logoLocked = true; styles.notice.logo.color = '#ffffff' }
  if (s === 'dark') { document.getElementById('darkbg').checked = true; styles.notice.logo.color = '#ffffff'; styles.notice.title.color = '#1f2a44'; styles.notice.body.color = '#dc2626' }
  if (q.get('tool') === 'guide') document.getElementById('tab-guide').click()
  sync()
  document.body.dataset.ready = '1'
})()
</script>
