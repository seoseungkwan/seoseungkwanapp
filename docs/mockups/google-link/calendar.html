<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구글 캘린더 잇기 시안</title>
<!--
  예약 탭 ↔ 병원 구글 캘린더 양쪽 잇기(google-link) 클릭 시안. 결정·기본값·화면 글은 notes-calendar.md.
  ?s=connect · import · colors · rules · week(기본) · detail · fix · err · staff
  2차 고침(2026-11-26, 승인 전): ?s=fix-range · fix-skipall · colors-reread, week의 취소 칸(진한 토마토, 흐리게 칠하지 않음)
  모양은 승인된 예약 탭 시안(docs/mockups/clinic-calendar)과 앱 토큰(src/app/globals.css :root) 그대로이고,
  예약 색만 구글 캘린더 일정 색 11가지(+ 캘린더 기본 색)로 바꿨다. PC 화면만 그린다(폰 전용 모양 없음).
  이름·차트번호·주소·비밀 글자는 모두 지어낸 값이다. 어디로도 보내지 않는다.
-->
<style>
/* ───── 예약 탭 시안(clinic-calendar/index.html)에서 그대로 가져온 모양 ───── */
:root {
  --canvas: #F7F8FA; --surface: #FFFFFF; --line: #E5E7EB; --line-strong: #D1D5DB; --faint: #9CA3AF;
  --muted: #6B7280; --ink-2: #374151; --ink: #111827; --accent: #2563EB; --accent-strong: #1D4ED8; --accent-soft: #EAF1FE;
  --positive: #15803D; --positive-soft: #ECF7EF; --negative: #C2410C; --negative-soft: #FDF0EA;
  --warning: #B45309; --warning-soft: #FDF4E3; --r: 4px; --r-float: 8px;
  --elev: 0 1px 2px rgb(17 24 39 / 6%), 0 6px 16px rgb(17 24 39 / 10%);
  --ui: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --slot: 20px; /* 10분 한 칸 */
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--canvas); color: var(--ink-2); font: 14px/22px var(--ui); word-break: keep-all; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num, .ch { font-variant-numeric: tabular-nums; }
.mut { color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app b, .app strong { font-weight: 600; } /* 앱 글꼴 굵기는 400·500·600뿐 */

/* 시안 머리(앱 밖) */
.mhead { background: #E9ECF0; border-bottom: 1px solid var(--line-strong); }
.mhead-in { max-width: 1280px; margin: 0 auto; padding: 12px 24px; display: grid; gap: 6px; }
.mhead b { color: var(--ink); font-size: 15px; }
.mhead .ex { margin-left: 6px; padding: 1px 7px; border-radius: 4px; background: #FEF3C7; color: #92400E; font-size: 12px; font-weight: 600; }
.mdesc { font-size: 13px; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg a { padding: 3px 10px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); font-size: 12px; color: var(--ink-2); text-decoration: none; white-space: nowrap; }
.seg a[aria-current="true"] { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
.mnote { font-size: 12px; line-height: 18px; color: var(--ink-2); }
.mnote b { font-size: 12px; }

/* 앱 */
.app { position: relative; background: var(--canvas); }
.framed .app { width: 390px; max-width: 100%; margin: 16px auto 32px; border: 1px solid var(--line-strong); border-radius: 12px; overflow: clip; box-shadow: var(--elev); min-height: 800px; }
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1280px; margin: 0 auto; height: 56px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; font-size: 16px; font-weight: 600; color: var(--ink); }
.brand span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-r { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--muted); }
.acct { height: 32px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r); display: inline-flex; align-items: center; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.tabsbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs { max-width: 1280px; margin: 0 auto; padding: 0 12px; display: flex; overflow-x: auto; scrollbar-width: none; }
.tabs a { position: relative; height: 44px; padding: 0 12px; display: inline-flex; align-items: center; white-space: nowrap; color: var(--ink-2); font-weight: 500; text-decoration: none; flex: none; }
.tabs a[aria-current="page"] { color: var(--ink); font-weight: 600; }
.tabs a[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; background: var(--accent); }
main { max-width: 1280px; margin: 0 auto; padding: 16px 24px 40px; display: grid; gap: 12px; }
main > * { min-width: 0; }

/* 단추 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 500; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--canvas); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.icon { width: 36px; padding: 0; }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); }
.btn.primary { border-color: transparent; background: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--accent-strong); }
.btn.accent { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.btn.accent:hover:not(:disabled) { background: var(--accent-soft); }
.btn.danger { color: var(--negative); }
.btn.dangerfill { border-color: transparent; background: var(--negative); color: #fff; font-weight: 600; }
.btn.text { border: 0; background: none; padding: 0 4px; height: 28px; font-size: 13px; color: var(--accent); }
.btn.text.danger { color: var(--negative); }
.btn svg { flex: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border: 1px solid transparent; border-radius: var(--r); font-size: 12px; font-weight: 500; white-space: nowrap; }
.chip.gray { background: var(--canvas); border-color: var(--line); color: var(--ink-2); }
.chip.ok { background: var(--positive-soft); color: var(--positive); font-weight: 600; }
.chip.ng { background: var(--negative-soft); color: var(--negative); font-weight: 600; }

/* 도구 줄 */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.tb1, .tb2 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.tb2 { gap: 8px; }
.toolbar h1 { margin: 0 0 0 6px; font-size: 20px; line-height: 28px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; font-variant-numeric: tabular-nums; }
.vseg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r); overflow: clip; background: var(--surface); flex: none; }
.vseg button { border: 0; margin: 0; background: none; height: 34px; padding: 0 16px; font-size: 14px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.vseg button + button { border-left: 1px solid var(--line-strong); }
.vseg button:hover { background: var(--canvas); }
.vseg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
.vseg button:focus-visible { outline-offset: -2px; }
.vseg.sm button { height: 30px; padding: 0 12px; font-size: 13px; }

/* 표시 안내 */
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px; font-size: 12px; line-height: 18px; color: var(--muted); }
.lg { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.lg > b { color: var(--ink-2); font-weight: 600; }
.lg > span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
i.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); flex: none; }
i.sw.follow { background: conic-gradient(#2563EB 0 25%, #0F766E 0 50%, #7C3AED 0 75%, #EA580C 0); border-radius: 50%; }
i.gh { display: inline-block; width: 18px; height: 10px; border-radius: 2px; background: repeating-linear-gradient(135deg, #E5E7EB 0 3px, #F9FAFB 3px 6px); outline: 1px dashed var(--faint); outline-offset: -1px; }
.bit { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: var(--r); font-size: 12px; font-weight: 600; white-space: nowrap; }
.bit.on { background: var(--positive-soft); color: var(--positive); }
.bit.on::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.bit.off { background: var(--surface); border: 1px solid var(--line-strong); color: var(--muted); font-weight: 500; }
details.legend-d summary { font-size: 13px; color: var(--ink-2); cursor: pointer; padding: 2px 0; }
details.legend-d .legend { margin-top: 8px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }

/* 도착 표시 */
.mk { display: inline-grid; place-items: center; width: 13px; height: 13px; border-radius: 50%; color: #fff; font-size: 10px; line-height: 1; font-weight: 600; vertical-align: -2px; margin-right: 3px; flex: none; }
.mk.came { background: var(--positive); }
.mk.noshow { background: var(--negative); }
.mk.cancel { width: auto; height: 14px; padding: 0 4px; border-radius: 3px; background: #E5E7EB; color: var(--ink-2); font-size: 10px; font-weight: 600; }

/* 예약표(주·일) */
.cal { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: clip; --gw: 52px; }
.crow { display: grid; grid-template-columns: var(--gw) repeat(var(--days), minmax(0, 1fr)); }
.chead { position: sticky; top: 0; z-index: 8; background: var(--surface); border-bottom: 1px solid var(--line); }
.dh { border: 0; margin: 0; background: none; text-align: left; padding: 6px 8px; border-left: 1px solid var(--line); display: flex; align-items: center; gap: 6px; min-width: 0; color: inherit; }
.dh:hover { background: var(--canvas); }
.dh .n { font-size: 20px; line-height: 28px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.dh .w { font-size: 13px; color: var(--muted); font-weight: 500; }
.dh.today .n { color: #fff; background: var(--accent); border-radius: 50%; width: 30px; height: 30px; display: inline-grid; place-items: center; font-size: 16px; line-height: 1; }
.dh.today .w { color: var(--accent-strong); font-weight: 600; }
.dh .c { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
.allday { border-bottom: 1px solid var(--line-strong); }
.gh { min-width: 0; }
.adlb { font-size: 11px; color: var(--muted); padding: 7px 8px 0 0; text-align: right; white-space: nowrap; }
.ad { position: relative; border-left: 1px solid var(--line); padding: 4px; min-height: 34px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-width: 0; }
.ad:hover { background: var(--canvas); }
.ad .adadd { font-size: 11px; color: var(--accent); opacity: 0; padding: 2px 4px; line-height: 16px; }
.ad:hover .adadd { opacity: 1; }
.ad.has .adadd { display: none; }
.adc { border: 0; margin: 0; display: flex; align-items: center; gap: 4px; height: 22px; padding: 0 6px; border-radius: 3px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; min-width: 0; text-align: left; }
.adc.memo { background: #EEF0F4; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
.adc.off { background: color-mix(in srgb, var(--c) 12%, white); color: var(--ink); box-shadow: inset 3px 0 0 var(--c); }
.adc span { overflow: hidden; text-overflow: ellipsis; }
.gut { position: relative; height: var(--h); }
.hl { position: absolute; right: 6px; transform: translateY(-50%); font-size: 11px; line-height: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hl.first { transform: none; top: 2px !important; }
.col { position: relative; height: var(--h); border-left: 1px solid var(--line); min-width: 0;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(#F1F2F5 1px, transparent 1px);
  background-size: 100% calc(var(--slot) * 6), 100% calc(var(--slot) * 3); }
.col.today { background-color: #FBFCFF; }

/* 예약 칸 */
.ev { position: absolute; z-index: 1; display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; margin: 0; border: 0; padding: 1px 3px 1px 6px; border-radius: 4px; text-align: left; overflow: hidden;
  background: var(--c); color: #fff;
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / 8%);
  font-size: 11px; line-height: 13px; }
.ev.day { font-size: 12.5px; line-height: 16px; padding: 2px 6px 2px 9px; }
.ev:hover { z-index: 4; box-shadow: inset 0 0 0 2px rgb(0 0 0 / 24%), 0 2px 8px rgb(17 24 39 / 16%); }
.ev.dk { color: var(--ink); }
.ev .tk.ch, .ev .tk.len, .ev .tk.memo, .ev .tk.tm { color: inherit; opacity: .82; }
.ev .mk.came, .ev .mk.noshow { box-shadow: 0 0 0 1.5px #fff; }
.ev:focus-visible { z-index: 4; outline-offset: 1px; }
.evt { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--lines, 1); overflow: hidden; }
.tk { white-space: nowrap; }
.tk.ch { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tk.nm { font-weight: 600; }
.tk.len, .tk.memo { color: var(--muted); }
.tk.tm { color: var(--ink-2); font-variant-numeric: tabular-nums; }
/* 2차 고침: 취소 칸은 흐리게 칠하지 않는다 — 진한 취소 색(토마토 #D50000) 바탕 + 흰 글자 + 가운데 줄 + '취소' 표시 */
.ev.st-cancel .tk { text-decoration: line-through; }
.ev.st-cancel .mk.cancel { background: #fff; color: #B71C1C; }
.ev.st-noshow { background: repeating-linear-gradient(135deg, var(--c) 0 6px, color-mix(in srgb, var(--c) 70%, white) 6px 12px); }
.ev.ghost { background: repeating-linear-gradient(135deg, #EEF0F3 0 5px, #F9FAFB 5px 10px); box-shadow: none; outline: 1px dashed var(--faint); outline-offset: -1px; color: var(--muted); cursor: help; }
.ev.ghost .gl { font-weight: 600; color: var(--ink-2); }
.now { position: absolute; left: -1px; right: 0; height: 0; border-top: 2px solid var(--negative); z-index: 6; pointer-events: none; }
.now::before { content: ""; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--negative); }
.hov { position: absolute; left: 2px; right: 2px; height: calc(var(--slot) * 3 - 2px); border: 1px dashed var(--accent); border-radius: 4px; background: rgb(37 99 235 / 6%); color: var(--accent-strong); font-size: 11px; line-height: 14px; padding: 2px 6px; pointer-events: none; z-index: 3; font-weight: 600; }
.draft { position: absolute; left: 2px; right: 2px; z-index: 7; border: 2px dashed var(--accent); border-radius: 4px; background: rgb(234 241 254 / 92%); color: var(--accent-strong); font-size: 12px; line-height: 15px; font-weight: 600; padding: 2px 6px; pointer-events: none; overflow: hidden; }
.draft.warn { border-color: var(--warning); background: rgb(253 244 227 / 94%); color: var(--warning); }
.emptycard { position: absolute; left: 50%; top: 150px; transform: translateX(-50%); z-index: 7; width: min(420px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-float); box-shadow: var(--elev); padding: 20px; display: grid; gap: 8px; justify-items: start; }
.emptycard h2 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; color: var(--ink); }
.emptycard p { margin: 0; font-size: 13px; line-height: 20px; color: var(--ink-2); }
.emptycard .btn { margin-top: 4px; }

/* 월 보기 */
.mon { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: clip; }
.mh { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.mh span { padding: 8px 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
.mg { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.mc { border: 0; margin: 0; background: none; text-align: left; color: inherit; min-height: 124px; padding: 6px 8px 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; align-items: stretch; gap: 4px; min-width: 0; }
.mc:nth-child(7n) { border-right: 0; }
.mc:hover { background: var(--canvas); }
.mtop { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.mn { font-size: 13px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; min-width: 24px; height: 24px; display: inline-grid; place-items: center; }
.mc.today .mn { background: var(--accent); color: #fff; border-radius: 50%; }
.mc.out { background: #FBFBFC; }
.mc.out .mn, .mc.out .cnt, .mc.out .kc, .mc.out .ns, .mc.out .chgn { color: var(--faint); }
.mc.sun .mn { color: var(--muted); }
.cnt { font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.kc { font-size: 12px; line-height: 17px; color: var(--muted); }
.ns { color: var(--negative); font-weight: 600; font-size: 12px; line-height: 17px; }
.mchip { display: block; font-size: 11px; line-height: 18px; font-weight: 600; padding: 0 5px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mchip.memo { background: #EEF0F4; color: var(--ink); }
.mchip.off { background: color-mix(in srgb, var(--c) 12%, white); box-shadow: inset 3px 0 0 var(--c); color: var(--ink); }
.mdot { display: none; }

/* 옆에서 나오는 판 */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgb(17 24 39 / 18%); }
.drawer { position: fixed; z-index: 21; top: 0; right: 0; bottom: 0; width: 460px; max-width: 100%; background: var(--surface); border-left: 1px solid var(--line-strong); box-shadow: -8px 0 28px rgb(17 24 39 / 14%); display: flex; flex-direction: column; }
.dwh { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px 10px 20px; border-bottom: 1px solid var(--line); }
.dwh h3 { margin: 0; font-size: 17px; line-height: 24px; font-weight: 600; color: var(--ink); }
.dwb { flex: 1; overflow-y: auto; padding: 16px 20px 20px; display: grid; align-content: start; gap: 16px; }
.dwf { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }
.dwf .need { flex: 1 1 140px; font-size: 12px; line-height: 18px; color: var(--muted); }
.dwf .need.err { color: var(--negative); }
.dwf .sp { flex: 1; }
.narrow .drawer { width: 100%; border-left: 0; }
.framed .scrim, .framed .drawer { position: absolute; }
.framed .drawer { bottom: auto; min-height: 800px; }

/* 예약 더하기 */
.bithint { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; line-height: 18px; color: #1E3A8A; background: var(--accent-soft); padding: 8px 10px; border-radius: var(--r); }
.bithint svg, .phnote svg, .info svg, .wbox svg { flex: none; margin-top: 2px; }
.phnote { display: flex; gap: 6px; align-items: flex-start; margin: -6px 0 0; font-size: 12px; line-height: 18px; color: var(--muted); }
.fgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.field { display: grid; gap: 6px; align-content: start; min-width: 0; }
.field > label, .field > .lb { font-size: 13px; line-height: 20px; font-weight: 600; color: var(--ink); display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; }
.hint, .help { font-size: 12px; line-height: 18px; font-weight: 400; color: var(--muted); margin: 0; }
.inp { height: 40px; width: 100%; min-width: 0; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); font-size: 14px; color: var(--ink); }
.inp::placeholder { color: var(--faint); }
.inp:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.inp.filled { background: var(--positive-soft); border-color: #A7D7B5; }
textarea.inp { height: 60px; padding: 8px 10px; resize: vertical; line-height: 20px; }
.lk { grid-column: 1 / -1; display: grid; gap: 6px; }
.lk:empty { display: none; }
.lk .ok { margin: 0; font-size: 12px; line-height: 18px; color: var(--positive); font-weight: 600; }
.lk .no { margin: 0; font-size: 12px; line-height: 18px; color: var(--muted); }
.picks { border: 1px solid var(--accent); border-radius: 6px; background: var(--surface); box-shadow: var(--elev); overflow: clip; }
.picks .ph { padding: 7px 12px; background: var(--accent-soft); color: #1E3A8A; font-size: 12px; line-height: 18px; font-weight: 600; }

/* 예약 자세히 */

/* 설정 */
.klist { display: grid; gap: 6px; }
.krow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "ord name del" "ord opts opts" "pal pal pal"; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); align-items: center; }

.krow .pal { grid-area: pal; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 8px; align-items: center; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r); }

.del { border: 0; margin: 0; background: none; height: 28px; padding: 0 6px; font-size: 12px; color: var(--negative); border-radius: var(--r); }
.del:hover:not(:disabled) { background: var(--negative-soft); }
.del:disabled { color: var(--faint); cursor: default; }
.cbtn { margin: 0; height: 32px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--r); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); background: var(--surface); white-space: nowrap; }

.pal .pf[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 600; }
.addline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }

/* 종일 떠 있는 판 */

/* 변경 표시(날짜·시작 시간을 옮긴 예약) */
.mk.chg { width: auto; height: 14px; padding: 0 3px; border-radius: 3px; background: var(--accent-soft); color: var(--accent-strong); font-size: 10px; font-weight: 600; box-shadow: inset 0 0 0 1px #B4CDFA; }

.wide .top-in, .wide .tabs, .wide main { max-width: none; }

/* ───── 구글 잇기 시안에서 더한 것 ───── */
.mhead .ex.fake { background: #E0E7FF; color: #3730A3; }
.tabs a .newb, .subnav .newb { margin-left: 4px; padding: 0 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-strong); font-size: 11px; line-height: 16px; font-weight: 600; }

/* 설정 쪽 */
.ph1 { margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; color: var(--ink); }
.subnav { display: flex; border-bottom: 1px solid var(--line); }
.subnav a { position: relative; height: 40px; padding: 0 12px; display: inline-flex; align-items: center; color: var(--ink-2); font-weight: 500; text-decoration: none; white-space: nowrap; }
.subnav a:first-child { margin-left: -12px; }
.subnav a[aria-current="page"] { color: var(--ink); font-weight: 600; }
.subnav a[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--accent); }
.gtop { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.gtop .vseg button { padding: 0 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-float); padding: 20px 24px; display: grid; gap: 14px; min-width: 0; }

.lead { margin: 0; font-size: 13px; line-height: 20px; color: var(--muted); }

.cols2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.cols-main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
.pv { display: grid; gap: 4px; }
.privacy { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r); background: var(--warning-soft); border: 1px solid #F1D9A8; font-size: 13px; line-height: 20px; color: var(--ink); }

/* 처음 잇기 차례 */
.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }

.kbd { display: inline-block; padding: 0 5px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; background: var(--surface); font-size: 12px; line-height: 17px; color: var(--ink); white-space: nowrap; }
.ok-l { margin: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 20px; color: var(--positive); font-weight: 600; }

.inrow { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 12px; }

.calpick { display: grid; gap: 6px; }
.cp { display: grid; grid-template-columns: 18px 14px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); text-align: left; font-size: 14px; color: var(--ink); cursor: pointer; }
.cp:hover { background: var(--canvas); }
.cp[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }

.cp .rd { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line-strong); background: var(--surface); }

.connected { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 14px; border: 1px solid #CFE3D6; background: #F3FAF5; border-radius: var(--r); font-size: 13px; line-height: 20px; color: var(--ink-2); }

/* 구글 색 */
i.gsw { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--c); flex: none; vertical-align: -1px; }
i.gsw.sq { border-radius: 3px; }
i.gsw.none { background: repeating-linear-gradient(135deg, var(--c) 0 3px, #fff 3px 5px); box-shadow: inset 0 0 0 1px var(--c); }
i.gsw.follow { background: conic-gradient(#7986CB 0 33%, #F6BF26 0 66%, #E67C73 0); }
.gpal { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; padding: 10px; background: var(--canvas); border-radius: var(--r); }
.gpal button { margin: 0; border: 1px solid transparent; border-radius: var(--r); background: none; padding: 6px 2px 4px; display: grid; justify-items: center; gap: 4px; font-size: 12px; line-height: 16px; color: var(--ink-2); }
.gpal button:hover { background: var(--surface); border-color: var(--line); }

/* 시행자·종류 줄 */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { height: 32px; padding: 0 8px; text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); white-space: nowrap; }

.tbl .ordb { display: inline-flex; gap: 4px; }
.cbtn .gname { min-width: 64px; text-align: left; }

.optrow { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 8px 16px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }

.optrow > .k { font-size: 13px; line-height: 20px; font-weight: 600; color: var(--ink); padding-top: 6px; }

.optrow > .v { display: grid; gap: 6px; min-width: 0; }
.optrow .hint { margin: 0; }
.chk { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; line-height: 20px; color: var(--ink); cursor: pointer; }
.chk input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
.rad { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; line-height: 20px; color: var(--ink); cursor: pointer; padding: 2px 0; }

.tok { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.tok span { display: inline-flex; align-items: center; height: 26px; padding: 0 8px; border-radius: 4px; background: var(--canvas); border: 1px solid var(--line-strong); font-size: 12px; font-weight: 600; color: var(--ink-2); }
.tok span.off { opacity: .4; text-decoration: line-through; }
.tok i { font-style: normal; color: var(--faint); font-size: 12px; }

/* 구글 캘린더처럼 보이는 미리 보기 */
.gprev { border: 1px solid var(--line); border-radius: var(--r); background: #fff; overflow: clip; }
.gprev-h { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: #FAFBFC; font-size: 12px; color: var(--muted); }
.gprev-b { display: grid; grid-template-columns: 52px minmax(0, 1fr); }
.gprev .gl { font-size: 11px; color: var(--muted); text-align: right; padding: 4px 8px 0 0; }
.gprev .gc { position: relative; border-left: 1px solid var(--line); padding: 4px 6px; display: grid; gap: 3px; }
.gev { display: block; padding: 2px 8px; border-radius: 4px; background: var(--c); color: #fff; font-size: 12px; line-height: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.gev.dark { color: #3C2A00; }
.gev small { opacity: .85; font-size: 11px; margin-left: 6px; font-weight: 400; }

.gtitle { display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; font-variant-numeric: tabular-nums; }
.gtitle span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gquote { padding: 8px 10px; border-radius: var(--r); background: var(--canvas); border: 1px solid var(--line); font-size: 14px; line-height: 20px; color: var(--ink); display: flex; align-items: center; gap: 8px; min-width: 0; }

/* 가져오기 미리 보기 */
.icards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.grpbox { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px; border: 1px solid #F5D06B; border-radius: var(--r); background: #FFFBEB; font-size: 13px; line-height: 20px; color: var(--ink-2); }
.grpbox > svg { flex: none; }
.grpbox .gb-t { flex: 1 1 520px; min-width: 0; }
.grpbox b { color: var(--ink); }
.grpbox.info { border-color: #B4CDFA; background: var(--accent-soft); }

function palHTML(val, forKind, extraCal) {
  let h = '<div class="gpal" role="group" aria-label="구글 색 고르기">'
  if (forKind) h += `<button class="wide2" data-act="gpal" data-c="" aria-pressed="${!val}"><i class="follow"></i>시행자 색 따름</button>`
  h += GC_KEYS.map(k => `<button data-act="gpal" data-c="${k}" aria-pressed="${val === k}" title="${GC[k][0]} ${GC[k][1]}"><i style="--c:${GC[k][1]}"></i>${GC[k][0]}</button>`).join('')
  if (extraCal) h += `<button class="wide2" data-act="gpal" data-c="cal" aria-pressed="${val === 'cal'}"><i class="none" style="--c:${CAL_COLOR}"></i>캘린더 기본 색</button>`
  return h + '</div>'
}
function colorBtn(val, t, i, follow) {
  const open = CED.open && CED.open.t === t && CED.open.i === i
  const inner = val ? `${gsw(val)}<span class="gname">${gName(val)}</span>` : follow ? `<i class="gsw follow"></i><span class="gname">시행자 색 따름</span>` : ''
  return `<button class="cbtn" data-act="copen" data-t="${t}" data-i="${i}" aria-expanded="${open}">${inner}<span class="car">▼</span></button>`
}
function dupColorWarn() {
  const out = []
  const sc = SET.staff.map(s => s.gc)
  SET.staff.forEach((s, i) => { if (sc.indexOf(s.gc) !== i) out.push(`${staffLabel(s.id)}과 ${staffLabel(SET.staff[sc.indexOf(s.gc)].id)}이 같은 색(${gName(s.gc)})이에요. 시행자 글이 없는 구글 예약은 색으로 누구인지 알아볼 수 없어요.`) })
  SET.kinds.filter(k => k.gc).forEach(k => { const s = SET.staff.find(x => x.gc === k.gc); if (s) out.push(`'${k.name}' 색(${gName(k.gc)})이 ${staffLabel(s.id)} 색과 같아요. 색만으로는 종류와 시행자를 가려낼 수 없어요.`) })
  if (SET.kinds.some(k => k.gc === SET.offGc) || SET.staff.some(s => s.gc === SET.offGc)) out.push(`휴무 줄 색(${gName(SET.offGc)})을 시행자·종류도 쓰고 있어요.`)
  for (const [key, nm] of [['cancelGc', '취소'], ['changeGc', '변경']]) {
    const c = SET[key]
    const who = [...SET.staff.filter(s => s.gc === c).map(s => staffLabel(s.id)), ...SET.kinds.filter(k => k.gc === c).map(k => `'${k.name}'`), ...(SET.offGc === c ? ['휴무 줄'] : [])]
    if (who.length) out.push(`${nm} 색(${gName(c)})을 ${who.join('·')}도 쓰고 있어요. 구글에서 이 색 일정은 모두 '${nm}'으로 알아봐요. 다른 색을 골라 주세요.`)
  }
  if (SET.cancelGc === SET.changeGc) out.push(`취소 색과 변경 색이 같아요(${gName(SET.cancelGc)}). 구글에서 취소와 변경을 가려낼 수 없어요.`)
  return out.map(w => `<p class="warnl">${ICON.warn}<span>${esc(w)}</span></p>`).join('')
}
// '로/으로': 괄호·빈칸 앞 마지막 글자로(받침 있고 ㄹ이 아니면 '으로'). 숫자는 읽는 소리로(2000 = 이천 → 으로)
function roJ(w) {
  const ch = [...w.replace(/[\s()]+/g, '')].pop() || ''
  if (/\d/.test(ch)) return '036'.includes(ch) ? '으로' : '로'
  const c = ch.charCodeAt(0) - 0xAC00
  if (c < 0 || c > 11171) return '로'
  const b = c % 28
  return b === 0 || b === 8 ? '로' : '으로'
}

  const R0 = UI.reread
  const res = R0 === 'busy' ? '' : R0 ? `<p class="ok-l">${ICON.check}예약 ${fmt(4358)}개를 다시 알아봤어요 · 종류가 바뀐 것 ${fmt(1962)}개 · 못 알아본 것 ${fmt(31)}개 <span class="mut">(${R0})</span></p>` : ''
  return `<section class="card" aria-labelledby="h-rr">
    <div class="card-h"><h2 id="h-rr">이미 들어온 예약</h2><span class="hint">원장 계정만 할 수 있어요</span></div>
    <p class="lead">구글 제목을 지금 설정으로 다시 읽어 종류·시행자를 맞춰요. 구글 일정은 바꾸지 않아요.</p>
    <p class="hint">저장한 설정으로 읽어요. 가져올 때 고르거나 [고치기]로 바꾼 종류·시행자는 그대로 둬요.</p>
    <div class="inrow" style="align-items:center"><button class="btn accent" data-act="reread" ${R0 === 'busy' ? 'disabled' : ''}>${ICON.sync}${R0 === 'busy' ? '다시 알아보는 중…' : '이미 들어온 예약 다시 알아보기'}</button>${res}</div>
    ${R0 && R0 !== 'busy' ? '<p class="hint">못 알아본 예약은 전 종류·시행자 그대로 두었어요.</p>' : ''}
  </section>`
}
function linkedBand() {
  return `<div class="connected"><span><span class="dotok"></span>이어져 있어요 · <b>2026 양지바른정형외과</b> · 11/23 (월) 08:55부터 · 마지막 맞춤 ${UI.lastSync}</span><span class="sp"></span><button class="btn" data-act="syncnow">${ICON.sync}지금 맞추기</button><button class="btn" data-act="go" data-s="connect">연결 시험 · 캘린더 바꾸기</button><button class="btn danger" data-act="unlink">잇기 끊기</button></div>`
}

/* 가져오기 미리 보기 */
// 세는 수: 표에는 일부 줄만 그리고, 위 카드 숫자는 전체(지어낸 값)에서 여기서 고른 만큼 뺀다
const IMP_N = { past: { timed: 4050, allday: 138, need: 14 }, fut: { timed: 186, allday: 9, need: 11 } }
const GROUP_N = { eswt: { all: 5, past: 0, fut: 5 } }
const NOST_PAST = { all: 114, eswt: 108 } // 지난 1년 시행자 글 없는 예약(시행자 없이 가져옴)
const fmt = n => n.toLocaleString('ko-KR')
function impState(x) {
  if (!x.fix) return 'ok'
  if (x.pick === 'skip') return 'skip'
  if (x.pick) return 'fixed'
  return 'need'
}
function impCounts() {
  let fixed = 0, skip = 0
  for (const x of IMP) {
    if (!x.fix || !x.pick) continue
    if (x.fix.group && IMP_UI.grp[x.fix.group]) continue
    if (x.pick === 'skip') skip++; else fixed++
  }
  for (const g in IMP_UI.grp) if (IMP_UI.grp[g]) fixed += GROUP_N[g].all
  const past = IMP_N.past.timed + IMP_N.past.allday, fut = IMP_N.fut.timed + IMP_N.fut.allday
  const need = IMP_N.past.need + IMP_N.fut.need - fixed - skip
  return { past, fut, total: past + fut, need, skip, ok: past + fut - need - skip }
}
const dayLabel = x => x.d2 ? `${mdw(x.d)} – ${mdw(x.d2)}` : mdw(x.d)
const dayHead = d => d.slice(0, 4) === '2026' ? mdwK(d) : `${d.slice(0, 4)}년 ${mdwK(d)}`
function tagBy(by, key) {
  const v = by && by[key]
  if (v === 'c') return '<span class="tag c">구글 색</span>'
  if (v === 's') return '<span class="tag s">설정</span>'
  if (v === 'f') return '<span class="tag f">고름</span>'
  return ''
}
function fixSelect(x) {
  const f = x.fix
  if (f.group && IMP_UI.grp[f.group]) return `<span class="mut">${staffLabel(IMP_UI.grp[f.group])} · 위에서 한꺼번에 고름</span>`
  const opts = {
    staff: SET.staff.map(s => [s.id, staffLabel(s.id)]),
    kind: SET.kinds.map(k => [k.id, k.name]),
    what: [['memo', '종일 메모로 넣기']],
    len: [['30', '30분으로'], ['50', '50분으로']],
    person: PEOPLE.map(p => [p.id, p.staff ? staffLabel(p.staff) : `${p.name} (${p.role})`]).concat([['memo', "종일 메모로 ('최호 off')"]]),
  }[f.need]
  return `<select class="isel ${f.need === 'person' || f.need === 'what' ? 'wide' : ''}" data-f="imp" data-id="${x.id}" aria-label="고르기"><option value="">고르기</option>${opts.map(([v, t]) => `<option value="${v}" ${x.pick === v ? 'selected' : ''}>${esc(t)}</option>`).join('')}<option value="skip" ${x.pick === 'skip' ? 'selected' : ''}>가져오지 않기 (구글에만 둠)</option></select>`
}
function impRowHTML(x) {
  const st = impState(x)
  const chip = { ok: '<span class="stt ok">✓ 알아봄</span>', fixed: '<span class="stt fixed">✓ 고름</span>', need: '<span class="stt need">! 고쳐야 함</span>', skip: '<span class="stt skip">가져오지 않음</span>' }[st]
  const why = x.fix && st === 'need' ? `<span class="why">${esc(x.fix.why)}</span>` : ''
  const src = x.p && x.p.cancel ? `<span class="tag x">${gName(SET.cancelGc)} = 취소</span>` : x.p && x.p.chg ? `<span class="tag x">${gName(SET.changeGc)} = 변경</span>` : ''
  const g = `<td class="gcell"><span class="gtitle">${gsw(x.gc)}<span title="${esc(x.title)}">${esc(x.title)}</span>${src}</span>${why}</td><td class="arrow">→</td>`
  const nd = need => x.fix && x.fix.need === need && st !== 'skip' ? 'nd' : ''
  if (x.allDay) {
    let body
    if (x.p.memo) body = `<span class="mut">종일 메모</span> · <b>${esc(x.p.memo)}</b>`
    else body = `<span class="mut">휴무</span> <span class="offp">${x.p.off.map(p => {
      if (!p.pid) return x.fix && st !== 'skip' ? fixSelect(x) : `<span class="mut">${esc(p.raw)}</span>`
      const pe = personOf(p.pid), stf = pe.staff ? staffOf(pe.staff) : null
      return `<span class="pp" style="--c:${gHex(SET.offGc)}">${stf ? `(${esc(stf.mark)}) ` : ''}${esc(pe.name)}${p.part ? ` · ${p.part === 'am' ? '오전' : '오후'} 반차` : ''}${stf ? '' : ' <span class="mut">(직원)</span>'}</span>`
    }).join('')}</span>${x.d2 ? ' <span class="mut">· 날마다 따로 넣어요</span>' : ''}`
    return `<tr class="${st}"><td>${chip}</td>${g}<td>${dayLabel(x)}</td><td colspan="2" class="mut">하루 종일</td><td colspan="5" class="span ${nd('person')}">${body}</td></tr>`
  }
  const p = x.p
  if (x.fix && x.fix.need === 'what') {
    return `<tr class="${st}"><td>${chip}</td>${g}<td>${mdw(x.d)}</td><td>${hm(x.s)}</td><td>${x.e - x.s}분</td><td colspan="5" class="span ${nd('what')}">${st === 'skip' ? '<span class="mut">구글에만 두고 웹앱은 건드리지 않아요</span> ' : ''}${fixSelect(x)}</td></tr>`
  }
  const len = x.e - x.s
  const lenCell = x.fix && x.fix.need === 'len' ? `<td class="${nd('len')}">${st === 'need' ? `<span class="mut">12시간</span><br>` : ''}${fixSelect(x)}</td>` : `<td>${len}분</td>`
  const staffCell = x.fix && x.fix.need === 'staff' ? `<td class="${nd('staff')}">${fixSelect(x)}</td>` : `<td>${p.nost ? '<span class="mut">없음</span> <span class="tag n">지난 예약 · 시행자 없이</span>' : p.st ? staffLabel(p.st) : ''}${tagBy(p.by, 'st')}</td>`
  const kindCell = x.fix && x.fix.need === 'kind' ? `<td class="${nd('kind')}">${fixSelect(x)}</td>` : `<td>${p.k ? esc(kindOf(p.k).name) : ''}${tagBy(p.by, 'k')}</td>`
  return `<tr class="${st}"><td>${chip}</td>${g}<td>${mdw(x.d)}</td><td>${hm(x.s)}</td>${lenCell}<td>${p.c || '<span class="mut">없음</span>'}</td><td><b>${esc(p.n)}</b></td>${kindCell}${staffCell}<td>${p.memo ? esc(p.memo) : ''}</td></tr>`
}
function grpBox() {
  const n = GROUP_N.eswt
  return `<div class="grpbox info">${ICON.info}<div class="gb-t"><b>시행자 글이 없는 예약</b> · 지난 1년 <b>${fmt(NOST_PAST.all)}개</b>(충격파 ${NOST_PAST.eswt}개 등)는 <b>시행자 없이</b> 가져와요 — 고쳐야 할 것에 넣지 않아요. 앞으로의 예약 <b>${n.fut}개</b>(충격파)는 아래 표에서 하나씩 시행자를 골라요.<br><span class="mut">'시행자 글이 없는 종류'는 ② 시행자·종류에서 정해요(지금: ${SET.kinds.filter(k => SET.noStaffKinds.includes(k.id)).map(k => k.name).join(', ') || '없음'}).</span></div><button class="btn" data-act="ifilt" data-v="need">고쳐야 할 것만 보기</button></div>`
}
function importHTML() {
  const c = impCounts()
  const F = IMP_UI.filter
  const byDate = (a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : (a.allDay ? -1 : b.allDay ? 1 : (a.s || 0) - (b.s || 0)))
  const fut = IMP.filter(x => !x.past)
  const rows = F === 'need' ? IMP.filter(x => x.fix).sort(byDate) : F === 'allday' ? IMP.filter(x => x.allDay).sort(byDate) : F === 'past' ? IMP.filter(x => x.past).sort(byDate) : fut.slice(0, FIRST_PAGE)
  let lastD = '', body = ''
  for (const x of rows) {
    if (x.d !== lastD) { body += `<tr class="daysep"><td colspan="11">${dayHead(x.d)}${x.d === NOW.date ? ' · 오늘 (잇는 날)' : ''}${x.past ? ' · <span class="mut">지난 예약 · 한 번만 옮겨 와요</span>' : ''}</td></tr>`; lastD = x.d }
    body += impRowHTML(x)
  }
  const shownNeed = IMP.filter(x => x.fix).length, shownAll = IMP.filter(x => x.allDay).length
  const more = {
    fut: `… 아래로 ${fmt(c.fut - FIRST_PAGE)}개 더 있어요 (시안에는 앞 ${FIRST_PAGE}줄만 그렸어요)`,
    past: `지난 1년 ${fmt(c.past)}개 가운데 1/2 하루와 11/20·21 이틀만 그렸어요`,
    need: `고쳐야 할 ${fmt(IMP_N.past.need + IMP_N.fut.need)}개 가운데 ${shownNeed}개만 그렸어요 (나머지는 지난 1년의 종류·길이를 모르는 것들이에요)`,
    allday: `하루 종일 ${fmt(IMP_N.past.allday + IMP_N.fut.allday)}개 가운데 ${shownAll}개만 그렸어요`,
  }[F]
  const pastNote = F === 'past' ? `<div class="pastnote">${ICON.info}<span><b>지난 예약은 처음 한 번만 옮겨 와요.</b> 그 뒤로는 구글과 맞추지 않아요(웹앱에서 고쳐도 구글로 보내지 않고, 구글에서 고쳐도 받아 오지 않아요). <b>도착(왔음·안 옴)은 가져온 뒤 비트 PC가 그날 비트 접수를 보고 저절로 채워요</b> — 최근 날부터 조금씩 채우고, 다 채우면 예약 탭에 알려요. 차트번호가 없는 예약(신환)은 비트 접수와 맞출 수 없어 도착을 비워 둬요. <b>시행자 글이 없는 지난 예약 ${fmt(NOST_PAST.all)}개는 시행자 없이 가져와요</b>(고쳐야 할 것에 넣지 않아요).</span></div>` : ''
  return `${settingsHead('import')}${flowBar('import')}
  <section class="card" aria-labelledby="h-imp">
    <div class="card-h"><h2 id="h-imp">처음 가져오기 미리 보기</h2><span class="hint">2026 양지바른정형외과 · 11/23 (월) 08:52에 읽음</span></div>
    <p class="lead">고른 캘린더에 있는 <b>지난 1년</b>(2025-11-23부터 어제까지)과 <b>앞으로</b>(오늘 0시부터)의 구글 일정을 웹앱 칸으로 알아봤어요. 웹앱은 1년 지난 예약을 저절로 지우니 그보다 오래된 일정은 가져오지 않아요. <b>[가져오기]를 누르기 전에는 웹앱도 구글도 바뀌지 않아요.</b> 가져와도 구글 일정의 제목·색은 그대로 둬요.</p>
    <div class="icards">
      <div class="ic"><span class="k">지난 1년</span><span class="n">${fmt(c.past)}개</span><span class="s">예약 ${fmt(IMP_N.past.timed)} · 하루 종일 ${IMP_N.past.allday}<br>한 번만 옮겨 와요 · 도착은 비트 PC가 채움</span></div>
      <div class="ic"><span class="k">앞으로</span><span class="n">${fmt(c.fut)}개</span><span class="s">예약 ${IMP_N.fut.timed} · 하루 종일 ${IMP_N.fut.allday}<br>가져온 뒤 양쪽으로 맞춰요</span></div>
      <div class="ic ok"><span class="k">알아봄</span><span class="n">${fmt(c.ok)}개</span><span class="s">그대로 가져와요<br>구글 색·설정으로 알아본 612개 포함</span></div>
      <div class="ic ${c.need ? 'need' : ''}"><span class="k">고쳐야 함</span><span class="n">${fmt(c.need)}개</span><span class="s">노란 칸에서 골라요<br>안 골라도 가져오기는 돼요</span></div>
      <div class="ic"><span class="k">가져오지 않음</span><span class="n">${fmt(c.skip)}개</span><span class="s">구글에만 남아요</span></div>
    </div>
    ${grpBox()}
    <div class="filt"><button data-act="ifilt" data-v="fut" aria-pressed="${F === 'fut'}">앞으로 ${fmt(c.fut)}</button><button data-act="ifilt" data-v="past" aria-pressed="${F === 'past'}">지난 1년 ${fmt(c.past)}</button><button data-act="ifilt" data-v="need" aria-pressed="${F === 'need'}">고쳐야 할 것 ${fmt(IMP_N.past.need + IMP_N.fut.need)}</button><button data-act="ifilt" data-v="allday" aria-pressed="${F === 'allday'}">하루 종일 ${fmt(IMP_N.past.allday + IMP_N.fut.allday)}</button><span class="sp"></span>
      <span class="legend"><span class="lg"><b>어디서 알아봤나</b><span>표시 없음 = 제목 글</span><span><span class="tag c">구글 색</span> 일정 색</span><span><span class="tag s">설정</span> 종류 글이 없는 예약</span><span><span class="tag f">고름</span> 여기서 고름</span></span></span></div>
    ${pastNote}
    <div class="itw"><table class="it"><thead><tr><th>상태</th><th>구글 일정 (색 · 제목 원문)</th><th class="arrow"></th><th>날짜</th><th>시작</th><th>길이</th><th>차트번호</th><th>이름</th><th>종류</th><th>시행자</th><th>메모</th></tr></thead><tbody>${body}</tbody></table><div class="more">${more}</div></div>
    <p class="hint">길이는 구글 일정의 시작·끝 시각으로 정해요(제목의 '50분' 같은 글은 보지 않아요). 시작은 5분 단위로 받아요(09:15처럼). 여러 날 하루 종일 일정은 날마다 따로 넣어요. 괄호 안 글은 메모로 넣어요. 취소 색(${gName(SET.cancelGc)}) 일정은 '취소'로, 변경 색(${gName(SET.changeGc)}) 일정은 '변경' 표시를 붙여 가져와요.</p>
  </section>
  <div class="ibar"><p id="ibar-t">${ibarText(c)}</p><button class="btn" data-act="go" data-s="colors">← 시행자·종류 고치기</button><button class="btn primary" data-act="doimport">가져오기</button></div>`
}
function ibarText(c) {
  return `<b>가져오면</b> 알아본 ${fmt(c.ok)}개(지난 1년 + 앞으로)를 웹앱에 넣어요. 지난 1년은 한 번만 옮기고, 앞으로의 예약은 그때부터 2분마다 양쪽으로 맞춰요. 지난 예약의 도착은 비트 PC가 그날 비트 접수를 보고 최근 날부터 채워요. ${c.need ? `고쳐야 할 <b>${fmt(c.need)}개</b>는 가져오지 않고 예약 탭 '고쳐야 할 구글 예약'에 남겨요(나중에 골라도 돼요).` : '고쳐야 할 것이 없어요.'}${c.skip ? ` 가져오지 않기로 한 ${fmt(c.skip)}개는 구글에만 둬요.` : ''}`
}

/* 맞춤 방법 */

  const rad = (name, val, opts) => opts.map(([v, t, sub]) => `<label class="rad"><input type="radio" name="${name}" data-f="rule" data-k="${name}" value="${v}" ${String(RULE[name]) === String(v) ? 'checked' : ''}><span>${t}${sub ? `<br><small>${sub}</small>` : ''}</span></label>`).join('')
  return `${settingsHead('rules')}
  ${linkedBand()}
  <section class="card" aria-labelledby="h-rl">
    <div class="card-h"><h2 id="h-rl">맞춤 방법</h2><span class="hint">골라져 있는 것이 기본값이에요</span></div>
    <div class="optrow"><div class="k">구글에서 받아 오기</div><div class="v">
      <div class="rowx">웹앱이 열려 있는 동안 <div class="vseg sm" role="group" aria-label="받아 오는 간격">${[1, 2, 5].map(n => `<button data-act="every" data-v="${n}" aria-pressed="${RULE.every === n}">${n}분</button>`).join('')}</div> 마다 받아 와요</div>
      <p class="hint">다른 창을 보다 예약 탭으로 돌아오면 바로 한 번 받아 와요. 웹앱이 열린 PC가 하나도 없으면 받아 오지 않고, 다음에 열 때 그동안 바뀐 것을 한꺼번에 받아 와요.</p></div></div>
    <div class="optrow"><div class="k">웹앱에서 넣고 고치기</div><div class="v"><p class="fixedv">저장하면 바로 구글에 적어요. 구글에 닿지 못하면 모아 두었다가 다시 닿을 때 보내요.</p></div></div>

function lay(items) {
  const ev = items.map(x => ({ x, s: x.start, e: x.start + Math.max(x.len, 10) }))
    .sort((a, b) => a.s - b.s || b.e - a.e || staffIdx(a.x.staff) - staffIdx(b.x.staff))
  const clusters = []; let cl = null, end = -1
  for (const v of ev) { if (!cl || v.s >= end) { cl = []; clusters.push(cl); end = v.e } else end = Math.max(end, v.e); cl.push(v) }
  for (const c of clusters) {
    const cols = []
    for (const v of c) { let i = cols.findIndex(t => t <= v.s); if (i < 0) { i = cols.length; cols.push(0) } cols[i] = v.e; v.col = i }
    const n = cols.length
    for (const v of c) {
      let span = 1
      while (v.col + span < n && !c.some(o => o.col === v.col + span && o.s < v.e && v.s < o.e)) span++
      v.left = v.col / n; v.width = span / n
    }
  }
  return ev
}
const yOf = m => (m - SET.open) / 10 * SLOT
function evHTML(v) {
  const a = v.x, end = a.start + a.len
  if (end <= SET.open || a.start >= SET.close) return ''
  const top = Math.max(0, yOf(a.start)), bottom = Math.min(yOf(SET.close), yOf(end))
  const h = Math.max(bottom - top - 1, 14)
  const lines = Math.max(1, Math.floor((h - 2) / 13))
  const pos = `top:${top}px;height:${h}px;left:calc((100% - 20px) * ${v.left.toFixed(4)} + 1px);width:calc((100% - 20px) * ${v.width.toFixed(4)} - 2px);--lines:${lines}`
  if (a.gfix) return `<button class="ev gfix" data-act="openfix" style="${pos}" title="고쳐야 할 구글 예약 · ${esc(a.gfix.title)}"><span class="evt"><span class="tk nm">고쳐야 함</span> <span class="tk">${esc(a.gfix.title)}</span></span></button>`
  const st = status(a), k = kindOf(a.kind), s = staffOf(a.staff)
  const inner = `${MK[st]}${a.pend ? MK.gwait : ''}${(a.orig || a.gchg) ? MK.chg : ''}<span class="tk ch">${a.chart}</span> <span class="tk nm">${a.name}</span> <span class="tk">${esc(k.name)}&nbsp;(${esc(s.mark)})</span> <span class="tk len">${a.len}분</span>`
  const label = `${a.chart} ${a.name} ${k.name} (${s.mark}) ${hm(a.start)}–${hm(end)} ${a.len}분${a.g?.from === 'google' ? ' · 구글 제목 ' + a.g.title : ''}${a.pend ? ' · 구글에 아직 못 보냄' : ''}`
  const dc = drawGc(a)
  return `<button class="ev st-${st} ${darkChip(dc) ? 'dk' : ''}" data-act="appt" data-id="${a.id}" style="${pos};--c:${gHex(dc)}" title="${esc(label)}" aria-label="${esc(label)}"><span class="evt">${inner}</span></button>`
}

  const L = UI.layer, el = $('#layer')
  $('#dlg').innerHTML = dlgHTML()
  if (!L) { el.innerHTML = ''; return }
  const keep = el.querySelector('.dwb')?.scrollTop || 0
  el.innerHTML = L.type === 'detail' ? detailDrawer(L) : fixDrawer()
  const db = el.querySelector('.dwb'); if (db) db.scrollTop = keep
}
function render() { renderMain(); renderLayer() }
let toastT
function toast(msg) { const t = $('#toast'); t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => { t.textContent = '' }, 3600) }

/* ───────── 누르기 ───────── */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return
  const act = t.dataset.act
  if (t.tagName === 'A') e.preventDefault()
  switch (act) {
    case 'go': location.search = '?s=' + t.dataset.s; break
    case 'noop': if (t.tagName === 'A') toast('시안: 구글 캘린더 웹 화면이 새 창으로 열려요.'); break
    case 'copycode': toast('구글 코드를 복사했어요. 비밀 글자를 새로 만들어 코드 맨 위에 넣었어요.'); break
    case 'showkey': CONN.showKey = !CONN.showKey; renderMain(); break
    case 'test': CONN.tested = false; renderMain(); setTimeout(() => { CONN.tested = true; renderMain(); toast('연결됐어요. 캘린더 5개를 찾았어요.') }, 500); break
    case 'pickcal': CONN.cal = t.dataset.id; renderMain(); break
    case 'copen': { const o = { t: t.dataset.t, i: +t.dataset.i }; CED.open = CED.open && CED.open.t === o.t && CED.open.i === o.i ? null : o; renderMain(); break }
    case 'gpal': {
      const c = t.dataset.c || null, o = CED.open; if (!o) break
      if (o.t === 's') SET.staff[o.i].gc = c
      else if (o.t === 'k') SET.kinds[o.i].gc = c
      else if (o.t === 'x') SET.cancelGc = c
      else if (o.t === 'v') SET.changeGc = c
      else SET.offGc = c
      CED.open = null; renderMain(); break
    }
    case 'k-up': case 'k-down': { const i = +t.dataset.i, j = act === 'k-up' ? i - 1 : i + 1; [SET.kinds[i], SET.kinds[j]] = [SET.kinds[j], SET.kinds[i]]; CED.open = null; renderMain(); break }
    case 'k-del': if (SET.kinds.length > 1) { SET.kinds.splice(+t.dataset.i, 1); CED.open = null; renderMain() } break
    case 'nsk': { const id = t.dataset.id, L = SET.noStaffKinds; SET.noStaffKinds = L.includes(id) ? L.filter(x => x !== id) : [...L, id]; renderMain(); break }
    case 'k-add': SET.kinds.push({ id: 'k' + Date.now(), name: '', words: '', len: 30, gc: null }); renderMain(); break
    case 'ifilt': IMP_UI.filter = t.dataset.v; renderMain(); break
    case 'grpundo': IMP_UI.grp.eswt = null; IMP.filter(y => y.fix?.group === 'eswt').forEach(y => { y.pick = null }); renderMain(); break
    case 'doimport': { const c = impCounts(); toast(`가져왔어요. ${fmt(c.ok)}개를 넣었어요${c.need ? ` · 고쳐야 할 ${fmt(c.need)}개는 예약 탭에 남겼어요` : ''}. 이제 2분마다 맞추고, 지난 예약 도착은 비트 PC가 채워요.`); break }
    case 'every': RULE.every = +t.dataset.v; renderMain(); break
    case 'rulesave': toast('맞춤 방법을 저장했어요.'); break
    case 'unlink': toast('시안: [잇기 끊기]를 누르면 한 번 더 물어요. 끊어도 웹앱 예약과 구글 일정은 그대로 남고, 그 뒤로는 서로 맞추지 않아요.'); break
    case 'syncnow': UI.lastSync = hm(NOW.min); renderMain(); toast(`구글과 맞췄어요 · 바뀐 것 없음 (${UI.lastSync})`); break
    case 'retry': toast('다시 해 봤지만 아직 닿지 않아요. 1분 뒤 다시 해 볼게요.'); break
    case 'errtoggle': UI.errOpen = !UI.errOpen; renderMain(); break
    case 'appt': UI.layer = { type: 'detail', id: t.dataset.id }; renderLayer(); break
    case 'openfix': UI.layer = { type: 'fix' }; renderLayer(); break
    case 'fxsel': { const f = (RANGE ? FIXR : FIXQ).find(x => x.id === t.dataset.id); f.sel[t.dataset.n] = t.dataset.v; renderLayer(); break }
    case 'rskipall': UI.dlg = 'skipall'; renderLayer(); break
    case 'dlgx': UI.dlg = null; renderLayer(); break
    case 'dlgok': {
      const ids = FIXR.filter(f => inRange(f) && !UI.fixDone[f.id]).map(f => f.id)
      ids.forEach(id => { UI.fixDone[id] = 'bulk' })
      UI.bulk = ids.length; UI.dlg = null; renderMain(); renderLayer()
      toast(`${fmt(ids.length)}개를 가져오지 않기로 했어요. 구글에만 남아요.`); break
    }
    case 'reread': UI.reread = 'busy'; renderMain(); setTimeout(() => { UI.reread = hm(NOW.min + 1); renderMain() }, 700); break
    case 'csave': toast('설정을 저장했어요. 다른 PC에도 몇 초 안에 보여요.'); break
    case 'fxok': case 'fxskip': { UI.fixDone[t.dataset.id] = act === 'fxok' ? 'ok' : 'skip'; renderMain(); renderLayer(); toast(act === 'fxok' ? '예약표에 넣었어요. 구글 제목은 그대로 둬요.' : '가져오지 않아요. 구글에만 남아요.'); break }
    case 'slot': if (!e.target.closest('.ev')) toast(S === 'err' ? '시안: 예약 더하기 판은 지금과 같아요. 저장하면 웹앱에 넣고, 구글에는 다시 닿으면 보내요.' : '시안: 예약 더하기 판은 지금과 같아요. 저장하면 바로 구글 캘린더에도 적혀요.'); break
    case 'add': toast(S === 'err' ? '웹앱에 저장했어요. 구글에는 다시 닿으면 보내요.' : '시안: 예약 더하기 판은 지금과 같아요. 저장하면 바로 구글 캘린더에도 적혀요.'); break
    case 'lvsave': UI.saved = true; renderMain(); toast('휴가를 넣었어요. 예약 달력과 구글 캘린더 11/27 (금) off 줄에도 더했어요.'); break
    case 'close': UI.layer = null; renderLayer(); break
  }
})
document.addEventListener('change', e => {
  const t = e.target, f = t.dataset.f; if (!f) return
  const i = +t.dataset.i
  if (f === 'imp') { const x = IMP.find(y => y.id === t.dataset.id); x.pick = t.value || null; renderMain(); return }
  if (f === 'grp') { IMP_UI.grp[t.dataset.g] = t.value || null; IMP.filter(y => y.fix?.group === t.dataset.g).forEach(y => { y.pick = t.value || null }); renderMain(); return }
  if (f === 'rfrom' || f === 'rto') { UI.range[f === 'rfrom' ? 'from' : 'to'] = t.value; UI.bulk = 0; renderLayer(); $('#' + (f === 'rfrom' ? 'r-from' : 'r-to'))?.focus(); return }
  if (f === 'k-len') SET.kinds[i].len = +t.value
  if (f === 'nokind') SET.noKind = t.value
  if (f === 'bycolor') SET.byColor = t.checked
  if (f === 'withlen') { SET.withLen = t.checked; renderMain() }
  if (f === 'memotitle') { SET.memoInTitle = t.checked; renderMain() }
  if (f === 'rule') RULE[t.dataset.k] = t.value
  if (f === 'offall') RULE.offAll = t.checked
})
document.addEventListener('input', e => {
  const t = e.target, f = t.dataset.f; if (!f) return
  const i = +t.dataset.i
  if (f === 's-name') SET.staff[i].name = t.value
  if (f === 's-mark') SET.staff[i].mark = t.value
  if (f === 'k-name') SET.kinds[i].name = t.value
  if (f === 'k-words') SET.kinds[i].words = t.value
  if (f === 'offword') SET.offWord = t.value
})
document.addEventListener('focusout', e => { if (['s-name', 's-mark', 'k-name', 'offword'].includes(e.target.dataset?.f)) renderMain() })
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && UI.dlg) { UI.dlg = null; renderLayer(); return }
  if (e.key === 'Escape' && UI.layer) { UI.layer = null; renderLayer() }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.cp[data-act="pickcal"]')) { e.preventDefault(); e.target.click() }
})
render()
</script>
</body>
