<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="794" height="1123">
  <!-- 광복절: 의원 8월 안내문 재현 — 회색 괘(왼쪽 위·오른쪽 끝), 분홍 무궁화(오른쪽 위), 왼쪽 아래 태극 -->
  <defs>
    <linearGradient id="liberation-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eceef1"/>
      <stop offset="0.38" stop-color="#f7f8fa"/>
      <stop offset="0.7" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f3f5"/>
    </linearGradient>
    <radialGradient id="liberation-petal" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="56">
      <stop offset="0.15" stop-color="#ec7ea6"/>
      <stop offset="0.55" stop-color="#f7b8cd"/>
      <stop offset="1" stop-color="#fde4ec"/>
    </radialGradient>
    <!-- 분홍 무궁화: 꽃잎 다섯, 단심, 암술대 -->
    <symbol id="liberation-mugung" viewBox="-60 -60 120 120" overflow="visible">
      <g fill="url(#liberation-petal)" stroke="#e58fae" stroke-width="1.2">
        <path id="liberation-pt" d="M0 0 C -12 -6, -32 -22, -30 -40 C -28 -52, -14 -56, -2 -52 C 6 -58, 24 -54, 28 -42 C 32 -26, 12 -6, 0 0 Z"/>
        <use href="#liberation-pt" transform="rotate(72)"/><use href="#liberation-pt" transform="rotate(144)"/>
        <use href="#liberation-pt" transform="rotate(216)"/><use href="#liberation-pt" transform="rotate(288)"/>
      </g>
      <g fill="#b8104a">
        <path id="liberation-dan" d="M0 0 C -7 -4, -13 -12, -10 -20 C -6 -25, 6 -25, 10 -20 C 13 -12, 7 -4, 0 0 Z"/>
        <use href="#liberation-dan" transform="rotate(72)"/><use href="#liberation-dan" transform="rotate(144)"/>
        <use href="#liberation-dan" transform="rotate(216)"/><use href="#liberation-dan" transform="rotate(288)"/>
      </g>
      <path d="M0 0 L8 -24" stroke="#fff7f0" stroke-width="5" stroke-linecap="round"/>
      <circle cx="8" cy="-25" r="4.5" fill="#f4d264"/>
      <circle cx="4" cy="-14" r="2" fill="#f4d264"/><circle cx="10" cy="-16" r="2" fill="#f4d264"/>
    </symbol>
    <symbol id="liberation-leaf" viewBox="-20 -50 40 54" overflow="visible">
      <path d="M0 0 C -14 -8, -20 -22, -14 -32 C -18 -38, -10 -46, 0 -50 C 10 -46, 18 -38, 14 -32 C 20 -22, 14 -8, 0 0 Z" fill="#5f9e5b"/>
      <path d="M0 0 C 14 -8, 20 -22, 14 -32 C 18 -38, 10 -46, 0 -50 Z" fill="#4b8748"/>
      <path d="M0 -2 V-44" stroke="#3c7039" stroke-width="1.6"/>
    </symbol>
    <symbol id="liberation-bud" viewBox="-12 -28 24 40" overflow="visible">
      <path d="M0 -26 C 11 -18, 11 4, 0 9 C -11 4, -11 -18, 0 -26 Z" fill="#f29bbb"/>
      <path d="M0 9 C -10 3, -12 -8, -8 -13 L0 -4 L8 -13 C 12 -8, 10 3, 0 9 Z" fill="#5f9e5b"/>
    </symbol>
  </defs>

  <rect width="794" height="1123" fill="url(#liberation-bg)"/>

  <!-- 왼쪽 위: 건(☰) — 회색 막대 셋 -->
  <g fill="#d6d9df" transform="translate(66 76) rotate(-56.31)">
    <rect x="-150" y="-80" width="300" height="40" rx="3"/>
    <rect x="-150" y="-20" width="300" height="40" rx="3"/>
    <rect x="-150" y="40" width="300" height="40" rx="3"/>
  </g>

  <!-- 오른쪽 끝 아래: 곤(☷) — 끊긴 막대 셋 -->
  <g fill="#d6d9df" transform="translate(744 1004) rotate(123.69)">
    <rect x="-130" y="-90" width="121" height="36" rx="3"/><rect x="9" y="-90" width="121" height="36" rx="3"/>
    <rect x="-130" y="-18" width="121" height="36" rx="3"/><rect x="9" y="-18" width="121" height="36" rx="3"/>
    <rect x="-130" y="54" width="121" height="36" rx="3"/><rect x="9" y="54" width="121" height="36" rx="3"/>
  </g>

  <!-- 오른쪽 위: 분홍 무궁화 -->
  <use href="#liberation-leaf" x="-20" y="-50" width="40" height="54" transform="translate(690 100) rotate(-120) scale(1.5)"/>
  <use href="#liberation-leaf" x="-20" y="-50" width="40" height="54" transform="translate(740 150) rotate(-175) scale(1.45)"/>
  <use href="#liberation-leaf" x="-20" y="-50" width="40" height="54" transform="translate(800 230) rotate(-150) scale(1.3)"/>
  <use href="#liberation-leaf" x="-20" y="-50" width="40" height="54" transform="translate(664 34) rotate(-80) scale(1.2)"/>
  <use href="#liberation-leaf" x="-20" y="-50" width="40" height="54" transform="translate(770 40) rotate(40) scale(1.3)"/>
  <use href="#liberation-bud" x="-12" y="-28" width="24" height="40" transform="translate(664 168) rotate(-150) scale(1.1)"/>
  <use href="#liberation-bud" x="-12" y="-28" width="24" height="40" transform="translate(724 226) rotate(170)"/>
  <use href="#liberation-mugung" x="-60" y="-60" width="120" height="120" transform="translate(684 30) rotate(-8) scale(.78)"/>
  <use href="#liberation-mugung" x="-60" y="-60" width="120" height="120" transform="translate(786 170) rotate(-28) scale(.95)"/>
  <use href="#liberation-mugung" x="-60" y="-60" width="120" height="120" transform="translate(740 88) rotate(14) scale(1.2)"/>

  <!-- 왼쪽 아래: 태극이 반쯤 보임 -->
  <g transform="translate(22 1062) rotate(33.69)">
    <circle r="156" fill="#0047a0"/>
    <path d="M-156 0 A156 156 0 0 1 156 0 A78 78 0 0 0 0 0 A78 78 0 0 1 -156 0 Z" fill="#cd2e3a"/>
  </g>
</svg>
