<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="794" height="1123">
  <!-- 부처님오신날: 줄에 매단 연등, 아래 연못의 연꽃·연잎 -->
  <defs>
    <linearGradient id="buddha-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffefdc"/>
      <stop offset="0.36" stop-color="#fff8f0"/>
      <stop offset="0.64" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6faf4"/>
    </linearGradient>
    <linearGradient id="buddha-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7eee6"/>
      <stop offset="1" stop-color="#b3dccd"/>
    </linearGradient>
    <linearGradient id="buddha-petalg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="-72">
      <stop offset="0" stop-color="#fff2f5"/>
      <stop offset=".55" stop-color="#f8b3c9"/>
      <stop offset="1" stop-color="#e9608d"/>
    </linearGradient>
    <radialGradient id="buddha-glow">
      <stop offset="0.35" stop-color="#ffd27a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <!-- 연등 꽃잎 하나(밑이 0,0) -->
    <g id="buddha-petal">
      <path d="M0 0 C -9 -5, -10 -14, 0 -24 C 10 -14, 9 -5, 0 0 Z" fill="currentColor" stroke="#000" stroke-opacity=".16" stroke-width="1"/>
      <path d="M0 -9 C -3 -12, -3 -16, 0 -20 C 3 -16, 3 -12, 0 -9 Z" fill="#fff" opacity=".5"/>
    </g>
    <!-- 연등: 몸은 currentColor, 아래에 꼬리표 -->
    <symbol id="buddha-lantern" viewBox="-45 -50 90 140" overflow="visible">
      <circle r="62" fill="url(#buddha-glow)"/>
      <rect x="-9" y="-38" width="18" height="9" rx="2" fill="#c98f2c"/>
      <ellipse rx="34" ry="30" fill="currentColor"/>
      <ellipse rx="34" ry="30" fill="#000" opacity=".12"/>
      <use href="#buddha-petal" x="-14" y="-16"/><use href="#buddha-petal" x="14" y="-16"/><use href="#buddha-petal" y="-16"/>
      <use href="#buddha-petal" x="-28" y="0"/><use href="#buddha-petal" x="-14" y="0"/><use href="#buddha-petal" y="0"/><use href="#buddha-petal" x="14" y="0"/><use href="#buddha-petal" x="28" y="0"/>
      <use href="#buddha-petal" x="-31" y="16"/><use href="#buddha-petal" x="-18.5" y="16"/><use href="#buddha-petal" x="-6" y="16"/><use href="#buddha-petal" x="6" y="16"/><use href="#buddha-petal" x="18.5" y="16"/><use href="#buddha-petal" x="31" y="16"/>
      <use href="#buddha-petal" x="-24" y="30"/><use href="#buddha-petal" x="-12" y="30"/><use href="#buddha-petal" y="30"/><use href="#buddha-petal" x="12" y="30"/><use href="#buddha-petal" x="24" y="30"/>
      <rect x="-11" y="28" width="22" height="6" rx="2" fill="#c98f2c"/>
      <rect x="-6" y="34" width="12" height="44" fill="#fffaf0" stroke="currentColor" stroke-width="2"/>
      <path d="M0 78 V90" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <!-- 연꽃(옆모습, 밑이 0,0) -->
    <path id="buddha-lp" d="M0 0 C -19 -18, -17 -50, 0 -72 C 17 -50, 19 -18, 0 0 Z"/>
    <symbol id="buddha-lotus" viewBox="-80 -80 160 90" overflow="visible">
      <g fill="url(#buddha-petalg)" stroke="#d94f7f" stroke-opacity=".35" stroke-width="1.2">
        <use href="#buddha-lp" transform="rotate(-58) scale(.74)"/>
        <use href="#buddha-lp" transform="rotate(58) scale(.74)"/>
        <use href="#buddha-lp" transform="rotate(-30) scale(.9)"/>
        <use href="#buddha-lp" transform="rotate(30) scale(.9)"/>
        <use href="#buddha-lp"/>
        <use href="#buddha-lp" transform="rotate(-14) scale(.8)"/>
        <use href="#buddha-lp" transform="rotate(14) scale(.8)"/>
        <use href="#buddha-lp" transform="rotate(-76) scale(.5)"/>
        <use href="#buddha-lp" transform="rotate(76) scale(.5)"/>
      </g>
    </symbol>
    <!-- 물 위 연잎 -->
    <symbol id="buddha-pad" viewBox="-80 -24 160 48" overflow="visible">
      <path d="M0 0 L-6 -22 C -50 -22, -78 -12, -78 0 C -78 14, -42 22, 0 22 C 42 22, 78 14, 78 0 C 78 -12, 50 -22, 8 -22 Z" fill="#5da66b"/>
      <path d="M0 0 L-6 -22 C -50 -22, -78 -12, -78 0 C -60 -8, -30 -12, 0 0 Z" fill="#7bbf84"/>
      <path d="M0 0 L-60 10 M0 0 L-24 18 M0 0 L24 18 M0 0 L60 10 M0 0 L60 -12" stroke="#4a8f58" stroke-width="1.6" fill="none"/>
    </symbol>
  </defs>

  <rect width="794" height="1123" fill="url(#buddha-bg)"/>

  <!-- 연등 줄 -->
  <path d="M-10 18 Q 397 84 804 18" stroke="#9c7b5a" stroke-width="2.5" fill="none"/>
  <g stroke="#9c7b5a" stroke-width="2">
    <path d="M42 26 V115"/><path d="M118 35 V82"/><path d="M172 40 V56"/>
    <path d="M752 26 V115"/><path d="M676 35 V82"/><path d="M624 40 V56"/>
  </g>
  <use href="#buddha-lantern" x="-45" y="-50" width="90" height="140" color="#f2779e" transform="translate(42 160) scale(1.3)"/>
  <use href="#buddha-lantern" x="-45" y="-50" width="90" height="140" color="#f79b3e" transform="translate(118 116) scale(1.02)"/>
  <use href="#buddha-lantern" x="-45" y="-50" width="90" height="140" color="#f5c33b" transform="translate(172 82) scale(.76)"/>
  <use href="#buddha-lantern" x="-45" y="-50" width="90" height="140" color="#f5c33b" transform="translate(752 160) scale(1.3)"/>
  <use href="#buddha-lantern" x="-45" y="-50" width="90" height="140" color="#e8574d" transform="translate(676 116) scale(1.02)"/>
  <use href="#buddha-lantern" x="-45" y="-50" width="90" height="140" color="#f2779e" transform="translate(624 82) scale(.76)"/>

  <!-- 연못 -->
  <path d="M0 1006 C 200 990, 400 1018, 600 1002 C 700 995, 760 998, 794 1002 V1123 H0 Z" fill="url(#buddha-water)"/>
  <g stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".8">
    <path d="M300 1030 h60 M330 1044 h40 M470 1074 h70 M90 1092 h50 M620 1060 h50 M700 1100 h40"/>
  </g>
  <use href="#buddha-pad" x="-80" y="-24" width="160" height="48" transform="translate(250 1066) scale(.8)"/>
  <use href="#buddha-pad" x="-80" y="-24" width="160" height="48" transform="translate(520 1096) scale(.95)"/>
  <use href="#buddha-pad" x="-80" y="-24" width="160" height="48" transform="translate(400 1034) scale(.5)"/>

  <!-- 왼쪽 아래 연꽃 -->
  <path d="M40 1123 C 44 1060, 30 990, 34 930" stroke="#4f8f5b" stroke-width="5" fill="none"/>
  <g transform="translate(34 932) rotate(-8)">
    <path d="M0 0 C -14 -14, -12 -40, 0 -56 C 12 -40, 14 -14, 0 0 Z" fill="url(#buddha-petalg)" stroke="#d94f7f" stroke-opacity=".35" transform="scale(.9)"/>
    <path d="M0 0 C -8 -10, -4 -36, 0 -50 C 4 -36, 8 -10, 0 0 Z" fill="#e9608d" opacity=".35"/>
  </g>
  <path d="M126 1123 C 130 1080, 140 1040, 146 1010" stroke="#4f8f5b" stroke-width="5" fill="none"/>
  <use href="#buddha-lotus" x="-80" y="-80" width="160" height="90" transform="translate(146 1012) scale(1.05)"/>
  <use href="#buddha-pad" x="-80" y="-24" width="160" height="48" transform="translate(70 1046) scale(.9)"/>

  <!-- 오른쪽 아래 연꽃 -->
  <path d="M770 1123 C 768 1040, 772 960, 780 900" stroke="#4f8f5b" stroke-width="5" fill="none"/>
  <use href="#buddha-pad" x="-80" y="-24" width="160" height="48" transform="translate(782 902) rotate(-14) scale(.85)"/>
  <path d="M664 1123 C 662 1070, 656 1040, 652 1008" stroke="#4f8f5b" stroke-width="5" fill="none"/>
  <use href="#buddha-lotus" x="-80" y="-80" width="160" height="90" transform="translate(652 1010) scale(1.15)"/>
  <use href="#buddha-pad" x="-80" y="-24" width="160" height="48" transform="translate(720 1060) scale(1)"/>
</svg>
