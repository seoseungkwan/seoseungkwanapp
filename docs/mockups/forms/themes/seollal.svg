      <stop offset="0.38" stop-color="#fff7f9"/>
      <stop offset="0.66" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff3f0"/>
    </linearGradient>
    <!-- 방패연: 가운데 방구멍, 빨간 꼭지, 색동 치마 -->
