  <use href="#seollal-plum" x="604" y="80" width="18" height="18" opacity=".8"/>
  <use href="#seollal-plum" x="20" y="320" width="20" height="20"/>
  <use href="#seollal-plum" x="756" y="330" width="22" height="22"/>
  <use href="#seollal-plum" x="140" y="430" width="16" height="16" opacity=".8"/>
  <use href="#seollal-plum" x="648" y="440" width="18" height="18" opacity=".8"/>
  <use href="#seollal-plum" x="756" y="700" width="20" height="20"/>
  <use href="#seollal-plum" x="20" y="760" width="16" height="16" opacity=".8"/>
  <use href="#seollal-plum" x="120" y="905" width="18" height="18"/>
  <use href="#seollal-plum" x="660" y="900" width="20" height="20"/>
  <g fill="#f6c64f">
