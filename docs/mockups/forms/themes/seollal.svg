      <path fill-rule="evenodd" d="M-60 -80 H60 V80 H-60 Z M0 -20 A26 26 0 1 0 0 32 A26 26 0 1 0 0 -20 Z" fill="#fffdf6" stroke="#e2d2bb" stroke-width="2"/>
      <rect x="-60" y="38" width="120" height="10" fill="#e0473f"/>
      <rect x="-60" y="48" width="120" height="10" fill="#f5c443"/>
      <rect x="-60" y="58" width="120" height="10" fill="#4fa45c"/>
