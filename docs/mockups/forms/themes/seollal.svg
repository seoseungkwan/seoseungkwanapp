    <path d="M0 1042 C 140 1017, 260 1082, 420 1074 C 560 1067, 640 1014, 794 1020 V1123 H0 Z" fill="#2f4f9a"/>
    <path d="M0 1055 C 140 1030, 260 1095, 420 1087 C 560 1080, 640 1027, 794 1033 V1123 H0 Z" fill="#fff8ec"/>
