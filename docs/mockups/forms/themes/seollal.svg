      <rect x="27" y="-2" width="10" height="20" rx="4" fill="#f6c64f"/>
      <rect x="-27" y="-43" width="54" height="9" rx="4.5" fill="#f6c64f"/>
      <ellipse cx="-9" cy="-38" rx="8" ry="5" fill="none" stroke="#e8a92c" stroke-width="3"/>
      <ellipse cx="9" cy="-38" rx="8" ry="5" fill="none" stroke="#e8a92c" stroke-width="3"/>
      <circle cx="0" cy="-38" r="5" fill="#e8a92c"/>
    </symbol>
    <symbol id="seollal-plum" viewBox="-12 -12 24 24" overflow="visible">
