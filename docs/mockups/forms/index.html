<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>서식 시안 — 5월 어린이날 휴진 안내 (A4 세로)</title>
<style>
  /* 시안 전용 글꼴. 실제 앱은 외부 글꼴을 쓰지 않고 Pretendard 굵은 판을 src/app/fonts에 넣는다 */
  @font-face {
    font-family: 'PretendardV';
    src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2');
    font-weight: 45 920;
  }
  :root {
    --accent: #f0522d;      /* 테마 강조색: 어린이날 = 주황 */
    --ink: #262626;
    --sub: #3a3a3a;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #d9dde3;
    font-family: 'PretendardV', 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    padding: 32px 0 64px;
  }
  .caption { text-align: center; color: #444; font-size: 15px; margin-bottom: 16px; }
  /* A4 = 210 x 297 mm = 794 x 1123 px (96dpi) */
  .page {
    position: relative;
    width: 794px; height: 1123px;
    margin: 0 auto;
    overflow: hidden;
    background: linear-gradient(180deg, #e6f3ff 0%, #f4f9ff 40%, #ffffff 68%);
    box-shadow: 0 6px 30px rgba(0,0,0,.18);
  }
  .art { position: absolute; inset: 0; width: 100%; height: 100%; }
  .content {
    position: relative;
    padding-top: 96px;
    text-align: center;
  }
  .month {
    font-size: 132px; font-weight: 900; line-height: 1;
    color: var(--accent); letter-spacing: -0.02em;
  }
  .title {
    margin-top: 6px;
    font-size: 120px; font-weight: 900; line-height: 1.04;
    color: var(--ink); letter-spacing: -0.045em;
  }
  .lead {
    margin-top: 38px;
    font-size: 27px; font-weight: 700; line-height: 1.55;
    color: var(--sub); letter-spacing: -0.02em;
  }
  .cards {
    margin-top: 54px;
    display: flex; justify-content: center; gap: 36px;
  }
  .card {
    width: 318px;
    background: #fff;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 14px 34px rgba(25, 45, 80, .16);
  }
  .card .date {
    background: var(--accent); color: #fff;
    font-size: 33px; font-weight: 800; letter-spacing: -0.02em;
    padding: 16px 0 15px;
  }
  .card .body { padding: 34px 0 38px; }
  .card .name { font-size: 46px; font-weight: 800; color: var(--ink); letter-spacing: -0.03em; }
  .card .off  { margin-top: 14px; font-size: 50px; font-weight: 900; color: var(--accent); letter-spacing: 0.02em; }
</style>
</head>
<body>
<p class="caption">시안 1 — 5월 어린이날 휴진 안내 · A4 세로 · 테마: 어린이날(바람개비·풍선·색종이·종이비행기·언덕)</p>

<div class="page" id="page">
  <svg class="art" viewBox="0 0 794 1123" aria-hidden="true">
    <defs>
      <!-- 바람개비: 날개 넷(빨강·노랑·파랑·초록) + 접힌 그늘 + 가운데 핀 -->
      <symbol id="pinwheel" viewBox="-100 -100 200 200" overflow="visible">
        <g>
          <path d="M0 0 L0 -90 Q50 -82 64 -36 Z" fill="#ff5a5f"/>
          <path d="M0 0 L0 -90 L24 -38 Z" fill="#d93c45"/>
        </g>
        <g transform="rotate(90)">
          <path d="M0 0 L0 -90 Q50 -82 64 -36 Z" fill="#ffc83d"/>
          <path d="M0 0 L0 -90 L24 -38 Z" fill="#e8a91c"/>
        </g>
        <g transform="rotate(180)">
          <path d="M0 0 L0 -90 Q50 -82 64 -36 Z" fill="#3d8bfd"/>
          <path d="M0 0 L0 -90 L24 -38 Z" fill="#2a6fd6"/>
        </g>
        <g transform="rotate(270)">
          <path d="M0 0 L0 -90 Q50 -82 64 -36 Z" fill="#35c08b"/>
          <path d="M0 0 L0 -90 L24 -38 Z" fill="#23a072"/>
        </g>
        <circle r="11" fill="#fff" stroke="#e3e6ea" stroke-width="2"/>
        <circle r="4.5" fill="#f0522d"/>
      </symbol>

      <!-- 풍선: 색은 use의 color로 -->
      <symbol id="balloon" viewBox="-50 -70 100 210" overflow="visible">
        <path d="M0 50 C-10 78 12 100 -2 136" stroke="#9aa6b2" stroke-width="1.6" fill="none"/>
        <path d="M0 -64 C36 -64 48 -32 44 -4 C40 24 16 44 0 46 C-16 44 -40 24 -44 -4 C-48 -32 -36 -64 0 -64 Z" fill="currentColor"/>
        <path d="M0 -64 C36 -64 48 -32 44 -4 C40 24 16 44 0 46 C10 30 20 6 18 -20 C16 -46 8 -60 0 -64 Z" fill="#000" opacity=".08"/>
        <path d="M-6 52 L6 52 L0 45 Z" fill="currentColor"/>
        <ellipse cx="-17" cy="-32" rx="8" ry="15" fill="#fff" opacity=".5" transform="rotate(22 -17 -32)"/>
      </symbol>

      <symbol id="cloud" viewBox="0 0 160 70" overflow="visible">
        <g fill="#fff">
          <circle cx="40" cy="44" r="24"/>
          <circle cx="72" cy="30" r="30"/>
          <circle cx="106" cy="40" r="26"/>
          <rect x="30" y="40" width="96" height="28" rx="14"/>
        </g>
      </symbol>
    </defs>

    <!-- 옅은 구름 -->
    <use href="#cloud" x="-60" y="392" width="190" height="84" opacity=".85"/>
    <use href="#cloud" x="610" y="430" width="170" height="74" opacity=".8"/>
    <use href="#cloud" x="250" y="40" width="120" height="52" opacity=".7"/>

    <!-- 왼쪽 위: 큰 바람개비(화면 밖으로 살짝 잘림) -->
    <rect x="34" y="70" width="9" height="300" rx="4.5" fill="#d2a679" transform="rotate(28 38 70)"/>
    <use href="#pinwheel" x="-62" y="-30" width="200" height="200" transform="rotate(-12 38 70)"/>

    <!-- 오른쪽 위: 풍선 다발 -->
    <use href="#balloon" x="640" y="-6" width="80" height="168" style="color:#ff5a5f" transform="rotate(-10 680 60)"/>
    <use href="#balloon" x="700" y="30" width="86" height="180" style="color:#3d8bfd" transform="rotate(8 743 100)"/>
    <use href="#balloon" x="600" y="70" width="70" height="147" style="color:#ffc83d" transform="rotate(-18 635 120)"/>
    <use href="#balloon" x="748" y="-40" width="76" height="160" style="color:#35c08b" transform="rotate(14 786 20)"/>

    <!-- 오른쪽 가운데: 작은 바람개비 -->
    <rect x="770" y="640" width="7" height="200" rx="3.5" fill="#d2a679"/>
    <use href="#pinwheel" x="718" y="584" width="112" height="112" transform="rotate(20 774 640)"/>

    <!-- 왼쪽 가운데: 종이비행기와 점선 -->
    <path d="M-10 760 C 40 700, 70 690, 96 640" stroke="#9fb3c8" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" fill="none"/>
    <g transform="translate(92 626) rotate(-38)">
      <polygon points="0,0 76,-24 22,8" fill="#ffffff" stroke="#c9d5e2" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="22,8 76,-24 30,20" fill="#dbe7f4" stroke="#c9d5e2" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <!-- 색종이 -->
    <g opacity=".9">
      <rect x="180" y="180" width="12" height="7" rx="1.5" fill="#ffc83d" transform="rotate(30 186 183)"/>
      <rect x="560" y="210" width="12" height="7" rx="1.5" fill="#3d8bfd" transform="rotate(-25 566 213)"/>
      <circle cx="120" cy="250" r="5" fill="#ff5a5f"/>
      <rect x="690" y="330" width="12" height="7" rx="1.5" fill="#35c08b" transform="rotate(55 696 333)"/>
      <circle cx="58" cy="470" r="5" fill="#3d8bfd"/>
      <rect x="120" y="545" width="12" height="7" rx="1.5" fill="#ff5a5f" transform="rotate(-40 126 548)"/>
      <circle cx="690" cy="560" r="5" fill="#ffc83d"/>
      <rect x="610" y="800" width="12" height="7" rx="1.5" fill="#9b7bff" transform="rotate(20 616 803)"/>
      <rect x="170" y="840" width="12" height="7" rx="1.5" fill="#ffc83d" transform="rotate(65 176 843)"/>
      <circle cx="720" cy="880" r="5" fill="#ff5a5f"/>
      <circle cx="96" cy="900" r="4.5" fill="#35c08b"/>
    </g>

    <!-- 아래: 언덕과 바람개비 -->
    <path d="M0 985 C 170 925, 340 950, 470 995 C 590 1036, 700 985, 794 960 L794 1123 L0 1123 Z" fill="#a6dc8f"/>
    <rect x="140" y="930" width="8" height="140" rx="4" fill="#d2a679"/>
    <use href="#pinwheel" x="94" y="884" width="100" height="100" transform="rotate(40 144 934)"/>
    <rect x="662" y="905" width="8" height="150" rx="4" fill="#d2a679"/>
    <use href="#pinwheel" x="606" y="849" width="120" height="120" transform="rotate(-8 666 909)"/>
    <path d="M0 1040 C 160 1000, 330 1060, 500 1040 C 640 1024, 720 1012, 794 1020 L794 1123 L0 1123 Z" fill="#6cc46c"/>
    <!-- 언덕 위 작은 꽃 -->
    <g>
      <circle cx="260" cy="1050" r="6" fill="#fff"/><circle cx="260" cy="1050" r="2.6" fill="#ffc83d"/>
      <circle cx="300" cy="1066" r="5" fill="#ffd1dc"/><circle cx="300" cy="1066" r="2.2" fill="#ff5a5f"/>
      <circle cx="470" cy="1060" r="6" fill="#fff"/><circle cx="470" cy="1060" r="2.6" fill="#ffc83d"/>
      <circle cx="530" cy="1078" r="5" fill="#ffd1dc"/><circle cx="530" cy="1078" r="2.2" fill="#ff5a5f"/>
      <circle cx="60" cy="1072" r="5" fill="#fff"/><circle cx="60" cy="1072" r="2.2" fill="#ffc83d"/>
    </g>
  </svg>

  <div class="content">
    <div class="month">5월</div>
    <div class="title">진료일정안내</div>
    <p class="lead">5월 진료일정을 안내드리오니<br>진료 및 내원에 참고해주시길 바랍니다</p>
    <div class="cards">
      <div class="card">
        <div class="date">5월 5일(수)</div>
        <div class="body">
          <div class="name">어린이날</div>
          <div class="off">휴진</div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
