<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>접수 현황 · 종이 진료기록부 모양 목업</title>
<!-- 목업(사용자 승인 전 시안). 환자는 모두 지어낸 가짜다. 색·글꼴은 reception/www/theme.css 그대로 -->
<style>
@font-face { font-family: "Black Han Sans"; src: url("../../../reception/www/fonts/title.woff2") format("woff2"); }
:root {
  --ground:#F4F4F2; --surface:#FFFFFF; --ink:#333432; --ink-2:#4A4A47; --ink-3:#5F5F5C; --ink-4:#6B6B67;
  --line:#E4E4E0; --line-2:#CFCFCA; --accent:#DFDA06; --ok:#15803D; --ok-soft:#ECF7EF; --warn:#C2410C; --warn-soft:#FDF0EA;
  --paper:#FFFFFF; --paper-ink:#1F1F1E;
  --font-body:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-title:"Black Han Sans",var(--font-body);
  --font-mono:"D2Coding","Consolas","Menlo",monospace;
}
* { box-sizing:border-box; }
html,body { margin:0; background:#DADAD6; }
body { font-family:var(--font-body); color:var(--ink); word-break:keep-all; font-variant-numeric:tabular-nums; }
.phone { max-width:430px; margin:0 auto; min-height:100vh; background:var(--ground); display:flex; flex-direction:column; }
.mock-note { background:var(--ink); color:var(--accent); font-size:12px; padding:6px 12px; text-align:center; }

/* 머리 (지금 화면 그대로) */
.top { background:var(--surface); border-bottom:4px solid var(--accent); padding:10px 16px 16px; display:flex; flex-direction:column; gap:10px; }
.top-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.brand { font-family:var(--font-title); font-size:26px; line-height:1; }
.brand b { font-weight:400; background:var(--accent); padding:0 2px; }
.conn { font-size:13px; font-weight:600; color:var(--ok); background:var(--ok-soft); border-radius:6px; padding:5px 9px; }
.page-title { margin:0; font-family:var(--font-title); font-weight:400; font-size:30px; }
.sub { font-size:13px; color:var(--ink-3); }
.back { min-height:44px; display:flex; align-items:center; gap:4px; font-size:15px; font-weight:600; color:var(--ink); text-decoration:none; }
.back::before { content:"‹"; font-size:24px; line-height:1; margin-top:-2px; }
.mark { font-family:var(--font-title); font-size:20px; }
.who { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.who .chart { font-size:14px; color:var(--ink-4); }
.who h1 { margin:0; font-family:var(--font-title); font-weight:400; font-size:28px; line-height:1.2; }
.who .meta { font-size:14px; color:var(--ink-2); }
.state { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-2); }
.tag { font-size:12px; font-weight:600; padding:2px 7px; border-radius:4px; border:1px solid transparent; }
.tag.wait { background:var(--ink); color:var(--accent); }
.tag.pay { background:var(--surface); color:var(--ink-2); border-color:var(--line-2); }
.tag.done { background:var(--ok-soft); color:var(--ok); }
.memo { font-size:13px; color:var(--ink-2); background:var(--ground); border-radius:4px; padding:8px 10px; }

/* 목록 */
.list { padding:16px; display:flex; flex-direction:column; gap:12px; }
.list h2 { margin:0; font-size:15px; font-weight:600; color:var(--ink-2); }
.row { display:block; text-decoration:none; color:inherit; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
.row:active { background:#FCFBE3; }
.row .l1 { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.num { width:30px; height:30px; border-radius:4px; background:var(--ink); color:var(--accent); font-weight:700; display:grid; place-items:center; }
.row .nm { font-family:var(--font-title); font-size:21px; }
.row .l2 { margin-top:8px; font-size:13px; color:var(--ink-2); display:flex; gap:8px; align-items:center; }
.chip { background:var(--ground); border-radius:4px; padding:3px 7px; font-weight:600; }
.spc-flag { font-size:12px; font-weight:600; color:var(--warn); background:var(--warn-soft); border-radius:4px; padding:2px 6px; }
.hint { font-size:12px; color:var(--ink-3); text-align:center; }

/* 상세 */
.detail { padding:16px 12px; display:flex; flex-direction:column; gap:12px; }
.detail h2 { margin:0 4px; font-size:14px; font-weight:600; color:var(--ink-2); }

/* 종이 진료기록부 */
.paper { background:var(--paper); color:var(--paper-ink); border:2px solid var(--accent); border-radius:8px; padding:16px 14px 18px; box-shadow:0 1px 3px rgba(0,0,0,.08); font-size:14px; line-height:1.55; }
.paper-head { display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid var(--paper-ink); padding-bottom:6px; margin-bottom:10px; }
.paper-head .ttl { font-size:17px; font-weight:700; letter-spacing:1px; }
.paper-head .dt { font-size:12px; color:var(--ink-3); }
.kv { display:grid; grid-template-columns:5.2em 1fr; column-gap:6px; row-gap:2px; }
.kv dt { color:var(--ink-3); white-space:nowrap; }
.kv dt::after { content:" :"; }
.kv dd { margin:0; overflow-wrap:anywhere; }
.kv .empty { color:var(--line-2); }
.rule { border:0; border-top:1px solid var(--paper-ink); margin:12px 0 10px; }
.sec { margin-top:12px; }
.sec-h { font-weight:700; margin-bottom:4px; }
.sec-h::before { content:"<"; } .sec-h::after { content:">"; }
.none { color:var(--ink-3); font-size:13px; }
.spc { margin:0 0 4px; border:2px solid var(--warn); background:var(--warn-soft); border-radius:6px; padding:8px 10px; }
.spc .sec-h { color:var(--warn); margin-bottom:2px; }
.spc p { margin:0; white-space:pre-wrap; font-weight:600; }
.spc p.clamp { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:5; line-clamp:5; overflow:hidden; }
.spc .more { margin-top:6px; width:100%; min-height:40px; border:1px solid var(--warn); border-radius:6px; background:var(--surface); color:var(--warn); font:inherit; font-size:14px; font-weight:600; cursor:pointer; }
.spc.is-none { border:1px dashed var(--line-2); background:transparent; }
.spc.is-none .sec-h { color:var(--ink-3); }
.spc.is-none p { font-weight:400; color:var(--ink-3); }
.visit-line { display:flex; flex-wrap:wrap; gap:4px 12px; }
.sym { display:grid; grid-template-columns:auto 1fr; column-gap:10px; }
.sym .d { color:var(--ink-3); font-size:13px; padding-top:1px; }
.sym pre { margin:0; font-family:inherit; white-space:pre-wrap; overflow-wrap:anywhere; }
.dx { margin:0; padding:0; list-style:none; }
.dx li { display:grid; grid-template-columns:4.6em 1fr; column-gap:6px; }
.dx code, .rx code { font-family:var(--font-mono); font-size:12.5px; color:var(--ink-2); }
.dx .main::after { content:" 주"; font-size:11px; font-weight:700; color:var(--ink); background:var(--accent); border-radius:3px; padding:0 3px; margin-left:4px; vertical-align:1px; }
table.rx { width:100%; border-collapse:collapse; font-size:13px; }
.rx th { text-align:left; font-weight:600; color:var(--ink-3); font-size:12px; border-bottom:1px solid var(--paper-ink); padding:2px 3px 4px; }
.rx td { padding:4px 3px; vertical-align:top; border-bottom:1px dotted var(--line-2); }
.rx tr:last-child td { border-bottom:0; }
.rx .n { text-align:right; white-space:nowrap; width:2.6em; }
.rx th.n { text-align:right; }
.rx .c { width:5.6em; white-space:nowrap; }

/* 지난번 카드 (지금 화면 그대로) */
.card { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; }
.card .h { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.card .h b { display:flex; align-items:center; gap:8px; font-size:15px; }
.badge { font-size:12px; font-weight:600; padding:2px 6px; border-radius:4px; background:var(--ground); color:var(--ink-2); border:1px solid var(--line-2); }
.ago { font-size:12px; color:var(--ink-4); }
.card p { margin:0; font-size:14px; line-height:1.5; color:var(--ink-2); background:var(--ground); border-radius:4px; padding:6px 8px; }
.end { font-size:12px; color:var(--ink-3); text-align:center; }
.foot { padding:12px 16px 28px; font-size:12px; color:var(--ink-3); text-align:center; }
</style>
</head>
<body>
<div class="phone" id="app"></div>

const app = document.getElementById('app')
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const NOTE = '<div class="mock-note">목업 · 가짜 환자 · 줄을 누르면 상세가 열려요</div>'

function list() {
  return NOTE + `
  <header class="top">
    <div class="top-row"><span class="brand">양지바른<b>정형외과</b></span><span class="conn">● 연결됨</span></div>

    ${P.map(p => `
    <a class="row" href="#/v/${p.k}">

const kvRow = (k, v) => `<dt>${k}</dt><dd>${v ? esc(v) : '<span class="empty">—</span>'}</dd>`
const rxTable = rows => rows.length === 0 ? '<div class="none">없어요</div>' : `
  <table class="rx"><thead><tr><th>코드</th><th>명칭</th><th class="n">용량</th><th class="n">횟수</th><th class="n">일수</th></tr></thead>

  return NOTE + `
  <header class="top">
    <div class="top-row"><a class="back" href="#/">접수 현황</a><span class="mark">양지바른</span></div>

  <main class="detail">
    <h2>오늘 진료기록부</h2>

        ${kvRow('차트번호', p.chart)}
        ${kvRow('수진자명', `${p.name} (${p.sexEn}/${p.age})`)}
        ${kvRow('주민등록', p.res)}
        ${kvRow('주&nbsp;&nbsp;&nbsp;&nbsp;소', p.addr)}
        ${kvRow('전&nbsp;&nbsp;&nbsp;&nbsp;화', p.tel)}
        ${kvRow('이동전화', p.cel)}
      </dl>
      <hr class="rule">
      <div class="spc ${p.spc ? '' : 'is-none'}"><div class="sec-h">특이사항</div><p class="clamp">${p.spc ? esc(p.spc) : '적힌 특이사항이 없어요'}</p><button type="button" class="more" hidden>전부 보기 ▾</button></div>

      ${before && !p.sym && !p.dx.length && !p.rx.length && !p.out.length

      <div class="sec"><div class="sec-h">증상</div>
        ${p.sym ? `<div class="sym"><span class="d">${p.day.replaceAll('-', '')}</span><pre>${esc(p.sym)}</pre></div>` : '<div class="none">적힌 증상이 없어요</div>'}</div>
      <div class="sec"><div class="sec-h">상병</div>
        ${p.dx.length ? `<ul class="dx">${p.dx.map(d => `<li><code class="${d[2] ? 'main' : ''}">${d[0]}</code><span>${esc(d[1])}</span></li>`).join('')}</ul>` : '<div class="none">없어요</div>'}</div>
      <div class="sec"><div class="sec-h">처방</div>${rxTable(p.rx)}</div>
      <div class="sec"><div class="sec-h">원외처방</div>${rxTable(p.out)}</div>`}
    </article>
    <h2 style="margin-top:6px">지난번 증상</h2>
    ${p.last ? `<section class="card"><div class="h"><b><span class="badge">지난번</span>${p.last.date}</b><span class="ago">${p.last.ago}</span></div><p>증상 · ${esc(p.last.sym)}</p></section>`
             : '<section class="card"><p style="background:none;padding:0">첫 방문이라 지난 진료가 없어요.</p></section>'}
  </main>
  <footer class="foot">보기만 할 수 있어요 · 비트 자료는 바뀌지 않아요</footer>`
}

function route() {
  const m = location.hash.match(/^#\/v\/(\w+)$/)
  const p = m && P.find(x => x.k === m[1])
  app.innerHTML = p ? detail(p) : list()
  window.scrollTo(0, 0)
  // 특이사항이 5줄을 넘으면 [전부 보기]를 보인다. 누르면 펼치고 다시 누르면 접는다
  const note = app.querySelector('.spc p.clamp'), more = app.querySelector('.spc .more')
  if (note && more && note.scrollHeight > note.clientHeight + 1) {
    more.hidden = false
    more.onclick = () => {
      const open = note.classList.toggle('clamp') === false
      more.textContent = open ? '접기 ▴' : '전부 보기 ▾'
    }
  }
  if (p && /open/.test(location.search) && more && !more.hidden) more.click()
}
addEventListener('hashchange', route)
route()
</script>
</body>
</html>
