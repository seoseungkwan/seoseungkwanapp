<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="794" height="1123">
  <!-- 삼일절: 깃대의 태극기, 흰 무궁화(백단심), 아래에 물결치는 태극기들 -->
  <defs>
    <linearGradient id="samiljeol-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6edf8"/>
      <stop offset="0.36" stop-color="#f5f8fc"/>
      <stop offset="0.64" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5fb"/>
    </linearGradient>
    <linearGradient id="samiljeol-fold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d2a44" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#1d2a44" stop-opacity=".09"/>
      <stop offset="0.5" stop-color="#1d2a44" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#1d2a44" stop-opacity=".1"/>
      <stop offset="1" stop-color="#1d2a44" stop-opacity=".02"/>
    </linearGradient>
    <radialGradient id="samiljeol-petal" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="54">
      <stop offset="0.2" stop-color="#f3e6ef"/>
      <stop offset="1" stop-color="#ffffff"/>
    </radialGradient>
    <!-- 태극기 3:2 (지름 120, 괘 길이 60·너비 10·간격 5) -->
    <symbol id="samiljeol-flag" viewBox="0 0 360 240">
      <rect width="360" height="240" fill="#fff"/>
      <g transform="translate(180 120) rotate(33.69)">
        <circle r="60" fill="#0047a0"/>
        <path d="M-60 0 A60 60 0 0 1 60 0 A30 30 0 0 0 0 0 A30 30 0 0 1 -60 0 Z" fill="#cd2e3a"/>
      </g>
      <g fill="#1b1b1b" transform="translate(180 120)">
        <path transform="rotate(-56.31)" d="M-30 -100h60v10h-60z M-30 -115h60v10h-60z M-30 -130h60v10h-60z"/>
        <path transform="rotate(56.31)" d="M-30 -100h27.5v10h-27.5z M2.5 -100h27.5v10h-27.5z M-30 -115h60v10h-60z M-30 -130h27.5v10h-27.5z M2.5 -130h27.5v10h-27.5z"/>
        <path transform="rotate(-123.69)" d="M-30 -100h60v10h-60z M-30 -115h27.5v10h-27.5z M2.5 -115h27.5v10h-27.5z M-30 -130h60v10h-60z"/>
        <path transform="rotate(123.69)" d="M-30 -100h27.5v10h-27.5z M2.5 -100h27.5v10h-27.5z M-30 -115h27.5v10h-27.5z M2.5 -115h27.5v10h-27.5z M-30 -130h27.5v10h-27.5z M2.5 -130h27.5v10h-27.5z"/>
      </g>
      <rect width="360" height="240" fill="url(#samiljeol-fold)"/>
      <rect x="1.5" y="1.5" width="357" height="237" fill="none" stroke="#cfd6e2" stroke-width="3"/>
    </symbol>
    <!-- 흰 무궁화: 꽃잎 다섯, 붉은 단심, 암술대 -->
    <symbol id="samiljeol-mugung" viewBox="-60 -60 120 120" overflow="visible">
      <g fill="url(#samiljeol-petal)" stroke="#d8cfe0" stroke-width="1.5">
        <path id="samiljeol-pt" d="M0 0 C -12 -6, -32 -22, -30 -40 C -28 -52, -14 -56, -2 -52 C 6 -58, 24 -54, 28 -42 C 32 -26, 12 -6, 0 0 Z"/>
        <use href="#samiljeol-pt" transform="rotate(72)"/>
        <use href="#samiljeol-pt" transform="rotate(144)"/>
        <use href="#samiljeol-pt" transform="rotate(216)"/>
        <use href="#samiljeol-pt" transform="rotate(288)"/>
      </g>
      <g fill="#c2185b">
        <path id="samiljeol-dan" d="M0 0 C -7 -4, -13 -12, -10 -20 C -6 -25, 6 -25, 10 -20 C 13 -12, 7 -4, 0 0 Z"/>
        <use href="#samiljeol-dan" transform="rotate(72)"/>
        <use href="#samiljeol-dan" transform="rotate(144)"/>
        <use href="#samiljeol-dan" transform="rotate(216)"/>
        <use href="#samiljeol-dan" transform="rotate(288)"/>
      </g>
      <path d="M0 0 L8 -24" stroke="#fdf7e6" stroke-width="5" stroke-linecap="round"/>
      <circle cx="8" cy="-25" r="4.5" fill="#f2cf5e"/>
      <circle cx="4" cy="-14" r="2" fill="#f2cf5e"/><circle cx="10" cy="-16" r="2" fill="#f2cf5e"/>
    </symbol>
    <symbol id="samiljeol-leaf" viewBox="-20 -50 40 54" overflow="visible">
      <path d="M0 0 C -14 -8, -20 -22, -14 -32 C -18 -38, -10 -46, 0 -50 C 10 -46, 18 -38, 14 -32 C 20 -22, 14 -8, 0 0 Z" fill="#4f8a55"/>
      <path d="M0 0 C 14 -8, 20 -22, 14 -32 C 18 -38, 10 -46, 0 -50 Z" fill="#3e7445"/>
      <path d="M0 -2 V-44" stroke="#2f5f37" stroke-width="1.6"/>
    </symbol>
  </defs>

  <rect width="794" height="1123" fill="url(#samiljeol-bg)"/>

  <!-- 왼쪽 위: 깃대에 단 태극기 -->
  <rect x="25" y="26" width="7" height="470" rx="3" fill="#bfc6d2"/>
  <rect x="29" y="26" width="3" height="470" fill="#a3abb9"/>
  <circle cx="28.5" cy="20" r="10" fill="#e3b440"/>
  <path d="M20 22 C 22 30, 35 30, 37 22 Z" fill="#c9962c"/>
  <use href="#samiljeol-flag" x="32" y="34" width="138" height="92"/>

  <!-- 오른쪽 위: 흰 무궁화 -->
  <g>
    <use href="#samiljeol-leaf" x="-20" y="-50" width="40" height="54" transform="translate(704 108) rotate(-138) scale(1.45)"/>
    <use href="#samiljeol-leaf" x="-20" y="-50" width="40" height="54" transform="translate(752 128) rotate(-170) scale(1.35)"/>
    <use href="#samiljeol-leaf" x="-20" y="-50" width="40" height="54" transform="translate(796 206) rotate(-150) scale(1.3)"/>
    <use href="#samiljeol-leaf" x="-20" y="-50" width="40" height="54" transform="translate(686 40) rotate(-78) scale(1.2)"/>
    <path d="M700 132 C 694 148, 690 160, 690 172" stroke="#3e7445" stroke-width="3" fill="none"/>
    <g transform="translate(690 186) rotate(176)">
      <path d="M0 -24 C 11 -16, 11 4, 0 9 C -11 4, -11 -16, 0 -24 Z" fill="#fff" stroke="#d8cfe0" stroke-width="1.5"/>
      <path d="M0 9 C -10 3, -12 -8, -8 -13 L0 -4 L8 -13 C 12 -8, 10 3, 0 9 Z" fill="#4f8a55"/>
    </g>
    <use href="#samiljeol-mugung" x="-60" y="-60" width="120" height="120" transform="translate(782 172) rotate(-24) scale(.82)"/>
    <use href="#samiljeol-mugung" x="-60" y="-60" width="120" height="120" transform="translate(728 70) rotate(12) scale(1.15)"/>
  </g>

  <!-- 아래: 손에 든 태극기들 -->
  <path d="M0 1010 C 160 990, 300 1040, 460 1030 C 600 1020, 700 990, 794 994 V1123 H0 Z" fill="#dfe7f4"/>
  <path d="M0 1070 C 180 1050, 360 1090, 520 1082 C 640 1076, 730 1060, 794 1062 V1123 H0 Z" fill="#c9d6ec"/>
  <g transform="translate(12 904) rotate(-12)"><path d="M0 -3 V240" stroke="#8b6b4d" stroke-width="4" stroke-linecap="round"/><use href="#samiljeol-flag" x="2" width="104" height="69.3"/></g>
  <g transform="translate(144 972) rotate(-8)"><path d="M0 -3 V240" stroke="#8b6b4d" stroke-width="4" stroke-linecap="round"/><use href="#samiljeol-flag" x="2" width="96" height="64.0"/></g>
  <g transform="translate(282 1004) rotate(4)"><path d="M0 -3 V240" stroke="#8b6b4d" stroke-width="4" stroke-linecap="round"/><use href="#samiljeol-flag" x="2" width="90" height="60.0"/></g>
  <g transform="translate(436 996) rotate(-4)"><path d="M0 -3 V240" stroke="#8b6b4d" stroke-width="4" stroke-linecap="round"/><use href="#samiljeol-flag" x="2" width="90" height="60.0"/></g>
  <g transform="translate(578 968) rotate(8)"><path d="M0 -3 V240" stroke="#8b6b4d" stroke-width="4" stroke-linecap="round"/><use href="#samiljeol-flag" x="2" width="96" height="64.0"/></g>
  <g transform="translate(698 918) rotate(12)"><path d="M0 -3 V240" stroke="#8b6b4d" stroke-width="4" stroke-linecap="round"/><use href="#samiljeol-flag" x="2" width="104" height="69.3"/></g>
</svg>
