<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="794" height="1123">
  <!-- 개천절: 열린 하늘 — 햇살, 구름, 겹겹 산, 소나무 -->
  <defs>
    <linearGradient id="foundation-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3e8fa"/>
      <stop offset="0.38" stop-color="#ecf5fd"/>
      <stop offset="0.64" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f8fd"/>
    </linearGradient>
    <radialGradient id="foundation-ray" gradientUnits="userSpaceOnUse" cx="34" cy="34" r="720">
      <stop offset="0.1" stop-color="#fff6cf" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff6cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="foundation-halo">
      <stop offset="0.35" stop-color="#ffe89a" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffe89a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="foundation-sun" cx=".4" cy=".4" r=".7">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="1" stop-color="#ffbf3c"/>
    </radialGradient>
    <path id="foundation-cloudpath" d="M24 78 C 4 78 0 52 22 48 C 20 28 44 18 60 30 C 66 8 104 0 118 22 C 130 10 156 14 160 36 C 184 32 200 56 186 72 C 182 76 178 78 172 78 Z"/>
    <symbol id="foundation-cloud" viewBox="0 0 200 84" overflow="visible">
      <use href="#foundation-cloudpath" fill="#cfe1f2" y="6"/>
      <use href="#foundation-cloudpath" fill="#fff"/>
    </symbol>
    <!-- 소나무 잎 덩어리 -->
    <symbol id="foundation-pad" viewBox="-60 -26 120 42" overflow="visible">
      <path d="M-56 10 C -62 0, -50 -10, -40 -8 C -36 -18, -20 -24, -8 -16 C 0 -26, 20 -26, 26 -16 C 36 -22, 54 -16, 52 -4 C 62 -2, 62 12, 50 14 L -50 14 C -56 14, -58 12, -56 10 Z" fill="#2f5d3d"/>
      <path d="M-50 -2 C -46 -9, -40 -10, -36 -8 C -32 -16, -20 -20, -10 -14 C -2 -22, 16 -22, 22 -14 C 30 -18, 44 -14, 44 -6 C 30 -10, 14 -8, 0 -6 C -18 -4, -36 -2, -50 -2 Z" fill="#4d8a59"/>
      <path d="M-48 14 C -30 8, 30 8, 50 14 Z" fill="#234a31"/>
    </symbol>
  </defs>

  <rect width="794" height="1123" fill="url(#foundation-sky)"/>

  <!-- 햇살(희미하게) -->
  <g fill="url(#foundation-ray)" opacity=".42">
    <polygon points="34,34 760,120 760,180"/>
    <polygon points="34,34 700,330 680,400"/>
    <polygon points="34,34 560,560 510,600"/>
    <polygon points="34,34 360,740 300,760"/>
    <polygon points="34,34 160,780 110,780"/>
  </g>

  <!-- 해 -->
  <circle cx="34" cy="34" r="170" fill="url(#foundation-halo)"/>
  <circle cx="34" cy="34" r="78" fill="url(#foundation-sun)"/>

  <!-- 구름 -->
  <use href="#foundation-cloud" x="600" y="40" width="240" height="101"/>
  <use href="#foundation-cloud" x="676" y="150" width="150" height="63"/>
  <use href="#foundation-cloud" x="110" y="150" width="96" height="40" opacity=".8"/>
  <use href="#foundation-cloud" x="-70" y="420" width="150" height="63" opacity=".9"/>
  <use href="#foundation-cloud" x="736" y="560" width="130" height="55" opacity=".9"/>

  <!-- 겹겹 산 -->
  <path d="M0 880 C 40 866, 70 850, 110 866 C 150 884, 190 942, 250 944 C 310 946, 340 904, 392 906 C 448 908, 480 948, 540 944 C 600 940, 640 888, 700 872 C 740 862, 770 868, 794 876 V1123 H0 Z" fill="#d3e5f4"/>
  <path d="M0 950 C 50 930, 90 920, 140 944 C 190 968, 230 990, 290 984 C 350 978, 380 952, 430 958 C 490 966, 520 996, 580 990 C 640 984, 680 950, 730 944 C 760 940, 780 946, 794 950 V1123 H0 Z" fill="#a8c8e3"/>
  <path d="M0 1010 C 70 990, 140 1000, 200 1024 C 260 1046, 320 1050, 390 1036 C 460 1022, 520 1034, 590 1048 C 650 1060, 720 1040, 794 1030 V1123 H0 Z" fill="#7fae9b"/>
  <path d="M0 1070 C 100 1056, 200 1078, 320 1086 C 440 1094, 540 1076, 640 1080 C 700 1082, 760 1076, 794 1074 V1123 H0 Z" fill="#5b8f6d"/>

  <!-- 오른쪽 아래: 소나무 -->
  <g stroke="#8a4f34" fill="none" stroke-linecap="round">
    <path d="M732 1000 C 700 984, 660 974, 600 972" stroke-width="10"/>
    <path d="M734 942 C 712 930, 690 924, 660 922" stroke-width="7"/>
    <path d="M748 904 C 770 896, 790 884, 812 874" stroke-width="8"/>
    <path d="M742 966 C 766 960, 786 954, 810 950" stroke-width="7"/>
  </g>
  <path d="M758 1123 C 750 1080, 738 1040, 724 1010 C 710 980, 712 950, 730 924 C 742 906, 746 890, 744 868 L 758 868 C 762 892, 758 912, 746 932 C 730 956, 730 980, 744 1006 C 760 1036, 778 1080, 796 1123 Z" fill="#94573a"/>
  <path d="M766 1123 C 758 1082, 748 1046, 736 1016 C 724 988, 724 960, 738 936" stroke="#b8714a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <use href="#foundation-pad" x="-60" y="-26" width="120" height="42" transform="translate(602 966) scale(1.3)"/>
  <use href="#foundation-pad" x="-60" y="-26" width="120" height="42" transform="translate(654 982) scale(.95)"/>
  <use href="#foundation-pad" x="-60" y="-26" width="120" height="42" transform="translate(664 918) scale(1.15)"/>
  <use href="#foundation-pad" x="-60" y="-26" width="120" height="42" transform="translate(706 930) scale(.85)"/>
  <use href="#foundation-pad" x="-60" y="-26" width="120" height="42" transform="translate(800 946) scale(1.15)"/>
  <use href="#foundation-pad" x="-60" y="-26" width="120" height="42" transform="translate(790 874) scale(1.25)"/>
  <use href="#foundation-pad" x="-60" y="-26" width="120" height="42" transform="translate(750 860) scale(1.15)"/>
  <use href="#foundation-pad" x="-60" y="-26" width="120" height="42" transform="translate(776 836) scale(.85)"/>
</svg>
