    </symbol>
  </defs>

  <rect width="794" height="1123" fill="url(#chuseok-bg)"/>

  <!-- 보름달 -->
  <circle cx="728" cy="84" r="190" fill="url(#chuseok-glow)"/>
  <circle cx="728" cy="84" r="104" fill="url(#chuseok-moon)"/>
  <g fill="#f1c463" opacity=".22">
    <ellipse cx="704" cy="66" rx="22" ry="16"/><ellipse cx="758" cy="114" rx="26" ry="18"/><circle cx="694" cy="126" r="9"/>
  </g>
  <use href="#chuseok-bird" x="606" y="168" width="34" height="17"/>
  <use href="#chuseok-bird" x="646" y="196" width="26" height="13"/>
  <use href="#chuseok-bird" x="584" y="206" width="20" height="10"/>

  <!-- 왼쪽 위: 감나무 가지 -->
  <path d="M-10 30 C 40 44, 90 60, 176 70" stroke="#6b4a33" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M60 50 C 80 80, 90 110, 92 150" stroke="#6b4a33" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M130 64 C 140 80, 146 92, 148 104" stroke="#6b4a33" stroke-width="4" fill="none" stroke-linecap="round"/>
  <use href="#chuseok-leaf" x="-14" y="-46" width="28" height="48" color="#7f9c3a" transform="translate(40 42) rotate(-150) scale(1.3)"/>
  <use href="#chuseok-leaf" x="-14" y="-46" width="28" height="48" color="#e3a23a" transform="translate(100 58) rotate(-20) scale(1.25)"/>
  <use href="#chuseok-leaf" x="-14" y="-46" width="28" height="48" color="#d0622d" transform="translate(160 68) rotate(40) scale(1.1)"/>
  <use href="#chuseok-leaf" x="-14" y="-46" width="28" height="48" color="#8aa443" transform="translate(84 112) rotate(-120) scale(1.1)"/>
  <use href="#chuseok-persimmon" x="-34" y="-40" width="68" height="70" transform="translate(92 182) scale(1.1)"/>
  <use href="#chuseok-persimmon" x="-34" y="-40" width="68" height="70" transform="translate(148 132) rotate(8) scale(.92)"/>
  <use href="#chuseok-persimmon" x="-34" y="-40" width="68" height="70" transform="translate(28 112) rotate(-10) scale(1.2)"/>

  <!-- 언덕 -->
  <path d="M0 958 C 150 930, 300 988, 450 974 C 600 960, 700 928, 794 940 V1123 H0 Z" fill="#f7dcc0"/>
  <path d="M0 1030 C 160 1008, 330 1060, 520 1040 C 650 1026, 740 1008, 794 1014 V1123 H0 Z" fill="#edc396"/>

  <!-- 억새: 왼쪽 -->
  <g stroke="#b9a172" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M14 1123 C 16 1040, 20 960, 30 880"/>
    <path d="M52 1123 C 56 1060, 64 1000, 80 944"/>
    <path d="M96 1123 C 100 1080, 110 1030, 126 990"/>
    <path d="M150 1123 C 154 1090, 162 1056, 176 1030"/>
  </g>
  <g fill="#b8a165">
