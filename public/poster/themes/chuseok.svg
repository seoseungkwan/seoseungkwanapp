    <path d="M60 1123 C 80 1080, 120 1050, 170 1040 C 130 1060, 96 1090, 74 1123 Z"/>
    <path d="M110 1123 C 120 1090, 150 1070, 200 1070 C 160 1085, 136 1100, 124 1123 Z"/>
  </g>
  <use href="#chuseok-plume" x="0" y="-70" width="60" height="72" transform="translate(30 882) rotate(-8) scale(1.25)"/>
  <use href="#chuseok-plume" x="0" y="-70" width="60" height="72" transform="translate(80 946) rotate(6) scale(1.1)"/>
  <use href="#chuseok-plume" x="0" y="-70" width="60" height="72" transform="translate(126 992) rotate(14) scale(.95)"/>
  <use href="#chuseok-plume" x="0" y="-70" width="60" height="72" transform="translate(176 1032) rotate(22) scale(.8)"/>

  <!-- 억새: 오른쪽(좌우 뒤집음) -->
  <g transform="translate(794 0) scale(-1 1)">
    <g stroke="#b9a172" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M18 1123 C 20 1030, 24 940, 34 860"/>
      <path d="M60 1123 C 64 1050, 72 990, 88 936"/>
      <path d="M104 1123 C 108 1078, 118 1030, 136 996"/>
    </g>
    <g fill="#b8a165">
      <path d="M12 1123 C 2 1050, -6 1000, -18 960 C 4 1000, 16 1060, 24 1123 Z"/>
      <path d="M66 1123 C 86 1076, 126 1046, 176 1036 C 136 1056, 100 1088, 80 1123 Z"/>
    </g>
    <use href="#chuseok-plume" x="0" y="-70" width="60" height="72" transform="translate(34 862) rotate(-6) scale(1.3)"/>
    <use href="#chuseok-plume" x="0" y="-70" width="60" height="72" transform="translate(88 938) rotate(8) scale(1.1)"/>
    <use href="#chuseok-plume" x="0" y="-70" width="60" height="72" transform="translate(136 998) rotate(16) scale(.95)"/>
  </g>

  <!-- 송편 접시 -->
  <ellipse cx="400" cy="1098" rx="112" ry="14" fill="#c9905e" opacity=".3"/>
  <ellipse cx="397" cy="1084" rx="108" ry="22" fill="#ffffff" stroke="#e6d6c2" stroke-width="2"/>
  <ellipse cx="397" cy="1082" rx="84" ry="13" fill="#f6efe6"/>
  <g stroke="#6f8f4a" stroke-width="2" stroke-linecap="round">
    <path d="M318 1080 l-22 -9 M318 1080 l-20 2 M318 1080 l-13 -15 M476 1080 l22 -9 M476 1080 l20 2 M476 1080 l13 -15"/>
  </g>
  <g transform="translate(372 1056) scale(1.15 1.15)"><use href="#chuseok-songpyeon" fill="#bfd99c" stroke="#9fbf78" stroke-width="1.5"/><use href="#chuseok-seam" stroke="#9fbf78" stroke-width="2"/><ellipse cx="-8" cy="-6" rx="6" ry="3" fill="#fff" opacity=".5"/></g>
  <g transform="translate(424 1054) scale(-1.15 1.15)"><use href="#chuseok-songpyeon" fill="#f6c6cf" stroke="#e6a2b0" stroke-width="1.5"/><use href="#chuseok-seam" stroke="#e6a2b0" stroke-width="2"/><ellipse cx="-8" cy="-6" rx="6" ry="3" fill="#fff" opacity=".5"/></g>
  <g transform="translate(344 1072) scale(1.15 1.15)"><use href="#chuseok-songpyeon" fill="#fbf6ec" stroke="#ddd2bf" stroke-width="1.5"/><use href="#chuseok-seam" stroke="#ddd2bf" stroke-width="2"/><ellipse cx="-8" cy="-6" rx="6" ry="3" fill="#fff" opacity=".5"/></g>
  <g transform="translate(398 1076) scale(1.15 1.15)"><use href="#chuseok-songpyeon" fill="#f5dc94" stroke="#dfbf68" stroke-width="1.5"/><use href="#chuseok-seam" stroke="#dfbf68" stroke-width="2"/><ellipse cx="-8" cy="-6" rx="6" ry="3" fill="#fff" opacity=".5"/></g>
  <g transform="translate(452 1072) scale(-1.15 1.15)"><use href="#chuseok-songpyeon" fill="#fbf6ec" stroke="#ddd2bf" stroke-width="1.5"/><use href="#chuseok-seam" stroke="#ddd2bf" stroke-width="2"/><ellipse cx="-8" cy="-6" rx="6" ry="3" fill="#fff" opacity=".5"/></g>
</svg>
