<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="794" height="1123">
  <!-- 추석: 보름달, 감나무 가지, 억새, 송편 -->
  <defs>
    <linearGradient id="chuseok-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe2cb"/>
      <stop offset="0.34" stop-color="#fff3e7"/>
      <stop offset="0.62" stop-color="#fffbf6"/>
      <stop offset="1" stop-color="#fdf0e2"/>
    </linearGradient>
    <radialGradient id="chuseok-glow">
      <stop offset="0.45" stop-color="#ffe7a6" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffe7a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="chuseok-moon" cx=".4" cy=".38" r=".7">
      <stop offset="0" stop-color="#fff8dc"/>
      <stop offset="1" stop-color="#ffd977"/>
    </radialGradient>
    <radialGradient id="chuseok-fruit" cx=".36" cy=".34" r=".75">
      <stop offset="0" stop-color="#ffb35c"/>
      <stop offset="1" stop-color="#e2661c"/>
    </radialGradient>
    <!-- 감: 꼭지 네 갈래 -->
    <path id="chuseok-sepal" d="M0 0 C -7 -4, -7 -15, 0 -18 C 7 -15, 7 -4, 0 0 Z"/>
    <symbol id="chuseok-persimmon" viewBox="-34 -40 68 70" overflow="visible">
      <path d="M0 -24 V-34" stroke="#5a3e2a" stroke-width="3" stroke-linecap="round"/>
      <path d="M0 -22 C 22 -24, 32 -10, 30 4 C 28 20, 14 27, 0 27 C -14 27, -28 20, -30 4 C -32 -10, -22 -24, 0 -22 Z" fill="url(#chuseok-fruit)"/>
      <ellipse cx="-11" cy="-7" rx="8" ry="5" fill="#fff" opacity=".35" transform="rotate(-25 -11 -7)"/>
      <g fill="#5e6b2f" transform="translate(0 -21) scale(1 .5)">
        <use href="#chuseok-sepal" transform="rotate(45)"/><use href="#chuseok-sepal" transform="rotate(135)"/>
        <use href="#chuseok-sepal" transform="rotate(225)"/><use href="#chuseok-sepal" transform="rotate(315)"/>
      </g>
    </symbol>
    <symbol id="chuseok-leaf" viewBox="-14 -46 28 48" overflow="visible">
      <path d="M0 0 C -14 -12, -14 -32, 0 -46 C 14 -32, 14 -12, 0 0 Z" fill="currentColor"/>
      <path d="M0 0 C 14 -12, 14 -32, 0 -46 Z" fill="#000" opacity=".12"/>
      <path d="M0 -2 V-40" stroke="#000" stroke-opacity=".2" stroke-width="1.4"/>
    </symbol>
    <!-- 억새 이삭(밑이 0,0, 오른쪽 위로 휨) -->
    <symbol id="chuseok-plume" viewBox="0 -70 60 72" overflow="visible">
      <path d="M0 0 C 6 -22, 12 -44, 18 -66" stroke="#b9a172" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <g fill="#dccaa2">
        <path d="M3 -14 C 14 -22, 30 -24, 44 -18 C 30 -20, 16 -16, 5 -8 Z"/>
        <path d="M7 -28 C 18 -38, 36 -42, 52 -36 C 36 -36, 20 -32, 8 -22 Z"/>
      </g>
      <g fill="#f3ead6">
        <path d="M5 -20 C 16 -30, 32 -33, 48 -28 C 32 -28, 18 -24, 6 -14 Z"/>
        <path d="M10 -36 C 22 -48, 40 -52, 56 -46 C 40 -46, 24 -42, 11 -30 Z"/>
        <path d="M13 -48 C 24 -60, 40 -64, 56 -58 C 40 -58, 26 -54, 14 -42 Z"/>
        <path d="M16 -58 C 26 -68, 38 -71, 50 -68 C 38 -66, 28 -62, 17 -53 Z"/>
      </g>
    </symbol>
    <path id="chuseok-songpyeon" d="M-27 9 C -26 -6, -12 -17, 2 -17 C 16 -17, 27 -7, 27 6 C 20 11, -18 12, -27 9 Z"/>
    <path id="chuseok-seam" d="M-21 3 C -19 -7, -9 -12, 2 -12 C 12 -12, 20 -6, 21 2" fill="none" stroke-linecap="round"/>
    <symbol id="chuseok-bird" viewBox="-20 -10 40 20" overflow="visible">
