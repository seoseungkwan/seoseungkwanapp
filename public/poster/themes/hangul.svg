<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="794" height="1123">
  <!-- 한글날: 자모 조각(선으로 그린 모양, 글자 요소 없음), 먹 붓질 ㅡ·ㅇ -->
  <defs>
    <linearGradient id="hangul-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef5f4"/>
      <stop offset="0.36" stop-color="#f9fbf8"/>
      <stop offset="0.64" stop-color="#fffefb"/>
      <stop offset="1" stop-color="#f8f4ea"/>
    </linearGradient>
    <!-- 원고지 칸(아주 옅게) -->
    <pattern id="hangul-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 H0 V44" fill="none" stroke="#1f6e8c" stroke-width="1"/>
    </pattern>
    <!-- 자모 모양: 76칸 안, 선 색은 쓰는 곳에서 -->
    <g id="hangul-jamo" fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path id="hangul-g" d="M20 22 H54 V58"/>
      <path id="hangul-n" d="M22 18 V54 H58"/>
      <path id="hangul-d" d="M56 20 H22 V56 H58"/>
      <path id="hangul-m" d="M21 21 H55 V55 H21 Z"/>
      <path id="hangul-o" d="M57 38 A19 19 0 1 1 19 38 A19 19 0 1 1 57 38 Z"/>
      <path id="hangul-s" d="M38 18 L18 58 M32 32 L58 58"/>
      <path id="hangul-h" d="M30 13 H46 M18 26 H58 M50 47 A12 12 0 1 1 26 47 A12 12 0 1 1 50 47 Z"/>
      <path id="hangul-b" d="M22 18 V58 H54 V18 M22 38 H54"/>
      <path id="hangul-a" d="M30 14 V62 M30 38 H52"/>
    </g>
    <rect id="hangul-tile" width="76" height="76" rx="14"/>
  </defs>

  <rect width="794" height="1123" fill="url(#hangul-bg)"/>
  <rect width="794" height="1123" fill="url(#hangul-grid)" opacity=".07"/>

  <!-- 왼쪽 위 -->
  <g transform="translate(20 30) rotate(-8) scale(1.12)">
    <use href="#hangul-tile" x="3" y="5" fill="#d9e3e2"/><use href="#hangul-tile" fill="#1f6e8c"/>
    <use href="#hangul-g" stroke="#fff" fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(106 96) rotate(8) scale(.92)">
    <use href="#hangul-tile" x="3" y="5" fill="#e7e0d2"/><use href="#hangul-tile" fill="#fff"/>
    <use href="#hangul-h" stroke="#ef7d5a" fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <use href="#hangul-o" stroke="#f2b84b" fill="none" stroke-width="10" stroke-linecap="round" transform="translate(16 170) scale(.8)"/>
  <use href="#hangul-s" stroke="#6cc3a6" fill="none" stroke-width="10" stroke-linecap="round" transform="translate(140 14) rotate(12) scale(.6)"/>

  <!-- 오른쪽 위 -->
  <g transform="translate(672 26) rotate(9) scale(1.08)">
    <use href="#hangul-tile" x="3" y="5" fill="#e7dcc4"/><use href="#hangul-tile" fill="#f2b84b"/>
    <use href="#hangul-m" stroke="#fff" fill="none" stroke-width="11" stroke-linejoin="round"/>
  </g>
  <g transform="translate(716 132) rotate(-7) scale(.92)">
    <use href="#hangul-tile" x="3" y="5" fill="#d9e3e2"/><use href="#hangul-tile" fill="#fff"/>
    <use href="#hangul-s" stroke="#1f6e8c" fill="none" stroke-width="11" stroke-linecap="round"/>
  </g>
  <use href="#hangul-n" stroke="#ef7d5a" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" transform="translate(646 150) rotate(-14) scale(.62)"/>

  <!-- 가장자리 -->
  <path d="M8 520 L40 506" stroke="#ef7d5a" stroke-width="9" stroke-linecap="round"/>
  <use href="#hangul-o" stroke="#1f6e8c" fill="none" stroke-width="10" transform="translate(4 744) scale(.56)"/>
  <path d="M770 380 L778 432" stroke="#f2b84b" stroke-width="9" stroke-linecap="round"/>
  <g transform="translate(752 620) rotate(12) scale(.66)">
    <use href="#hangul-tile" x="3" y="5" fill="#d3e6de"/><use href="#hangul-tile" fill="#6cc3a6"/>
    <use href="#hangul-d" stroke="#fff" fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 아래: 붓으로 쓴 ㅡ (끝이 가닥으로 갈라지는 마른 붓) -->
  <path fill="#27313b" d="M34 1042 C 28 1030, 42 1020, 64 1022 C 160 1028, 300 1026, 420 1022
    C 480 1020, 540 1018, 600 1020 C 540 1024, 480 1026, 430 1029
    C 490 1030, 560 1030, 630 1032 C 560 1036, 490 1036, 432 1038
    C 480 1040, 530 1041, 584 1045 C 530 1047, 480 1047, 430 1047
    C 490 1050, 550 1052, 614 1055 C 550 1057, 490 1057, 428 1056
    C 470 1058, 510 1060, 548 1063 C 500 1064, 460 1062, 420 1060
    C 300 1063, 180 1068, 66 1070 C 46 1068, 38 1056, 34 1042 Z"/>
  <g stroke="#faf6ee" stroke-width="1.3" fill="none" stroke-linecap="round" opacity=".7">
    <path d="M340 1031 C 380 1030, 410 1029, 432 1029"/>
    <path d="M300 1039 C 360 1038, 400 1038, 434 1038"/>
    <path d="M360 1048 C 390 1048, 410 1047, 432 1047"/>
    <path d="M320 1057 C 370 1057, 400 1056, 430 1056"/>
  </g>

  <!-- 아래 오른쪽: 붓으로 그린 ㅇ (굵기가 고르지 않은 고리) -->
  <path fill="#1f6e8c" d="M733.9 985.9 A64 64 0 1 1 690.1 985.9 L704.3 994.8 A46 46 0 1 0 735.7 994.8 Z"/>
  <circle cx="697" cy="990" r="9" fill="#1f6e8c"/>

  <!-- 아래 왼쪽 위에 얹은 조각 -->
  <g transform="translate(52 940) rotate(-10) scale(.8)">
    <use href="#hangul-tile" x="3" y="5" fill="#e7e0d2"/><use href="#hangul-tile" fill="#fff"/>
    <use href="#hangul-b" stroke="#2d4a6b" fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(140 966) rotate(8) scale(.62)">
    <use href="#hangul-tile" x="3" y="5" fill="#ecd3c8"/><use href="#hangul-tile" fill="#ef7d5a"/>
    <use href="#hangul-a" stroke="#fff" fill="none" stroke-width="11" stroke-linecap="round"/>
  </g>
</svg>
