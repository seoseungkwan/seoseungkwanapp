      <stop offset="0.36" stop-color="#f3f5f8"/>
      <stop offset="0.64" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f5"/>
    </linearGradient>
    <radialGradient id="memorial-mpetal" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="54">
