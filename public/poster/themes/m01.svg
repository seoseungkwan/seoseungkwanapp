<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="794" height="1123">
  <!-- 1월: 눈송이·눈 언덕·눈사람·눈 덮인 나무 -->
  <defs>
    <linearGradient id="m01-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e9f9"/>
      <stop offset="0.38" stop-color="#eef5fd"/>
      <stop offset="0.68" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f8fd"/>
    </linearGradient>
    <!-- 가지 달린 눈송이 -->
    <symbol id="m01-flake" viewBox="-50 -50 100 100" overflow="visible">
      <g stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none">
        <path id="m01-arm" d="M0 -6 V-46 M0 -18 L-11 -29 M0 -18 L11 -29 M0 -32 L-7 -40 M0 -32 L7 -40"/>
        <use href="#m01-arm" transform="rotate(60)"/>
        <use href="#m01-arm" transform="rotate(120)"/>
        <use href="#m01-arm" transform="rotate(180)"/>
        <use href="#m01-arm" transform="rotate(240)"/>
        <use href="#m01-arm" transform="rotate(300)"/>
      </g>
      <circle r="7" fill="currentColor"/>
    </symbol>
    <!-- 끝이 마름모인 눈송이 -->
    <symbol id="m01-flake2" viewBox="-50 -50 100 100" overflow="visible">
      <g fill="currentColor">
        <path id="m01-ray" d="M-3 0 V-34 L0 -46 L3 -34 V0 Z M0 -26 L-8 -34 L-5 -37 L0 -31 L5 -37 L8 -34 Z"/>
        <use href="#m01-ray" transform="rotate(60)"/>
        <use href="#m01-ray" transform="rotate(120)"/>
        <use href="#m01-ray" transform="rotate(180)"/>
        <use href="#m01-ray" transform="rotate(240)"/>
        <use href="#m01-ray" transform="rotate(300)"/>
        <circle r="8"/>
      </g>
      <circle r="3.5" fill="#fff"/>
    </symbol>
    <symbol id="m01-cloud" viewBox="0 0 160 70" overflow="visible">
      <g fill="#fff">
        <circle cx="40" cy="44" r="24"/><circle cx="72" cy="30" r="30"/><circle cx="106" cy="40" r="26"/>
        <rect x="30" y="40" width="96" height="28" rx="14"/>
      </g>
    </symbol>
    <!-- 눈 쌓인 전나무 (밑동 가운데가 0,0) -->
    <symbol id="m01-pine" viewBox="-50 -120 100 132" overflow="visible">
      <rect x="-6" y="-8" width="12" height="20" rx="3" fill="#8b6b57"/>
      <path d="M-46 0 L0 -58 L46 0 Z" fill="#5b8fc2"/>
      <path d="M0 -58 L46 0 L0 0 Z" fill="#4878aa"/>
      <path d="M-36 -32 L0 -86 L36 -32 Z" fill="#5b8fc2"/>
      <path d="M0 -86 L36 -32 L0 -32 Z" fill="#4878aa"/>
      <path d="M-26 -60 L0 -116 L26 -60 Z" fill="#5b8fc2"/>
      <path d="M0 -116 L26 -60 L0 -60 Z" fill="#4878aa"/>
      <g fill="#fff">
        <path d="M-46 0 Q-40 -9 -33 -3 Q-26 -11 -18 -3 Q-10 -11 -2 -3 Q6 -11 14 -3 Q22 -11 30 -3 Q38 -9 46 0 Q24 -4 0 -4 Q-24 -4 -46 0 Z"/>
        <path d="M-36 -32 Q-30 -40 -23 -35 Q-16 -42 -8 -35 Q0 -42 8 -35 Q16 -42 23 -35 Q30 -40 36 -32 Q18 -36 0 -36 Q-18 -36 -36 -32 Z"/>
        <path d="M-26 -60 Q-20 -67 -13 -62 Q-6 -69 1 -62 Q8 -69 14 -62 Q20 -67 26 -60 Q13 -63 0 -63 Q-13 -63 -26 -60 Z"/>
        <path d="M-9 -98 L0 -116 L9 -98 Q4 -103 0 -99 Q-4 -103 -9 -98 Z"/>
      </g>
    </symbol>
  </defs>

  <rect width="794" height="1123" fill="url(#m01-bg)"/>

  <!-- 구름 -->
  <use href="#m01-cloud" x="270" y="18" width="130" height="56" opacity=".75"/>
  <use href="#m01-cloud" x="-70" y="400" width="180" height="78" opacity=".8"/>
  <use href="#m01-cloud" x="640" y="440" width="170" height="74" opacity=".75"/>

  <!-- 왼쪽 위 모서리: 큰 눈송이 -->
  <use href="#m01-flake" x="-70" y="-60" width="200" height="200" color="#a9cdef" transform="rotate(8 30 40)"/>
  <use href="#m01-flake2" x="118" y="112" width="64" height="64" color="#7fb0e3"/>
  <use href="#m01-flake" x="40" y="168" width="40" height="40" color="#c3dcf4"/>

  <!-- 오른쪽 위 모서리 -->
  <use href="#m01-flake2" x="652" y="-28" width="170" height="170" color="#9cc4ec" transform="rotate(12 737 57)"/>
  <use href="#m01-flake" x="618" y="132" width="52" height="52" color="#6fa3db"/>
  <use href="#m01-flake" x="730" y="176" width="44" height="44" color="#bcd7f2"/>
  <use href="#m01-flake2" x="590" y="22" width="34" height="34" color="#c3dcf4"/>

  <!-- 가장자리 눈송이 -->
  <use href="#m01-flake" x="6" y="536" width="40" height="40" color="#8dbbe7"/>
  <use href="#m01-flake2" x="12" y="760" width="30" height="30" color="#a9cdef"/>
  <use href="#m01-flake2" x="748" y="580" width="40" height="40" color="#8dbbe7"/>
  <use href="#m01-flake" x="752" y="830" width="30" height="30" color="#a9cdef"/>

  <!-- 흩날리는 눈: 글자 자리 안은 옅게 -->
  <g fill="#8fbbe6">
    <g opacity=".3">
      <circle cx="210" cy="96" r="5"/><circle cx="560" cy="80" r="4"/><circle cx="250" cy="236" r="4"/>
      <circle cx="610" cy="362" r="5"/><circle cx="150" cy="380" r="4"/><circle cx="660" cy="250" r="3.5"/>
      <circle cx="120" cy="620" r="4"/><circle cx="690" cy="700" r="4.5"/><circle cx="160" cy="880" r="4"/>
      <circle cx="640" cy="880" r="3.5"/>
    </g>
    <circle cx="70" cy="300" r="4.5"/><circle cx="34" cy="420" r="3.5"/><circle cx="26" cy="660" r="4"/>
    <circle cx="44" cy="870" r="3.5"/><circle cx="740" cy="300" r="4.5"/><circle cx="770" cy="400" r="3.5"/>
    <circle cx="764" cy="720" r="4"/><circle cx="744" cy="910" r="3.5"/><circle cx="200" cy="40" r="3.5"/>
    <circle cx="520" cy="30" r="4"/><circle cx="440" cy="54" r="3"/>
  </g>

  <!-- 아래: 눈 언덕 -->
  <path d="M0 972 C 140 930, 300 948, 420 984 C 540 1018, 680 958, 794 944 L794 1123 L0 1123 Z" fill="#d3e5f7"/>
  <use href="#m01-pine" x="682" y="878" width="100" height="132"/>
  <use href="#m01-pine" x="730" y="836" width="120" height="158"/>
  <use href="#m01-pine" x="618" y="932" width="70" height="92"/>
  <path d="M0 1036 C 150 998, 320 1028, 470 1050 C 600 1068, 710 1028, 794 1016 L794 1123 L0 1123 Z" fill="#ffffff"/>
  <path d="M0 1098 C 200 1076, 470 1110, 794 1084 L794 1123 L0 1123 Z" fill="#e7f0fa"/>

  <!-- 눈사람 -->
  <g>
    <ellipse cx="130" cy="1084" rx="70" ry="10" fill="#c9dcf0"/>
    <path d="M86 1024 L48 994 M60 1004 L50 984 M174 1026 L212 1000 M200 1008 L214 990" stroke="#8b6b57" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="130" cy="1036" r="50" fill="#fff" stroke="#c9dcf0" stroke-width="2.5"/>
    <path d="M130 986 A50 50 0 0 1 130 1086 A34 50 0 0 0 130 986 Z" fill="#d6e5f5"/>
    <circle cx="130" cy="970" r="33" fill="#fff" stroke="#c9dcf0" stroke-width="2.5"/>
    <path d="M130 937 A33 33 0 0 1 130 1003 A22 33 0 0 0 130 937 Z" fill="#d6e5f5"/>
    <circle cx="130" cy="1024" r="4" fill="#33435a"/>
    <circle cx="130" cy="1046" r="4" fill="#33435a"/>
    <!-- 목도리 -->
    <path d="M100 994 Q130 1006 160 994 L162 1006 Q130 1018 98 1006 Z" fill="#3c6fb4"/>
    <path d="M140 1004 L150 1036 L136 1038 L130 1008 Z" fill="#3c6fb4"/>
    <path d="M140 1004 L150 1036 L144 1037 L136 1008 Z" fill="#2f5a95"/>
    <!-- 털모자 -->
    <path d="M100 958 Q102 922 130 920 Q158 922 160 958 Z" fill="#5b8fd0"/>
    <rect x="96" y="950" width="68" height="14" rx="7" fill="#3c6fb4"/>
    <circle cx="130" cy="916" r="9" fill="#fff"/>
    <!-- 얼굴 -->
    <circle cx="119" cy="972" r="3.6" fill="#33435a"/>
    <circle cx="141" cy="972" r="3.6" fill="#33435a"/>
    <path d="M130 979 L152 984 L130 986 Z" fill="#f08a3c"/>
    <circle cx="112" cy="984" r="4.5" fill="#f7b6c2" opacity=".7"/>
    <circle cx="148" cy="986" r="4.5" fill="#f7b6c2" opacity=".7"/>
  </g>

  <!-- 언덕 위 반짝이 -->
  <g fill="#b9d4ee">
    <circle cx="300" cy="1070" r="4"/><circle cx="420" cy="1086" r="3"/><circle cx="560" cy="1070" r="4"/>
    <circle cx="250" cy="1104" r="3"/><circle cx="660" cy="1100" r="3.5"/>
  </g>
</svg>
